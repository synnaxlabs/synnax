[project]
name = "synnax-x"
version = "0.56.0"
description = "Shared Python utilities for Synnax"
keywords = ["Synnax"]
authors = [{ name = "Emiliano Bonilla", email = "ebonilla@synnaxlabs.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "numpy>=2.5.0,<3",
    "pandas>=3.0.3,<4",
    "pydantic>=2.13.4,<3",
    "msgpack>=1.2.1,<2",
]

[project.urls]
Homepage = "https://synnaxlabs.com"
Repository = "https://github.com/synnaxlabs/synnax"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3",
    "pytest-cov>=7.1.0,<8",
    "pandas-stubs>=3.0.0.260530,<4",
    "python-dateutil>=2.9.0.post0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.18,<1",
    "types-python-dateutil>=2.9.0.20260518,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["x"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["x"]

[tool.mypy]
mypy_path = "stubs"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "color: mark test as a color test",
    "control: mark test as a control test",
    "deprecation: mark test as a deprecation test",
    "series: mark test as a series test",
    "telem: mark test as a telem test",
    "timing: mark test as a timing test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
