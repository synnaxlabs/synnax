[project]
name = "synnax-x"
version = "0.0.0"
readme = "README.md"
description = "Shared Python utilities for Synnax"
keywords = ["Synnax"]
authors = [{ name = "Emiliano Bonilla", email = "ebonilla@synnaxlabs.com" }]
requires-python = ">=3.13,<4"
dependencies = [
    "numpy>=2.5.5,<3",
    "pandas>=3.1.1,<4",
    "pydantic>=2.14.4,<3",
]

[project.urls]
Homepage = "https://synnaxlabs.com"
Repository = "https://github.com/synnaxlabs/synnax"

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "pytest-cov>=7.1.0,<8",
    "pytest-timeout>=2.4.0,<3",
    "pandas-stubs>=3.1.0.261029,<4",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6,<1",
    "hypothesis>=6.170.15,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["x"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]

[tool.ruff.lint.isort]
known-first-party = ["x"]

# Series and MultiSeries declare a covariant TypeVar.
[tool.ruff.lint.per-file-ignores]
"x/telem/series.py" = ["UP046"]

[tool.mypy]
python_version = "3.13"
mypy_path = "stubs"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "unused-awaitable",
    "explicit-override",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
strict = true
timeout = 60
testpaths = ["tests"]
markers = [
    "color: mark test as a color test",
    "control: mark test as a control test",
    "series: mark test as a series test",
    "telem: mark test as a telem test",
    "timing: mark test as a timing test",
]

[tool.coverage.run]
omit = ["*/types_gen.py"]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"
