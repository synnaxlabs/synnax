[project]
name = "synnax-x"
version = "0.60.0"
readme = "README.md"
description = "Shared Python utilities for Synnax"
keywords = ["Synnax"]
authors = [{ name = "Emiliano Bonilla", email = "ebonilla@synnaxlabs.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "numpy>=2.5.4,<3",
    "pandas>=3.0.6,<4",
    "pydantic>=2.14.1,<3",
    "msgpack>=1.2.3,<2",
    "typing-extensions>=4.16.0,<5",
]

[project.urls]
Homepage = "https://synnaxlabs.com"
Repository = "https://github.com/synnaxlabs/synnax"

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3",
    "pytest-cov>=7.1.0,<8",
    "pytest-timeout>=2.4.0,<3",
    "pandas-stubs>=3.0.5.260914,<4",
    "python-dateutil>=2.9.0.post0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<1",
    "types-python-dateutil>=2.9.0.20260807,<3",
    "hypothesis>=6.170.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["x"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "I",
    "B",
    "DTZ",
    "E501",
    "E7",
    "E9",
    "PLE",
    "UP",
    "SIM",
    "C4",
    "RET",
    "PIE",
    "PERF",
    "RUF",
    "PT",
]
ignore = ["UP040", "UP046", "UP047", "SIM105", "SIM115", "SIM117", "PT012", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["x"]

[tool.mypy]
python_version = "3.12"
mypy_path = "stubs"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
strict = true
timeout = 60
testpaths = ["tests"]
markers = [
    "color: mark test as a color test",
    "control: mark test as a control test",
    "series: mark test as a series test",
    "telem: mark test as a telem test",
    "timing: mark test as a timing test",
]

[tool.coverage.run]
omit = ["*/types_gen.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
