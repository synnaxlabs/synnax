syntax = "proto3";

package x.color.pb;

option go_package = "github.com/synnaxlabs/x/color/pb";

// Color is an RGBA color.
message Color {
  reserved 1, 2, 3, 4;
  reserved "r", "g", "b", "a";
  // rgba is the color packed as 0xRRGGBBAA, with every component 0-255.
  fixed32 rgba = 5;
}
