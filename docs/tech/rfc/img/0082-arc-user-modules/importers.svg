<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 760 440"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="12"
>
  <style>
    .ink { fill: #1f2328; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .axis { stroke: #c3c2b7; }
    .ref { stroke: #898781; }
    .surface { fill: #ffffff; }
    .all { stroke: #eb6834; fill: #eb6834; }
    .edge { stroke: #2a78d6; fill: #2a78d6; }
    .hollow { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .surface { fill: #0d1117; }
      .all { stroke: #d95926; fill: #d95926; }
      .edge { stroke: #3987e5; fill: #3987e5; }
      .hollow { fill: #0d1117; }
    }
    .tick { font-variant-numeric: tabular-nums; }
  </style>

  <text
        x="70"
        y="22"
        class="ink"
        font-size="14"
        font-weight="600"
    >Time per module save, all 37 runs</text>
  <text
        x="70"
        y="40"
        class="muted"
    >N automations, a chain of D modules, P automations importing each module; I = (D − 1) + P × D</text>

  <!-- marker legend -->
  <g font-size="12">
    <circle cx="500" cy="60" r="4" class="ink" />
    <text x="510" y="64" class="ink">D = 1</text>
    <circle cx="570" cy="60" r="4" fill="none" class="axis" stroke-width="2" />
    <text x="580" y="64" class="ink">D = 4</text>
    <rect
            x="636"
            y="56"
            width="8"
            height="8"
            fill="none"
            class="axis"
            stroke-width="2"
        />
    <text x="650" y="64" class="ink">D = 8</text>
  </g>

  <!-- shared y gridlines across both panels, one decade per 60 px -->
  <g class="grid" stroke-width="1">
    <line x1="70" y1="310" x2="340" y2="310" /><line
            x1="430"
            y1="310"
            x2="700"
            y2="310"
        />
    <line x1="70" y1="250" x2="340" y2="250" /><line
            x1="430"
            y1="250"
            x2="700"
            y2="250"
        />
    <line x1="70" y1="190" x2="340" y2="190" /><line
            x1="430"
            y1="190"
            x2="700"
            y2="190"
        />
    <line x1="70" y1="130" x2="340" y2="130" /><line
            x1="430"
            y1="130"
            x2="700"
            y2="130"
        />
    <line x1="70" y1="70" x2="340" y2="70" /><line x1="430" y1="70" x2="700" y2="70" />
  </g>
  <g class="muted tick" text-anchor="end">
    <text x="62" y="314">0.1</text>
    <text x="62" y="254">1</text>
    <text x="62" y="194">10</text>
    <text x="62" y="134">100</text>
    <text x="62" y="74">1000</text>
  </g>
  <text x="62" y="58" class="muted" text-anchor="end">ms</text>

  <!-- panel titles -->
  <text x="70" y="96" class="ink" font-weight="600">Scan every Arc</text>
  <text x="430" y="96" class="ink" font-weight="600">Ontology imports</text>

  <!-- x axes -->
  <line x1="70" y1="360" x2="340" y2="360" class="axis" stroke-width="1" />
  <line x1="430" y1="360" x2="700" y2="360" class="axis" stroke-width="1" />
  <g class="muted tick" text-anchor="middle">
    <text x="70.0" y="378">10</text>
    <text x="160.0" y="378">100</text>
    <text x="250.0" y="378">1000</text>
    <text x="340.0" y="378">10000</text>
    <text x="430.0" y="378">1</text>
    <text x="520.0" y="378">10</text>
    <text x="610.0" y="378">100</text>
    <text x="700.0" y="378">1000</text>
  </g>
  <text x="205" y="400" class="muted" text-anchor="middle">Arcs stored, N + D</text>
  <text
        x="565"
        y="400"
        class="muted"
        text-anchor="middle"
