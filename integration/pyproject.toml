[project]
name = "synnax-test-framework"
version = "0.0.0"
requires-python = ">=3.12,<4"
dependencies = [
    "synnax",
    "synnax-freighter",
    "synnax-x",
    "flask>=3.1.3,<4",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.4,<3",
    "playwright>=1.64.0,<2",
    "psutil>=7.2.2,<8",
    "pymodbus[serial]>=3.16.1,<4",
    "asyncua>=2.1.0,<3",
    "nidaqmx>=1.6.0,<2",
    "nisyscfg>=0.2.1,<1",
    "pagerduty>=7.0.1,<8",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
test-conductor = "framework.test_conductor:main"
tc = "framework.test_conductor:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.1,<1",
    "types-psutil>=7.2.2.20260906,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["console", "framework", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "I",
    "B",
    "DTZ",
    "E501",
    "E7",
    "E9",
    "PLE",
    "UP",
    "SIM",
    "C4",
    "RET",
    "PIE",
    "PERF",
    "RUF",
]
ignore = ["UP040", "UP046", "UP047", "SIM105", "SIM115", "SIM117", "PT012", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["synnax", "alamos", "freighter", "x"]

[tool.ruff.lint.per-file-ignores]
# Test cases configure subclasses with class-level lists that nothing mutates.
"tests/**" = ["RUF012"]
# Optional hooks with no-op defaults.
"console/schematic/symbol.py" = ["B027"]
"framework/test_case.py" = ["B027"]

[tool.mypy]
mypy_path = "stubs"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "nidaqmx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nisyscfg.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The integration tests run through the conductor; pytest runs only the framework's
# unit tests.
[tool.pytest.ini_options]
testpaths = ["framework/tests"]

[tool.coverage.run]
omit = ["framework/tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
