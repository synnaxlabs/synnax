[project]
name = "synnax-test-framework"
version = "0.0.0"
requires-python = ">=3.12,<4"
dependencies = [
    "synnax",
    "synnax-x",
    "flask>=3.1.3,<4",
    "matplotlib>=3.11.0,<4",
    "numpy>=2.5.0,<3",
    "playwright>=1.60.0,<2",
    "psutil>=7.2.2,<8",
    "pymodbus>=3.13.1,<4",
    "asyncua>=2.0,<3",
    "nidaqmx>=1.5.0,<2",
    "nisyscfg>=0.2.1,<1",
    "pagerduty>=6.3.0,<7",
]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["mypy>=2.1.0,<3", "ruff>=0.15.18,<1", "types-psutil>=7.2.2.20260518,<8"]

[project.scripts]
test-conductor = "framework.test_conductor:main"
tc = "framework.test_conductor:main"
migration-conductor = "migration_conductor:main"
mc = "migration_conductor:main"

[tool.hatch.build.targets.wheel]
packages = ["driver", "framework", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["synnax", "alamos", "freighter", "x"]

[tool.mypy]
mypy_path = "stubs"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = "synnax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "examples.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nidaqmx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nisyscfg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setup"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_types = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
