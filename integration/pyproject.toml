[project]
name = "synnax-test-framework"
version = "0.0.0"
requires-python = ">=3.12,<4"
dependencies = [
    "synnax",
    "synnax-x",
    "flask>=3.1.3,<4",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.3,<3",
    "playwright>=1.63.0,<2",
    "psutil>=7.2.2,<8",
    "pymodbus>=3.15.0,<4",
    "asyncua>=2.0.1,<3",
    "nidaqmx>=1.6.0,<2",
    "nisyscfg>=0.2.1,<1",
    "pagerduty>=7.0.1,<8",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
test-conductor = "framework.test_conductor:main"
tc = "framework.test_conductor:main"
migration-conductor = "migration_conductor:main"
mc = "migration_conductor:main"

[dependency-groups]
dev = ["mypy>=2.3.1,<3", "ruff>=0.16.8,<1", "types-psutil>=7.2.2.20260906,<8"]

[tool.hatch.build.targets.wheel]
packages = ["console", "framework", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "B", "DTZ", "E7", "E9", "PLE", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["synnax", "alamos", "freighter", "x"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["framework.models.SynnaxConnection"]

[tool.ruff.lint.per-file-ignores]
# Test cases configure subclasses with class-level lists that nothing mutates.
"tests/**" = ["RUF012"]
# Optional hooks with no-op defaults.
"console/schematic/symbol.py" = ["B027"]
"framework/test_case.py" = ["B027"]
# Controller.wait_until calls its condition before the loop moves on.
"tests/client/simple_press.py" = ["B023"]
"tests/latency/driver_ni_digital_write.py" = ["B023"]

[tool.mypy]
mypy_path = "stubs"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = "synnax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "examples.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nidaqmx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nisyscfg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setup"
ignore_missing_imports = true

# The migration conductor runs these against the pinned PyPI client of each
# SETUP_VERSION, so they target old client APIs, not the workspace client.
[[tool.mypy.overrides]]
module = [
    "tests.migration.channels_calc_setup",
    "tests.migration.channels_setup",
    "tests.migration.ranges_setup",
    "tests.migration.rbac_setup",
    "tests.migration.setup",
    "tests.migration.task_modbus_setup",
    "tests.migration.task_ni_setup",
    "tests.migration.task_opc_setup",
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
