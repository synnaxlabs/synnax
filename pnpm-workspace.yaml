packages:
  - alamos/ts
  - arc/ts
  - client/ts
  - configs/**
  - console
  - drift
  - freighter/ts
  - lyra
  - oracle/lsp/extensions/vscode
  - pluto
  - site/common
  - site/docs
  - site/foundation
  - site/portal
  - site/www
  - studio
  - x/ts

shellEmulator: true

# Node.js downloads from nodejs.org sometimes time out on hosted CI runners. The default
# is two retries.
fetchRetries: 5

trustPolicy: no-downgrade
trustPolicyExclude:
  # Old major versions that predate provenance on their package, so the downgrade is
  # against a newer release the tree never installs.
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
  # The vercel/vercel monorepo stopped attaching provenance attestations partway through
  # each package's history. Every release still comes from the same GitHub Actions
  # trusted publisher and carries the same registry signature, so the only thing lost is
  # the attestation.
  - '@vercel/cli-config@0.3.1'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/functions@3.10.1'
  - '@vercel/oidc@4.0.1'
  - '@vercel/oidc-aws-credentials-provider@3.3.13'
  - '@vercel/routing-utils@6.6.0'
lockfile:
  includeResolutionSettings: true

overrides:
  # GHSA-9wv6-86v2-598j. Lift when @vercel/routing-utils ships a fixed version.
  '@vercel/routing-utils>path-to-regexp': 6.3.0
  # GHSA-p98j-92pf-mc4p and GHSA-6688-9rhm-gjv2. Lift when @codingame/monaco-vscode-api
  # ships a fixed version.
  '@codingame/monaco-vscode-api>dompurify': 3.4.16

catalogMode: strict
catalogPrune: true
autoDedupe: true

allowBuilds:
  '@vscode/vsce-sign': false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true

