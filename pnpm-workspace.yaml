packages:
  - alamos/ts
  - arc/ts
  - client/ts
  - configs/**
  - console
  - docs/site
  - drift
  - freighter/ts
  - oracle/lsp/extensions/vscode
  - pluto
  - studio
  - x/media
  - x/ts

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Old major versions that predate provenance on their package, so the downgrade is
  # against a newer release the tree never installs.
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
  # The vercel/vercel monorepo stopped attaching provenance attestations partway
  # through each package's history. Every release still comes from the same GitHub
  # Actions trusted publisher and carries the same registry signature, so the only
  # thing lost is the attestation.
  - '@vercel/cli-config@0.3.0'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/functions@3.9.9'
  - '@vercel/oidc@3.8.9'
  - '@vercel/routing-utils@6.6.0'
catalogMode: strict
catalogPrune: true
autoDedupe: true

allowBuilds:
  '@vscode/vsce-sign': false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true

