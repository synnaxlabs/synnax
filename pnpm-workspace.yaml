  '@reduxjs/toolkit': ^2.12.0
  '@tauri-apps/api': ^2.11.1
  '@testing-library/react': ^16.3.2
  '@types/node': ^26.1.2
  '@types/offscreencanvas': ^2019.7.3
  '@types/pluralize': ^0.0.33
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/ws': ^8.18.1
  '@vitejs/plugin-react': ^6.0.5
  '@vitest/coverage-v8': ^4.1.10
  async-mutex: ^0.5.0
  clsx: ^2.1.1
  compromise: ^14.16.0
  compromise-dates: ^3.8.1
  eslint: ^10.8.0
  immer: ^11.1.15
  jsdom: ^30.0.1
  madge: ^8.0.0
  pluralize: ^8.0.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-icons: ^5.7.0
