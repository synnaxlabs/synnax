  // snapshot indicates whether this schematic represents a saved snapshot state.
  bool snapshot = 3;
  // nodes contains all diagram nodes in the schematic.
  repeated Node nodes = 4;
  // edges contains all connections between nodes.
  repeated Edge edges = 5;
  // configs contains per-element configuration keyed by node or edge key. The variant of
  // each value selects the symbol or edge style it configures.
  map<string, ElementConfig> configs = 6;
}

// EdgeConfig is the per-edge configuration stored in the schematic configs map. The
// variant selects the visual style of the connection.
message EdgeConfig {
  oneof variant {
    SegmentedEdgeConfig pipe = 1;
    SegmentedEdgeConfig electric = 2;
    SegmentedEdgeConfig secondary = 3;
    SegmentedEdgeConfig jacketed = 4;
    SegmentedEdgeConfig hydraulic = 5;
    SegmentedEdgeConfig pneumatic = 6;
    SegmentedEdgeConfig data = 7;
  }
}

// BooleanSourceSpec is a telemetry source that yields boolean values.
message BooleanSourceSpec {
  oneof variant {
    SourceTelemSpec boolean = 1;
  }
}

// NumberSourceSpec is a telemetry source that yields numeric values.
message NumberSourceSpec {
  oneof variant {
    SourceTelemSpec number = 1;
  }
}

// StringSourceSpec is a telemetry source that yields string values.
message StringSourceSpec {
  oneof variant {
    SourceTelemSpec string = 1;
  }
}

// ColorSourceSpec is a telemetry source that yields colors.
message ColorSourceSpec {
  oneof variant {
    SourceTelemSpec color = 1;
  }
}

// StatusSourceSpec is a telemetry source that yields statuses.
message StatusSourceSpec {
  oneof variant {
    SourceTelemSpec status = 1;
  }
}

// BooleanSinkSpec is a telemetry sink that accepts boolean commands.
message BooleanSinkSpec {
  oneof variant {
    SinkTelemSpec boolean = 1;
  }
}

// NumberSinkSpec is a telemetry sink that accepts numeric commands.
message NumberSinkSpec {
  oneof variant {
    SinkTelemSpec number = 1;
  }
}

// StringSinkSpec is a telemetry sink that accepts string commands.
message StringSinkSpec {
  oneof variant {
    SinkTelemSpec string = 1;
  }
}

