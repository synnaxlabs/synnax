// This proto is hand-maintained (not generated by Oracle). It mirrors the minimal,
// hand-written distribution-layer channel.Channel used for cluster-internal channel
// allocation RPCs. The rich channel metadata (operations, expression, internal, etc.)
// lives in the service layer and is never sent over the cluster-internal wire.

syntax = "proto3";

package distribution.channel.pb;

import "x/go/control/pb/control.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/distribution/channel/pb";

// Channel is the minimal distribution-layer representation of a channel, carrying only
// the storage and routing metadata needed to allocate the channel and create its
// storage across the cluster.
message Channel {
  // name is the human-readable channel name.
  string name = 1;
  // leaseholder is the cluster node that holds the lease for this channel and is
  // authorized to accept writes.
  uint32 leaseholder = 2;
  // data_type is the data type of samples stored in this channel.
  string data_type = 3;
  // is_index is true if this channel is an index channel. Index channels must have int64
  // values (TIMESTAMP data type) written in ascending order, and are most commonly unix
  // nanosecond timestamps.
  bool is_index = 4;
  // local_key is the locally-unique portion of this channel's key.
  uint32 local_key = 5;
  // local_index is the channel used to index this channel's values, associating each
  // value with a timestamp.
  uint32 local_index = 6;
  // virtual is true if this channel does not persist data and is used only for streaming.
  bool virtual = 7;
  // concurrency sets the policy for concurrent writes to the channel's data. Only virtual
  // channels can have a policy of shared concurrency.
  .x.control.pb.Concurrency concurrency = 8;
}
