syntax = "proto3";

package grpc.auth;

import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/auth";

service AuthLoginService {
  rpc Exec(LoginRequest) returns (LoginResponse);
}

message ClusterInfo {
  string cluster_key = 1;
  string node_version = 2;
  uint32 node_key = 3;
  int64 node_time = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  ClusterInfo cluster_info = 3;
}

message User {
  reserved 2;
  reserved "username";
  string key = 1;
}

service AuthMethodsService {
  rpc Exec(google.protobuf.Empty) returns (MethodsResponse);
}

message MethodsResponse {
  repeated string methods = 1;
}

service AuthSessionCreateService {
  rpc Exec(SessionCreateRequest) returns (SessionCreateResponse);
}

service AuthSessionRenewService {
  rpc Exec(google.protobuf.Empty) returns (SessionRenewResponse);
}

service AuthSessionRetrieveService {
  rpc Exec(SessionRetrieveRequest) returns (SessionRetrieveResponse);
}

service AuthSessionDeleteService {
  rpc Exec(SessionDeleteRequest) returns (google.protobuf.Empty);
}

service AuthAPIKeyCreateService {
  rpc Exec(APIKeyCreateRequest) returns (APIKeyCreateResponse);
}

service AuthAPIKeyRetrieveService {
  rpc Exec(APIKeyRetrieveRequest) returns (APIKeyRetrieveResponse);
}

service AuthAPIKeyDeleteService {
  rpc Exec(APIKeyDeleteRequest) returns (google.protobuf.Empty);
}

// Proof is what a subject presents to log in. The method selects which fields apply.
message Proof {
  string method = 1;
  string username = 2;
  string password = 3;
  string key = 4;
  string provider = 5;
  string code = 6;
  string verifier = 7;
  string redirect_uri = 8;
}

// Subject names the user or rack a session belongs to.
message Subject {
  string type = 1;
  string key = 2;
}

message Session {
  string key = 1;
  Subject subject = 2;
  string credential = 3;
  int64 last_active = 4;
}

message SessionCreateRequest {
  Proof proof = 1;
}

message SessionCreateResponse {
  string token = 1;
  Session session = 2;
  optional User user = 3;
  reserved 4;
}

message SessionRenewResponse {
  Session session = 1;
  optional User user = 2;
}

message SessionRetrieveRequest {
  repeated Subject subjects = 1;
}

message SessionRetrieveResponse {
  repeated Session sessions = 1;
}

message SessionDeleteRequest {
  repeated string keys = 1;
}

message APIKey {
  string key = 1;
  Subject subject = 2;
  string name = 3;
  int64 created = 4;
}

message APIKeyCreateRequest {
  Subject subject = 1;
  string name = 2;
}

message APIKeyCreateResponse {
  string token = 1;
  APIKey key = 2;
}

message APIKeyRetrieveRequest {
  repeated Subject subjects = 1;
}

message APIKeyRetrieveResponse {
  repeated APIKey keys = 1;
}

message APIKeyDeleteRequest {
  repeated string keys = 1;
}
