syntax = "proto3";

package grpc.ranger;

import "core/pkg/api/ranger/pb/ranger.proto";
import "core/pkg/service/ranger/pb/ranger.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/ranger";

service RangeCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse) {}
}

service RangeRetrieveService {
  rpc Exec(RetrieveRequest) returns (api.ranger.pb.RetrieveResponse) {}
}

service RangeDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty) {}
}

service RangeRenameService {
  rpc Exec(RenameRequest) returns (google.protobuf.Empty) {}
}

service RangeSetEndService {
  rpc Exec(SetEndRequest) returns (google.protobuf.Empty) {}
}

message DeleteRequest {
  repeated string keys = 1;
}

message CreateRequest {
  repeated service.ranger.pb.Range ranges = 1;
}

message CreateResponse {
  repeated service.ranger.pb.Range ranges = 1;
}

message RetrieveRequest {
  reserved 1, 2;
  reserved "keys", "names";
  api.ranger.pb.RetrieveRequest request = 3;
}

message RenameRequest {
  string key = 1;
  string name = 2;
}

message SetEndRequest {
  string key = 1;
  int64 end = 2;
}
