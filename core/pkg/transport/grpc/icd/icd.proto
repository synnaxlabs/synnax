syntax = "proto3";

package grpc.icd;

import "core/pkg/api/icd/pb/icd.proto";
import "core/pkg/service/icd/pb/icd.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/icd";

service ICDCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse);
}

service ICDRetrieveService {
  rpc Exec(api.icd.pb.RetrieveRequest) returns (api.icd.pb.RetrieveResponse);
}

message CreateRequest {
  repeated service.icd.pb.ICD icds = 1;
}

message CreateResponse {
  repeated service.icd.pb.ICD icds = 1;
}
