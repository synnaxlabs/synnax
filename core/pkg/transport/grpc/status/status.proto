syntax = "proto3";

package grpc.status;

import "google/protobuf/empty.proto";
import "core/pkg/service/status/pb/status.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/status";

service StatusSetService {
  rpc Exec(SetRequest) returns (SetResponse) {}
}

service StatusRetrieveService {
  rpc Exec(RetrieveRequest) returns (RetrieveResponse) {}
}

service StatusDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty) {}
}

service StatusSetByKeyOrNameService {
  rpc Exec(SetByKeyOrNameRequest) returns (SetByKeyOrNameResponse) {}
}

message SetRequest {
  string parent = 1;
  repeated service.status.pb.Status statuses = 2;
}

message SetResponse {
  repeated service.status.pb.Status statuses = 1;
}

message RetrieveRequest {
  repeated string keys = 1;
  string search_term = 2;
  int32 offset = 3;
  int32 limit = 4;
  bool include_labels = 5;
  repeated string has_labels = 6;
  repeated string variants = 7;
}

message RetrieveResponse {
  repeated service.status.pb.Status statuses = 1;
}

message DeleteRequest {
  repeated string keys = 1;
}

message SetByKeyOrNameRequest {
  string key_or_name = 1;
  string message = 2;
  string variant = 3;
}

message SetByKeyOrNameResponse {
  string key = 1;
  bool multiple_matches = 2;
}
