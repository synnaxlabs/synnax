syntax = "proto3";

package grpc.device;

import "core/pkg/api/device/pb/device.proto";
import "core/pkg/service/legacy/device/pb/device.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/device";

service DeviceCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse);
}

service DeviceRetrieveService {
  rpc Exec(RetrieveRequest) returns (api.device.pb.RetrieveResponse);
}

service DeviceDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty);
}

message CreateRequest {
  repeated service.device.pb.Device devices = 1;
}

message CreateResponse {
  repeated service.device.pb.Device devices = 1;
}

message RetrieveRequest {
  reserved 1 to 12;
  reserved "keys", "names", "makes", "models", "locations", "racks", "search", "limit", "offset", "ignore_not_found", "include_status", "include_parent";
  api.device.pb.RetrieveRequest request = 13;
}

message DeleteRequest {
  repeated string keys = 1;
}
