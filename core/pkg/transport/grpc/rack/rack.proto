syntax = "proto3";

package grpc.rack;

import "core/pkg/api/rack/pb/rack.proto";
import "core/pkg/service/rack/pb/rack.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/rack";

service RackCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse);
}

service RackRetrieveService {
  rpc Exec(RetrieveRequest) returns (api.rack.pb.RetrieveResponse);
}

service RackDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty);
}

message CreateRequest {
  repeated service.rack.pb.Rack racks = 1;
}

message CreateResponse {
  repeated service.rack.pb.Rack racks = 1;
}

message RetrieveRequest {
  reserved 1, 2, 3, 4;
  reserved "keys", "names", "integration", "include_status";
  api.rack.pb.RetrieveRequest request = 5;
}

message DeleteRequest {
  repeated uint32 keys = 1;
}
