syntax = "proto3";

package grpc.ni_chassis;

import "core/pkg/api/ni/chassis/pb/ni_chassis.proto";
import "core/pkg/service/ni/chassis/pb/ni_chassis.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/ni/chassis";

service NIChassisCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse);
}

service NIChassisRetrieveService {
  rpc Exec(api.ni_chassis.pb.RetrieveRequest) returns (api.ni_chassis.pb.RetrieveResponse);
}

service NIChassisUpdateService {
  rpc Exec(UpdateRequest) returns (google.protobuf.Empty);
}

service NIChassisDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty);
}

message CreateRequest {
  repeated service.ni_chassis.pb.Chassis chassis = 1;
}

message CreateResponse {
  repeated service.ni_chassis.pb.Chassis chassis = 1;
}

// UpdateRequest writes one field group to the chassis with the given key.
message UpdateRequest {
  string key = 1;
  service.ni_chassis.pb.Update update = 2;
}

message DeleteRequest {
  repeated string keys = 1;
}
