syntax = "proto3";

package grpc.arc;

import "core/pkg/api/arc/pb/arc.proto";
import "core/pkg/service/arc/pb/arc.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/arc";

service ArcCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse) {}
}

service ArcRetrieveService {
  rpc Exec(RetrieveRequest) returns (api.arc.pb.RetrieveResponse) {}
}

service ArcDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty) {}
}

message CreateRequest {
  repeated service.arc.pb.Arc arcs = 1;
}

message CreateResponse {
  repeated service.arc.pb.Arc arcs = 1;
}

message RetrieveRequest {
  reserved 1, 2, 3, 4, 5, 6, 7;
  reserved "keys", "names", "search_term", "limit", "offset", "include_status", "compile";
  api.arc.pb.RetrieveRequest request = 8;
}

message DeleteRequest {
  repeated string keys = 1;
}
