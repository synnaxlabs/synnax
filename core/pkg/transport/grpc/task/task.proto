syntax = "proto3";

package grpc.task;

import "core/pkg/api/task/pb/task.proto";
import "core/pkg/service/task/pb/task.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/task";

service TaskCreateService {
  rpc Exec(CreateRequest) returns (CreateResponse);
}

service TaskRetrieveService {
  rpc Exec(RetrieveRequest) returns (api.task.pb.RetrieveResponse);
}

service TaskDeleteService {
  rpc Exec(DeleteRequest) returns (google.protobuf.Empty);
}

service TaskCopyService {
  rpc Exec(CopyRequest) returns (CopyResponse);
}

message CreateRequest {
  repeated service.task.pb.Task tasks = 1;
}

message CreateResponse {
  repeated service.task.pb.Task tasks = 1;
}

message RetrieveRequest {
  reserved 1 to 5;
  reserved "rack", "keys", "names", "types", "include_status";
  api.task.pb.RetrieveRequest request = 6;
}

message DeleteRequest {
  repeated string keys = 1;
}

message CopyRequest {
  string key = 1;
  string name = 2;
  bool snapshot = 3;
}

message CopyResponse {
  service.task.pb.Task task = 1;
}
