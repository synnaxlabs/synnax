syntax = "proto3";

package grpc.secret;

import "core/pkg/api/secret/pb/secret.proto";
import "core/pkg/service/task/pb/task.proto";

option go_package = "github.com/synnaxlabs/synnax/pkg/transport/grpc/secret";

service SecretRetrieveService {
  rpc Exec(api.secret.pb.RetrieveRequest) returns (api.secret.pb.RetrieveResponse);
}

service SecretResolveService {
  rpc Exec(ResolveRequest) returns (ResolveResponse);
}

message ResolveRequest {
  string grant = 1;
  string task = 2;
  repeated string secrets = 3;
}

message Value {
  string key = 1;
  string value = 2;
}

message ResolveResponse {
  service.task.pb.Command command = 1;
  repeated Value values = 2;
  repeated string secrets = 3;
}
