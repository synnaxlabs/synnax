[project]
name = "synnax"
version = "0.60.0"
readme = "README.md"
description = "Synnax Client Library"
keywords = ["Synnax", "Synnax Python Client"]
authors = [{ name = "Emiliano Bonilla", email = "ebonilla@synnaxlabs.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "alamos",
    "synnax-freighter",
    "synnax-x",
    "click>=8.5.0,<9",
    "keyring>=25.7.0,<26",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.4,<3",
    "pandas>=3.0.6,<4",
    "pydantic>=2.14.1,<3",
    "rich>=15.0.0,<16",
    "typing-extensions>=4.16.0,<5",
    "urllib3>=2.8.0,<3",
]

[project.scripts]
sy = "synnax.cli.synnax:synnax"

[project.urls]
Homepage = "https://synnaxlabs.com"
Repository = "https://github.com/synnaxlabs/synnax"

[dependency-groups]
dev = [
    "asyncua>=2.1.0,<3",
    "flask>=3.1.3,<4",
    "mypy>=2.4.0,<3",
    "ruff>=0.17.1,<1",
    "pandas-stubs>=3.0.5.260914,<4",
    "pymodbus[serial]>=3.16.1,<4",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-timeout>=2.4.0,<3",
    "scipy>=1.18.1,<2",
    "scipy-stubs>=1.18.1.1,<2",
    "types-pyserial>=3.5.0.20260712,<4",
    "nptdms>=1.13.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["synnax"]

[tool.hatch.build.targets.sdist]
exclude = ["examples"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "I",
    "B",
    "DTZ",
    "E501",
    "E7",
    "E9",
    "PLE",
    "UP",
    "SIM",
    "C4",
    "RET",
    "PIE",
    "PERF",
    "RUF",
    "PT",
]
ignore = ["UP040", "UP046", "UP047", "SIM105", "SIM115", "SIM117", "PT012", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["synnax", "alamos", "freighter", "x"]

[tool.mypy]
python_version = "3.12"
mypy_path = "stubs"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
strict = true
timeout = 60
markers = [
    "access: mark test as an access test",
    "arc: mark test as an arc test",
    "auth: mark test as an auth test",
    "license: mark test as a license test",
    "channel: mark test as a channel test",
    "cli: mark test as a cli test",
    "color: mark test as a color test",
    "control: mark test as a control test",
    "deprecation: mark test as a deprecation test",
    "device: mark test as a device test",
    "view: mark test as a view test",
    "ethercat: mark test as an ethercat test",
    "framer: mark test as a framer test",
    "http: mark test as an http test",
    "group: mark test as a group test",
    "imex: mark test as an imex test",
    "frame_codec: mark test as a frame codec test",
    "iterator: mark test as a reader test",
    "internal: mark test as an internal test",
    "labjack: mark test as a labjack test",
    "io: mark test as an io test",
    "multi_node: mark test as a multi_node test",
    "modbus: mark test as a modbus test",
    "ni: mark test as a ni test",
    "ontology: mark test as an ontology test",
    "opcua: mark test as an opcua test",
    "pagerduty: mark test as a pagerduty test",
    "project: mark test as a project test",
    "rack: mark test as a rack test",
    "ranger: mark test as a ranger test",
    "role: mark test as a role test",
    "sequence: mark test as a sequence test",
    "series: mark test as a series test",
    "signals: mark test as a signals test",
    "status: mark test as a status test",
    "task: mark test as a task test",
    "telem: mark test as a telem test",
    "timing: mark test as a timing test",
    "tsconvert: mark test as a tsconvert test",
    "reader: mark test as a frame reader test",
    "writer: mark test as a frame writer test",
    "streamer: mark test as a frame streamer test",
    "calculations: mark test as a calculated channels test",
    "delete: mark test as a data deletion test",
    "focus: marker to temporarily focus a test",
    "user: marker to temporarily focus a user test",
]

[tool.coverage.run]
omit = ["*/types_gen.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
