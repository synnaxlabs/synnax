                        .get(t.id)
                        .filter((o) => o.self && !keyRows.has(o.row))
                        .map((o) => o.row),
                );
                for (const r of t.extends || [])
                    rows.push(
                        `<div class="cc-row meta" data-row="extends:${esc(r.name)}"><span class="r-name">extends</span><span class="r-type">${refHTML(r, t.namespace)}</span></div>`,
                    );
                if (t.target)
                    rows.push(
                        `<div class="cc-row meta" data-row="target"><span class="r-name">${t.kind === "filter" ? "filters" : t.kind === "distinct" ? "distinct" : "="}</span><span class="r-type">${refHTML(t.target, t.namespace)}</span></div>`,
                    );
                for (const f of t.fields || [])
                    rows.push(
                        `<a class="cc-row" data-row="f:${esc(f.name)}" ${f.key ? "data-key" : ""} href="${typeHref(t.id, f.name)}"><span class="r-name">${esc(f.name)}${f.optional ? '<span class="opt">?</span>' : ""}</span>${f.key ? icon.key : ""}${selfRows.has("f:" + f.name) ? `<span title="References its own type" style="color:var(--faint)">${icon.self}</span>` : ""}<span class="r-type">${f.type ? refHTML(f.type, t.namespace, true) : '<span class="t-punc">inherited</span>'}</span></a>`,
                    );
                for (const v of t.variants || [])
                    rows.push(
                        `<div class="cc-row" data-row="v:${esc(v.name)}"><span class="r-name">${esc(v.name)}</span><span class="r-type">${v.fields ? `<span class="t-punc">{ ${v.fields.length} field${v.fields.length === 1 ? "" : "s"} }</span>` : refHTML(v.type, t.namespace, true)}</span></div>`,
                    );
                for (const v of t.values || [])
                    rows.push(
                        `<div class="cc-row"><span class="r-name">${esc(v.name)}</span><span class="r-type t-punc">${esc(v.value)}</span></div>`,
                    );
                return rows.join("");
            }

            function diagramHTML(t) {
                const out = S.out.get(t.id).filter((o) => !o.self);
                const targets = [];
                const seen = new Map();
                for (const o of out) {
                    if (!seen.has(o.target)) {
                        seen.set(o.target, { id: o.target, via: [] });
                        targets.push(seen.get(o.target));
                    }
                    seen.get(o.target).via.push(o);
                }
                const inc = new Map();
                for (const i of S.inc.get(t.id) || []) {
                    if (!inc.has(i.from)) inc.set(i.from, { id: i.from, via: [] });
                    inc.get(i.from).via.push(i);
                }
                const rank = (g) =>
                    g.via.some((v) => v.via === "link")
                        ? 0
                        : g.via.some((v) => v.via === "key")
                          ? 1
                          : 2;
                const incoming = [...inc.values()].sort(
                    (a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id),
                );
                const shownIn = S.showAllIn ? incoming : incoming.slice(0, MAX_COL);

                const mini = (g, side) => {
                    const m = T(g.id);
                    const vias = g.via
                        .filter((v) =>
                            side === "in"
                                ? v.field || v.via === "extends" || v.via === "variant"
                                : false,
                        )
                        .map((v) => {
                            const label =
                                v.via === "extends"
                                    ? "extends"
                                    : v.via === "variant"
                                      ? v.row.slice(2)
                                      : v.field;
                            return `<span class="via ${v.link ? "od-" + (v.link.on_delete || "none") : ""}">${esc(label)}</span>`;
                        });
                    const uniq = [...new Set(vias)];
                    return `<a class="mini k-${m.kind}" href="${typeHref(m.id)}" data-node="${esc(m.id)}" data-side="${side}">
            <div class="mini-head">${glyph(m.kind)}<span class="mini-name">${esc(m.name)}</span><span class="mini-ns">${esc(m.namespace)}</span></div>
            ${side === "out" && m.doc ? `<div class="mini-doc">${inline(firstSentence(m.doc))}</div>` : ""}
            ${uniq.length ? `<div class="mini-via">${uniq.slice(0, 6).join("")}${uniq.length > 6 ? `<span class="via">+${uniq.length - 6}</span>` : ""}</div>` : ""}
          </a>`;
                };
                const html = `<div class="diagram" id="diagram">
          <svg class="wires" id="wires"></svg>
          <div class="col col-in">
            <div class="col-title">Referenced by <span class="count">${incoming.length}</span></div>
            ${shownIn.map((g) => mini(g, "in")).join("") || '<div class="col-empty">Nothing references this type.</div>'}
            ${incoming.length > MAX_COL ? `<button class="show-more" data-action="toggle-in">${S.showAllIn ? "Show fewer" : `Show all ${incoming.length}`}</button>` : ""}
          </div>
          <div class="col col-center">
            <div class="center-card k-${t.kind}" id="center">
              <div class="cc-head" data-row="head">${glyph(t.kind)}<span class="name">${esc(t.name)}</span><span class="ns">${esc(t.namespace)}</span></div>
              ${centerRows(t) || '<div class="cc-more">No fields.</div>'}
            </div>
          </div>
          <div class="col col-out">
            <div class="col-title">References <span class="count">${targets.length}</span></div>
            ${targets.map((g) => mini(g, "out")).join("") || '<div class="col-empty">Only primitive types.</div>'}
          </div>
        </div>`;
                return { html, wires: { out, incoming: shownIn } };
            }

            function wireClass(o) {
                if (o.via === "link")
                    return "w-link od-" + (o.link.on_delete || "none");
                if (o.via === "key") return "w-key";
                if (o.via === "extends") return "w-extends";
                return "w-field";
            }

            function drawWires() {
                const d = $("#diagram");
                const svg = $("#wires");
                if (!d || !svg || getComputedStyle(svg).display === "none") return;
                const box = d.getBoundingClientRect();
                svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
                svg.setAttribute("width", box.width);
                svg.setAttribute("height", box.height);
                const rel = (el) => {
                    const r = el.getBoundingClientRect();
                    return {
                        l: r.left - box.left,
                        r: r.right - box.left,
                        t: r.top - box.top,
                        m: r.top - box.top + r.height / 2,
                        h: r.height,
                    };
                };
                const center = $("#center", d);
                const head = $('[data-row="head"]', d);
                const key = $(".cc-row[data-key]", center);
                const paths = [];
                const curve = (x1, y1, x2, y2) => {
                    const dx = Math.max(30, (x2 - x1) / 2);
                    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
                };
                for (const o of S.wires.out) {
                    const row = $(`[data-row="${CSS.escape(o.row)}"]`, center) || head;
                    const card = $(`.col-out [data-node="${CSS.escape(o.target)}"]`, d);
                    if (!card) continue;
                    const a = rel(row),
                        b = rel(card);
                    const y2 = b.t + 18;
                    paths.push({
                        d: curve(a.r, a.m, b.l, y2),
                        cls: wireClass(o),
                        row: o.row,
                        node: o.target,
                        p1: [a.r, a.m],
                        p2: [b.l, y2],
                    });
                }
                const arrivals = S.wires.incoming.map((g) => {
                    const v =
                        g.via.find((x) => x.via === "link") ||
                        g.via.find((x) => x.via === "key") ||
                        g.via[0];
                    return {
                        g,
                        v,
                        anchor:
                            (v.via === "link" || v.via === "key") && key ? key : head,
                    };
                });
                const perAnchor = new Map();
                arrivals.forEach((w) =>
                    perAnchor.set(w.anchor, (perAnchor.get(w.anchor) || 0) + 1),
                );
                const seenAnchor = new Map();
                for (const { g, v, anchor } of arrivals) {
                    const card = $(`.col-in [data-node="${CSS.escape(g.id)}"]`, d);
                    if (!card) continue;
                    const a = rel(card),
                        b = rel(anchor);
                    const n = perAnchor.get(anchor),
                        i = seenAnchor.get(anchor) || 0;
                    seenAnchor.set(anchor, i + 1);
                    const y2 =
                        b.m +
                        (n > 1 ? (i - (n - 1) / 2) * Math.min(4, (b.h * 0.7) / n) : 0);
                    const y1 = a.t + 18;
                    paths.push({
                        d: curve(a.r, y1, b.l, y2),
                        cls: wireClass(v),
                        row: anchor.dataset.row,
                        node: g.id,
                        p1: [a.r, y1],
                        p2: [b.l, y2],
                    });
                }
                svg.innerHTML = paths
                    .map(
                        (p) =>
                            `<path class="wire ${p.cls}" data-row="${esc(p.row)}" data-node="${esc(p.node)}" d="${p.d}"/>` +
                            `<circle class="port" data-row="${esc(p.row)}" data-node="${esc(p.node)}" cx="${p.p1[0]}" cy="${p.p1[1]}" r="3"/>` +
                            `<circle class="port" data-row="${esc(p.row)}" data-node="${esc(p.node)}" cx="${p.p2[0]}" cy="${p.p2[1]}" r="3"/>`,
                    )
                    .join("");
            }

            function highlightDiagram(target) {
                const d = $("#diagram");
                if (!d) return;
                $$(".hl", d).forEach((e) => e.classList.remove("hl"));
                if (!target) return d.classList.remove("dim");
                const row = target.closest("[data-row]")?.dataset.row;
                const node = target.closest("[data-node]")?.dataset.node;
                let sel;
                if (node)
                    sel = `.wire[data-node="${CSS.escape(node)}"], .port[data-node="${CSS.escape(node)}"]`;
                else if (row)
                    sel = `.wire[data-row="${CSS.escape(row)}"], .port[data-row="${CSS.escape(row)}"]`;
                if (!sel) return d.classList.remove("dim");
                const wires = $$(sel, d);
                if (!wires.length) return d.classList.remove("dim");
                d.classList.add("dim");
                wires.forEach((w) => {
                    w.classList.add("hl");
                    if (w.tagName !== "path") return;
                    $(
                        `.col [data-node="${CSS.escape(w.dataset.node)}"]`,
                        d,
                    )?.classList.add("hl");
                    $(
                        `#center [data-row="${CSS.escape(w.dataset.row)}"]`,
                        d,
                    )?.classList.add("hl");
                });
            }

            function fieldHTML(t, f, inherited) {
                const anchor = inherited ? "" : `id="field-${esc(f.name)}"`;
                return `<div class="field" ${anchor}>
          <div class="f-sig"><span class="f-name">${esc(f.name)}</span>${f.optional ? '<span class="f-opt">?</span>' : ""} ${f.type ? refHTML(f.type, t.namespace) : '<span class="t-punc">inherited type</span>'}${f.default ? ` <span class="f-default">= ${esc(f.default)}</span>` : ""}${inherited ? "" : `<a class="anchor" href="${typeHref(t.id, f.name)}">#</a>`}</div>
          <div class="f-body"><div class="doc">${docHTML(f.name, f.doc) || '<span class="t-punc">No documentation.</span>'}</div>
            ${linkHTML(f.link)}
            ${f.annotations?.some((a) => !a.startsWith("@ref")) ? `<div class="f-annos">${annoHTML(f.annotations)}</div>` : ""}
          </div>
        </div>`;
            }

            function inheritedFields(t) {
                const own = new Set((t.fields || []).map((f) => f.name));
                const omitted = new Set(t.omits || []);
                const groups = [];
                const visit = (ref, seen) => {
                    const p = T(ref.name);
                    if (!p || seen.has(p.id) || p.kind !== "struct") return;
                    seen.add(p.id);
                    const fs = (p.fields || []).filter(
                        (f) => !own.has(f.name) && !omitted.has(f.name),
                    );
                    fs.forEach((f) => own.add(f.name));
                    if (fs.length) groups.push({ from: p, fields: fs });
                    (p.extends || []).forEach((r) => visit(r, seen));
                };
                (t.extends || []).forEach((r) => visit(r, new Set([t.id])));
                return groups;
            }

            function bodySections(t) {
                let html = "";
                if (t.fields?.length)
                    html += `<section><h2>${t.kind === "filter" ? "Lines" : "Fields"} <span class="count">${t.fields.length}</span></h2><div class="fields">${t.fields.map((f) => fieldHTML(t, f)).join("")}</div></section>`;
                const inh = inheritedFields(t);
                if (inh.length)
                    html += `<section class="inherited"><h2>Inherited fields</h2>${inh
                        .map(
                            (g) =>
                                `<h3>from <a href="${typeHref(g.from.id)}">${esc(g.from.id)}</a></h3><div class="fields">${g.fields.map((f) => fieldHTML(g.from, f, true)).join("")}</div>`,
                        )
                        .join("")}</section>`;
                if (t.variants?.length)
                    html += `<section><h2>Variants <span class="count">${t.variants.length}</span></h2>
            <div class="table-wrap"><table class="table"><thead><tr><th>${esc(t.discriminator)}</th><th>Payload</th><th>Description</th></tr></thead><tbody>
            ${t.variants
                .map(
                    (v) =>
                        `<tr><td class="mono">"${esc(v.name)}"</td><td class="mono">${v.fields ? v.fields.map((f) => `<div>${esc(f.name)}${f.optional ? "?" : ""} ${refHTML(f.type, t.namespace)}</div>`).join("") || '<span class="t-punc">{}</span>' : refHTML(v.type, t.namespace)}</td><td><div class="doc">${docHTML(v.name, v.doc || T(v.type.name)?.doc)}</div></td></tr>`,
                )
                .join("")}</tbody></table></div></section>`;
                if (t.values?.length)
                    html += `<section><h2>Members <span class="count">${t.values.length}</span></h2>
            <div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Value</th><th>Description</th></tr></thead><tbody>
            ${t.values.map((v) => `<tr><td class="mono">${esc(v.name)}</td><td class="mono t-punc">${esc(v.value)}</td><td><div class="doc">${docHTML(v.name, v.doc)}</div></td></tr>`).join("")}
            </tbody></table></div></section>`;
                if (t.actions?.length)
                    html += `<section><h2>Actions <span class="count">${t.actions.length}</span></h2><div class="actions">${t.actions
                        .map(
                            (
                                a,
                            ) => `<details class="action"><summary>${icon.chev}<b>${esc(a.name)}</b><span class="doc">${inline(a.doc || "")}</span></summary>
                ${a.fields?.length ? `<div class="fields">${a.fields.map((f) => fieldHTML(t, f, true)).join("")}</div>` : ""}</details>`,
                        )
                        .join("")}</div></section>`;
                const ns = S.ns.get(t.namespace);
                const omits = new Set(
                    (t.annotations || [])
                        .filter((a) => / omit$/.test(a))
                        .map((a) => a.split(" ")[0].slice(1)),
                );
                const gens = LANGS.filter(([k]) => ns.outputs?.[k]).map(
                    ([k, name, short]) =>
                        `<div class="gen-item ${omits.has(k) ? "omitted" : ""}"><span class="lang lang-${k}">${short}</span><div class="meta"><div>${name}${omits.has(k) ? " · omitted" : ""}</div><div title="${esc(ns.outputs[k].join("\n"))}">${esc(ns.outputs[k].join(", "))}</div></div></div>`,
                );
                if (
                    ns.annotations?.includes("@pb") ||
                    (t.annotations || []).includes("@pb")
                )
                    gens.push(
                        `<div class="gen-item"><span class="lang lang-pb">PB</span><div class="meta"><div>Protobuf</div><div>generated from @pb</div></div></div>`,
                    );
                if (gens.length)
                    html += `<section><h2>Generated bindings</h2><div class="gen">${gens.join("")}</div></section>`;
                const annos = (t.annotations || []).filter((a) => !/^@doc/.test(a));
                if (annos.length)
                    html += `<section><h2>Annotations</h2><div class="f-annos">${annoHTML(annos)}</div></section>`;
                return html;
            }

            /* ---------- Namespace page ---------- */

            function renderNamespace(name) {
                const ns = S.ns.get(name);
                document.title = `${name} · Oracle`;
                const types = S.model.types.filter((t) => t.namespace === name);
                const groups = [
                    ["Resources", (t) => t.resource],
                    [
                        "Stored structs",
                        (t) => !t.resource && t.persisted && t.kind === "struct",
                    ],
                    [
                        "Structs",
                        (t) => !t.resource && !t.persisted && t.kind === "struct",
                    ],
                    ["Unions", (t) => t.kind === "union"],
                    ["Enums", (t) => t.kind === "enum"],
                    [
                        "Aliases and distinct types",
                        (t) => t.kind === "alias" || t.kind === "distinct",
                    ],
                    ["Filters", (t) => t.kind === "filter"],
                ];
                const card = (t) => {
                    const rows = (t.fields || [])
                        .slice(0, 5)
                        .map(
                            (f) =>
                                `<div><span>${esc(f.name)}${f.optional ? "?" : ""}</span><span>${refHTML(f.type, name, true)}</span></div>`,
                        );
                    (t.variants || [])
                        .slice(0, 5)
                        .forEach((v) =>
                            rows.push(
                                `<div><span>${esc(v.name)}</span><span>${v.fields ? "{…}" : refHTML(v.type, name, true)}</span></div>`,
                            ),
                        );
                    (t.values || [])
                        .slice(0, 5)
                        .forEach((v) =>
                            rows.push(
                                `<div><span>${esc(v.name)}</span><span class="t-punc">${esc(v.value)}</span></div>`,
                            ),
                        );
                    if (t.target)
                        rows.push(
                            `<div><span>${t.kind === "filter" ? "filters" : "="}</span><span>${refHTML(t.target, name, true)}</span></div>`,
                        );
                    const total = (t.fields || t.variants || t.values || []).length;
                    if (total > 5)
                        rows.push(`<div class="more">+ ${total - 5} more</div>`);
                    return `<a class="tcard k-${t.kind}" href="${typeHref(t.id)}">
            <div class="tcard-head">${glyph(t.kind)}<b>${esc(t.name)}</b><span class="tags">${t.resource ? '<span class="tag">resource</span>' : ""}${t.persisted ? '<span class="tag stored">stored</span>' : ""}</span></div>
            ${t.doc ? `<div class="doc">${docHTML(t.name, firstSentence(t.doc))}</div>` : ""}
            ${rows.length ? `<div class="tcard-fields">${rows.join("")}</div>` : ""}
          </a>`;
                };
                const gens = LANGS.filter(([k]) => ns.outputs?.[k]).map(
                    ([k, lname, short]) =>
                        `<div class="gen-item"><span class="lang lang-${k}">${short}</span><div class="meta"><div>${lname}</div><div title="${esc(ns.outputs[k].join("\n"))}">${esc(ns.outputs[k].join(", "))}</div></div></div>`,
                );
                if (ns.annotations?.includes("@pb"))
                    gens.push(
                        `<div class="gen-item"><span class="lang lang-pb">PB</span><div class="meta"><div>Protobuf</div><div>generated from @pb</div></div></div>`,
                    );
                main.innerHTML = `<div class="page">
          <div class="crumbs"><span>${esc(ns.domain)}</span>${icon.chev}<span>${esc(name)}</span></div>
          <div class="title-row"><h1>${esc(name)}</h1></div>
          <div class="chips">
            <span class="chip">${types.length} types</span>
            ${ns.versions?.length ? `<span class="chip">${icon.db}versions <b>${ns.versions.map((v) => "v" + v).join(" → ")}</b></span>` : ""}
            <button class="chip" data-copy="${esc(ns.file)}" title="Copy the path">${icon.file}${esc(ns.file)}</button>
          </div>
          ${gens.length ? `<section><h2>Generated bindings</h2><div class="gen">${gens.join("")}</div></section>` : ""}
          ${groups
              .map(([title, pred]) => {
                  const ts = types.filter(pred);
                  return ts.length
                      ? `<section><h2>${title} <span class="count">${ts.length}</span></h2><div class="card-grid">${ts.map(card).join("")}</div></section>`
                      : "";
              })
              .join("")}
        </div>`;
                main.scrollTop = 0;
            }

            /* ---------- Graphs ---------- */

            function resourceGraph() {
                const nodes = new Map();
                const edges = new Map();
                const targets = new Set();
                for (const t of S.model.types)
                    for (const { f } of allFields(t))
                        (f.link?.targets || []).forEach((id) => targets.add(id));
                const typeNode = (t, cls) => {
                    if (nodes.has(t.id)) return;
                    const ns = S.ns.get(t.namespace);
                    const v = ns.versions?.length ? ` · v${ns.versions.at(-1)}` : "";
                    const sub =
                        cls === "res"
                            ? `${t.namespace} · resource${v}`
                            : cls === "stored"
                              ? `${t.namespace} · stored${v}`
                              : `${t.namespace} · struct`;
                    nodes.set(t.id, {
                        id: t.id,
                        label: t.name,
                        sub,
                        cls,
                        domain: ns.domain,
                        href: typeHref(t.id),
                        doc: t.doc,
                    });
                };
                const resources = S.model.types.filter(
                    (t) =>
                        (t.kind === "struct" || t.kind === "union") &&
                        t.resource &&
                        (t.persisted || targets.has(t.id)),
                );
                const nsResource = new Map();
                resources.forEach((t) => {
                    typeNode(t, "res");
                    if (!nsResource.has(t.namespace)) nsResource.set(t.namespace, t.id);
                });
                const nodeFor = (t) => {
                    if (nodes.has(t.id)) return t.id;
                    const keyed = t.persisted && t.key && T(t.key);
                    if (S.expanded || keyed) {
                        typeNode(t, keyed ? "stored" : "holder");
                        return t.id;
                    }
                    if (nsResource.has(t.namespace)) return nsResource.get(t.namespace);
                    const gid = "ns:" + t.namespace;
                    if (!nodes.has(gid))
                        nodes.set(gid, {
                            id: gid,
                            label: t.namespace,
                            cls: "group",
                            domain: S.ns.get(t.namespace).domain,
                            href: "#/ns/" + encodeURIComponent(t.namespace),
                            members: new Set(),
                        });
                    nodes.get(gid).members.add(t.id);
                    return gid;
                };
                for (const t of S.model.types) {
                    for (const { f } of allFields(t)) {
                        if (!f.link?.targets?.length) continue;
                        const src = nodeFor(t);
                        const kind = f.link.kind || "place";
                        const od = f.link.on_delete || "none";
                        for (const dst of f.link.targets) {
                            if (!nodes.has(dst))
                                typeNode(
                                    T(dst),
                                    T(dst).persisted ? "stored" : "holder",
                                );
                            const k = `${src}>${dst}|${kind}|${od}`;
                            if (!edges.has(k))
                                edges.set(k, {
                                    s: src,
                                    t: dst,
                                    cls: `k-${kind} od-${od}`,
                                    marker:
                                        od === "cascade" ||
                                        od === "restrict" ||
                                        od === "detach"
                                            ? od
                                            : "plain",
                                    kind,
                                    od,
                                    fields: [],
                                });
                            edges.get(k).fields.push(`${t.id}.${f.name}`);
                        }
                    }
                }
                for (const n of nodes.values())
                    if (n.members)
                        n.sub = `${n.members.size} config struct${n.members.size > 1 ? "s" : ""}`;
                return {
                    key: "resources" + (S.expanded ? "+" : ""),
                    nodes: [...nodes.values()],
                    edges: [...edges.values()],
                    charge: 700,
                    dist: 150,
                    gravity: 0.12,
                };
            }

            function namespaceGraph() {
                const counts = new Map();
                for (const t of S.model.types)
                    for (const o of S.out.get(t.id)) {
                        const to = T(o.raw)?.namespace;
                        if (!to || to === t.namespace) continue;
                        const k = t.namespace + ">" + to;
                        if (!counts.has(k))
                            counts.set(k, { s: t.namespace, t: to, fields: [] });
                        counts
                            .get(k)
                            .fields.push(
                                `${t.id}${o.field ? "." + o.field : ""} → ${o.raw}`,
                            );
                    }
                const sizes = new Map();
                S.model.types.forEach((t) =>
                    sizes.set(t.namespace, (sizes.get(t.namespace) || 0) + 1),
                );
                const nodes = S.model.namespaces.map((n) => ({
                    id: n.name,
                    label: n.name,
                    sub: `${sizes.get(n.name) || 0} types${n.versions?.length ? " · v" + n.versions.at(-1) : ""}`,
                    cls: "res",
                    domain: n.domain,
                    href: "#/ns/" + encodeURIComponent(n.name),
                }));
                const edges = [...counts.values()].map((e) => ({
                    ...e,
                    cls: "nsedge",
                    marker: "ns",
                    width: 1 + Math.log2(e.fields.length) * 0.7,
                }));
                return {
                    key: "namespaces",
                    nodes,
                    edges,
                    charge: 520,
                    dist: 120,
                    gravity: 0.14,
                };
            }

            let measureCtx;
            function textWidth(s, font) {
                measureCtx ??= document.createElement("canvas").getContext("2d");
                measureCtx.font = font;
                return measureCtx.measureText(s).width;
            }

            function simulate(g) {
                const nodes = g.nodes;
                const idx = new Map(nodes.map((n, i) => [n.id, i]));
                const deg = new Array(nodes.length).fill(0);
                const links = g.edges
                    .filter((e) => e.s !== e.t)
                    .map((e) => [idx.get(e.s), idx.get(e.t)]);
                links.forEach(([a, b]) => (deg[a]++, deg[b]++));
                const order = nodes
                    .map((_, i) => i)
                    .sort(
                        (a, b) =>
                            deg[b] - deg[a] || nodes[a].id.localeCompare(nodes[b].id),
                    );
                order.forEach((i, r) => {
                    const a = r * 2.399963;
                    const rad = 40 * Math.sqrt(r + 1) * 2.2;
                    nodes[i].x = Math.cos(a) * rad;
                    nodes[i].y = Math.sin(a) * rad;
                    nodes[i].vx = 0;
                    nodes[i].vy = 0;
                });
                let alpha = 1;
                const n = nodes.length;
                for (let it = 0; it < 420; it++) {
                    alpha *= 0.986;
                    for (let i = 0; i < n; i++)
                        for (let j = i + 1; j < n; j++) {
                            const a = nodes[i],
                                b = nodes[j];
                            let dx = b.x - a.x,
                                dy = b.y - a.y;
                            let d2 = dx * dx + dy * dy;
                            if (d2 < 1)
                                ((dx = Math.random() - 0.5),
                                    (dy = Math.random() - 0.5),
                                    (d2 = 1));
                            const f = (g.charge * alpha) / d2;
                            a.vx -= dx * f;
                            a.vy -= dy * f;
                            b.vx += dx * f;
                            b.vy += dy * f;
                        }
                    for (const [si, ti] of links) {
                        const a = nodes[si],
                            b = nodes[ti];
                        const dx = b.x - a.x,
                            dy = b.y - a.y;
                        const d = Math.sqrt(dx * dx + dy * dy) || 1;
                        const k =
                            ((d - g.dist) / d) *
                            alpha *
                            (0.5 / Math.min(deg[si], deg[ti]));
                        a.vx += dx * k;
                        a.vy += dy * k;
                        b.vx -= dx * k;
                        b.vy -= dy * k;
                    }
                    for (const p of nodes) {
                        p.vx -= p.x * g.gravity * 0.8 * alpha;
                        p.vy -= p.y * g.gravity * 1.2 * alpha;
                        p.vx *= 0.6;
                        p.vy *= 0.6;
                        const v = Math.hypot(p.vx, p.vy);
                        if (v > 40) ((p.vx *= 40 / v), (p.vy *= 40 / v));
                        p.x += p.vx;
                        p.y += p.vy;
                    }
                    for (let i = 0; i < n; i++)
                        for (let j = i + 1; j < n; j++) {
                            const a = nodes[i],
                                b = nodes[j];
                            const dx = b.x - a.x,
                                dy = b.y - a.y;
                            const ox = (a.w + b.w) / 2 + 28 - Math.abs(dx);
                            const oy = (a.h + b.h) / 2 + 22 - Math.abs(dy);
                            if (ox > 0 && oy > 0) {
                                if (ox / (a.w + b.w) < oy / (a.h + b.h)) {
                                    const s = (dx < 0 ? -1 : 1) * ox * 0.5;
                                    a.x -= s;
                                    b.x += s;
                                } else {
                                    const s = (dy < 0 ? -1 : 1) * oy * 0.5;
                                    a.y -= s;
                                    b.y += s;
                                }
                            }
                        }
                }
            }

            function clipToRect(n, px, py, pad) {
                const dx = px - n.x,
                    dy = py - n.y;
                if (!dx && !dy) return [n.x, n.y];
                const sx = dx ? (n.w / 2 + pad) / Math.abs(dx) : Infinity;
                const sy = dy ? (n.h / 2 + pad) / Math.abs(dy) : Infinity;
                const s = Math.min(sx, sy);
                return [n.x + dx * s, n.y + dy * s];
            }

            function edgeGeom(e, byId) {
                const a = byId.get(e.s),
                    b = byId.get(e.t);
                if (a === b) {
                    const x = a.x + a.w / 2 - 18,
                        y = a.y - a.h / 2;
                    return {
                        d: `M${x},${y} C${x + 10},${y - 54} ${x + 70},${y - 20} ${a.x + a.w / 2},${a.y - 6}`,
                        lx: x + 46,
                        ly: y - 26,
                    };
                }
                const mx = (a.x + b.x) / 2,
                    my = (a.y + b.y) / 2;
                const dx = b.x - a.x,
                    dy = b.y - a.y;
                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                const off = e.bend * Math.min(len * 0.18, 70);
                const cx = mx - (dy / len) * off,
                    cy = my + (dx / len) * off;
                const [x1, y1] = clipToRect(a, cx, cy, 2);
                const [x2, y2] = clipToRect(b, cx, cy, 5);
                return {
                    d: `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,
                    lx: (x1 + 2 * cx + x2) / 4,
                    ly: (y1 + 2 * cy + y2) / 4,
                };
            }

            function drawGraph(svg, g) {
                const titleFont = `650 13px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
                const subFont = `500 11px ${getComputedStyle(document.body).getPropertyValue("--sans")}`;
                for (const n of g.nodes) {
                    n.w = Math.max(
                        116,
                        Math.max(
                            textWidth(n.label, titleFont),
                            textWidth(n.sub || "", subFont),
                        ) + 34,
                    );
                    n.h = 46;
                }
                const pairs = new Map();
                for (const e of g.edges) {
                    const k = [e.s, e.t].sort().join("|");
                    const c = pairs.get(k) || 0;
                    pairs.set(k, c + 1);
                    e.bend = (c % 2 ? -1 : 1) * (0.5 + Math.floor(c / 2));
                }
                const cached = S.layouts.get(g.key);
                if (cached && g.nodes.every((n) => cached.has(n.id)))
                    g.nodes.forEach((n) => Object.assign(n, cached.get(n.id)));
                else simulate(g);
                const save = () =>
                    S.layouts.set(
                        g.key,
                        new Map(g.nodes.map((n) => [n.id, { x: n.x, y: n.y }])),
                    );
                save();
                const byId = new Map(g.nodes.map((n) => [n.id, n]));
                const adj = new Map(g.nodes.map((n) => [n.id, new Set([n.id])]));
                g.edges.forEach((e) => (adj.get(e.s).add(e.t), adj.get(e.t).add(e.s)));

                const markers = ["plain", "cascade", "restrict", "detach", "ns"]
                    .map(
                        (m) =>
                            `<marker id="m-${m}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-${m}" d="M0,1 L9,5 L0,9 z"/></marker>`,
                    )
                    .join("");
                const edgeHTML = g.edges
                    .map((e, i) => {
                        const geo = edgeGeom(e, byId);
                        const w = e.width
                            ? `style="stroke-width:${e.width.toFixed(2)}px"`
                            : "";
                        const count =
                            e.fields.length > 1 && g.key !== "namespaces"
                                ? `<text class="edge-count" data-e="${i}" x="${geo.lx}" y="${geo.ly}" text-anchor="middle" dy="4">×${e.fields.length}</text>`
                                : "";
                        return `<path class="edge ${e.cls}" data-e="${i}" d="${geo.d}" marker-end="url(#m-${e.marker})" ${w}/><path class="edge-hit" data-e="${i}" d="${geo.d}"/>${count}`;
                    })
                    .join("");
                const nodeHTML = g.nodes
                    .map(
                        (
                            n,
                        ) => `<g class="node ${n.cls} d-${n.domain}" data-id="${esc(n.id)}" transform="translate(${n.x},${n.y})">
              <rect class="box" x="${-n.w / 2}" y="${-n.h / 2}" width="${n.w}" height="${n.h}" rx="9"/>
              ${n.cls === "res" ? `<rect class="bar" x="${-n.w / 2}" y="${-n.h / 2 + 9}" width="3" height="${n.h - 18}" rx="1.5"/>` : ""}
              <text x="${-n.w / 2 + 15}" y="-2">${esc(n.label)}</text>
              <text class="sub" x="${-n.w / 2 + 15}" y="14">${esc(n.sub || "")}</text>
            </g>`,
                    )
                    .join("");
                svg.innerHTML = `<defs>${markers}</defs><g class="vp"><g class="edges">${edgeHTML}</g><g class="nodes">${nodeHTML}</g></g>`;
                const vp = $(".vp", svg);
                const view = { k: 1, x: 0, y: 0 };
                const apply = () =>
                    vp.setAttribute(
                        "transform",
                        `translate(${view.x},${view.y}) scale(${view.k})`,
                    );
                const fit = () => {
                    const r = svg.getBoundingClientRect();
                    const xs = g.nodes.flatMap((n) => [n.x - n.w / 2, n.x + n.w / 2]);
                    const ys = g.nodes.flatMap((n) => [
                        n.y - n.h / 2 - 50,
                        n.y + n.h / 2,
                    ]);
                    const [x0, x1, y0, y1] = [
                        Math.min(...xs),
                        Math.max(...xs),
                        Math.min(...ys),
                        Math.max(...ys),
                    ];
                    const padTop = 110,
                        pad = 60,
                        padLeft = r.width > 900 ? 200 : pad;
                    view.k = Math.min(
                        (r.width - padLeft - pad) / (x1 - x0),
                        (r.height - padTop - pad) / (y1 - y0),
                        1.25,
                    );
                    view.x =
                        padLeft +
                        (r.width - padLeft - pad) / 2 -
                        ((x0 + x1) / 2) * view.k;
                    view.y =
                        padTop +
                        (r.height - padTop - pad) / 2 -
                        ((y0 + y1) / 2) * view.k;
                    apply();
                };
                fit();
                const zoomAt = (mx, my, f) => {
                    const k = Math.min(3, Math.max(0.12, view.k * f));
                    view.x = mx - ((mx - view.x) * k) / view.k;
                    view.y = my - ((my - view.y) * k) / view.k;
                    view.k = k;
                    apply();
                };
                svg.addEventListener(
                    "wheel",
                    (e) => {
                        e.preventDefault();
                        const r = svg.getBoundingClientRect();
                        zoomAt(
                            e.clientX - r.left,
                            e.clientY - r.top,
                            Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)),
                        );
                    },
                    { passive: false },
                );
                const redrawEdges = () => {
                    g.edges.forEach((e, i) => {
                        if (!adj.has(e.s)) return;
                        const geo = edgeGeom(e, byId);
                        $$(`[data-e="${i}"]`, svg).forEach((el) => {
                            if (el.tagName === "text")
                                (el.setAttribute("x", geo.lx),
                                    el.setAttribute("y", geo.ly));
                            else el.setAttribute("d", geo.d);
                        });
                    });
                };
                let drag = null;
                svg.addEventListener("pointerdown", (e) => {
                    const nodeEl = e.target.closest(".node");
                    drag = {
                        x: e.clientX,
                        y: e.clientY,
                        moved: false,
                        node: nodeEl ? byId.get(nodeEl.dataset.id) : null,
                        el: nodeEl,
                        vx: view.x,
                        vy: view.y,
                    };
                    if (drag.node) ((drag.nx = drag.node.x), (drag.ny = drag.node.y));
                    svg.setPointerCapture(e.pointerId);
                });
                svg.addEventListener("pointermove", (e) => {
                    if (!drag) return hoverGraph(e);
                    const dx = e.clientX - drag.x,
                        dy = e.clientY - drag.y;
                    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
                    drag.moved = true;
                    hideTip();
                    if (drag.node) {
                        drag.node.x = drag.nx + dx / view.k;
                        drag.node.y = drag.ny + dy / view.k;
                        drag.el.setAttribute(
                            "transform",
                            `translate(${drag.node.x},${drag.node.y})`,
                        );
                        redrawEdges();
                    } else {
                        svg.classList.add("panning");
                        view.x = drag.vx + dx;
                        view.y = drag.vy + dy;
                        apply();
                    }
                });
                svg.addEventListener("pointerup", () => {
                    svg.classList.remove("panning");
                    if (drag?.node && !drag.moved) location.hash = drag.node.href;
                    if (drag?.node && drag.moved) save();
                    drag = null;
                });
                const hoverGraph = (e) => {
                    const nodeEl = e.target.closest(".node");
                    const edgeEl = e.target.closest(".edge-hit");
                    svg.classList.toggle("focus", !!(nodeEl || edgeEl));
                    $$(".on", svg).forEach((el) => el.classList.remove("on"));
                    if (nodeEl) {
                        const id = nodeEl.dataset.id;
                        const near = adj.get(id);
                        $$(".node", svg).forEach((el) =>
                            el.classList.toggle("on", near.has(el.dataset.id)),
                        );
                        g.edges.forEach((ed, i) => {
                            if (ed.s === id || ed.t === id)
                                $$(`[data-e="${i}"]`, svg).forEach((el) =>
                                    el.classList.add("on"),
                                );
                        });
                        const n = byId.get(id);
                        const inc = g.edges.filter((ed) => ed.t === id).length,
                            out = g.edges.filter((ed) => ed.s === id).length;
                        const desc = n.members
                            ? `${n.members.size} config structs in ${esc(n.label)}`
                            : n.doc
                              ? inline(firstSentence(n.doc))
                              : esc(n.sub || "");
                        showTip(
                            e,
                            `<b>${esc(n.id)}</b><div style="margin-top:4px">${desc}</div><div style="margin-top:6px;color:var(--faint)">${out} outgoing · ${inc} incoming · click to open</div>`,
                        );
                    } else if (edgeEl) {
                        const ed = g.edges[+edgeEl.dataset.e];
                        $$(`[data-e="${edgeEl.dataset.e}"]`, svg).forEach((el) =>
                            el.classList.add("on"),
                        );
                        [ed.s, ed.t].forEach((id) =>
                            $(`.node[data-id="${CSS.escape(id)}"]`, svg)?.classList.add(
                                "on",
                            ),
                        );
                        const head =
                            g.key === "namespaces"
                                ? `<b>${esc(ed.s)}</b> uses <b>${esc(ed.t)}</b> · ${ed.fields.length} reference${ed.fields.length > 1 ? "s" : ""}`
                                : `<b>${esc(byId.get(ed.s).label)}</b> → <b>${esc(byId.get(ed.t).label)}</b><div style="margin-top:4px">${esc(ed.kind)}${ed.od !== "none" ? " · on delete " + esc(ed.od) : ""}</div>`;
                        const list =
                            ed.fields.slice(0, 10).map(esc).join("<br>") +
                            (ed.fields.length > 10
                                ? `<br>+ ${ed.fields.length - 10} more`
                                : "");
                        showTip(e, `${head}<div class="tt-list">${list}</div>`);
                    } else hideTip();
                };
                svg.addEventListener("pointerleave", () => {
                    svg.classList.remove("focus");
                    hideTip();
                });
                $(".map-zoom").addEventListener("click", (e) => {
                    const z = e.target.closest("button")?.dataset.z;
                    const r = svg.getBoundingClientRect();
                    if (z === "in") zoomAt(r.width / 2, r.height / 2, 1.25);
                    if (z === "out") zoomAt(r.width / 2, r.height / 2, 0.8);
                    if (z === "fit") fit();
                });
            }

            function renderMap(kind) {
                document.title = "Oracle schema map";
                const res = kind === "resources";
                const legend = res
                    ? `<div class="lg-title">Nodes</div>
             <span><svg viewBox="0 0 30 12"><rect x="1" y="1" width="28" height="10" rx="3" fill="var(--raised)" stroke="var(--d-synnax)"/></svg>resource</span>
             <span><svg viewBox="0 0 30 12"><rect x="1" y="1" width="28" height="10" rx="3" fill="var(--raised)" stroke="var(--border-strong)"/></svg>stored struct</span>
             <span><svg viewBox="0 0 30 12"><rect x="1" y="1" width="28" height="10" rx="3" fill="var(--panel)" stroke="var(--border-strong)" stroke-dasharray="4 3"/></svg>config structs</span>
             <div class="lg-title">Stored references</div>
             <span><svg viewBox="0 0 30 12"><path d="M1 6h28" stroke="var(--muted)" stroke-width="2"/></svg>place</span>
             <span><svg viewBox="0 0 30 12"><path d="M1 6h28" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/></svg>use</span>
             <span><svg viewBox="0 0 30 12"><path d="M1 6h28" stroke="var(--od-cascade)" stroke-width="2"/></svg>on delete cascade</span>
             <span><svg viewBox="0 0 30 12"><path d="M1 6h28" stroke="var(--od-restrict)" stroke-width="2"/></svg>on delete restrict</span>
             <span><svg viewBox="0 0 30 12"><path d="M1 6h28" stroke="var(--od-detach)" stroke-width="2"/></svg>on delete detach</span>`
                    : `<div class="lg-title">Domains</div>
             ${DOMAINS.map((d) => `<span><svg viewBox="0 0 30 12"><rect x="1" y="1" width="28" height="10" rx="3" fill="var(--raised)" stroke="var(--d-${d})"/></svg>${d}</span>`).join("")}
             <div class="lg-title">Edges</div>
             <span><svg viewBox="0 0 30 12"><path d="M1 6h28" stroke="var(--faint)" stroke-width="3"/></svg>width shows reference count</span>`;
                main.innerHTML = `<div class="map">
          <svg class="graph" id="graph"></svg>
          <div class="map-bar">
            <div class="seg"><a href="#/map/resources" class="${res ? "on" : ""}">Resources</a><a href="#/map/namespaces" class="${res ? "" : "on"}">Namespaces</a></div>
            ${res ? `<label class="toggle"><input type="checkbox" id="expand" ${S.expanded ? "checked" : ""}/>Show each config struct</label>` : ""}
          </div>
          <div class="map-title">
            <h1>${res ? "How stored data references other data" : "How schema namespaces depend on each other"}</h1>
            <p>${res ? "Every arrow is a field marked <code>@ref</code>. The color shows what happens to the field when the target is deleted." : "An arrow means a type in one namespace uses a type in the other."}</p>
          </div>
          <div class="map-legend">${legend}</div>
          <div class="map-hint">Scroll to zoom · drag to pan · click a node to open it</div>
          <div class="map-zoom"><button data-z="in" title="Zoom in">${icon.plus}</button><button data-z="out" title="Zoom out">${icon.minus}</button><button data-z="fit" title="Fit to view">${icon.fit}</button></div>
        </div>`;
                drawGraph($("#graph"), res ? resourceGraph() : namespaceGraph());
            }

            /* ---------- Search ---------- */

            let results = [];
            let sel = 0;
            function score(e, q) {
                const l = e.label.toLowerCase();
                const name = e.type === "field" ? e.field.toLowerCase() : l;
                let s = 0;
                if (name === q || l === q) s = 100;
                else if (name.startsWith(q)) s = 80;
                else if (l.startsWith(q)) s = 70;
                else if (l.includes(q) || (e.ns + "." + l).includes(q)) s = 55;
                else {
                    let i = 0;
                    for (const c of l) if (c === q[i]) i++;
                    if (i === q.length) s = 25;
                    else if (q.length > 3 && e.doc.toLowerCase().includes(q)) s = 10;
                }
                if (!s) return 0;
                if (e.type === "field") s -= 6;
                if (e.type === "ns") s += 4;
                if (T(e.id)?.resource) s += 3;
                return s - l.length * 0.01;
            }
            function highlight(label, q) {
                const i = label.toLowerCase().indexOf(q);
                if (i < 0 || !q) return esc(label);
                return (
                    esc(label.slice(0, i)) +
                    "<mark>" +
                    esc(label.slice(i, i + q.length)) +
                    "</mark>" +
                    esc(label.slice(i + q.length))
                );
            }
            function runSearch() {
                const q = $("#q").value.trim().toLowerCase();
                if (!q) {
                    results = S.model.types
                        .filter((t) => t.resource && t.persisted)
                        .map((t) => ({
                            type: "type",
                            id: t.id,
                            label: t.name,
                            ns: t.namespace,
                            kind: t.kind,
                            doc: t.doc || "",
                        }));
                } else {
                    results = S.search
                        .map((e) => [score(e, q), e])
                        .filter(([s]) => s > 0)
                        .sort((a, b) => b[0] - a[0])
                        .slice(0, 60)
                        .map(([, e]) => e);
                }
                sel = 0;
                $("#results").innerHTML = results.length
                    ? (q
                          ? ""
                          : '<div class="col-title" style="padding:6px 10px">Resources</div>') +
                      results
                          .map(
                              (
                                  r,
                                  i,
                              ) => `<div class="result ${i === sel ? "sel" : ""}" data-i="${i}">
                  ${r.type === "ns" ? `<span class="glyph" style="background:var(--d-${r.ns})">N</span>` : glyph(r.kind)}
                  <div class="r-main"><div class="r-label">${highlight(r.label, q)}</div>${r.doc ? `<div class="r-doc">${esc(firstSentence(r.doc))}</div>` : ""}</div>
                  <span class="r-ns">${esc(r.type === "ns" ? r.ns : r.ns)}</span><span class="r-kind">${r.type === "field" ? "field" : r.type === "ns" ? "file" : r.kind}</span>
                </div>`,
                          )
                          .join("")
                    : '<div class="palette-empty">No matches.</div>';
            }
            function moveSel(d) {
                if (!results.length) return;
                sel = (sel + d + results.length) % results.length;
                $$(".result").forEach((el) =>
                    el.classList.toggle("sel", +el.dataset.i === sel),
                );
                $(`.result[data-i="${sel}"]`)?.scrollIntoView({ block: "nearest" });
            }
            function openResult(i) {
                const r = results[i];
                if (!r) return;
                closePalette();
                location.hash =
                    r.type === "ns"
                        ? "#/ns/" + encodeURIComponent(r.id)
                        : typeHref(r.id, r.field);
            }
            function openPalette() {
                $("#palette").hidden = false;
                $("#q").value = "";
                runSearch();
                $("#q").focus();
            }
            function closePalette() {
                $("#palette").hidden = true;
            }

            /* ---------- Tooltip ---------- */

            function showTip(e, html) {
                tip.innerHTML = html;
                tip.hidden = false;
                const w = tip.offsetWidth,
                    h = tip.offsetHeight;
                let x = e.clientX + 14,
                    y = e.clientY + 14;
                if (x + w > innerWidth - 8) x = e.clientX - w - 14;
                if (y + h > innerHeight - 8) y = e.clientY - h - 14;
                tip.style.left = x + "px";
                tip.style.top = y + "px";
            }
            function hideTip() {
                tip.hidden = true;
            }

            /* ---------- Theme ---------- */

            function storage(key, value) {
                try {
                    if (value === undefined) return localStorage.getItem(key);
                    if (value === null) localStorage.removeItem(key);
                    else localStorage.setItem(key, value);
                } catch {
                    return null;
                }
            }
            function applyTheme(t) {
                if (t) document.documentElement.dataset.theme = t;
                else delete document.documentElement.dataset.theme;
            }
            applyTheme(storage("oracle-theme"));

            /* ---------- Events ---------- */

            document.addEventListener("click", (e) => {
                const copy = e.target.closest("[data-copy]");
                if (copy) {
                    navigator.clipboard?.writeText(copy.dataset.copy);
                    const old = copy.innerHTML;
                    copy.innerHTML = "Copied";
                    setTimeout(() => (copy.innerHTML = old), 900);
                }
                const kind = e.target.closest("[data-kind]");
                if (kind) {
                    const k = kind.dataset.kind;
                    S.hidden.has(k) ? S.hidden.delete(k) : S.hidden.add(k);
                    renderKinds();
                    renderTree();
                }
                if (e.target.closest('[data-action="toggle-in"]')) {
                    S.showAllIn = !S.showAllIn;
                    route();
                }
                const result = e.target.closest(".result");
                if (result) openResult(+result.dataset.i);
                if (e.target === $("#palette")) closePalette();
            });
            main.addEventListener("change", (e) => {
                if (e.target.id === "expand") {
                    S.expanded = e.target.checked;
                    route();
                }
            });
            main.addEventListener("mouseover", (e) => {
                if (e.target.closest("#diagram")) highlightDiagram(e.target);
            });
            main.addEventListener("mouseout", (e) => {
                if (!e.relatedTarget?.closest?.("#diagram")) highlightDiagram(null);
            });
            $("#filter").addEventListener("input", (e) => {
                S.filter = e.target.value;
                renderTree();
            });
            $("#search-open").addEventListener("click", openPalette);
            $("#menu").addEventListener("click", () =>
                document.body.classList.toggle("side-open"),
            );
            $("#q").addEventListener("input", runSearch);
            $("#q").addEventListener("keydown", (e) => {
                if (e.key === "ArrowDown") (e.preventDefault(), moveSel(1));
                if (e.key === "ArrowUp") (e.preventDefault(), moveSel(-1));
                if (e.key === "Enter") openResult(sel);
            });
            document.addEventListener("keydown", (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
                    e.preventDefault();
                    $("#palette").hidden ? openPalette() : closePalette();
                } else if (e.key === "Escape") closePalette();
                else if (
                    e.key === "/" &&
                    !/INPUT|TEXTAREA/.test(document.activeElement.tagName)
                ) {
                    e.preventDefault();
                    openPalette();
                }
            });
            $("#theme").addEventListener("click", () => {
                const dark = matchMedia("(prefers-color-scheme: dark)").matches;
                const cur =
                    document.documentElement.dataset.theme || (dark ? "dark" : "light");
                const next = cur === "dark" ? "light" : "dark";
                applyTheme(next);
                storage("oracle-theme", next);
            });
            $("#reload").addEventListener("click", () => load(true));
            window.addEventListener("hashchange", () => {
                S.showAllIn = false;
                route();
            });
            let resizeTimer;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(drawWires, 60);
            });
            new ResizeObserver(() => drawWires()).observe(main);

            async function load(again) {
                const btn = $("#reload");
                btn.classList.add("spin");
                try {
                    const res = await fetch("model.json", { cache: "no-store" });
                    if (!res.ok) throw new Error(await res.text());
                    index(await res.json());
                    S.layouts.clear();
                    renderKinds();
                    renderTree();
                    route();
                } catch (err) {
                    main.innerHTML = `<div class="error"><div><h2>Oracle could not analyze the schemas</h2><pre>${esc(err.message)}</pre><p>Fix the schemas, then select reload.</p></div></div>`;
                } finally {
                    btn.classList.remove("spin");
                }
            }
            load();
        </script>
    </body>
</html>
