[project]
name = "synnax-scripts-common"
version = "0.0.0"
description = "Test utilities for scripts and .github/scripts"
requires-python = ">=3.12,<4"
classifiers = ["Private :: Do Not Upload"]

[tool.hatch.build.targets.wheel]
packages = ["scripts_common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
