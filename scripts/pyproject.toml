[project]
name = "synnax-scripts"
version = "0.0.0"
description = "Synnax repository scripts"
requires-python = ">=3.12,<4"
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114,<2",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "I",
    "B",
    "DTZ",
    "E7",
    "E9",
    "PLE",
    "UP",
    "SIM",
    "C4",
    "RET",
    "PIE",
    "PERF",
    "RUF",
    "PT",
]
ignore = ["UP040", "UP046", "UP047", "SIM105", "SIM115", "SIM117", "PT012", "RUF001"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
