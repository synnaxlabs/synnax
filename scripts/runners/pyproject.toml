[project]
name = "synnax-runners"
version = "0.0.0"
description = "Self-hosted CI runner fleet controller"
requires-python = ">=3.13,<4"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "boto3>=1.44,<2",
    "certifi>=2026.10.23,<2027",
    "mypy-boto3-ce>=1.44,<2",
    "mypy-boto3-cloudwatch>=1.44,<2",
    "mypy-boto3-ec2>=1.43,<2",
    "mypy-boto3-pricing>=1.44,<2",
    "mypy-boto3-secretsmanager>=1.44,<2",
    "mypy-boto3-ssm>=1.44,<2",
    "psutil>=7.2,<8",
    "pyjwt[crypto]>=2.15,<3",
    "synnax>=0.62,<0.63",
]

[dependency-groups]
dev = [
    "boto3-stubs[ec2,ssm,ce,cloudwatch,pricing,secretsmanager,iam]>=1.44,<2",
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.6,<1",
    "types-psutil>=7.2.2.20261111,<8",
]

[tool.uv]
package = false

[tool.ruff]
extend = "../pyproject.toml"
src = [".", "tests"]

[tool.ruff.lint.per-file-ignores]
# Log.error(context, exception) is this package's logger, not the stdlib's.
"*.py" = ["PLE1205"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "synnax.*"
ignore_missing_imports = true
