version: "2"
linters:
  enable:
    - ginkgolinter
    - modernize
    - revive
    - must
    - set
    - goroutineleak
    - blank
  settings:
    ginkgolinter:
      forbid-focus-container: true
      force-expect-to: true
      validate-async-intervals: true
      force-tonot: true
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    revive:
      rules:
        - name: error-naming
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
        - name: unused-receiver
        - name: unused-parameter
    custom:
      must:
        type: "module"
        description: >
          Detects Expect(err).ToNot(HaveOccurred()) patterns that can be replaced with
          MustSucceed.
      set:
        type: "module"
        description: >
          Detects map[T]struct{} and map[T]bool patterns that should use set.Set[T].
      goroutineleak:
        type: "module"
        description: >
          Enforces goroutine leak checks in Ginkgo suites: every suite must register
          ShouldNotLeakGoroutinesPerSpec, and every BeforeSuite/BeforeAll must call
          ShouldNotLeakGoroutines first.
      blank:
        type: "module"
        description: >
          Detects blank receivers and all-blank parameter lists that can drop their
          names entirely.
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gci:
      no-inline-comments: true
      no-prefix-comments: true
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
        - pattern: "a[0:b]"
          replacement: "a[:b]"
        - pattern: "time.Now().Sub(a)"
          replacement: "time.Since(a)"
        - pattern: "a.Sub(time.Now())"
          replacement: "time.Until(a)"
        - pattern: "strings.Replace(a, b, c, -1)"
          replacement: "strings.ReplaceAll(a, b, c)"
        - pattern: "!(a == b)"
          replacement: "a != b"
    gofumpt:
      extra-rules: true
    golines:
      max-len: 88
      shorten-comments: true
  exclusions:
    warn-unused: true
    generated: strict
