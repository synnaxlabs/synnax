version: "2"
linters:
  enable:
    - ginkgolinter
    - modernize
    - revive
    - must
    - set
    - goroutineleak
    - suiteconfig
    - errmatch
    - depguard
    - forbidigo
    - testpackage
  settings:
    depguard:
      rules:
        errors:
          files:
            - "$all"
            - "!**/x/go/errors/*.go"
          deny:
            - pkg: "errors"
              desc: use github.com/synnaxlabs/x/errors
            - pkg: "github.com/cockroachdb/errors"
              desc: use github.com/synnaxlabs/x/errors
            - pkg: "github.com/pkg/errors"
              desc: use github.com/synnaxlabs/x/errors
    forbidigo:
      forbid:
        - pattern: ^fmt\.Errorf$
          msg: use errors.Newf or errors.Wrapf from github.com/synnaxlabs/x/errors
    ginkgolinter:
      forbid-focus-container: true
      force-expect-to: true
      validate-async-intervals: true
      force-tonot: true
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    revive:
      rules:
        - name: error-naming
        - name: marshal-receiver
        - name: use-slices-concat
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
    testpackage:
      # Exempt no file and no package. "^$" matches no file name. An empty list would
      # fall back to the default of main, so the list holds a name no package has.
      skip-regexp: "^$"
      allow-packages: [""]
    custom:
      must:
        type: "module"
        description: >
          Detects Expect(err).ToNot(HaveOccurred()) patterns that can be replaced with
          MustSucceed.
      set:
        type: "module"
        description: >
          Detects map[T]struct{} and map[T]bool patterns that should use set.Set[T].
      goroutineleak:
        type: "module"
        description: >
          Enforces goroutine leak checks in Ginkgo suites: every suite must register
          ShouldNotLeakGoroutinesPerSpec, and every BeforeSuite/BeforeAll must call
          ShouldNotLeakGoroutines first.
      suiteconfig:
        type: "module"
        description: >
          Enforces the shared Ginkgo configuration in Ginkgo suites: every RunSpecs call
          must pass SuiteConfig().
      errmatch:
        type: "module"
        description: >
          Forbids error assertions that do not identify the error: HaveOccurred(),
          Not(Succeed()), and Not(BeNil()) on an error.
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gci:
      no-inline-comments: true
      no-prefix-comments: true
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
        - pattern: "a[0:b]"
          replacement: "a[:b]"
        - pattern: "time.Now().Sub(a)"
          replacement: "time.Since(a)"
        - pattern: "a.Sub(time.Now())"
          replacement: "time.Until(a)"
        - pattern: "strings.Replace(a, b, c, -1)"
          replacement: "strings.ReplaceAll(a, b, c)"
        - pattern: "!(a == b)"
          replacement: "a != b"
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    golines:
      max-len: 88
      shorten-comments: true
  exclusions:
    warn-unused: true
    generated: strict
