coverage:
  status:
    project: off
    patch:
      minimum:
        target: 80%
      no_decrease:
        target: auto

fixes:
  - "github.com/synnaxlabs/alamos/::/alamos/go/"
  - "github.com/synnaxlabs/arc/::/arc/go/"
  - "github.com/synnaxlabs/freighter/::/freighter/go/"
  - "github.com/synnaxlabs/synnax/::/core/"
  - "github.com/synnaxlabs/x/::/x/go/"

flag_management:
  default_rules:
    carryforward: true

ignore:
  # Oracle
  - "**/*.gen.go"
  - "**/*.gen.ts"
  - "**/*.gen.h"
  - "**/types_gen.py"
  # protoc
  - "**/*.pb.go"
  # stringer and go generate
  - "**/*_string.go"
  - "**/*_generated.go"
  - "arc/go/parser/token_literals.go"
  # ANTLR
  - "**/parser/*_lexer.go"
  - "**/parser/*_parser.go"
  - "**/parser/*parser_*listener.go"
  - "**/parser/*parser_*visitor.go"
  # generate_mock.py
  - "driver/ni/daqmx/mock.h"
  - "**/examples/**"
  - "stylelint.config.js"
