[project]
name = "synnax-freighter"
version = "0.60.0"
readme = "README.md"
authors = [{ name = "Emiliano Bonilla", email = "ebonilla@synnaxlabs.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "alamos",
    "synnax-x",
    "pydantic>=2.14.1,<3",
    "urllib3>=2.8.0,<3",
    "websockets>=17.3,<18",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3",
    "ruff>=0.17.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-timeout>=2.4.0,<3",
    "trustme>=1.2.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["freighter"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "I",
    "B",
    "DTZ",
    "E501",
    "E7",
    "E9",
    "PLE",
    "UP",
    "SIM",
    "C4",
    "RET",
    "PIE",
    "PERF",
    "RUF",
    "PT",
]
ignore = ["UP040", "UP046", "UP047", "SIM105", "SIM115", "SIM117", "PT012", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["freighter", "alamos", "x"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
strict = true
timeout = 60
markers = [
    "http: mark test as an http test",
    "sync: mark test as a sync test",
    "ws: mark test as a websocket test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
