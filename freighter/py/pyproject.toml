[project]
name = "synnax-freighter"
version = "0.56.0"
authors = [{ name = "Emiliano Bonilla", email = "ebonilla@synnaxlabs.com" }]
requires-python = ">=3.12,<4"
dependencies = [
    "alamos",
    "synnax-x",
    "pydantic>=2.13.4,<3",
    "urllib3>=2.7.0,<3",
    "websockets>=16.1.1,<17",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "ruff>=0.16.0,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["freighter"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["freighter", "alamos", "x"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_types = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
markers = [
    "http: mark test as an http test",
    "sync: mark test as a sync test",
    "ws: mark test as a websocket test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
