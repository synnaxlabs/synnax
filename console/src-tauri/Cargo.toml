[package]
name = "synnax-console"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

[dependencies]
device_query = "4.0.1"
keyring = "4.2.0"
serde = "1.0.229"
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["devtools"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-fs = "2.7.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-prevent-default = "6.0.1"
getrandom = { version = "0.4.3", optional = true }
zip = { version = "9.0.5", optional = true, default-features = false, features = [
    "deflate",
] }
tokio = { version = "1.54.0", optional = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread"] }

[features]
# by default Tauri runs in production mode when `tauri dev` runs it is executed with
# `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem DO
# NOT remove this
custom-protocol = ["tauri/custom-protocol"]
# Synnax Desktop: the app bundles a Core and supervises it.
desktop = ["dep:getrandom", "dep:tokio", "dep:zip"]
