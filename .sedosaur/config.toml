# How Sedosaur reviews pull requests. A review reads this file, `prompt.md`, and the
# rules from the base branch, so a pull request cannot change its own review.

model = "claude-opus-5-5"
effort = "high"
# The tools the reviewer can use. The review runs in Claude Code's restricted mode, so a
# tool that runs code is off unless this list names it.
tools = ["Read", "Grep", "Glob"]
# Git globs of files the review leaves out of the diff.
excluded = ["**/pnpm-lock.yaml", "**/uv.lock", "**/go.sum", "**/MODULE.bazel.lock"]
# The diff is cut at a file boundary past this many characters. The reviewer reads the
# files it leaves out.
diff_chars = 300_000

# The highest score a review can give while it has a blocking finding of the severity. A
# review with no blocking finding scores 5.
[caps]
P0 = 2
P1 = 4
P2 = 4

# Documents of the repository that the reviewer applies. A document with `paths` applies
# only when the pull request changes a file that matches one of its globs. Rules written
# for the reviewer go in `rules/*.md`, with `description` and `paths` in TOML front
# matter between `+++` lines.
[[context]]
path = "CONTRIBUTING.md"
description = "Review tiers, pull request rules, and the dark-launch lane"

[[context]]
path = "AGENTS.md"
description = "Code style and architectural principles for every language"

[[context]]
path = "docs/claude/architecture.md"
description = "System design, layering, and data flow"

[[context]]
path = "docs/claude/testing.md"
description = "Testing rules across languages"

[[context]]
path = "docs/claude/toolchains/go.md"
description = "Go rules"
paths = ["**/*.go"]

[[context]]
path = "docs/claude/toolchains/typescript.md"
description = "TypeScript rules"
paths = ["**/*.ts", "**/*.tsx"]

[[context]]
path = "docs/claude/toolchains/python.md"
description = "Python rules"
paths = ["**/*.py"]

[[context]]
path = "docs/claude/toolchains/cpp.md"
description = "C++ rules"
paths = ["**/*.cpp", "**/*.h"]

[[context]]
path = "docs/claude/toolchains/css.md"
description = "CSS rules"
paths = ["**/*.css", "**/*.scss"]

[[context]]
path = "docs/claude/ux.md"
description = "How the Console, Lyra, Pluto, and the docs site look and behave"
paths = ["console/**", "pluto/**", "lyra/**", "site/**"]

[[context]]
path = "docs/claude/integration-test.md"
description = "Integration test rules"
paths = ["integration/**"]

[[context]]
path = "site/docs/CONTRIBUTING.md"
description = "Docs site writing rules"
paths = ["site/docs/**"]

[[context]]
path = "core/AGENTS.md"
description = "The Core"
paths = ["core/**"]

[[context]]
path = "console/AGENTS.md"
description = "The Console"
paths = ["console/**"]

[[context]]
path = "pluto/AGENTS.md"
description = "Pluto"
paths = ["pluto/**"]

[[context]]
path = "lyra/AGENTS.md"
description = "Lyra"
paths = ["lyra/**"]

[[context]]
path = "driver/AGENTS.md"
description = "The Driver"
paths = ["driver/**"]

[[context]]
path = "arc/AGENTS.md"
description = "Arc"
paths = ["arc/**"]

[[context]]
path = "oracle/AGENTS.md"
description = "Oracle and its schemas"
paths = ["oracle/**", "schemas/**"]

[[context]]
path = "scripts/AGENTS.md"
description = "Repository scripts"
paths = ["scripts/**"]

# Focused passes that run beside the pass with the rules on the first review of a pull
# request. They see the pull request and its diff, but not the rules.
[[lens]]
name = "Interleavings"
effort = "medium"
focus = """
Trace the concurrent and repeated paths that real callers make through the changed code:
two callers at once, a read before a lock and a read after it, a retry, a cancel, a
timeout, a stop or close while work still runs, and events that arrive in another order.
First read the lock, transaction, or queue that guards the state. For each path that it
does not serialize, follow the state to the end, and name what ends up wrong and the
trigger that makes it.
"""

[[lens]]
name = "Edge values"
effort = "medium"
focus = """
Give each changed function the values at its edges that a caller or a user can send:
empty, zero, blank or whitespace-only strings, missing fields, the exact boundary of
each range or comparison, the largest sizes and the caps that cut them, other numeric
types and their defaults, and duplicate or reordered entries. Check the platform edges
too: Windows file rules, and what runs only in CI.
"""

[[lens]]
name = "Contracts"
effort = "medium"
focus = """
List each contract the change alters: a function, type, schema, default, setting, or
behavior that the description promises. Find every caller, consumer, sibling path,
preview, and test that depends on it, in every language, and check that each one still
holds. Check each guarantee of the description along its whole path.
"""
