# The change map behind CI. Each key is a filter dorny/paths-filter reports as an output
# of the changes job. A module lists its toolchain, every module its manifest depends on
# directly, and its own sources, so a change to any of them runs its tests. YAML
# resolves an alias only after its anchor, so entries sit in dependency order. A test
# that needs a running Core also keys on core in ci.yaml rather than here, which keeps
# the *_build keys free of server dependencies.

ci: &ci
  - .github/filters.yaml
  - .github/workflows/ci.yaml

bazel: &bazel
  - .bazelignore
  - .bazeliskrc
  - .bazelrc
  - .gitmodules
  - MODULE.bazel
  - MODULE.bazel.lock

cpp: &cpp
  - *bazel
  - *ci
  - .clang-format
  - .clang-format-ignore
  - .github/workflows/test.cpp.yaml
  - scripts/check_clang_format.sh
  - scripts/install_clang_format.sh
  - scripts/run_bazel.sh
  - scripts/sanitizers/**

go: &go
  - *ci
  - .github/workflows/test.go.yaml
  - .golangci.yaml
  - codecov.yaml
  - scripts/check_go_generate.sh

py: &py
  - *ci
  - .github/workflows/test.py.yaml
  - codecov.yaml
  - pyproject.toml
  - uv.lock

ts: &ts
  - *ci
  - .github/workflows/test.ts.yaml
  - codecov.yaml
  - configs/**
  - knip.json
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - turbo.json

