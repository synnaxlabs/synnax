  - .python-version
  - pyproject.toml
  - uv.lock

ts: &ts
  - .github/actions/setup-pnpm/**
  - .github/workflows/test.ts.yaml
  - configs/**
  - knip.json
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - turbo.json

