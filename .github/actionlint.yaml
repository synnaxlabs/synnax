self-hosted-runner:
  labels:
    - macos-build-bot
    - ubuntu-agent-bot
    - ubuntu-build-bot
    - ubuntu-test-bot
    - windows-build-bot
    - windows-test-bot

config-variables:
  - AGENT_DEFAULT
  - AGENT_LOGINS
  - AGENT_RUNNER_ROLE_ARN
  - BAZEL_REMOTE_CACHE_GRPC_URL
  - NIGHTLY_TRIAGE_ENABLED
  - PREVIEW_DOMAIN
  - PREVIEW_INSTANCE_ID
  - PREVIEW_REGION
  - PREVIEW_ROLE_ARN
  - S3_CACHE_BUCKET
  - S3_CACHE_REGION
  - SECURITY_REPORT_PUBLIC_KEY
  - TURBO_TEAM
  - WINDOWS_TEST_BOTS

paths:
  .github/workflows/cancel.merge-group.yaml:
    ignore:
      # GitHub sends the destroyed type, but actionlint knows only checks_requested.
      - 'invalid activity type "destroyed"'
