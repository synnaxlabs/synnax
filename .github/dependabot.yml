version: 2
updates:
  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      bazel:
        patterns:
          - "*"
    # openssl is the only dependency in vendor/boringssl/MODULE.bazel, so this keeps
    # updates out of vendor/. exclude-paths cannot: Dependabot regenerates the lock from
    # the files it fetches, and that needs vendor/boringssl and vendor/esi.bzl.
    ignore:
      - dependency-name: "openssl"
    labels:
      - "dependencies"
      - "review/bot"
