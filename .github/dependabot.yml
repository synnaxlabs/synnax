# Version updates for the pinned GitHub Actions, the agent CLIs, and the uv, Go, and
# Cargo dependencies. Security updates are on in the repository settings, but they obey
# the ignore rules here.

version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    # A release must be a week old, so a bad or compromised one has time to be pulled.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    # The trailing space stops Dependabot from adding a colon after the prefix.
    commit-message:
      prefix: "[ci] "
    # A bump changes code that runs in CI, and the classifier marks a change to
    # .github/actions/ for human review, so a person merges these.
    labels:
      - dependencies
      - review/human

  # The root lockfile pins the Python packages and the scripts that run in CI with
  # secrets. The runner controller runs daily on main with AWS credentials. A person
  # merges these.
  - package-ecosystem: uv
    directories:
      - /
      - /scripts/runners
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Keeps the dependency ranges that the published Python packages declare.
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[ci] "
    labels:
      - dependencies
      - review/human

  # The agent and Sedosaur jobs run these CLIs, which release several times a week.
  - package-ecosystem: npm
    directory: /.github/agents/cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      agent-cli:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[ci] "
    labels:
      - dependencies
      - review/human

  # A bump changes the code that the Core releases build from.
  - package-ecosystem: gomod
    directories:
      - /alamos/go
      - /arc/go
      - /cesium
      - /core
      - /freighter/go
      - /freighter/integration
      - /gorp
      - /oracle
      - /x/go
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # A module that is direct in one go.mod is often indirect in the siblings that
    # replace it, so every pin must move together or go mod tidy fails.
    allow:
      - dependency-type: all
    # Sibling modules come from replace directives.
    ignore:
      - dependency-name: github.com/synnaxlabs/*
    groups:
      go:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[ci] "
    labels:
      - dependencies
      - review/human

  # A bump changes the code that the Console releases build from.
  - package-ecosystem: cargo
    directory: /console/src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Tauri crates must match the minor version of their @tauri-apps package in the
    # pnpm catalog, so only patches update here. A dependency can still pull in a new
    # minor, and the Tauri CLI then fails the build, so a person bumps both sides.
    ignore:
      - dependency-name: "tauri*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      rust:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[ci] "
    labels:
      - dependencies
      - review/human
