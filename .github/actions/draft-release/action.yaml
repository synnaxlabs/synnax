name: Draft release
description: Creates a draft release under a tag with generated notes

inputs:
  tag:
    description: The release tag, such as console/v0.59.0
    required: true
  title:
    description: The release title
    required: true
  previous_tag:
    description: The tag the generated notes start after, or empty for the first release
    required: false
    default: ""
  notes:
    description: Text placed above the generated notes
    required: false
    default: ""
  config:
    description:
      The release notes config; PRs that match none of its categories are left out
    required: false
    default: .github/release.yml
  prerelease:
    description: Mark the release as a pre-release
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # A failed earlier run can leave a draft under the same tag, and GitHub lets a
    # second release take a tag that another holds, so clear the tag first.
    - name: Draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        NOTES: ${{ inputs.notes }}
        PRERELEASE: ${{ inputs.prerelease }}
        CONFIG: ${{ inputs.config }}
      run: |
        .github/scripts/clear_release_drafts.sh "$TAG"
        BODY=$(.github/scripts/release_notes.sh "$TAG" "$GITHUB_SHA" "$CONFIG" \
          "$PREVIOUS_TAG" "$NOTES")
        ARGS=(--draft --target "$GITHUB_SHA" --title "$TITLE" --notes "$BODY")
        if [ "$PRERELEASE" = true ]; then ARGS+=(--prerelease); fi
        gh release create "$TAG" "${ARGS[@]}"
