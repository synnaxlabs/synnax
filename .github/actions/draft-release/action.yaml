name: Draft release
description: Creates a draft release under a tag with generated notes

inputs:
  tag:
    description: The release tag, such as console/v0.59.0
    required: true
  title:
    description: The release title
    required: true
  previous_tag:
    description: The tag the generated notes start after, or empty for the first release
    required: false
    default: ""
  notes:
    description: Text placed above the generated notes
    required: false
    default: ""
  config:
    description:
      The release notes config; PRs that match none of its categories are left out
    required: false
    default: .github/release.yml
  prerelease:
    description: Mark the release as a pre-release
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # A failed earlier run can leave a draft under the same tag; the tag itself only
    # exists once a release is published.
    - name: Draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        NOTES: ${{ inputs.notes }}
        PRERELEASE: ${{ inputs.prerelease }}
        CONFIG: ${{ inputs.config }}
      run: |
        RELEASES=$(gh release list --json tagName,isDraft)
        if jq -e --arg tag "$TAG" 'any(.[]; .tagName == $tag and .isDraft)' \
          <<< "$RELEASES" > /dev/null; then
          gh release delete "$TAG" --yes
        fi
        GENERATE=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA"
          -f configuration_file_path="$CONFIG")
        if [ -n "$PREVIOUS_TAG" ]; then
          GENERATE+=(-f previous_tag_name="$PREVIOUS_TAG")
        fi
        # New contributors are counted across the whole repo, not the config's PRs.
        BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
          "${GENERATE[@]}" --jq .body | awk '/^## New Contributors/ { skip = 1 }
          /^\*\*Full Changelog\*\*/ { skip = 0 } !skip')
        if [ -n "$NOTES" ]; then BODY="$NOTES"$'\n\n'"$BODY"; fi
        ARGS=(--draft --target "$GITHUB_SHA" --title "$TITLE" --notes "$BODY")
        if [ "$PRERELEASE" = true ]; then ARGS+=(--prerelease); fi
        gh release create "$TAG" "${ARGS[@]}"
