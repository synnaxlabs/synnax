name: Verify Checks
description: Fails unless the commit's checks and the branch's newest push runs passed

inputs:
  sha:
    description: The commit to verify
    required: true

runs:
  using: composite
  steps:
    - name: Verify Checks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ inputs.sha }}
      run: .github/scripts/verify_checks.sh "$SHA" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME"
