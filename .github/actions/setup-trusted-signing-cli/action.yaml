name: Set up trusted-signing-cli
description: Puts trusted-signing-cli on the PATH of a Windows runner

inputs:
  version:
    description: The trusted-signing-cli release to install
    required: false
    default: 0.11.0

outputs:
  cache-hit:
    description: Whether the binary came from the Actions cache
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The compression method is part of the cache version, so a runner without zstd
    # cannot read an entry that a runner with zstd saved.
    - name: Set up zstd
      uses: ./.github/actions/setup-zstd

    # The path text is part of the cache version too. A path in the workspace has the
    # same text on each runner, so one entry serves all of them, and each runner unpacks
    # it into a directory of its own. Git ignores the binary.
    - name: Restore trusted-signing-cli
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .trusted-signing-cli/bin
        key:
          trusted-signing-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Build trusted-signing-cli
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      # cargo writes its install records next to bin, where Git does not ignore them.
      run: |
        cargo install trusted-signing-cli --version "$VERSION" --locked \
          --root "$RUNNER_TEMP/trusted-signing-cli"
        mkdir -p .trusted-signing-cli
        mv "$RUNNER_TEMP/trusted-signing-cli/bin" .trusted-signing-cli/bin

    # Merge queue caches are unreachable from later runs, so the queue never saves.
    - name: Save trusted-signing-cli
      if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .trusted-signing-cli/bin
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Add trusted-signing-cli to the PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE\.trusted-signing-cli\bin" >> "$GITHUB_PATH"
