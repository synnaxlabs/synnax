name: Set up zstd
description: Installs zstd on a Windows runner that does not have it

runs:
  using: composite
  steps:
    # Without zstd, actions/cache compresses with gzip. On the Windows build bots,
    # unpacking the pnpm store then takes 104 s instead of 15 s.
    - name: Install zstd
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        if (Get-Command zstd -ErrorAction SilentlyContinue) { exit 0 }
        choco install zstandard --version=1.5.7.20250308 -y --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
