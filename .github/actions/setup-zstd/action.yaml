name: Set up zstd
description: Puts zstd on the PATH of a Windows runner that does not have it

runs:
  using: composite
  steps:
    # Without zstd, actions/cache compresses with gzip. On the Windows build bots,
    # unpacking the pnpm store then takes 104 s instead of 15 s.
    - name: Install zstd
      if: runner.os == 'Windows'
      shell: powershell
      env:
        SHA256: ACB4E8111511749DC7A3EBEDCA9B04190E37A17AFEB73F55D4425DBF0B90FAD9
        VERSION: 1.5.7
      run: |
        if (Get-Command zstd -ErrorAction SilentlyContinue) { exit 0 }
        $name = "zstd-v$env:VERSION-win64"
        $zip = "$env:RUNNER_TEMP\$name.zip"
        Invoke-WebRequest -OutFile $zip `
          "https://github.com/facebook/zstd/releases/download/v$env:VERSION/$name.zip"
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SHA256) {
          throw "The zstd archive does not match its checksum."
        }
        Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
        Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\$name"
