name: Agent gate
description:
  Decides whether an agent may act on a pull request and records the attempt. At the
  cap, labels the pull request agent/needs-human and asks for a person. Needs a checkout
  of the default branch and a token that can write issues and pull requests.

inputs:
  pr:
    description: The pull request number
    required: true
  kind:
    description: The attempt counter, such as fix
    required: true
  cap:
    description: The number of attempts before the gate asks for a person
    required: true
  task:
    description: What the agent does, to finish "Agent attempt 1 of 3 to ..."
    required: true
  sha:
    description: Skip when the head is no longer this commit
    required: false
    default: ""
  agents:
    description: A JSON array of agent logins; empty uses the defaults in agent_gate.sh
    required: false
    default: ""

outputs:
  run:
    description: Whether the agent may act
    value: ${{ steps.gate.outputs.run }}

runs:
  using: composite
  steps:
    - name: Decide and record the attempt
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        AGENT_LOGINS: ${{ inputs.agents }}
        PR: ${{ inputs.pr }}
        KIND: ${{ inputs.kind }}
        CAP: ${{ inputs.cap }}
        SHA: ${{ inputs.sha }}
        TASK: ${{ inputs.task }}
      run: |
        result=$(.github/scripts/agent_gate.sh "$PR" "$KIND" "$CAP" "$SHA")
        echo "$result"
        read -r verdict detail <<< "$result"
        RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        COMMENTS="repos/$GITHUB_REPOSITORY/issues/$PR/comments"
        case "$verdict" in
          run)
            gh api "$COMMENTS" > /dev/null -f body="<!-- agent:${KIND} -->
        Agent attempt ${detail} of ${CAP} to ${TASK}: [run](${RUN_URL})."
            echo run=true >> "$GITHUB_OUTPUT"
            ;;
          stop)
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" > /dev/null \
              -f 'labels[]=agent/needs-human'
            gh api "$COMMENTS" > /dev/null -f body="Agents stopped after ${CAP} \
        attempts to ${TASK}. A person must look. Remove the \`agent/needs-human\` label to \
        let agents try again."
            ;;
        esac
