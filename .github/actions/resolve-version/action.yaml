name: Resolve Version
description: Resolves the next version of a product from its Git tags

inputs:
  product:
    description: console, core, or driver
    required: true
  bump:
    description: patch or minor
    required: true
  prerelease:
    description: Tag a release candidate (-rc.N)
    required: false
    default: "false"

outputs:
  version:
    description: The resolved version, such as 0.59.0 or 0.59.0-rc.2
    value: ${{ steps.resolve.outputs.version }}
  tag:
    description: The release tag, such as console/v0.59.0
    value: ${{ steps.resolve.outputs.tag }}
  minor:
    description: The train the version belongs to, such as 0.59
    value: ${{ steps.resolve.outputs.minor }}
  previous_tag:
    description: The previous stable product tag, the baseline for release notes
    value: ${{ steps.resolve.outputs.previous_tag }}

runs:
  using: composite
  steps:
    - name: Resolve Version
      id: resolve
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
        BUMP: ${{ inputs.bump }}
        PRERELEASE: ${{ inputs.prerelease }}
      run:
        .github/scripts/resolve_version.sh "$PRODUCT" "$BUMP" "$PRERELEASE" >>
        "$GITHUB_OUTPUT"
