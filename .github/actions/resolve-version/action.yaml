name: Resolve version
description: Resolves the next version of a product from its Git tags

inputs:
  product:
    description: console, core, driver, desktop, ts, or py
    required: true
  prerelease:
    description: Tag a release candidate (-rc.N)
    required: false
    default: "false"
  ref:
    description:
      The branch the release runs from. It is main, release/X.Y, or release/desktop-X.Y
      for Desktop. Any other branch fails.
    required: true
  bump:
    description: patch, minor, or major (Desktop only)
    required: false
    default: ""
  core:
    description:
      The stable Core version the same run releases. ts and py take its minor from main,
      and fail from main without it.
    required: false
    default: ""

outputs:
  version:
    description: The resolved version, such as 0.59.0 or 0.59.0-rc.2
    value: ${{ steps.resolve.outputs.version }}
  tag:
    description: The release tag, such as console/v0.59.0
    value: ${{ steps.resolve.outputs.tag }}
  minor:
    description: The train the version belongs to, such as 0.59
    value: ${{ steps.resolve.outputs.minor }}
  previous_tag:
    description:
      The previous stable product tag, the baseline for release notes, or empty for the
      first release
    value: ${{ steps.resolve.outputs.previous_tag }}
  latest:
    description: true when no stable tag of the product outranks the resolved version
    value: ${{ steps.resolve.outputs.latest }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: resolve
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
        PRERELEASE: ${{ inputs.prerelease }}
        REF: ${{ inputs.ref }}
        BUMP: ${{ inputs.bump }}
        CORE: ${{ inputs.core }}
      run:
        .github/scripts/resolve_version.sh "$PRODUCT" "$PRERELEASE" "$REF" "$BUMP"
        "$CORE" >> "$GITHUB_OUTPUT"
