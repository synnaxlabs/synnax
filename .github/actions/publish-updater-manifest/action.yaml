name: Publish updater manifest
description:
  Uploads the Tauri updater manifest (latest.json) for an app whose signed bundles are
  already on the release

inputs:
  tag:
    description: The release tag, such as console/v0.59.0
    required: true
  version:
    description: The resolved version, such as 0.59.0 or 0.59.0-rc.2
    required: true
  app:
    description: The app product name, such as Synnax or Synnax Desktop
    required: true
  linux:
    description: Whether the release carries a signed Linux AppImage
    default: "false"

runs:
  using: composite
  steps:
    # The manifest carries the app version the build stamped (X.Y.Z-N for a candidate),
    # so the updater compares like with like. Asset names replace the spaces in the app
    # name with dashes. The updater looks up {os}-{arch}-{installer} before {os}-{arch},
    # so each Windows install updates with the installer it came from, and an install
    # that cannot name its installer gets NSIS, the one the download page offers. The
    # macOS bundle is arm64 only, so an Intel Mac gets no entry. An app without a Linux
    # build gets a placeholder Linux entry that no install can apply.
    - name: Write updater manifest
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        VERSION: ${{ inputs.version }}
        APP: ${{ inputs.app }}
        LINUX: ${{ inputs.linux }}
      run: |
        APP_VERSION="${VERSION/-rc./-}"
        NAME="${APP// /-}"
        BASE="https://github.com/${GH_REPO}/releases/download/${TAG}"
        MAC="${NAME}.app.tar.gz"
        NSIS="${NAME}_${APP_VERSION}_x64-setup.exe"
        MSI="${NAME}_${APP_VERSION}_x64_en-US.msi"
        APPIMAGE="${NAME}_${APP_VERSION}_amd64.AppImage"
        gh release download "$TAG" \
          --pattern "$MAC.sig" --pattern "$NSIS.sig" --pattern "$MSI.sig"
        if [ "$LINUX" = true ]; then
          gh release download "$TAG" --pattern "$APPIMAGE.sig"
          LINUX_ENTRY=$(jq -n --rawfile signature "$APPIMAGE.sig" \
            --arg url "$BASE/$APPIMAGE" '{signature: $signature, url: $url}')
        else
          LINUX_ENTRY=$(jq -n --arg url "$BASE/$MAC" \
            '{signature: "not_supported_and_tauri_requires_an_entry", url: $url}')
        fi
        jq -n --arg version "v${APP_VERSION}" --arg notes "${APP} Update" \
          --arg mac "$BASE/$MAC" --arg nsis "$BASE/$NSIS" --arg msi "$BASE/$MSI" \
          --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --rawfile darwin "$MAC.sig" \
          --rawfile nsis_sig "$NSIS.sig" \
          --rawfile msi_sig "$MSI.sig" \
          --argjson linux "$LINUX_ENTRY" \
          '{
            version: $version,
            notes: $notes,
            pub_date: $date,
            platforms: {
              "darwin-aarch64": {signature: $darwin, url: $mac},
              "linux-x86_64": $linux,
              "windows-x86_64": {signature: $nsis_sig, url: $nsis},
              "windows-x86_64-nsis": {signature: $nsis_sig, url: $nsis},
              "windows-x86_64-msi": {signature: $msi_sig, url: $msi}
            }
          }' > latest.json
        gh release upload --clobber "$TAG" latest.json
