name: Set up Tauri on Linux
description: Installs the system packages that build and bundle the Tauri app on Ubuntu

runs:
  using: composite
  steps:
    - name: Install Tauri system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
          librsvg2-dev patchelf file
