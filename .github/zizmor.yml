# Findings reviewed and accepted. Every entry gives its reason, and a new use of a rule
# in any other file still reports.

rules:
  # These run from the base branch. Three read pull requests only through the API, as
  # data. agent.shepherd.yaml checks out a pull request for its agent only after
  # agent_gate.sh passes: the head must be in this repository, and an agent must have
  # opened it or it must have the agent/autofix label.
  dangerous-triggers:
    ignore:
      - agent.shepherd.yaml
      - check.review.yaml
      - label.classify.yaml
      - merge.auto.yaml
  # The service images come from build.docker.yaml, which tags each with a hash of its
  # sources.
  unpinned-images:
    ignore:
      - test.cpp.yaml
      - test.py.yaml
      - test.ts.yaml
