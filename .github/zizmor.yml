# Findings reviewed and accepted. Every entry gives its reason. Except for a disabled
# rule, a new use of a rule in any other file still reports.

rules:
  # These run from the base branch and read pull requests through the API as data. None
  # checks out or runs pull request code.
  dangerous-triggers:
    ignore:
      - agent.shepherd.yaml
      - check.review.yaml
      - label.classify.yaml
      - merge.auto.yaml
  # The service images come from build.docker.yaml, which tags each with a hash of its
  # sources.
  unpinned-images:
    ignore:
      - test.cpp.yaml
      - test.py.yaml
      - test.ts.yaml
  # Every caller passes secrets to a workflow in this repository, and a workflow reads
  # only the secrets it names. A hand-kept list across 80 calls would blank a secret
  # without an error when it drifts.
  secrets-inherit:
    disable: true
