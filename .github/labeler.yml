# Area labels applied to a pull request from the paths it touches. Release notes group
# entries by these labels (see release.yml).

console:
  - changed-files:
      - any-glob-to-any-file: console/**

driver:
  - changed-files:
      - any-glob-to-any-file: driver/**

server:
  - changed-files:
      - any-glob-to-any-file:
          - aspen/**
          - cesium/**
          - core/**

pluto:
  - changed-files:
      - any-glob-to-any-file: pluto/**

drift:
  - changed-files:
      - any-glob-to-any-file: drift/**

freighter:
  - changed-files:
      - any-glob-to-any-file: freighter/**

arc:
  - changed-files:
      - any-glob-to-any-file: arc/**

py-client:
  - changed-files:
      - any-glob-to-any-file: client/py/**

ts-client:
  - changed-files:
      - any-glob-to-any-file: client/ts/**

cpp-client:
  - changed-files:
      - any-glob-to-any-file:
          - client/clib/**
          - client/cpp/**

user docs:
  - changed-files:
      - any-glob-to-any-file: docs/site/**

tech docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/CLAUDE.md"
          - docs/CONTRIBUTING.md
          - docs/claude/**
          - docs/tech/**

ops:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - configs/**
          - integration/**
          - scripts/**
