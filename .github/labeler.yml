# Labels applied to a pull request from the paths it touches, one per product a user
# knows. A package lands under the product that ships it; a per-language package under
# the product in that language. Release notes group entries by these labels (see
# release.yml).

console:
  - changed-files:
      - any-glob-to-any-file:
          - console/**
          - drift/**
          - pluto/**

driver:
  - changed-files:
      - any-glob-to-any-file:
          - client/cpp/**
          - driver/**
          - freighter/cpp/**
          - x/cpp/**

core:
  - changed-files:
      - any-glob-to-any-file:
          - alamos/go/**
          - aspen/**
          - cesium/**
          - core/**
          - freighter/go/**
          - x/go/**

arc:
  - changed-files:
      - any-glob-to-any-file: arc/**

py-client:
  - changed-files:
      - any-glob-to-any-file:
          - alamos/py/**
          - client/py/**
          - freighter/py/**
          - x/py/**

ts-client:
  - changed-files:
      - any-glob-to-any-file:
          - alamos/ts/**
          - client/ts/**
          - freighter/ts/**
          - x/ts/**

user docs:
  - changed-files:
      - any-glob-to-any-file: docs/site/**
