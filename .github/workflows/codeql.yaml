# The code scanning rule on main blocks a pull request until it has an analysis for each
# category main has. A pull request that changes no C++ input uploads an empty C++
# analysis instead of a scan, and likewise for Rust. Every other run scans all
# languages. A changed category orphans the alerts filed under the old one.

name: CodeQL

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]
  schedule:
    - cron: "0 6 * * 1" # 6am UTC on Monday
  workflow_dispatch:

# A new push to a pull request cancels the scan it replaces. Pushes to a branch scan one
# at a time, and a newer push replaces the one that waits, so a burst of merges scans
# only the first and last commit.
concurrency:
  group:
    codeql-${{ github.event.pull_request.number || github.event_name == 'push' &&
    github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp: ${{ steps.filter.outputs.codeql_cpp }}
      rust: ${{ steps.filter.outputs.codeql_rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/filters.yaml

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, go, javascript-typescript, python, rust]
    env:
      PLACEHOLDER:
        ${{ github.event_name == 'pull_request' && (matrix.language == 'c-cpp' &&
        needs.changes.outputs.cpp != 'true' || matrix.language == 'rust' &&
        needs.changes.outputs.rust != 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The proxy drops streams at times, so a failed fetch falls back to the source.
      - name: Download the Go modules
        if: matrix.language == 'go'
        env:
          GOPROXY: https://proxy.golang.org|direct
        run: |
          .github/scripts/go_mod_download.sh alamos/go arc/go cesium core freighter/go \
            freighter/integration gorp oracle x/go
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: env.PLACEHOLDER != 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: env.PLACEHOLDER != 'true'
        with:
          category: /language:${{ matrix.language }}
      - name: Write an empty analysis
        if: env.PLACEHOLDER == 'true'
        run: |
          cat > "$RUNNER_TEMP/placeholder.sarif" <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{ "tool": { "driver": { "name": "CodeQL" } }, "results": [] }]
          }
          EOF
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: env.PLACEHOLDER == 'true'
        with:
          sarif_file: ${{ runner.temp }}/placeholder.sarif
          category: /language:${{ matrix.language }}

  # The CodeQL check, not this run, fails on new alerts that the main ruleset blocks.
  # GitHub sends no event to the default branch for it.
  shepherd:
    name: Wake the shepherd
    needs: analyze
    if:
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor
      != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Agent - Shepherd when the CodeQL check fails
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHECKS="repos/$GH_REPO/commits/$SHA/check-runs?check_name=CodeQL"
          for _ in {1..30}; do
            CHECK=$(.github/scripts/gh_api.sh "$CHECKS" \
              --jq '.check_runs[0] | "\(.status) \(.conclusion)"')
            read -r STATUS CONCLUSION <<< "$CHECK"
            [ "$STATUS" != completed ] || break
            sleep 10
          done
          echo "CodeQL check: $STATUS $CONCLUSION"
          [ "$STATUS" = completed ] || exit 1
          [ "$CONCLUSION" = failure ] || exit 0
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/agent.shepherd.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"
