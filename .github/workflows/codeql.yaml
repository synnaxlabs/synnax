# Every run scans all languages. The code scanning rule on main blocks a pull request
# until it has an analysis for each category main has. A changed category orphans the
# alerts filed under the old one.

name: CodeQL

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]
  schedule:
    - cron: "0 6 * * 1" # 6am UTC on Monday
  workflow_dispatch:

# A new push to a pull request cancels the scan it replaces.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, go, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7
      # The proxy drops streams at times, so a failed fetch falls back to the source.
      - name: Download the Go modules
        if: matrix.language == 'go'
        env:
          GOPROXY: https://proxy.golang.org|direct
        run: |
          .github/scripts/go_mod_download.sh alamos/go arc/go aspen cesium core \
            freighter/go freighter/integration gorp oracle x/go
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
