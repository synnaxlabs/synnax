name: Test - C++

on:
  workflow_call:
    inputs: &inputs
      apt_packages:
        description: Ubuntu packages to install before the build
        required: false
        type: string
        default: ""
      clang_tidy:
        description: Whether to lint the targets with clang-tidy
        required: false
        type: boolean
        default: false
      core_image:
        description: Core image to test against on Ubuntu, or empty for none
        required: false
        type: string
        default: ""
      coverage_flag:
        description:
          Codecov flag for coverage of the sources in `directories` on Ubuntu, or empty
          for no coverage
        required: false
        type: string
        default: ""
      directories:
        description: Directories clang-format checks, separated by spaces
        required: false
        type: string
        default: ""
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      rust:
        description: Whether the build needs a Rust toolchain
        required: false
        type: boolean
        default: false
      sanitizers:
        description: Whether to build with the sanitizer configs
        required: false
        type: boolean
        default: true
      targets:
        description: Bazel target patterns to test
        required: true
        type: string
      test_flags:
        description: Extra flags for every bazel test command
        required: false
        type: string
        default: ""
      test_tags:
        description: Extra test tag filters, comma separated
        required: false
        type: string
        default: ""
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *inputs

env:
  BAZEL_REMOTE_CACHE_FLAGS:
    --remote_cache=${{ vars.BAZEL_REMOTE_CACHE_GRPC_URL }}
    --remote_cache_compression=true

# The test services pull their images from GHCR.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-build-bot, ubuntu-build-bot, windows-build-bot]
        exclude:
          - os: ${{ !inputs.macos && 'macos-build-bot' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-build-bot' }}
          - os: ${{ !inputs.windows && 'windows-build-bot' }}
    runs-on: ${{ matrix.os }}
    # A cold-cache build passes 30 minutes on every OS.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start Core
        if: runner.os == 'Linux' && inputs.core_image != ''
        uses: ./.github/actions/start-service
        env:
          SYNNAX_LISTEN: localhost:9090
          SYNNAX_VERBOSE: true
          SYNNAX_INSECURE: true
          SYNNAX_MEM: true
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        with:
          name: synnax
          image: ${{ inputs.core_image }}
          port: 9090
          token: ${{ github.token }}
          variables: >-
            SYNNAX_LISTEN SYNNAX_VERBOSE SYNNAX_INSECURE SYNNAX_MEM SYNNAX_LICENSE_KEY

      - name: Install packages
        timeout-minutes: 10
        if: runner.os == 'Linux' && inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          read -ra packages <<< "$PACKAGES"
          sudo apt-get install -y "${packages[@]}"

      - name: Install Rust
        if: inputs.rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          # A cache save deletes rustup from ~/.cargo/bin, which the build bots keep.
          cache-bin: false

      - name: Update submodules
        shell: bash
        run: .github/scripts/update_submodules.sh

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      - name: Set up uv
        if: runner.os == 'Linux' && inputs.directories != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known

      - name: Install clang-format
        if: runner.os == 'Linux' && inputs.directories != ''
        run: scripts/install_clang_format.sh

      - name: Check formatting
        if: runner.os == 'Linux' && inputs.directories != ''
        env:
          DIRECTORIES: ${{ inputs.directories }}
        run: |
          read -ra directories <<< "$DIRECTORIES"
          for directory in "${directories[@]}"; do
            scripts/check_clang_format.sh "$directory"
          done

      - name: Choose the test tags
        id: tags
        shell: bash
        env:
          EXTRA: ${{ inputs.test_tags }}
          CORE: ${{ runner.os == 'Linux' && inputs.core_image != '' }}
        run: |
          tags=()
          if [ "$RUNNER_OS" = macOS ]; then tags+=(-no-asan); fi
          if [ "$CORE" = false ]; then tags+=(-requires-core); fi
          if [ -n "$EXTRA" ]; then tags+=("$EXTRA"); fi
          IFS=,
          echo "flag=${tags[*]:+--test_tag_filters=${tags[*]}}" >> "$GITHUB_OUTPUT"

      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # The HTTP/2 client in Go stalls Bazelisk downloads on the Mac build bots.
          GODEBUG: http2client=0
          TARGETS: ${{ inputs.targets }}
          TAG_FLAG: ${{ steps.tags.outputs.flag }}
          TEST_FLAGS: ${{ inputs.test_flags }}
        run: |
          read -ra args <<< "$TARGETS $TAG_FLAG $TEST_FLAGS"
          bazel test ${{ inputs.sanitizers && '--config=asan' || '' }} \
            --test_output=all "${args[@]}"

      # The Ubuntu build bots have 16 GB and no swap. A sanitized compile takes up to
      # 3.5 GB, so eight at once reach the OOM killer, which takes the runner down with
      # the job and leaves its Core service container holding port 9090.
      - name: Test (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          COVERAGE_FLAG: ${{ inputs.coverage_flag }}
          DIRECTORIES: ${{ inputs.directories }}
          TARGETS: ${{ inputs.targets }}
          TAG_FLAG: ${{ steps.tags.outputs.flag }}
          TEST_FLAGS: ${{ inputs.test_flags }}
        run: |
          lsan="$GITHUB_WORKSPACE/scripts/sanitizers/lsan_suppressions.txt"
          read -ra args <<< "$BAZEL_REMOTE_CACHE_FLAGS $TARGETS $TAG_FLAG $TEST_FLAGS"
          verb="test"
          if [ -n "$COVERAGE_FLAG" ]; then
            verb=coverage
            read -ra directories <<< "$DIRECTORIES"
            filter=$(printf '^//%s[/:],' "${directories[@]}")
            args+=(--combined_report=lcov --instrument_test_targets \
              "--instrumentation_filter=${filter%,}")
          fi
          bazel "$verb" --jobs=4 \
            ${{ inputs.sanitizers && '--config=asan-leak' || '' }} --test_output=all \
            --test_env=LSAN_OPTIONS=suppressions="$lsan" "${args[@]}"

      # GCC counts the exception edge of every call as a branch, so Codecov marks most
      # lines partial. Report line coverage only, as Go does.
      - name: Strip branch coverage
        if: runner.os == 'Linux' && inputs.coverage_flag != ''
        run: |
          grep -v '^BR[DFH]' bazel-out/_coverage/_coverage_report.dat \
            > "$RUNNER_TEMP/coverage.lcov"

      - name: Upload coverage
        if: runner.os == 'Linux' && inputs.coverage_flag != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CURL_HOME: ${{ github.workspace }}/.github/codecov
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ runner.temp }}/coverage.lcov
          flags: ${{ inputs.coverage_flag }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          TAG_FLAG: ${{ steps.tags.outputs.flag }}
          TEST_FLAGS: ${{ inputs.test_flags }}
        run: |
          export MSYS_NO_PATHCONV=1
          read -ra args <<< "$BAZEL_REMOTE_CACHE_FLAGS $TARGETS $TAG_FLAG $TEST_FLAGS"
          scripts/run_bazel.sh test --test_output=all "${args[@]}"

      - name: Clean build caches (Ubuntu)
        if: always() && runner.os == 'Linux'
        run: integration/scripts/clean_build_caches.sh 25

      - name: Clean build caches (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: integration/scripts/CleanBuildCaches.ps1 -MinFreeGB 30

      - name: Stop the services
        if: always() && runner.os == 'Linux'
        run: docker rm --force synnax 2> /dev/null || true

  lint:
    name: Lint
    if: inputs.clang_tidy
    runs-on: ubuntu-build-bot
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install packages
        timeout-minutes: 10
        if: inputs.apt_packages != ''
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          read -ra packages <<< "$PACKAGES"
          sudo apt-get install -y "${packages[@]}"

      - name: Install Rust
        if: inputs.rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          # A cache save deletes rustup from ~/.cargo/bin, which the build bots keep.
          cache-bin: false

      - name: Update submodules
        shell: bash
        run: .github/scripts/update_submodules.sh

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      # A clang-tidy action peaks near 2 GB, and so does the Bazel server. The build
      # bots have 16 GB and no swap, so six jobs leave 2 GB free.
      - name: Lint
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          read -ra args <<< "$BAZEL_REMOTE_CACHE_FLAGS $TARGETS"
          bazel build --jobs=6 --config=clang-tidy --keep_going "${args[@]}"

      - name: Clean build caches
        if: always()
        run: integration/scripts/clean_build_caches.sh 25
