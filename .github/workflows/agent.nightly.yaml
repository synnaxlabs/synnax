# Calls one agent per theme each night to improve the repo. The prompts in
# .github/agents/nightly say when to open a PR and when to open none. The reports of all
# themes go to Slack in one message.

name: Agent - Nightly

on:
  schedule:
    - cron: "0 7 * * *" # 7am UTC, after the Nightly CI run
  workflow_dispatch:
    inputs:
      theme:
        description: The theme to run
        required: false
        type: choice
        default: all
        options:
          - all
          - flake-hunt
          - slop
          - dead-code
          - test-quality
          - docs-drift
          - duplication-go
          - duplication-ts
          - duplication-python
          - duplication-cpp

permissions: {}

jobs:
  prompt:
    name: Write the prompts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      themes: ${{ steps.prompt.outputs.themes }}
      flake-hunt: ${{ steps.prompt.outputs.flake-hunt }}
      slop: ${{ steps.prompt.outputs.slop }}
      dead-code: ${{ steps.prompt.outputs.dead-code }}
      test-quality: ${{ steps.prompt.outputs.test-quality }}
      docs-drift: ${{ steps.prompt.outputs.docs-drift }}
      duplication-go: ${{ steps.prompt.outputs.duplication-go }}
      duplication-ts: ${{ steps.prompt.outputs.duplication-ts }}
      duplication-python: ${{ steps.prompt.outputs.duplication-python }}
      duplication-cpp: ${{ steps.prompt.outputs.duplication-cpp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find duplicated code
        if:
          inputs.theme == '' || inputs.theme == 'all' || startsWith(inputs.theme,
          'duplication-')
        run:
          npx --yes jscpd@5.4.1 --config .github/agents/nightly/jscpd.json --output
          "$RUNNER_TEMP/jscpd" .

      - name: Write the prompts
        id: prompt
        env:
          THEME: ${{ inputs.theme || 'all' }}
        run: |
          THEMES=(flake-hunt slop dead-code test-quality docs-drift duplication-go
            duplication-ts duplication-python duplication-cpp)
          [ "$THEME" = all ] || THEMES=("$THEME")
          echo "themes=$(jq --compact-output --null-input '$ARGS.positional' \
            --args "${THEMES[@]}")" >> "$GITHUB_OUTPUT"
          for theme in "${THEMES[@]}"; do
            EOF=$(openssl rand -hex 16)
            {
              echo "$theme<<$EOF"
              cat .github/agents/nightly/rules.md
              echo
              if [[ $theme == duplication-* ]]; then
                cat .github/agents/nightly/duplication.md
                printf '\n## Clone groups\n\n'
                python3 -I .github/scripts/clones.py "$RUNNER_TEMP/jscpd/jscpd-report.json" \
                  --language "${theme#duplication-}" --top 40
              else
                cat ".github/agents/nightly/$theme.md"
              fi
              printf '\nToday is %s. The theme is %s.\n' "$(date -u +%F)" "$theme"
              echo "$EOF"
            } >> "$GITHUB_OUTPUT"
          done

  agent:
    name: Agent (${{ matrix.theme }})
    needs: prompt
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.prompt.outputs.themes) }}
    concurrency:
      group: agent-nightly-${{ matrix.theme }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.nightly.theme.yaml
    with:
      theme: ${{ matrix.theme }}
      prompt: ${{ needs.prompt.outputs[matrix.theme] }}
    secrets:
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  report:
    name: Post the reports
    needs: [prompt, agent]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download the reports
        if: needs.agent.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: nightly-*
          path: ${{ runner.temp }}/reports

      - name: Post the reports to Slack
        env:
          THEMES: ${{ needs.prompt.outputs.themes || '[]' }}
          RESULT: ${{ needs.agent.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
        run: |
          REPORT=$(jq --raw-output '.[]' <<< "$THEMES" | while read -r theme; do
            f="$RUNNER_TEMP/reports/nightly-$theme/report.md"
            if [ -f "$f" ]; then
              cat "$f"
            else
              printf '*%s*\nDid not run.\n' "$theme"
            fi
            echo
          done)
          [ -n "$REPORT" ] || REPORT="No agent ran ($RESULT)."
          printf '*Nightly agents*\n%s\n<%s|Run>\n' "$REPORT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" |
            jq --raw-input --slurp '{text: .}' |
            curl --fail --silent --show-error \
              --header "Content-Type: application/json" \
              --data @- "$SLACK_WEBHOOK_URL"
