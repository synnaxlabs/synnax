# Calls one agent per theme each night to improve the repo. The prompts in
# .github/agents/nightly say when to open a PR and when to open none.

name: Agent - Nightly

on:
  schedule:
    - cron: "0 7 * * *" # 7am UTC, after the Nightly CI run
  workflow_dispatch:
    inputs:
      theme:
        description: The theme to run
        required: false
        type: choice
        default: all
        options:
          - all
          - flake-hunt
          - slop
          - dead-code
          - test-quality
          - docs-drift

permissions: {}

jobs:
  prompt:
    name: Write the prompts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      themes: ${{ steps.prompt.outputs.themes }}
      flake-hunt: ${{ steps.prompt.outputs.flake-hunt }}
      slop: ${{ steps.prompt.outputs.slop }}
      dead-code: ${{ steps.prompt.outputs.dead-code }}
      test-quality: ${{ steps.prompt.outputs.test-quality }}
      docs-drift: ${{ steps.prompt.outputs.docs-drift }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/agents

      - name: Write the prompts
        id: prompt
        env:
          THEME: ${{ inputs.theme || 'all' }}
        run: |
          THEMES=(flake-hunt slop dead-code test-quality docs-drift)
          [ "$THEME" = all ] || THEMES=("$THEME")
          echo "themes=$(jq --compact-output --null-input '$ARGS.positional' \
            --args "${THEMES[@]}")" >> "$GITHUB_OUTPUT"
          for theme in "${THEMES[@]}"; do
            EOF=$(openssl rand -hex 16)
            {
              echo "$theme<<$EOF"
              cat .github/agents/nightly/rules.md
              echo
              cat ".github/agents/nightly/$theme.md"
              printf '\nToday is %s. The theme is %s.\n' "$(date -u +%F)" "$theme"
              echo "$EOF"
            } >> "$GITHUB_OUTPUT"
          done

  agent:
    name: Agent (${{ matrix.theme }})
    needs: prompt
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.prompt.outputs.themes) }}
    concurrency:
      group: agent-nightly-${{ matrix.theme }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.yaml
    with:
      prompt: ${{ needs.prompt.outputs[matrix.theme] }}
      agent: ${{ vars.AGENT_DEFAULT || 'claude' }}
      output: report
      timeout-minutes: 180
    secrets: inherit
