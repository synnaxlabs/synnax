# A run restores only the newest Go cache of a module, so the older ones only evict
# other caches.
name: Prune - Caches

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A key ends in the hash of its inputs and the ID of the run that saved it. The
      # rest names the tool, the OS, and the module.
      - name: Delete all but the newest cache of each module
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          OLDER: |-
            map(select(.key | test("^go-(lint|ginkgo|test)-")))
            | group_by(.key | sub("-[0-9a-f]{64}-[0-9]+$"; ""))[]
            | sort_by(.createdAt)[:-1][]
            | .id
        # GitHub evicts older caches too, so one can be gone before its delete.
        shell: bash
        run: |
          gh cache list --ref refs/heads/main --key go- --limit 1000 \
            --json id,key,createdAt --jq "$OLDER" |
            while read -r id; do
              if ! error=$(gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" 2>&1)
              then
                grep -q "HTTP 404" <<< "$error" || { echo "$error"; exit 1; }
              fi
            done
