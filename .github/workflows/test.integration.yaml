name: Test - Integration

run-name:
  ${{ github.event.inputs.RUN_NAME || format('Test - Integration {0}', github.ref_name)
  }}

on:
  # Windows is the default because it is more prevalent in the wild than Ubuntu.
  # It also frees the saturated Ubuntu build bots while the Windows ones sit idle.
  workflow_call:
    inputs:
      ubuntu:
        description: Whether to build and test on Ubuntu
        required: false
        type: boolean
        default: false
      windows:
        description: Whether to build and test on Windows
        required: false
        type: boolean
        default: true
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_USERNAME:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      PAGERDUTY_API_KEY:
        required: false
      PAGERDUTY_ROUTING_KEY:
        required: false
      POSTHOG_CLI_API_KEY:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false
      TAURI_KEY_PASSWORD:
        required: false
      TAURI_PRIVATE_KEY:
        required: false
      TURBO_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      RUN_NAME:
        description: "Custom name for this workflow run"
        required: false
        default: ""
        type: string
      SKIP_BUILD:
        description: "Skip build process and use artifacts from another run"
        required: false
        default: false
        type: boolean
      REF_RUN_ID:
        description:
          "Reference run ID for artifacts (when SKIP_BUILD is true, blank for most
          recent)"
        required: false
        default: ""
        type: string
      FLAGS:
        description: "Additional flags to pass to test-conductor (e.g., 'console/...')"
        required: false
        default: ""
        type: string
      ubuntu:
        description: Whether to build and test on Ubuntu
        required: false
        type: boolean
        default: false
      windows:
        description: Whether to build and test on Windows
        required: false
        type: boolean
        default: true

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      SKIP_BUILD: ${{ steps.check-cache.outputs.SKIP_BUILD }}
      REF_RUN_ID: ${{ steps.check-cache.outputs.REF_RUN_ID }}
      DRIVER_REF_RUN_ID: ${{ steps.check-cache.outputs.DRIVER_REF_RUN_ID }}
      CONSOLE_REF_RUN_ID: ${{ steps.check-cache.outputs.CONSOLE_REF_RUN_ID }}
      CORE_REF_RUN_ID: ${{ steps.check-cache.outputs.CORE_REF_RUN_ID }}
      FLAGS: ${{ steps.set-outputs.outputs.FLAGS }}
      BINARY_CHECK_MATRIX: ${{ steps.binary-check-matrix.outputs.MATRIX }}
      TEST_MATRIX:
        ${{ steps.set-outputs.outputs.CUSTOM_MATRIX ||
        steps.test-matrix.outputs.TEST_MATRIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set outputs
        id: set-outputs
        env:
          FLAGS: ${{ github.event.inputs.FLAGS || '' }}
        run: |
          echo "FLAGS=${FLAGS}" >> "$GITHUB_OUTPUT"
          if [ -n "${FLAGS}" ]; then
            SAFE_NAME=${FLAGS//[^a-zA-Z0-9_-]/_}
            echo "CUSTOM_MATRIX={\"include\":[{\"name\":\"${SAFE_NAME}\",\"target\":\"\"}]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for cached artifacts
        id: check-cache
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SKIP_BUILD: ${{ github.event.inputs.SKIP_BUILD || 'false' }}
          REF_RUN_ID: ${{ github.event.inputs.REF_RUN_ID || '' }}
          # Matches flags_enabled of the build job.
          FLAGS_ENABLED: true
          PLATFORMS:
            ${{ inputs.ubuntu && inputs.windows && 'all' || inputs.windows && 'windows'
            || 'linux' }}
        run: .github/scripts/check_artifact_cache.sh "${PLATFORMS}"

      - name: Validate test coverage
        if: ${{ steps.set-outputs.outputs.FLAGS == '' }}
        id: test-matrix
        run: integration/scripts/validate_test_coverage.sh

      # A matrix exclude only filters keys of the base matrix, so an include-only matrix
      # cannot drop a platform that way.
      - name: Generate binary check matrix
        id: binary-check-matrix
        env:
          UBUNTU: ${{ inputs.ubuntu }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          MATRIX=$(jq -nc --argjson ubuntu "$UBUNTU" --argjson windows "$WINDOWS" '[
            if $ubuntu then {os: "ubuntu-24.04", "os-name": "linux", display: "ubuntu",
              executable: ""} else empty end,
            if $windows then {os: "windows-2025", "os-name": "windows",
              display: "windows", executable: ".exe"} else empty end
          ]')
          echo "MATRIX=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: needs.setup.outputs.SKIP_BUILD == 'false'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/build.synnax.yaml
    with:
      windows: ${{ inputs.windows }}
      ubuntu: ${{ inputs.ubuntu }}
      docker: false
      driver: true
      console: true
      # The suite tests the work that flags hide in the Console build. Matches
      # FLAGS_ENABLED of the cache check.
      flags_enabled: true
      core: true
      use_simple_artifact_names: true
      driver_ref_run_id: ${{ needs.setup.outputs.DRIVER_REF_RUN_ID }}
      console_ref_run_id: ${{ needs.setup.outputs.CONSOLE_REF_RUN_ID }}
      core_ref_run_id: ${{ needs.setup.outputs.CORE_REF_RUN_ID }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # A free test bot takes the oldest queued job, so in a merge group the Windows test
  # bot jobs wait here until the groups ahead queued theirs.
  turn:
    name: Wait for turn
    needs: [setup, build]
    if:
      ${{ github.event_name == 'merge_group' && inputs.windows && !cancelled() &&
      needs.setup.result == 'success' && (needs.build.result == 'success' ||
      needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts

      - name: Wait for the groups ahead
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BOTS: ${{ vars.WINDOWS_TEST_BOTS }}
          TEST_MATRIX: ${{ needs.setup.outputs.TEST_MATRIX }}
        run: |
          JOBS=$(jq '[.include[] | select(.hosted != true)] | length' \
            <<< "$TEST_MATRIX")
          python3 .github/scripts/wait_for_turn.py "$GITHUB_SHA" \
            "$((TEST_BOTS / JOBS))"

  test-windows:
    name: Test (windows)
    needs: [setup, build, turn]
    permissions:
      actions: read
      contents: read
    if:
      ${{ inputs.windows && !cancelled() && needs.setup.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.turn.result == 'success' || needs.turn.result == 'skipped') }}
    uses: ./.github/workflows/test.integration.worker.yaml
    with:
      test_matrix: ${{ needs.setup.outputs.TEST_MATRIX }}
      ref_run_id: ${{ needs.setup.outputs.REF_RUN_ID }}
      os: windows-test-bot
      hosted_os: windows-2025
      flags: ${{ needs.setup.outputs.FLAGS }}
    secrets:
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  test-ubuntu:
    name: Test (ubuntu)
    needs: [setup, build]
    permissions:
      actions: read
      contents: read
    if:
      ${{ inputs.ubuntu && !cancelled() && needs.setup.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/test.integration.worker.yaml
    with:
      test_matrix: ${{ needs.setup.outputs.TEST_MATRIX }}
      ref_run_id: ${{ needs.setup.outputs.REF_RUN_ID }}
      os: ubuntu-test-bot
      flags: ${{ needs.setup.outputs.FLAGS }}
    secrets:
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  binary-checks:
    name: Binary checks (${{ matrix.display }})
    needs: [setup, build]
    if:
      ${{ !cancelled() && needs.setup.result == 'success' && (needs.build.result ==
      'success' || needs.build.result == 'skipped') &&
      needs.setup.outputs.BINARY_CHECK_MATRIX != '[]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.BINARY_CHECK_MATRIX) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: integration/scripts

      - name: Download Core artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: synnax-core-${{ matrix.os-name }}
          path: binaries
          run-id: ${{ needs.setup.outputs.REF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Driver artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: synnax-driver-${{ matrix.os-name }}
          path: binaries
          run-id: ${{ needs.setup.outputs.REF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Set up binaries
        shell: bash
        run: |
          mkdir -p "$HOME/synnax-binaries"
          cp binaries/synnax-v* "$HOME/synnax-binaries/synnax${{ matrix.executable }}"
          cp binaries/synnax-driver-v* \
            "$HOME/synnax-binaries/synnax-driver${{ matrix.executable }}"
          chmod +x "$HOME"/synnax-binaries/synnax*

      - name: Create Driver state directory (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo install -d -m 777 /var/lib/synnax-driver

      - name: Check Driver TLS (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/CheckDriverTLS.ps1

      - name: Check Driver TLS (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/check_driver_tls.sh

      - name: Check Driver external cert (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/CheckDriverExternalCert.ps1

      - name: Check Driver external cert (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/check_driver_external_cert.sh

      - name: Check unverifiable advertised cert (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/CheckDriverUnverifiableCert.ps1

      - name: Check unverifiable advertised cert (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/check_driver_unverifiable_cert.sh

      - name: Check auto-cert refresh (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/CheckAutoCertRefresh.ps1

      - name: Check auto-cert refresh (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/check_auto_cert_refresh.sh

      - name: Check Driver environment file (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/check_driver_env_file.sh

      - name: Check Driver service lifecycle (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/CheckDriverService.ps1

      - name: Check Driver service lifecycle (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: integration/scripts/check_driver_service.sh

      # An embedded Driver once wrote no output for its whole start timeout. These show
      # whether antivirus or the loader acted on the freshly extracted executable.
      - name: Print launch diagnostics (Windows)
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          $since = (Get-Date).AddMinutes(-30)
          Get-MpComputerStatus |
            Format-List RealTimeProtectionEnabled, OnAccessProtectionEnabled,
              BehaviorMonitorEnabled, IoavProtectionEnabled
          Get-MpPreference | Format-List ExclusionPath, ExclusionProcess
          $defender = 'Microsoft-Windows-Windows Defender/Operational'
          foreach ($filter in @(
              @{ LogName = $defender; StartTime = $since },
              @{ LogName = 'Application'; Level = 1, 2, 3; StartTime = $since }
            )) {
            Write-Host "--- $($filter.LogName) ---"
            # Get-WinEvent errors when no event matches, which is a valid answer here.
            Get-WinEvent -FilterHashtable $filter -ErrorAction SilentlyContinue |
              Format-List TimeCreated, ProviderName, Id, Message
          }

      - name: Upload check logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: binary-check-logs-${{ matrix.os-name }}
          path: ~/synnax-*-check/**/*.log
          retention-days: 7
          if-no-files-found: ignore
