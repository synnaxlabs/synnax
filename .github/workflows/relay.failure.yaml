# The last job of a watched workflow calls this when a job of its run failed. It starts
# Agent - Requeue, and Report - Failures for a scheduled run. Both wait for the run to
# complete and read its conclusion. A run that a person cancels starts nothing.
name: Relay - Failure

on:
  workflow_call:
    inputs:
      requeue:
        description: "Start Agent - Requeue"
        type: boolean
        default: false
      report:
        description: "Start Report - Failures when the run is scheduled"
        type: boolean
        default: false

permissions: {}

jobs:
  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUEUE: ${{ inputs.requeue }}
      REPORT: ${{ inputs.report && github.event_name == 'schedule' }}
    # No retry: a dispatch that fails with a 5xx can still start a run.
    steps:
      - name: Check out the scripts
        if: env.REQUEUE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts

      # When each failed job only stopped at a usage limit or a rejected token, the
      # seat left the pool and Agent - Requeue runs the job again. The run then ends
      # cancelled, as GitHub emails the person who started a failed run. Steps without
      # a status check still run in a run that a person cancelled, so this one checks.
      - name: Decide whether to cancel the run
        id: drain
        if: ${{ !cancelled() && env.REQUEUE == 'true' }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest"
          drained=$(.github/scripts/gh_api.sh --paginate "$jobs" --jq '.jobs[]
            | select(.conclusion == "failure")
            | any(.steps[]; (.name | startswith("Leave the pool until"))
              and .conclusion == "success")')
          cancel=false
          if [ -n "$drained" ] && ! grep -qx false <<< "$drained"; then cancel=true; fi
          echo "cancel=$cancel" >> "$GITHUB_OUTPUT"

      # A failed decision leaves the run failed, and Agent - Requeue still runs it.
      - name: Start Agent - Requeue
        if: ${{ !cancelled() && env.REQUEUE == 'true' }}
        env:
          CANCEL: ${{ steps.drain.outputs.cancel == 'true' }}
        run: |
          gh workflow run agent.requeue.yaml --ref main -f run="$GITHUB_RUN_ID" \
            -f cancelled="$CANCEL"

      # Report - Failures reads this attempt, so a rerun that Agent - Requeue starts
      # does not hide the failure. Agent - Requeue reports a cancelled run that it
      # cannot run again.
      - name: Start Report - Failures
        if: >-
          ${{ !cancelled() && env.REPORT == 'true' && steps.drain.outputs.cancel !=
          'true' }}
        run: |
          gh workflow run report.failures.yaml --ref main -f run="$GITHUB_RUN_ID" \
            -f attempt="$GITHUB_RUN_ATTEMPT"

      - name: Cancel the run
        if: steps.drain.outputs.cancel == 'true'
        run: gh run cancel "$GITHUB_RUN_ID"
