# Backs up the Synnax Core on Sandbox-Windows to a zip on that box.

name: Backup - Runner Core

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: deploy-runners

env:
  INSTANCE: i-0daf42c1631de819a

jobs:
  backup:
    name: Back up the Core on Sandbox-Windows
    runs-on: ubuntu-latest
    environment: runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts
            scripts/runners

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::004704223095:role/github-runners-deploy
          aws-region: us-east-1

      - name: Back up
        env:
          COMMENT: Back up the Core at ${{ github.sha }}
          TIMEOUT: 1800
        run: |
          echo "\$Backup = \$true" > "$RUNNER_TEMP/core.ps1"
          cat scripts/runners/core.ps1 >> "$RUNNER_TEMP/core.ps1"
          .github/scripts/run_ssm_powershell.sh < "$RUNNER_TEMP/core.ps1"
