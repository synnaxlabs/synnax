# Tells Check - Review that a pull request got a review. It runs the workflow file of
# the pull request, so it can only dispatch, and only for a branch of this repository.
# The run name carries the pull request number.

name: Relay - Review
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions: {}

jobs:
  relay:
    name: Relay review
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relay the review
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run check.review.yaml --ref "$REF" -f pr="$PR"
