# Tells Check - Review that a pull request got a review. It runs the workflow file of
# the pull request, so it can only dispatch, and only for a branch of this repository.
# The run name carries the pull request number.

name: Relay - Review
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions: {}

jobs:
  relay:
    name: Relay review
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # A pull request cannot edit the script that runs with this token.
      - name: Checkout the default branch scripts
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Relay the review
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/check.review.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"
