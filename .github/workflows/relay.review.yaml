# Tells Check - Review that a pull request got a review. It runs the workflow file of
# the pull request, so it has no permissions and runs nothing. The run name carries the
# pull request number.

name: Relay - Review
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions: {}

jobs:
  relay:
    name: Relay review
    runs-on: ubuntu-latest
    steps:
      - name: Relay the review
        run: "true"
