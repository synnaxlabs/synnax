name: Test - X (C++)

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to test on
        required: false
        type: string
        default: '["ubuntu-build-bot"]'
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels to test on
        required: false
        type: string
        default: '["ubuntu-build-bot"]'
env:
  BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE_GRPC_URL }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        include:
          - os: ubuntu-build-bot
            format: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      - name: Install clang-format
        if: matrix.format
        run: scripts/install_clang_format.sh

      - name: Check formatting
        if: matrix.format
        run: scripts/check_clang_format.sh x/cpp

      - name: Test (macOS)
        if: matrix.os == 'macos-build-bot'
        run:
          # Running on real hardware, not in the AWS vpc. This means caching from S3 is slow.
          # The hardware used is fast enough to not be a bottleneck.
          bazel test --config=asan --test_output=all //x/cpp/...
          --test_tag_filters=-no-asan
        shell: bash

      - name: Test (Ubuntu)
        if: matrix.os == 'ubuntu-build-bot'
        run: |
          bazel test --config=asan-leak --test_output=all //x/cpp/... \
            --remote_cache=${{ env.BAZEL_REMOTE_CACHE }} --remote_cache_compression=true
        shell: bash

      - name: Test (Windows)
        if: matrix.os == 'windows-build-bot'
        run: |
          scripts/run_bazel.sh test --test_output=all //x/cpp/... \
            --remote_cache=${{ env.BAZEL_REMOTE_CACHE }} --remote_cache_compression=true
        shell: bash

      - name: Clean build caches (Ubuntu)
        if: always() && matrix.os == 'ubuntu-build-bot'
        run: integration/scripts/clean_build_caches.sh 25

      - name: Clean build caches (Windows)
        if: always() && matrix.os == 'windows-build-bot'
        shell: powershell
        run: integration/scripts/CleanBuildCaches.ps1 -MinFreeGB 30
