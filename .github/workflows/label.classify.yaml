# Raises a pull request to review/human when the results Check - Classify uploaded show
# a changed interface, and keeps one comment with the evidence. Otherwise the author
# picks the tier. A fork, or a change to the classifier itself, always gets a human:
# either could forge the uploaded results. Check - Classify dispatches this, and Relay -
# Sweep does for a fork or Dependabot. The workflow runs from the default branch and
# never checks out or runs pull request code: the artifacts are data. The label goes on
# with an App token, because a label set with GITHUB_TOKEN starts no other workflow, and
# the review gate and auto-merge wait for it.

name: Label - Classify

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The Check - Classify run that uploaded the results
        required: true
        type: string
      head_sha:
        description: The commit that run classified
        required: true
        type: string
      group:
        description: Concurrency group of the pull request branch
        required: true
        type: string
      pr:
        description: The pull request, when the results cannot be trusted to name it
        required: false
        type: string

permissions: {}

# One run per pull request branch at a time, so an older run never writes after a newer
# one. A newer queued run replaces an older queued one.
concurrency:
  group: label-classify-${{ inputs.group }}
  cancel-in-progress: false

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/results

      - name: List the jobs of the run
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq ".jobs[].name" > "$RUNNER_TEMP/results/jobs"

      - name: Create an App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Classify
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR: ${{ inputs.pr }}
        run: python3 .github/scripts/classify.py "$RUNNER_TEMP/results"
