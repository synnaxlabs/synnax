# Raises a pull request to review/human when the results Check - Classify uploaded show
# a changed interface, and keeps one comment with the evidence. Check - Classify
# dispatches this. Otherwise the author picks the tier. A change to the classifier
# itself always gets a human: it could forge the uploaded results. A fork cannot
# dispatch this, so a maintainer labels it. The workflow runs from the default branch
# and never checks out or runs pull request code: the artifacts are data. The label goes
# on with an App token, because a label set with GITHUB_TOKEN starts no other workflow,
# and the review gate and auto-merge wait for it.

name: Label - Classify

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The Check - Classify run that uploaded the results
        required: true
        type: string
      head_sha:
        description: The commit that run classified
        required: true
        type: string
      group:
        description: Concurrency group of the pull request branch
        required: true
        type: string

permissions: {}

# One run per pull request branch at a time, so an older run never writes after a newer
# one. A newer queued run replaces an older queued one.
concurrency:
  group: label-classify-${{ inputs.group }}
  cancel-in-progress: false

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/results

      - name: Create an App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Classify
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 .github/scripts/classify.py "$RUNNER_TEMP/results"
