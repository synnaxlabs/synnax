# Brings agent pull requests to done. A failed CI run, a submitted review, or a removed
# agent/needs-human label dispatches this for one pull request, from a branch of this
# repository. GitHub sends no event when a pull request becomes conflicted, so a push to
# main, an hourly schedule, and a dispatch with no pull request scan for conflicted
# ones. Every wake runs Agent - Shepherd run, which finds the work left and calls the
# agent. Every trigger runs this file from main, so no pull request code runs with
# secrets outside the agent workflow, which runs only for what agent_gate.sh allows.

name: Agent - Shepherd

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number; empty scans for conflicted pull requests
        required: false
        type: string

permissions: {}

# A burst of pushes to main queues one pending scan instead of one per push.
concurrency:
  group: ${{ !inputs.pr && 'agent-shepherd-scan' || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The scan passes only pull requests the gate would not skip. The cap plays no
      # part in a skip.
      - name: List the pull requests
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_LOGINS: ${{ vars.AGENT_LOGINS }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          PR=$INPUT_PR
          # shellcheck disable=SC2016 # The GraphQL query uses GraphQL variables.
          if [ -n "$PR" ]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "pr must be a number" >&2; exit 1; }
            PRS="[$PR]"
          else
            PRS=$(gh api graphql --paginate -f o="$GITHUB_REPOSITORY_OWNER" \
              -f r="${GITHUB_REPOSITORY#*/}" \
              -f query='query($o: String!, $r: String!, $endCursor: String) {
                repository(owner: $o, name: $r) {
                  pullRequests(states: OPEN, first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes { number mergeable isCrossRepository }
                  }
                }
              }' --jq '.data.repository.pullRequests.nodes[]
                | select(.mergeable == "CONFLICTING" and (.isCrossRepository | not))
                | .number' |
              while read -r pr; do
                verdict=$(.github/scripts/agent_gate.sh "$pr" shepherd 1)
                echo "#$pr: $verdict" >&2
                [ "${verdict%% *}" = skip ] || echo "$pr"
              done | jq -cs .)
          fi
          echo "Pull requests: $PRS"
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"

  shepherd:
    name: Shepherd
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    # Shared by every wake, so one run at a time works on a pull request. A newer queued
    # run replaces an older one, and finds all of its work.
    concurrency:
      group: agent-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.shepherd.run.yaml
    with:
      pr: ${{ matrix.pr }}
    secrets:
      CLAUDE_CODE_APP_ID: ${{ secrets.CLAUDE_CODE_APP_ID }}
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
