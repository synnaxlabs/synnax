# Asks Sedosaur for a review when a pull request opens or is ready, and when a member
# comments `@sedosaur review` or `@greptileai review`. The review holds secrets, so it
# runs from the default branch through a dispatch. A fork's token cannot dispatch, and
# the review skips a fork.

name: Relay - Sedosaur
run-name: ${{ github.event.pull_request.number || github.event.issue.number }}

on:
  pull_request:
    types:
      - opened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  relay:
    name: Relay review request
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association)
        && (contains(github.event.comment.body, '@sedosaur review')
          || contains(github.event.comment.body, '@greptileai review')))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      REF: ${{ github.event.repository.default_branch }}
      COMMENT: ${{ github.event.comment.id }}
    steps:
      # Only `@sedosaur review` reviews a head again after a review of it succeeded.
      # No retry through gh_api.sh: a dispatch that fails with a 5xx can still start a
      # run, and each review is billed. A member can ask again with a comment.
      - name: Start Review - Sedosaur
        env:
          REPEAT: ${{ contains(github.event.comment.body, '@sedosaur review') }}
        run: |
          gh workflow run review.sedosaur.yaml --ref "$REF" -f pr="$PR" \
            -f comment="$COMMENT" -f repeat="$REPEAT"
