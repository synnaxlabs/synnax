# Asks Sedosaur for a review when a pull request opens or is ready, and when a member
# or an agent mentions `@sedosaur` or `@greptile` in a comment. A push never asks. Sends
# Sedosaur a reply that mentions it on the thread of one of its findings, such as a
# dismissal. Both hold secrets, so they run from the default branch through a dispatch.
# A fork's token cannot dispatch, and the review skips a fork.

name: Relay - Sedosaur
run-name: ${{ github.event.pull_request.number || github.event.issue.number }}

on:
  pull_request:
    types:
      - opened
      - ready_for_review
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions: {}

jobs:
  relay:
    name: Relay review request
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.comment.author_association)
          || contains(fromJSON('["synnax-claude-code[bot]", "synnax-codex[bot]"]'),
            github.event.comment.user.login))
        && (contains(github.event.comment.body, '@sedosaur')
          || contains(github.event.comment.body, '@greptile')))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      REF: ${{ github.event.repository.default_branch }}
      COMMENT: ${{ github.event.comment.id }}
    steps:
      # A comment never asks for a repeat, so a head with a review gets no other one.
      - name: Start Review - Sedosaur
        run: |
          gh workflow run review.sedosaur.yaml --ref "$REF" -f pr="$PR" \
            -f comment="$COMMENT"

  dismiss:
    name: Relay reply
    if: >-
      github.event_name == 'pull_request_review_comment'
        && github.event.comment.in_reply_to_id
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.comment.body, '@sedosaur')
        && (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.comment.author_association)
          || contains(fromJSON('["synnax-claude-code[bot]", "synnax-codex[bot]"]'),
            github.event.comment.user.login))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REF: ${{ github.event.repository.default_branch }}
      COMMENT: ${{ github.event.comment.id }}
      THREAD: ${{ github.event.comment.in_reply_to_id }}
    steps:
      # A reply points at the first comment of its thread.
      - name: Start Dismiss - Sedosaur
        run: |
          author=$(gh api "repos/$GH_REPO/pulls/comments/$THREAD" --jq .user.login)
          if [ "$author" = "sedosaur[bot]" ]; then
            gh workflow run dismiss.sedosaur.yaml --ref "$REF" -f pr="$PR" \
              -f comment="$COMMENT"
          fi
