# Asks Sedosaur for a review when a pull request opens or is ready, and when a member
# comments `@sedosaur review` or `@greptileai review`. The review holds secrets, so it
# runs from the default branch through a dispatch. A fork's token cannot dispatch, and
# the review skips a fork.

name: Relay - Sedosaur
run-name: ${{ github.event.pull_request.number || github.event.issue.number }}

on:
  pull_request:
    types:
      - opened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  relay:
    name: Relay review request
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association)
        && (contains(github.event.comment.body, '@sedosaur review')
          || contains(github.event.comment.body, '@greptileai review')))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      REF: ${{ github.event.repository.default_branch }}
      COMMENT: ${{ github.event.comment.id }}
    steps:
      # A pull request cannot edit the script that runs with this token.
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Review - Sedosaur
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/review.sedosaur.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR" \
            -f "inputs[comment]=$COMMENT"
