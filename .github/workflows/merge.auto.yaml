# Turns auto-merge on or off for each pull request event; auto_merge.sh holds the rule.
# Only main and release branches require CI and the Review gate. GitHub turns auto-merge
# off when someone without write access pushes, so a push turns it on again. A merge
# that GITHUB_TOKEN starts triggers no workflows, so an App token turns auto-merge on.
# No pull request code runs here. Runs on one pull request go one at a time, so an older
# run never acts after a newer one. A newer run waits instead of cancelling the run in
# progress, which would show as a failed check.

name: Merge - Auto

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Set auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Create an App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}

      # A pull_request_target checkout takes the base branch, so a pull request cannot
      # edit the script that decides its auto-merge.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # The labels and base can change while the run waits, so it reads them live.
      - name: Turn auto-merge on or off
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/auto_merge.sh "$PR"
