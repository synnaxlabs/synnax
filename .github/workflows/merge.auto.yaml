# Turns on auto-merge for a pull request into main or a release branch that is labeled
# review/bot and is not a draft, and turns it off for any other. Only those branches
# require CI and the Review gate. GitHub turns auto-merge off when someone without write
# access pushes, so a push turns it on again. A merge that GITHUB_TOKEN starts triggers
# no workflows, so an App token turns auto-merge on. No pull request code runs here.

name: Merge - Auto

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Set auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Create an App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}

      # The labels and base can change while the run waits, so it reads them live.
      - name: Turn auto-merge on or off
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016 # The jq program uses jq variables.
          read -r want enabled < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            --jq '[.labels[].name] as $l
              | (.draft == false and any($l[]; . == "review/bot")
                  and all($l[]; . != "review/human")
                  and (.base.ref == "main" or (.base.ref | startswith("release/"))))
                as $want
              | "\($want) \(.auto_merge != null)"')
          echo "auto-merge wanted: $want, enabled: $enabled"
          if [ "$want" = true ] && [ "$enabled" = false ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
          elif [ "$want" = false ] && [ "$enabled" = true ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
