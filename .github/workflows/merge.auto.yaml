# Turns on auto-merge for a pull request into main or a release branch that is labeled
# review/bot and is not a draft. When a pull request stops qualifying, it turns off only
# the auto-merge it turned on itself; auto-merge that a person turned on stays on. Only
# those branches require CI and the Review gate. GitHub turns auto-merge off when
# someone without write access pushes, so a push turns it on again. A merge that
# GITHUB_TOKEN starts triggers no workflows, so an App token turns auto-merge on. No
# pull request code runs here. Runs on one pull request go one at a time, so an older
# run never acts after a newer one. A newer run waits instead of cancelling the run in
# progress, which would show as a failed check.

name: Merge - Auto

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Set auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Create an App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}

      # The labels and base can change while the run waits, so it reads them live.
      - name: Turn auto-merge on or off
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016 # The jq program uses jq variables.
          read -r want enabled ours < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            --jq '[.labels[].name] as $l
              | (.draft == false and any($l[]; . == "review/bot")
                  and all($l[]; . != "review/human")
                  and (.base.ref == "main" or (.base.ref | startswith("release/"))))
                as $want
              | (.auto_merge.enabled_by.login == "synnax-claude-code[bot]") as $ours
              | "\($want) \(.auto_merge != null) \($ours)"'
          )
          echo "auto-merge wanted: $want, enabled: $enabled, by this workflow: $ours"
          if [ "$want" = true ] && [ "$enabled" = false ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
          elif [ "$want" = false ] && [ "$ours" = true ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
