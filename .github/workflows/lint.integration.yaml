name: Lint - Integration

on:
  workflow_call:
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint
        uses: ./.github/actions/test-python
        with:
          directory: integration
          test: false
