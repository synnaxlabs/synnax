name: Test - Lyra

on:
  pull_request:
    paths:
      - .github/actions/test-typescript/**
      - .github/workflows/test.lyra.yaml
      - codecov.yaml
      - configs/eslint/**
      - configs/ts/**
      - configs/vite/**
      - knip.json
      - lyra/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - x/ts/**
  push:
    branches:
      - main
      - release/**
    paths:
      - .github/actions/test-typescript/**
      - .github/workflows/test.lyra.yaml
      - codecov.yaml
      - configs/eslint/**
      - configs/ts/**
      - configs/vite/**
      - knip.json
      - lyra/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - x/ts/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            lint: true
        exclude:
          - os:
              ${{ (github.ref != 'refs/heads/main' && github.base_ref != 'main') &&
              'macos-latest' }}
          - os:
              ${{ (github.ref != 'refs/heads/main' && github.base_ref != 'main') &&
              'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test TypeScript
        uses: ./.github/actions/test-typescript
        with:
          package: lyra
          coverage_flag: lyra
          directory: lyra
          lint: ${{ matrix.lint }}
          knip: false
