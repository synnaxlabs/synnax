# Installs a Synnax Core release or dev build on Sandbox-Windows.

name: Deploy - Runner Core

on:
  workflow_dispatch:
    inputs:
      core:
        description: >-
          A release version, or the URL of a run or job that built the Core. Empty
          deploys the pinned release.
        type: string
      backup:
        description: Back up the Core first
        type: boolean
        default: true
  # Temporary, to test on this branch. Remove before the merge.
  push:
    branches:
      - sy/ci-runner-core-deploy

permissions:
  actions: read
  contents: read
  id-token: write

concurrency: deploy-runners

env:
  INSTANCE: i-0daf42c1631de819a
  COMMENT: Deploy the Core at ${{ github.sha }}
  TIMEOUT: 1800
  # The release that a run with no core input deploys.
  PINNED_CORE: 0.61.0

jobs:
  deploy:
    name: Deploy the Core to Sandbox-Windows
    runs-on: ubuntu-latest
    environment: runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts
            scripts/runners

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::004704223095:role/github-runners-deploy
          aws-region: us-east-1

      - name: Download
        env:
          CORE: ${{ inputs.core || env.PINNED_CORE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          lines=$(.github/scripts/runner_core_source.sh "$CORE")
          mapfile -t source <<< "$lines"
          .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 \
            Step=download "${source[@]}"

      - name: Shut down
        id: stop
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=stop

      - name: Back up
        if: inputs.backup
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=backup

      - name: Install
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=install

      - name: Restart
        if: always() && steps.stop.conclusion != 'skipped'
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=start
