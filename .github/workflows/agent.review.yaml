# Calls an agent to work through the open review findings on an agent pull request.
# workflow_run runs this file and the gate from the default branch, so no pull request
# code runs with secrets outside the agent workflow. The agent asks Greptile for a new
# review, which starts the next round, so the gate caps the rounds per pull request.

name: Agent - Address review

on:
  workflow_run:
    workflows:
      - Agent - Review submitted
    types:
      - completed

permissions: {}

# Shared with the other agent workflows, so the gate and the agent of one run finish
# before another agent run on the pull request starts. A newer queued run replaces an
# older one, and sees every thread the older one would have. A run that will skip gets
# its own group, so it never replaces a queued real one.
concurrency:
  group:
    ${{ github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.pull_requests[0] && format('agent-pr-{0}',
    github.event.workflow_run.pull_requests[0].number) || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if:
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.gate.outputs.run }}
      prompt: ${{ steps.prompt.outputs.prompt }}
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Greptile score plays no part: every open finding needs action.
      - name: Count the findings that need action
        id: threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          THREADS=$(.github/scripts/review_threads.sh "$PR" | wc -l)
          OUTSIDE=$(.github/scripts/greptile_outside_diff.sh "$PR")
          COUNT=$((THREADS + (${#OUTSIDE} > 0)))
          echo "$THREADS threads need action"
          echo "Findings outside the diff: ${OUTSIDE:-none}"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Gate the round
        id: gate
        if: steps.threads.outputs.count != '0'
        uses: ./.github/actions/agent-gate
        with:
          pr: ${{ env.PR }}
          kind: review
          cap: 3
          task: address review threads
          agents: ${{ vars.AGENT_LOGINS }}

      - name: Write the prompt
        id: prompt
        if: steps.gate.outputs.run == 'true'
        run: |
          EOF=$(openssl rand -hex 16)
          {
            echo "prompt<<$EOF"
            cat .github/agents/review.md
            printf '\nThe pull request is #%s.\n' "$PR"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

  agent:
    name: Agent
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.yaml
    with:
      prompt: ${{ needs.gate.outputs.prompt }}
      agent: ${{ vars.AGENT_DEFAULT || 'claude' }}
      output: comment
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
      timeout-minutes: 60
    secrets: inherit
