# Fails when the rulesets on GitHub drift from .github/rulesets. Nothing applies the
# files, so a change to one fails here until an admin applies it.

name: Check - Rulesets

on:
  push:
    branches:
      - main
    paths:
      - .github/rulesets/**
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify rulesets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify rulesets
        env:
          GH_TOKEN: ${{ secrets.GH_SERVICE_TOKEN }}
        run: .github/scripts/verify_rulesets.sh

      - name: Post the failure to Slack
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          text="Rulesets check failed: GitHub differs from .github/rulesets. $RUN_URL"
          jq --null-input --arg text "$text" '{text: $text}' |
            curl --fail --silent --show-error \
              --header "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL"
