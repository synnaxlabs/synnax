# Reviews a pull request with Sedosaur on a review runner, and posts the review as the
# sedosaur GitHub App. The scripts run from the commit that started this workflow, on
# the default branch, and policy comes from `.sedosaur/` on the base branch. Claude Code
# gets only read tools, a checkout of the head, and its OAuth token. The App token
# reaches only the step that posts.

name: Review - Sedosaur
run-name: ${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request to review"
        type: number
        required: true

permissions: {}

# One review of a pull request at a time. A newer request replaces a queued one.
concurrency:
  group: review-sedosaur-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  start:
    name: Start a runner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: read
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      fork: ${{ steps.pr.outputs.fork }}
    steps:
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '
            "head=\(.head.sha)", "base=\(.base.sha)",
            "fork=\(.head.repo.full_name != .base.repo.full_name)"' >> "$GITHUB_OUTPUT"

      - name: Assume the runner start role
        if: steps.pr.outputs.fork == 'false'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AGENT_RUNNER_ROLE_ARN }}
          aws-region: us-east-1

      # Idle runners stop themselves, so a review starts one stopped runner. Only one of
      # two concurrent starts sees an instance's previous state as stopped, so the other
      # tries again. The job waits for any runner when none is stopped.
      - name: Start a stopped runner
        if: steps.pr.outputs.fork == 'false'
        run: |
          for _ in 1 2 3; do
            ids=$(aws ec2 describe-instances --output text \
              --filters Name=tag:project,Values=synnax-agents \
              Name=tag:pool,Values=review Name=instance-state-name,Values=stopped \
              --query 'Reservations[].Instances[].InstanceId')
            if [ -z "$ids" ]; then exit 0; fi
            read -ra stopped <<< "$ids"
            id=$(shuf -n 1 -e "${stopped[@]}")
            previous=$(aws ec2 start-instances --instance-ids "$id" --output text \
              --query 'StartingInstances[0].PreviousState.Name')
            if [ "$previous" = stopped ]; then exit 0; fi
          done

  review:
    needs: start
    # A fork's code never reaches a runner.
    if: needs.start.outputs.fork == 'false'
    name: Review
    runs-on: [self-hosted, review]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ needs.start.outputs.head }}
      BASE_SHA: ${{ needs.start.outputs.base }}
      RUN_URL:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
        }}
    steps:
      - name: Mint the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.SEDOSAUR_APP_ID }}
          private-key: ${{ secrets.SEDOSAUR_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Start the check run
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Sedosaur Review" -f head_sha="$HEAD_SHA" \
            -f status=in_progress -f details_url="$RUN_URL" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The runner keeps the clone between jobs, so each fetch is small. This checkout
      # holds the scripts: a base branch other than the default one is not trusted.
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The config, prompt, and rules come from the base, never from the pull request.
      # The runner empties its temporary directory after each job, so prune drops the
      # checkouts of the last review.
      - name: Check out the base and the head
        run: |
          git worktree prune
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"

      # A runner can stay stopped for weeks, so a review takes the latest Claude Code.
      - name: Update Claude Code
        run: sudo npm install -g @anthropic-ai/claude-code@latest

      - name: Review
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN: ${{ steps.check.outputs.id }}
          BOT: ${{ steps.app.outputs.app-slug }}
          BASE_DIR: ${{ runner.temp }}/base
          HEAD_DIR: ${{ runner.temp }}/head
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.SEDOSAUR_CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -m review run "$RUNNER_TEMP/review.json"

      - name: Post the review
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHECK_RUN: ${{ steps.check.outputs.id }}
          BOT: ${{ steps.app.outputs.app-slug }}
        run: python3 -m review post "$RUNNER_TEMP/review.json"

      - name: End the check run
        if: (failure() || cancelled()) && steps.check.outputs.id
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHECK_RUN: ${{ steps.check.outputs.id }}
          STATUS: ${{ job.status }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN" \
            -f status=completed -f conclusion="$STATUS" \
            -f "output[title]=The review ended with $STATUS" \
            -f "output[summary]=See the [run]($RUN_URL)."
