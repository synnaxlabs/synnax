# Tells Check - Review queue that a merge group needs a verdict. It runs the workflow
# file of the queued commit, so it has no permissions and runs nothing.

name: Relay - Merge group

on:
  merge_group:
    types:
      - checks_requested

permissions: {}

jobs:
  relay:
    name: Relay merge group
    runs-on: ubuntu-latest
    steps:
      - name: Relay the merge group
        run: "true"
