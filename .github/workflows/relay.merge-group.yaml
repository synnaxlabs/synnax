# Starts Check - Review queue for a merge group. This file runs from the queued commit,
# so the check verifies what it passes.

name: Relay - Merge group

on:
  merge_group:
    types:
      - checks_requested

permissions: {}

jobs:
  relay:
    name: Relay merge group
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # A pull request cannot edit the script that runs with this token.
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Check - Review queue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REF: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/check.review.queue.yaml/dispatches" \
            -X POST -f ref="$REF" \
            -f "inputs[queue_ref]=${QUEUE_REF#refs/heads/}" -f "inputs[sha]=$SHA"
