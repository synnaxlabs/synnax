name: Audit - Migration

on:
  workflow_call:
    inputs: &inputs
      core:
        description: "Stable Core tag (default: the candidate's stable baseline)"
        type: string
        default: ""
      console:
        description: "Stable Console tag (default: the candidate's stable baseline)"
        type: string
        default: ""
      driver:
        description: "Stable Driver tag (default: the candidate's stable baseline)"
        type: string
        default: ""
      agent:
        description: "Agent to run, claude or codex (default: AGENT_DEFAULT)"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_APP_ID:
        required: false
      CLAUDE_CODE_APP_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CODEX_APP_ID:
        required: false
      CODEX_APP_PRIVATE_KEY:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false

  workflow_dispatch:
    inputs: *inputs

jobs:
  prompt:
    name: Write the audit prompt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prompt: ${{ steps.prompt.outputs.prompt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Write the prompt
        id: prompt
        env:
          CORE: ${{ inputs.core }}
          CONSOLE: ${{ inputs.console }}
          DRIVER: ${{ inputs.driver }}
          CANDIDATE: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          # The newest stable tag the candidate contains. Off a release branch, a newer
          # hotfix tagged on that tag's train counts too.
          stable() {
            local base
            base=$(git tag --list "$1/v*" --merged HEAD |
              sed -nE "s#^$1/v([0-9]+\.[0-9]+\.[0-9]+)\$#\1#p" | sort -V | tail -1)
            [ -n "$base" ] || return 0
            if [[ $REF != release/* ]]; then
              base=$(.github/scripts/latest_version.sh "$1" "${base%.*}")
            fi
            echo "$1/v$base"
          }
          CORE=${CORE:-$(stable core)}
          CONSOLE=${CONSOLE:-$(stable console)}
          DRIVER=${DRIVER:-$(stable driver)}
          if [ -z "$CORE" ] || [ -z "$CONSOLE" ] || [ -z "$DRIVER" ]; then
            echo "a product has no stable tag in $CANDIDATE" >&2
            exit 1
          fi
          EOF=$(openssl rand -hex 16)
          {
            echo "prompt<<$EOF"
            cat .github/agents/migration-audit.md
            printf '\nThe stable tags are %s, %s, and %s. The candidate is %s.\n' \
              "$CORE" "$CONSOLE" "$DRIVER" "$CANDIDATE"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

  audit:
    name: Audit
    needs: prompt
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/agent.yaml
    with:
      prompt: ${{ needs.prompt.outputs.prompt }}
      agent: ${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
      output: report
      timeout-minutes: 120
    secrets:
      CLAUDE_CODE_APP_ID: ${{ secrets.CLAUDE_CODE_APP_ID }}
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  verdict:
    name: Verdict
    needs: audit
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the verdict
        env:
          REPORT: ${{ needs.audit.outputs.report }}
        run: |
          printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          LAST=$(printf '%s\n' "$REPORT" | sed '/^[[:space:]]*$/d' | tail -1)
          if [ "$LAST" != "Verdict: pass" ]; then
            echo "the migration audit did not pass" >&2
            exit 1
          fi
