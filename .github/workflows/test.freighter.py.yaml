name: Test - Freighter (Python)

on:
  workflow_call:
    inputs:
      image:
        description: Freighter integration server image tag to test against
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: Freighter integration server image tag to test against
        required: true
        type: string

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      integration:
        image: ${{ inputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Python
        uses: ./.github/actions/test-python
        with:
          directory: freighter/py
          coverage: true
          coverage_module: freighter
          coverage_flag: freighter-py
