name: Test - Media

on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint TypeScript
        uses: ./.github/actions/test-typescript
        with:
          package: media
          test: false
