name: Test - Driver

on:
  workflow_call:
    inputs: &inputs
      image:
        description: Core Docker image tag to test against
        required: true
        type: string
  workflow_dispatch:
    inputs: *inputs
env:
  BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE_GRPC_URL }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-build-bot
    services:
      synnax:
        image: ${{ inputs.image }}
        env:
          SYNNAX_LISTEN: localhost:9090
          SYNNAX_VERBOSE: true
          SYNNAX_INSECURE: true
          SYNNAX_MEM: true
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_KEY }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 9090:9090
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Force quit existing Synnax processes
        continue-on-error: true
        run: integration/scripts/kill_synnax_processes.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      - name: Install clang-format
        run: scripts/install_clang_format.sh

      - name: Check formatting
        run: scripts/check_clang_format.sh driver

      - name: Test Driver
        run: |
          bazel test --config=asan-leak --test_output=all //driver/... \
            --remote_cache=${{ env.BAZEL_REMOTE_CACHE }} --remote_cache_compression=true \
            --test_env=LSAN_OPTIONS="suppressions=${{ github.workspace }}/scripts/sanitizers/lsan_suppressions.txt" \
            --spawn_strategy=local \
            --local_test_jobs=1 --test_tag_filters=-hardware

      - name: Clean build caches
        if: always()
        run: integration/scripts/clean_build_caches.sh 25
