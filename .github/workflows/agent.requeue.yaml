# Runs an agent job again when its seat stopped at the usage limit of its login: the job
# found the limit, or the drain of a limited seat stopped its runner. The fleet
# controller then starts another seat for it. When every seat of the agent is at its
# limit, or the run was already tried three times, this workflow fails instead. Release
# runs are left to a person.

name: Agent - Requeue

on:
  workflow_run:
    workflows:
      - Agent - Bug hunt
      - Agent - Console QA
      - Agent - Lint
      - Agent - Nightly
      - Agent - Shepherd
      - Agent - Task
      - Dispatch - Agents
      - Nightly
    types: [completed]

permissions: {}

jobs:
  requeue:
    name: Requeue
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Assume the runner start role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AGENT_RUNNER_ROLE_ARN }}
          aws-region: us-east-1

      # agent.yaml runs the drain step only when the agent stopped at a usage limit. A
      # runner that the drain stopped just after it took a job leaves no such step, only
      # a lost runner on a seat whose limit had not reset when the job ended. Only one
      # job of a run can run again at a time, so the first one goes.
      - name: Run a job that a usage limit stopped again on a seat with usage left
        run: |
          limit="Tags[?Key=='limited-until']|[0].Value"
          seats() {
            aws ec2 describe-instances --output text \
              --filters Name=tag:project,Values=synnax-agents \
              Name=tag:pool,Values=agent "$@" \
              Name=instance-state-name,Values=pending,running,stopping,stopped \
              --query "Reservations[].Instances[].[$limit]"
          }
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?filter=latest"
          gh api --paginate "$jobs" --jq '.jobs[] | select(.conclusion == "failure")
            | select(.name | test("Run \\([a-z]+\\)$"))
            | [.id, (.runner_name // "" | if . == "" then "-" else . end),
                (.completed_at | fromdate), any(.steps[];
                .name == "Leave the pool until the usage limit resets" and
                .conclusion == "success"), .name] | @tsv' > "$RUNNER_TEMP/jobs"
          found=""
          while IFS=$'\t' read -r id runner ended drained name; do
            if [ "$drained" = false ]; then
              [[ $runner == agent-*-* ]] || continue
              annotations="repos/$GITHUB_REPOSITORY/check-runs/$id/annotations"
              messages=$(gh api "$annotations" --jq '.[].message')
              grep -qE 'shutdown signal|lost communication' <<< "$messages" ||
                continue
              # Runners are named agent-<seat>-<number>.
              seat=${runner#agent-}
              until=$(seats "Name=tag:seat,Values=${seat%-*}")
              [[ $until =~ ^[0-9]+$ ]] && [ "$until" -gt "$ended" ] || continue
            fi
            found=$id
            break
          done < "$RUNNER_TEMP/jobs"
          if [ -z "$found" ]; then exit 0; fi
          agent=$(grep -oP 'Run \(\K[a-z]+(?=\)$)' <<< "$name")
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "::error::$name stopped at a usage limit in attempt $ATTEMPT." \
              "It does not run again."
            exit 1
          fi
          resets=$(seats "Name=tag:agent,Values=$agent")
          if [ -z "$resets" ]; then
            echo "::error::The agent pool has no seat for $agent"
            exit 1
          fi
          if ! awk -v now="$(date +%s)" '$1 == "None" || $1 <= now { found = 1 }
            END { exit !found }' <<< "$resets"; then
            first=$(sort -n <<< "$resets" | head -1)
            echo "::error::Every $agent seat is at its usage limit. The first" \
              "resets at $(date -u -d "@$first" '+%F %R UTC'). Run the job again then."
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$found/rerun" --silent
