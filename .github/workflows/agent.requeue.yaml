# Runs an agent job again when its seat stopped at the usage limit of its login: the job
# found the limit, or the drain of a limited seat stopped its runner. The fleet
# controller then starts a seat for it on a login with usage left. When no login of the
# agent is usable, or the run was already tried three times, this workflow fails
# instead. Release runs are left to a person.

name: Agent - Requeue

on:
  workflow_run:
    workflows:
      - Agent - Bug hunt
      - Agent - Console QA
      - Agent - Lint
      - Agent - Nightly
      - Agent - Shepherd
      - Agent - Task
      - Dispatch - Agents
      - Nightly
    types: [completed]

permissions: {}

jobs:
  requeue:
    name: Requeue
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Assume the runner start role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AGENT_RUNNER_ROLE_ARN }}
          aws-region: us-east-1

      # agent.yaml runs the drain step only when the agent stopped at a usage limit. A
      # runner that the drain stopped just after it took a job leaves no such step, only
      # a lost runner on a seat whose login's limit had not reset when the job ended.
      # Only one job of a run can run again at a time, so the first one goes.
      - name: Run a job that a usage limit stopped again on a login with usage left
        run: |
          prefix=synnax-agents/logins/
          # The tags of a login as tab-separated agent, limit, broken, and expiry.
          login() {
            tag() { echo "Tags[?Key=='$1']|[0].Value"; }
            aws secretsmanager describe-secret --secret-id "$prefix$1" --output text \
              --query "[$(tag agent),$(tag limited-until),$(tag broken),$(tag expires)]"
          }
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?filter=latest"
          gh api --paginate "$jobs" --jq '.jobs[] | select(.conclusion == "failure")
            | select(.name | test("Run \\([a-z]+\\)$"))
            | [.id, (.runner_name // "" | if . == "" then "-" else . end),
                (.completed_at | fromdate), any(.steps[];
                .name == "Leave the pool until the usage limit resets" and
                .conclusion == "success"), .name] | @tsv' > "$RUNNER_TEMP/jobs"
          found=""
          while IFS=$'\t' read -r id runner ended drained name; do
            if [ "$drained" = false ]; then
              [[ $runner == agent-*-* ]] || continue
              annotations="repos/$GITHUB_REPOSITORY/check-runs/$id/annotations"
              messages=$(gh api "$annotations" --jq '.[].message')
              grep -qE 'shutdown signal|lost communication' <<< "$messages" ||
                continue
              # Runners are named agent-<seat>-<number>.
              seat=${runner#agent-}
              held=$(aws ec2 describe-instances --output text \
                --filters Name=tag:project,Values=synnax-agents \
                "Name=tag:seat,Values=${seat%-*}" \
                --query "Reservations[].Instances[].[Tags[?Key=='login']|[0].Value]")
              [[ $held =~ ^[a-z0-9-]+$ ]] || continue
              until=$(login "$held" | cut -f2)
              [[ $until =~ ^[0-9]+$ ]] && [ "$until" -gt "$ended" ] || continue
            fi
            found=$id
            break
          done < "$RUNNER_TEMP/jobs"
          if [ -z "$found" ]; then exit 0; fi
          agent=$(grep -oP 'Run \(\K[a-z]+(?=\)$)' <<< "$name")
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "::error::$name stopped at a usage limit in attempt $ATTEMPT." \
              "It does not run again."
            exit 1
          fi
          # The list can lag by minutes, so each login's tags come from describe.
          names=$(aws secretsmanager list-secrets --output text \
            --filters "Key=name,Values=$prefix" --query 'SecretList[].Name')
          now=$(date +%s)
          usable=false
          resets=""
          for secret in $names; do
            tags=$(login "${secret#"$prefix"}")
            IFS=$'\t' read -r of until broken expires <<< "$tags"
            [ "$of" = "$agent" ] && [ "$broken" = None ] &&
              [ "$expires" -gt "$now" ] || continue
            if [ "$until" = None ] || [ "$until" -le "$now" ]; then usable=true; fi
            resets+="$until"$'\n'
          done
          if [ "$usable" = false ]; then
            first=$(grep -E '^[0-9]+$' <<< "$resets" | sort -n | head -1)
            if [ -z "$first" ]; then
              echo "::error::No $agent login is usable." \
                "Store a token with seat.sh token."
            else
              at=$(date -u -d "@$first" '+%F %R UTC')
              echo "::error::Every $agent login is at its usage limit. The first" \
                "resets at $at. Run the job again then."
            fi
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$found/rerun" --silent
