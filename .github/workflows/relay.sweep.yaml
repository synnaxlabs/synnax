# Starts the classifier, the review gate, and auto-merge and adds path labels for pull
# requests the other relays cannot reach: a fork or Dependabot gets a token that cannot
# dispatch or write. It skips a pull request that has not changed for an hour. It runs
# from the default branch and reads pull requests only through the API.

name: Relay - Sweep

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep pull requests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List the pull requests
        id: prs
        run: |
          since=$(date -u -d '1 hour ago' +%FT%TZ)
          prs=$(gh pr list --state open --limit 5000 \
            --json number,isCrossRepository,author,updatedAt \
            --jq ".[] | select(.isCrossRepository
              or .author.login == \"app/dependabot\") | select(.updatedAt > \"$since\")
              | .number")
          {
            echo 'prs<<EOF'
            echo "$prs"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Start the workflows
        env:
          PRS: ${{ steps.prs.outputs.prs }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          for pr in $PRS; do
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            run=$(gh run list --workflow check.classify.yaml --commit "$sha" \
              --status completed --limit 20 --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion != "cancelled")][0].databaseId // empty')
            if [ -n "$run" ]; then
              gh workflow run label.classify.yaml --ref "$REF" -f group="sweep-$pr" \
                -f run_id="$run" -f head_sha="$sha" -f pr="$pr"
            fi
            gh workflow run check.review.yaml --ref "$REF" -f pr="$pr"
            gh workflow run merge.auto.yaml --ref "$REF" -f pr="$pr"
          done

  label:
    name: Label pull requests
    needs: sweep
    if: needs.sweep.outputs.prs != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label from changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          pr-number: ${{ needs.sweep.outputs.prs }}
