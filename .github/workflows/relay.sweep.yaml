# Starts the classifier, the review gate, and auto-merge and adds path labels for pull
# requests the other relays cannot reach: a fork or Dependabot gets a token that cannot
# dispatch or write. It skips a pull request that has not changed for an hour, or for a
# day when it is a fork without review/human, because a fork's reports can arrive late.
# It also reruns, one time, the failed CI run of an open pull request in which no job
# other than OK failed: a GitHub outage fails such a run before OK can wake the shepherd.
# It runs from the default branch and reads pull requests only through the API.

name: Relay - Sweep

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep pull requests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: List the pull requests
        id: prs
        run: |
          hour=$(date -u -d '1 hour ago' +%FT%TZ)
          day=$(date -u -d '1 day ago' +%FT%TZ)
          gh pr list --state open --limit 5000 \
            --json number,isCrossRepository,author,updatedAt,labels,headRefOid \
            > "$RUNNER_TEMP/pulls.json"
          prs=$(jq -r ".[] | select(.isCrossRepository
                or .author.login == \"app/dependabot\")
              | select(.updatedAt > \"$hour\" or (.updatedAt > \"$day\"
                and .isCrossRepository
                and ([.labels[].name] | index(\"review/human\") | not)))
              | .number" "$RUNNER_TEMP/pulls.json")
          {
            echo 'prs<<EOF'
            echo "$prs"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Start the workflows
        env:
          PRS: ${{ steps.prs.outputs.prs }}
          # A `schedule` payload includes `repository`, so this is the default branch.
          REF: ${{ github.event.repository.default_branch }}
        run: |
          dispatch() {
            .github/scripts/gh_api.sh \
              "repos/$GH_REPO/actions/workflows/$1/dispatches" -X POST \
              -f ref="$REF" "${@:2}"
          }
          classify() {
            local latest='map(select(.conclusion != "cancelled"))[0]
              | .databaseId // empty'
            local sha run
            sha=$(gh pr view "$1" --json headRefOid --jq .headRefOid) &&
              run=$(gh run list --workflow check.classify.yaml --commit "$sha" \
                --status completed --limit 20 --json databaseId,conclusion \
                --jq "$latest") &&
              if [ -n "$run" ]; then
                dispatch label.classify.yaml -f "inputs[group]=sweep-$1" \
                  -f "inputs[run_id]=$run" -f "inputs[head_sha]=$sha" -f "inputs[pr]=$1"
              fi
          }
          # A failure must not stop the rest, so the job fails only at the end.
          failed=0
          for pr in $PRS; do
            classify "$pr" || failed=1
            dispatch check.review.yaml -f "inputs[pr]=$pr" || failed=1
            dispatch merge.auto.yaml -f "inputs[pr]=$pr" || failed=1
          done
          exit "$failed"

      - name: Rerun the outage runs
        if: ${{ !cancelled() && steps.prs.outcome == 'success' }}
        run: python3 .github/scripts/rerun_outage.py "$RUNNER_TEMP/pulls.json"

  label:
    name: Label pull requests
    needs: sweep
    if: ${{ !cancelled() && needs.sweep.outputs.prs != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label from changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          pr-number: ${{ needs.sweep.outputs.prs }}
