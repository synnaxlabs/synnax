# Releases the Core alone from already published Console and Driver releases, with no
# CI gate and an optional macOS build. A fallback for when the full release workflow
# cannot finish.

name: Release Core (manual)

run-name: Release Core ${{ inputs.version }} (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Core version to release, such as 0.59.3
        type: string
        required: true
      driver_version:
        description: Published Driver release the Core embeds, such as 0.59.3
        type: string
        required: true
      console_version:
        description: Published Console release the Core embeds, such as 0.59.3
        type: string
        required: true
      previous_tag:
        description: Previous stable Core tag, the baseline for release notes
        type: string
        required: true
      macos:
        description: Build the macOS binary
        type: boolean
        default: false
      docker_channel:
        description: Docker tag to move (latest, next, or empty)
        type: string
        default: ""

concurrency:
  group: release-core-manual-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  TAG: core/v${{ inputs.version }}
  VERSION: ${{ inputs.version }}

jobs:
  draft-core:
    name: Draft Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          tag: core/v${{ inputs.version }}
          title: Core v${{ inputs.version }}
          previous_tag: ${{ inputs.previous_tag }}
          config: .github/release/core.yml
          notes: >-
            Embeds [Console v${{ inputs.console_version }}](${{ github.server_url }}/${{
            github.repository }}/releases/tag/console/v${{ inputs.console_version }})
            and [Driver v${{ inputs.driver_version }}](${{ github.server_url }}/${{
            github.repository }}/releases/tag/driver/v${{ inputs.driver_version }}).

  build-core:
    name: Build Core
    needs: draft-core
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: ${{ inputs.macos }}
      ubuntu: true
      docker: true
      core: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ inputs.version }}
      release_tag: core/v${{ inputs.version }}
      console_release: console/v${{ inputs.console_version }}
      driver_release: driver/v${{ inputs.driver_version }}
      docker_channel: ${{ inputs.docker_channel }}
    secrets: inherit

  windows-installer:
    name: Build Windows installer
    needs: build-core
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Core binary
        uses: actions/download-artifact@v8
        with:
          name: synnax-core-windows
          path: .github/scripts/

      - name: Rename binary for installer
        shell: powershell
        run:
          Move-Item -Force .github/scripts/synnax-v${{ env.VERSION }}.exe
          .github/scripts/synnax-server.exe

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install trusted-signing-cli
        run: cargo install trusted-signing-cli

      - name: Build Windows installer
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $env:Path = "$nsisDir;$env:Path"
          Copy-Item -Force .\.github\scripts\EnVar.dll "$nsisDir\Plugins\x86-unicode\EnVar.dll"
          makensis /DVERSION=${{ env.VERSION }} .\.github\scripts\windows_installer.nsi

      - name: Sign Windows installer
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run:
          trusted-signing-cli -e https://wcus.codesigning.azure.net -a
          CodeSigningAccountName -c CodeSigningCertificateProfile -d "Synnax Core
          Installer" .\.github\scripts\synnax-setup-v${{ env.VERSION }}.exe

      - name: Upload Windows installer
        run: |
          gh release upload --clobber "${env:TAG}" .\.github\scripts\synnax-setup-v${env:VERSION}.exe

  publish-core:
    name: Publish Core
    needs: [build-core, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$TAG" --draft=false
