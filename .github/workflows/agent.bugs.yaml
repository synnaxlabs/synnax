# Calls one agent per code area twice a week to find and fix real bugs. Each area holds
# at most about 40,000 source lines, so one agent run can read all of it. Once every
# area ends, the run posts the PRs it opened to Slack.

name: Agent - Bug hunt

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mondays and Thursdays, 6am UTC
  workflow_dispatch:

permissions: {}

jobs:
  prompt:
    name: Write the prompt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prompt: ${{ steps.prompt.outputs.prompt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/agents

      - name: Write the prompt
        id: prompt
        run: |
          EOF=$(openssl rand -hex 16)
          {
            echo "prompt<<$EOF"
            cat .github/agents/bug-hunt.md
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

  agent:
    name: Agent (${{ matrix.area }})
    needs: prompt
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: py-client
            paths: client/py, x/py, alamos/py, freighter/py
          - area: py-integration
            paths: integration
          - area: go-core
            paths: core, except core/pkg/service
          - area: go-core-service-a-l
            paths: the core/pkg/service packages named a to l
          - area: go-core-service-m-z
            paths: the core/pkg/service packages named m to z
          - area: go-storage
            paths: cesium, gorp
          - area: go-arc
            paths: arc/go
          - area: go-oracle
            paths: oracle, except oracle/plugin
          - area: go-oracle-plugin
            paths: oracle/plugin
          - area: go-x
            paths: x/go, freighter/go, alamos/go
          - area: ts-console-feature
            paths: console/src/feature
          - area: ts-console
            paths: console/src, except console/src/feature, and console/src-tauri
          - area: ts-pluto-vis
            paths: pluto/src/schematic, pluto/src/vis
          - area: ts-pluto
            paths: pluto/src, except pluto/src/schematic and pluto/src/vis
          - area: ts-client
            paths: client/ts
          - area: ts-x
            paths: x/ts, drift, freighter/ts, alamos/ts, arc/ts
          - area: ts-lyra
            paths: lyra
          - area: ts-site
            paths: site
          - area: cpp-driver-ni
            paths: driver/ni
          - area: cpp-driver-labjack
            paths: driver/labjack
          - area: cpp-driver-io
            paths: driver/ethercat, driver/opcua, driver/modbus, driver/http
          - area: cpp-driver
            paths:
              driver, except driver/ni, driver/labjack, driver/ethercat, driver/opcua,
              driver/modbus, and driver/http
          - area: cpp-arc
            paths: arc/cpp
          - area: cpp-x
            paths: x/cpp, client/cpp, client/clib, freighter/cpp
    concurrency:
      group: agent-bug-hunt-${{ matrix.area }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.yaml
    with:
      prompt: |
        ${{ needs.prompt.outputs.prompt }}

        Your area is `${{ matrix.area }}`: ${{ matrix.paths }}.

        The reviewer for a `review/human` PR is `pjdotson`.
      agent: ${{ vars.AGENT_DEFAULT || 'claude' }}
      output: report
      timeout-minutes: 240
    secrets:
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  slack:
    name: Post to Slack
    needs: agent
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
    steps:
      # The agents open their own PRs, so the run finds them by branch and start time.
      - name: Post the PRs the run opened
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.agent.result }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq .run_started_at)
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 500 \
            --search "head:agent/bug-hunt- created:>=$started" \
            --json number,title,url,labels > prs.json
          jq -r --arg result "$RESULT" --arg run "$RUN_URL" '
            def line: "• <\(.url)|#\(.number)> \(.title)";
            def tier($t): map(select(any(.labels[]; .name == $t)));
            (tier("review/human")) as $human
            | (tier("review/bot")) as $bot
            | (map(select(all(.labels[]; .name | startswith("review/") | not))))
              as $none
            | (if $result == "success" then "Every area finished."
               else "Some areas did not finish (\($result))." end) as $areas
            | ["*Bug hunt*: \(length) PRs opened. \($areas) <\($run)|Run>"]
            + (if ($human | length) > 0
               then ["", "*Needs your review*"] + ($human | map(line)) else [] end)
            + (if ($none | length) > 0
               then ["", "*No tier label*"] + ($none | map(line)) else [] end)
            + (if ($bot | length) > 0
               then ["", "*review/bot, merging on their own*"] + ($bot | map(line))
               else [] end)
            | join("\n")' prs.json |
            jq --raw-input --slurp '{text: .}' |
            curl --fail --silent --show-error \
              --header "Content-Type: application/json" \
              --data @- "$SLACK_WEBHOOK_URL"
