# Synnax Desktop versions apart from the train, so it releases apart from release.yaml.

name: Release Desktop

run-name:
  ${{ format('Release Desktop {0}{1}', inputs.bump, inputs.prerelease && ' candidate' ||
  '') }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: Tag a release candidate (-rc.N)
        type: boolean
        default: false

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
    secrets: inherit

  fuzz:
    name: Fuzz
    uses: ./.github/workflows/fuzz.go.yaml

  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.desktop.outputs.version }}
      tag: ${{ steps.desktop.outputs.tag }}
      previous_tag: ${{ steps.desktop.outputs.previous_tag }}
      core_version: ${{ steps.core.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Desktop version
        id: desktop
        uses: ./.github/actions/resolve-version
        with:
          product: desktop
          bump: ${{ inputs.bump }}
          prerelease: ${{ inputs.prerelease }}

      # The bundled clients report their package version, so the Core and Driver carry
      # it too and the client compatibility checks pass.
      - name: Resolve Core version
        id: core
        run: echo "version=$(jq -r .version client/ts/package.json)" >> "$GITHUB_OUTPUT"

  draft:
    name: Draft Desktop
    needs: [resolve, ci, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          title: Synnax Desktop v${{ needs.resolve.outputs.version }}
          previous_tag: ${{ needs.resolve.outputs.previous_tag }}
          prerelease: ${{ inputs.prerelease }}

  # The Core and Driver of this run exist only inside Desktop. No release_tag reaches
  # the build, so neither lands on the release as an asset.
  build:
    name: Build Desktop
    needs: [resolve, draft]
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: true
      driver: true
      core: true
      desktop: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ needs.resolve.outputs.core_version }}
      desktop_version: ${{ needs.resolve.outputs.version }}
      updater_channel: ${{ inputs.prerelease && 'next' || 'stable' }}
    secrets: inherit

  publish:
    name: Publish Desktop
    needs: [resolve, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: synnax-desktop-*
          merge-multiple: true
          path: desktop-bundles

      - name: Upload bundles
        run: gh release upload --clobber "$TAG" desktop-bundles/*

      - name: Publish updater manifest
        uses: ./.github/actions/publish-updater-manifest
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          version: ${{ needs.resolve.outputs.version }}
          app: Synnax Desktop

      - name: Publish release
        run: gh release edit "$TAG" --draft=false
