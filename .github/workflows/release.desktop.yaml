# Synnax Desktop versions apart from the train, so it releases apart from release.yaml.

name: Release Desktop

run-name:
  ${{ format('Release Desktop {0}{1}', inputs.bump, inputs.prerelease && ' candidate' ||
  '') }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description:
          Version bump (minor or major from main, patch from release/desktop-X.Y)
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor
      prerelease:
        description: Tag a release candidate (-rc.N)
        type: boolean
        default: false

# release.yaml also releases Desktop, so both workflows share one group.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

# The draft and the build start at dispatch. CI gates only the publish, so a run that
# fails CI leaves only a draft, and the next run clears it.
jobs:
  ci:
    name: CI
    # A called workflow gets no more than its caller grants. In CI, the fail-fast job
    # asks for actions: write and the paths filter for pull-requests: read.
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.desktop.outputs.version }}
      tag: ${{ steps.desktop.outputs.tag }}
      previous_tag: ${{ steps.desktop.outputs.previous_tag }}
      core_version: ${{ steps.core.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve Desktop version
        id: desktop
        uses: ./.github/actions/resolve-version
        with:
          product: desktop
          ref: ${{ github.ref_name }}
          bump: ${{ inputs.bump }}
          prerelease: ${{ inputs.prerelease }}

      # The bundled Core, Driver, and clients all carry the newest stable Core version
      # reachable from this commit, so the client compatibility checks pass.
      - name: Resolve Core version
        id: core
        run: |
          version=$(git tag --list --merged HEAD 'core/v*' \
            | sed -nE 's#^core/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ -z "$version" ]; then
            echo "no stable core tag is reachable from HEAD" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  draft:
    name: Draft Desktop
    needs: resolve
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          title: Synnax Desktop v${{ needs.resolve.outputs.version }}
          previous_tag: ${{ needs.resolve.outputs.previous_tag }}
          prerelease: ${{ inputs.prerelease }}

  # The Core and Driver of this run exist only inside Desktop. No release_tag reaches
  # the build, so neither lands on the release as an asset.
  build:
    name: Build Desktop
    needs: [resolve, draft]
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: true
      driver: true
      core: true
      desktop: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ needs.resolve.outputs.core_version }}
      desktop_version: ${{ needs.resolve.outputs.version }}
      updater_channel: ${{ inputs.prerelease && 'next' || 'stable' }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  publish:
    name: Publish Desktop
    needs: [resolve, ci, build]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: synnax-desktop-*
          merge-multiple: true
          path: desktop-bundles

      - name: Upload bundles
        run: gh release upload --clobber "$TAG" desktop-bundles/*

      - name: Publish updater manifest
        uses: ./.github/actions/publish-updater-manifest
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          version: ${{ needs.resolve.outputs.version }}
          app: Synnax Desktop

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest=false

  deploy-docs:
    name: Deploy docs
    needs: publish
    # The docs read stable versions at build time, so a stable release redeploys next,
    # latest, and previous. An older site keeps the Desktop link of its last deploy.
    if: ${{ !inputs.prerelease }}
    uses: ./.github/workflows/deploy.docs.yaml
    with:
      versions: next latest previous
    secrets:
      DOCS_ALGOLIA_APP_ID: ${{ secrets.DOCS_ALGOLIA_APP_ID }}
      DOCS_ALGOLIA_WRITE_API_KEY: ${{ secrets.DOCS_ALGOLIA_WRITE_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
