# Reports the Review gate commit status of a merge group from the default branch, so the
# queued commit cannot edit the steps that write it. Relay - Merge group passes the
# queue ref and the commit, and the report trusts them only if GitHub's queue ref points
# at that commit.

name: Check - Review queue

on:
  workflow_dispatch:
    inputs:
      queue_ref:
        description: The branch of the merge group
        required: true
        type: string
      sha:
        description: The commit of the merge group
        required: true
        type: string

permissions: {}

jobs:
  gate:
    name: Report queue review gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Report the review gate status
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ inputs.queue_ref }}
          SHA: ${{ inputs.sha }}
        run: .github/scripts/report_queue_gate.sh "$QUEUE_REF" "$SHA"
