name: Test - Docs

on:
  workflow_call:
  workflow_dispatch:

jobs:
  site:
    name: Check site
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Check site
        timeout-minutes: 15
        working-directory: docs/site
        run: pnpm check-site:build && pnpm check-site

      - name: Build
        run: pnpm build:docs
