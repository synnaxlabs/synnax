name: Test - Docs

on:
  pull_request:
    paths:
      - .github/actions/test-typescript/**
      - .github/workflows/test.docs.yaml
      - alamos/ts/**
      - arc/ts/**
      - client/ts/**
      - configs/eslint/**
      - configs/ts/**
      - configs/vite/**
      - docs/site/**
      - freighter/ts/**
      - package.json
      - pluto/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - x/media/**
      - x/ts/**
  push:
    branches:
      - main
      - rc
    paths:
      - .github/actions/test-typescript/**
      - .github/workflows/test.docs.yaml
      - alamos/ts/**
      - arc/ts/**
      - client/ts/**
      - configs/eslint/**
      - configs/ts/**
      - configs/vite/**
      - docs/site/**
      - freighter/ts/**
      - package.json
      - pluto/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - x/media/**
      - x/ts/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # Pushes to rc already run these tests, so the rc PR run is redundant.
    if: github.event_name != 'pull_request' || github.head_ref != 'rc'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Test TypeScript
        uses: ./.github/actions/test-typescript
        with:
          package: docs
          coverage_flag: docs
          directory: docs/site

      - name: Diff Changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - docs/site/**

      - name: Check Site
        if: >-
          github.event_name != 'pull_request' || github.base_ref == 'main' ||
          steps.filter.outputs.site == 'true'
        timeout-minutes: 15
        working-directory: docs/site
        run: pnpm check-site:build && pnpm check-site

      - name: Build
        run: pnpm build:docs
