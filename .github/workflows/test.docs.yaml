name: Test - Docs

on:
  workflow_call:
    inputs:
      strict:
        description: Whether a broken external link fails the check
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      strict:
        description: Whether a broken external link fails the check
        required: false
        type: boolean
        default: false

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Check site
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      # Builds the workspace packages the site imports before the check. Prerendered
      # pages read the latest releases from the GitHub API, which rate limits
      # unauthenticated requests.
      - name: Build
        env:
          DOCS_GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build:docs

      # The Console and Desktop updaters poll these feeds, so each must redirect per
      # request. A prerendered feed builds without error as an HTML page.
      - name: Check updater feeds
        working-directory: site/docs/.vercel/output
        run: |
          # The quotes hold a jq program, which expands $src itself.
          # shellcheck disable=SC2016
          rendered='.routes | any(.src == $src and .dest == "_render")'
          for feed in console/latest console/next desktop/latest desktop/next; do
            src="^/releases/$feed\\.json\$"
            jq -e --arg src "$src" "$rendered" config.json >/dev/null && continue
            echo "::error::/releases/$feed.json is not rendered per request"
            exit 1
          done

      # A broken external link fails only a strict run. Any other run shows it as a
      # warning on the pull request, because the cause can be the host.
      - name: Check site
        timeout-minutes: 15
        working-directory: site/docs
        env:
          DOCS_GITHUB_TOKEN: ${{ github.token }}
          STRICT: ${{ inputs.strict && '--strict' || '' }}
        run: pnpm check-site:build && pnpm check-site ${STRICT:+"$STRICT"}
