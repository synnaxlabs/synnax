name: Test - Scripts

on:
  pull_request:
    paths:
      - .github/workflows/test.scripts.yaml
      - scripts/**
  push:
    branches:
      - main
      - rc
    paths:
      - .github/workflows/test.scripts.yaml
      - scripts/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pushes to rc already run these tests, so the rc PR run is redundant.
    if: github.event_name != 'pull_request' || github.head_ref != 'rc'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run Tests
        run: uvx pytest scripts
