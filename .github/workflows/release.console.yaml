name: Release - Console

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
        default: patch
      prerelease:
        description: Tag a release candidate (-rc.N)
        type: boolean
        default: false

  workflow_call:
    inputs:
      bump:
        type: string
        default: patch
      prerelease:
        type: boolean
        default: false
      verified:
        description: The caller already verified the commit's checks and integration
        type: boolean
        default: false
    outputs:
      version:
        description: The released version
        value: ${{ jobs.resolve.outputs.version }}

concurrency:
  group: release-console
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: resolve
        uses: ./.github/actions/resolve-version
        with:
          product: console
          bump: ${{ inputs.bump }}
          prerelease: ${{ inputs.prerelease }}

  verify:
    name: Verify Checks
    if: ${{ !inputs.verified }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify Checks
        uses: ./.github/actions/verify-checks
        with:
          sha: ${{ github.sha }}

  integration:
    name: Integration
    if: ${{ !inputs.verified }}
    uses: ./.github/workflows/test.integration.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    secrets: inherit

  draft:
    name: Draft Release
    needs: [resolve, verify, integration]
    if: >-
      !cancelled() && needs.resolve.result == 'success' && (needs.verify.result ==
      'success' || needs.verify.result == 'skipped') && (needs.integration.result ==
      'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
    steps:
      # A failed earlier run can leave a draft under the same tag; the tag itself only
      # exists once a release is published.
      - name: Delete Stale Draft
        run: |
          if gh release list --json tagName,isDraft --jq --arg tag "$TAG" \
            '.[] | select(.tagName == $tag and .isDraft)' | grep -q .; then
            gh release delete "$TAG" --yes
          fi

      - name: Create Draft Release
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Console v$VERSION" \
            --generate-notes --notes-start-tag "$PREVIOUS_TAG" \
            ${{ inputs.prerelease && '--prerelease' || '' }}

  build:
    name: Build
    needs: [resolve, draft]
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: true
      ubuntu: true
      console: true
      console_tauri: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ needs.resolve.outputs.version }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      updater_channel: ${{ inputs.prerelease && 'next' || 'stable' }}
    secrets: inherit

  publish:
    name: Publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      # The manifest carries the app version the build stamped (X.Y.Z-N for a
      # candidate), so the updater compares like with like.
      - name: Write Updater Manifest
        run: |
          APP_VERSION="${VERSION/-rc./-}"
          BASE="https://github.com/${GH_REPO}/releases/download/${TAG}"
          gh release download "$TAG" --pattern 'Synnax.app.tar.gz.sig' \
            --pattern "Synnax_${APP_VERSION}_x64_en-US.msi.sig"
          jq -n --arg version "v${APP_VERSION}" --arg base "$BASE" \
            --arg msi "Synnax_${APP_VERSION}_x64_en-US.msi" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile darwin Synnax.app.tar.gz.sig \
            --rawfile windows "Synnax_${APP_VERSION}_x64_en-US.msi.sig" \
            '($base + "/Synnax.app.tar.gz") as $mac | {
              version: $version,
              notes: "Synnax Update",
              pub_date: $date,
              platforms: {
                "darwin-x86_64": {signature: $darwin, url: $mac},
                "darwin-aarch64": {signature: $darwin, url: $mac},
                "linux-x86_64": {
                  signature: "not_supported_and_tauri_requires_an_entry",
                  url: $mac
                },
                "windows-x86_64": {signature: $windows, url: ($base + "/" + $msi)}
              }
            }' > latest.json
          gh release upload --clobber "$TAG" latest.json

      - name: Publish Release
        run: gh release edit "$TAG" --draft=false
