name: Build - Docker

on:
  workflow_call:
    inputs: &inputs
      module:
        description:
          Module path containing the Dockerfile and go.mod (e.g. core,
          freighter/integration)
        required: true
        type: string
      repository:
        description: Image repository to push to (e.g. ghcr.io/synnaxlabs/synnax)
        required: true
        type: string
    outputs:
      image:
        description: The image, tagged with a hash of the sources it was built from
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:
    inputs: *inputs

jobs:
  build:
    name: Build - Docker
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag hashes the Git objects of every path the Dockerfile copies and of the
      # files that drive the build, so two commits with the same sources share an image.
      - name: Tag the image
        id: tag
        env:
          MODULE: ${{ inputs.module }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          sources=$(awk '$1 == "COPY" && $2 !~ /^--/ { $1 = $NF = ""; print }' \
            "$MODULE/Dockerfile")
          objects=$(git rev-parse $(printf 'HEAD:%s ' $sources "$MODULE/Dockerfile" \
            .dockerignore .github/workflows/build.docker.yaml))
          hash=$(sha256sum <<< "$objects" | cut -c1-32)
          echo "image=$REPOSITORY:src-$hash" >> "$GITHUB_OUTPUT"

      # A failed inspect also builds, which is always correct.
      - name: Check for the image
        id: check
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "Found $IMAGE"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract Go version
        if: steps.check.outputs.found != 'true'
        id: go-version
        run:
          echo "GO_VERSION=$(grep '^go ' ${{ inputs.module }}/go.mod | awk '{print
          $2}')" >> $GITHUB_OUTPUT

      - name: Build and push image
        if: steps.check.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ inputs.module }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=synnax-docker-${{ inputs.module }}
          cache-to: type=gha,mode=max,scope=synnax-docker-${{ inputs.module }}
          build-args: GO_VERSION=${{ steps.go-version.outputs.GO_VERSION }}
