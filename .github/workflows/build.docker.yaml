name: Build - Docker

on:
  workflow_call:
    inputs: &inputs
      module:
        description:
          Module path containing the Dockerfile and go.mod (e.g. core,
          freighter/integration)
        required: true
        type: string
      repository:
        description: Image repository to push to (e.g. ghcr.io/synnaxlabs/synnax)
        required: true
        type: string
    outputs:
      image:
        description: The image, pinned by digest
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

jobs:
  build:
    name: Build - Docker
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag hashes the Git objects of every file the Dockerfile copies, the files
      # that drive the build, and the digests of the base images. Unit tests are not
      # part of a build, so they are left out. Two commits with the same sources share
      # an image until a base image moves.
      - name: Tag the image
        id: tag
        env:
          MODULE: ${{ inputs.module }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          dockerfile="$MODULE/Dockerfile"
          go_version=$(awk '$1 == "go" { print $2 }' "$MODULE/go.mod")
          sources=$(awk '$1 == "COPY" && $2 !~ /^--/ { $1 = $NF = ""; print }' \
            "$dockerfile")
          read -ra paths <<< "${sources//$'\n'/ } $dockerfile .dockerignore \
            .github/workflows/build.docker.yaml"
          mapfile -t tests < <(yq '.unit_tests[]' .github/filters.yaml)
          objects=$(git ls-files --stage -- "${paths[@]}" \
            "${tests[@]/#/:(exclude,glob)}")
          stages=$(awk '$1 == "FROM" && $3 == "AS" { print $4 }' "$dockerfile")
          bases=$(awk '$1 == "FROM" { print $2 }' "$dockerfile" |
            sed "s/\${GO_VERSION}/$go_version/" | grep -vxF "$stages")
          digests=""
          # Docker Hub returns a rare 5xx, so each inspect gets three attempts.
          for base in $bases; do
            for attempt in 1 2 3; do
              digest=$(docker buildx imagetools inspect "$base" \
                --format '{{json .Manifest.Digest}}') && break
              [ "$attempt" -lt 3 ] || exit 1
              echo "Inspect attempt $attempt of $base failed"
              sleep 10
            done
            digests+=$digest
          done
          hash=$(sha256sum <<< "$objects $digests" | cut -c1-32)
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"
          echo "image=$REPOSITORY:src-$hash" >> "$GITHUB_OUTPUT"

      # A failed inspect also builds, which is always correct.
      - name: Check for the image
        id: check
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "Found $IMAGE"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push image
        if: steps.check.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./${{ inputs.module }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=synnax-docker-${{ inputs.module }}
          cache-to: type=gha,mode=max,scope=synnax-docker-${{ inputs.module }}
          build-args: GO_VERSION=${{ steps.tag.outputs.go_version }}

      - name: Resolve the digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
