# Builds an image and pushes it to GitHub Container Registry. A fork's token
# cannot push, so a fork's pull request builds the image locally and uploads it as an
# artifact named after its tag, which the start-service action loads.

name: Build - Docker

on:
  workflow_call:
    inputs: &inputs
      module:
        description:
          Module path containing the Dockerfile and, for a Go image, go.mod (e.g. core,
          freighter/integration)
        required: true
        type: string
      dockerfile:
        description: Dockerfile to build, when it is not <module>/Dockerfile
        required: false
        type: string
        default: ""
      repository:
        description: Image repository to push to (e.g. ghcr.io/synnaxlabs/synnax)
        required: true
        type: string
      unused_by_forks:
        description: Whether no test of a fork loads the image, so a fork keeps no copy
        required: false
        type: boolean
        default: false
      prebuilt:
        description:
          Whether the runner builds the binary with <module>/docker-build.sh and the Go
          cache that main saves, in place of the Dockerfile's stage named binary
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: The image, pinned by digest, or by tag when a fork built it
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

jobs:
  build:
    name: Build - Docker
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      FORK:
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository }}
    outputs:
      image: ${{ steps.digest.outputs.image }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: env.FORK != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag hashes the Git objects of every path the Dockerfile copies and the files
      # that drive the build. A Dockerfile that copies nothing hashes alone, so only its
      # own edits rebuild it. The Dockerfile pins each base image by digest, so two
      # commits with the same sources share an image.
      - name: Tag the image
        id: tag
        env:
          MODULE: ${{ inputs.module }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          dockerfile=${DOCKERFILE:-$MODULE/Dockerfile}
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          if [ -f "$MODULE/go.mod" ]; then
            go_version=$(awk '$1 == "go" { print $2 }' "$MODULE/go.mod")
            if ! grep -qF "FROM golang:$go_version@sha256:" "$dockerfile"; then
              echo "::error file=$dockerfile::Pin golang:$go_version to match go.mod"
              exit 1
            fi
          fi
          sources=$(awk '$1 == "COPY" && $2 !~ /^--/ { $1 = $NF = ""; print }' \
            "$dockerfile")
          paths=("$dockerfile")
          if [ -n "$sources" ]; then
            read -ra paths <<< "${sources//$'\n'/ } $dockerfile .dockerignore \
              .github/workflows/build.docker.yaml"
          fi
          objects=$(git rev-parse "${paths[@]/#/HEAD:}")
          hash=$(sha256sum <<< "$objects" | cut -c1-32)
          echo "image=$REPOSITORY:src-$hash" >> "$GITHUB_OUTPUT"

      # A failed inspect also builds, which is always correct.
      - name: Check for the image
        id: check
        if: env.FORK != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "Found $IMAGE"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # Main builds the binary even when it finds the image, to save the Go cache that
      # pull requests and merge groups restore.
      - name: Set up Go
        if:
          &binary inputs.prebuilt && (steps.check.outputs.found != 'true' || github.ref
          == 'refs/heads/main')
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          cache: false

      - name: Key the Go caches
        id: go-key
        if: *binary
        env:
          MODULE: ${{ inputs.module }}
          SUM: ${{ hashFiles(format('{0}/go.sum', inputs.module)) }}
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "module=go-build-$MODULE-"
            echo "sum=go-build-$MODULE-$SUM-"
            echo "seconds=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own ref and of main, never those of another pull
      # request or merge group, so only main saves them.
      - name: Restore the Go caches
        id: go-cache
        if: *binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-key.outputs.build }}
            ${{ steps.go-key.outputs.modules }}
          key: ${{ steps.go-key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.go-key.outputs.sum }}
            ${{ steps.go-key.outputs.module }}

      - name: Build the binary
        if: *binary
        env:
          MODULE: ${{ inputs.module }}
          GOOS: linux
          GOARCH: amd64
        run: |
          .github/scripts/go_mod_download.sh "$MODULE"
          mkdir "$RUNNER_TEMP/binary"
          cd "$MODULE" && ./docker-build.sh "$RUNNER_TEMP/binary"

      # Go refreshes the mtime of an entry it uses, unless that mtime is less than an
      # hour old, so an entry older than an hour before the build did not serve it.
      - name: Trim the Go build cache
        if: &save inputs.prebuilt && github.ref == 'refs/heads/main'
        env:
          BUILD: ${{ steps.go-key.outputs.build }}
          START: ${{ steps.go-key.outputs.seconds }}
        run: |
          cd "$BUILD"
          find . -type f -mmin "+$(( ($(date +%s) - START) / 60 + 61 ))" -delete
          du -sh .

      - name: Save the Go caches
        if: *save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-key.outputs.build }}
            ${{ steps.go-key.outputs.modules }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push image
        if: steps.check.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./${{ steps.tag.outputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.FORK != 'true' }}
          outputs:
            ${{ env.FORK == 'true' && format('type=docker,dest={0}/image.tar',
            runner.temp) || '' }}
          tags: ${{ steps.tag.outputs.image }}
          build-contexts:
            ${{ inputs.prebuilt && format('binary={0}/binary', runner.temp) || '' }}
          # A prebuilt binary leaves no layer worth a cache.
          cache-from:
            ${{ !inputs.prebuilt && format('type=gha,scope=synnax-docker-{0}',
            inputs.module) || '' }}
          cache-to:
            ${{ !inputs.prebuilt && format('type=gha,mode=max,scope=synnax-docker-{0}',
            inputs.module) || '' }}

      - name: Name the artifact of the image
        id: artifact
        if: env.FORK == 'true' && !inputs.unused_by_forks
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: echo "name=image-${IMAGE##*:}" >> "$GITHUB_OUTPUT"

      - name: Upload the image
        if: env.FORK == 'true' && !inputs.unused_by_forks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 30

      # A fork's image has no digest, since it never reached a registry.
      - name: Resolve the digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if [ "$FORK" = true ]; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
