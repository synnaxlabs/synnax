# Builds a module's image and pushes it to GitHub Container Registry. A fork's token
# cannot push, so a fork's pull request builds the image locally and uploads it as an
# artifact named after its tag, which the start-service action loads.

name: Build - Docker

on:
  workflow_call:
    inputs: &inputs
      module:
        description:
          Module path containing the Dockerfile and go.mod (e.g. core,
          freighter/integration)
        required: true
        type: string
      repository:
        description: Image repository to push to (e.g. ghcr.io/synnaxlabs/synnax)
        required: true
        type: string
    outputs:
      image:
        description: The image, pinned by digest, or by tag when a fork built it
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

jobs:
  build:
    name: Build - Docker
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      FORK:
        ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository }}
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: env.FORK != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag hashes the Git objects of every path the Dockerfile copies, the files
      # that drive the build, and the digests of the base images. Two commits with the
      # same sources share an image until a base image moves.
      - name: Tag the image
        id: tag
        env:
          MODULE: ${{ inputs.module }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          dockerfile="$MODULE/Dockerfile"
          go_version=$(awk '$1 == "go" { print $2 }' "$MODULE/go.mod")
          sources=$(awk '$1 == "COPY" && $2 !~ /^--/ { $1 = $NF = ""; print }' \
            "$dockerfile")
          read -ra paths <<< "${sources//$'\n'/ } $dockerfile .dockerignore \
            .github/workflows/build.docker.yaml"
          objects=$(git rev-parse "${paths[@]/#/HEAD:}")
          stages=$(awk '$1 == "FROM" && $3 == "AS" { print $4 }' "$dockerfile")
          bases=$(awk '$1 == "FROM" { print $2 }' "$dockerfile" |
            sed "s/\${GO_VERSION}/$go_version/" | grep -vxF "$stages")
          digests=""
          # Docker Hub returns a rare 5xx, so each inspect gets three attempts.
          for base in $bases; do
            for attempt in 1 2 3; do
              digest=$(docker buildx imagetools inspect "$base" \
                --format '{{json .Manifest.Digest}}') && break
              [ "$attempt" -lt 3 ] || exit 1
              echo "Inspect attempt $attempt of $base failed"
              sleep 10
            done
            digests+=$digest
          done
          hash=$(sha256sum <<< "$objects $digests" | cut -c1-32)
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"
          echo "image=$REPOSITORY:src-$hash" >> "$GITHUB_OUTPUT"

      # A failed inspect also builds, which is always correct.
      - name: Check for the image
        id: check
        if: env.FORK != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "Found $IMAGE"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push image
        if: steps.check.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./${{ inputs.module }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.FORK != 'true' }}
          outputs:
            ${{ env.FORK == 'true' && format('type=docker,dest={0}/image.tar',
            runner.temp) || '' }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=synnax-docker-${{ inputs.module }}
          cache-to: type=gha,mode=max,scope=synnax-docker-${{ inputs.module }}
          build-args: GO_VERSION=${{ steps.tag.outputs.go_version }}

      - name: Name the artifact of the image
        id: artifact
        if: env.FORK == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: echo "name=image-${IMAGE##*:}" >> "$GITHUB_OUTPUT"

      - name: Upload the image
        if: env.FORK == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 30

      # A fork's image has no digest, since it never reached a registry.
      - name: Resolve the digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if [ "$FORK" = true ]; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
