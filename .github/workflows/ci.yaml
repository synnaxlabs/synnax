              - configs/vite/**
              - freighter/go/**
              - freighter/integration/**
              - freighter/ts/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/go/**
              - x/ts/**

            arc: &arc
              - .bazeliskrc
