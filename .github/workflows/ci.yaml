              - configs/vite/**
              - core/**
              - freighter/go/**
              - freighter/ts/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/go/**
              - x/ts/**

            freighter_py: &freighter_py
