# Gates every merge. The ruleset requires only the OK context, so every check a pull
# request or a merge group must pass runs from here. Nightly and Release call it with
# full, which runs every job whatever changed, on every OS the job supports.

name: CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      full:
        description: Whether to run every job on every OS
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Whether to run every job on every OS
        required: false
        type: boolean
        default: false
      integration:
        description: Whether to run the merge-queue tier too
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the run it replaces. A merge group run is
# cancelled only by cancel.merge-group.yaml, which uses the same key. A called run takes
# the caller's workflow name, so Nightly and Release never share a group.
concurrency:
  group:
    ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref ||
    format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test jobs pull the Core and Freighter images from GHCR.
permissions:
  contents: read
  packages: read

jobs:
  # One output per key in .github/filters.yaml, true when the pull request or merge
  # group touched one of its paths. The ci output is a JSON list of the jobs that an
  # edit to this file or the change map selects.
  changes:
    # paths-filter lists the changed files of a pull request through the API.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      actionlint: ${{ steps.filter.outputs.actionlint }}
      alamos_go: ${{ steps.filter.outputs.alamos_go }}
      alamos_py: ${{ steps.filter.outputs.alamos_py }}
      alamos_ts: ${{ steps.filter.outputs.alamos_ts }}
      arc_cpp: ${{ steps.filter.outputs.arc_cpp }}
      arc_go: ${{ steps.filter.outputs.arc_go }}
      aspen: ${{ steps.filter.outputs.aspen }}
      buildifier: ${{ steps.filter.outputs.buildifier }}
      cesium: ${{ steps.filter.outputs.cesium }}
      ci: ${{ steps.ci.outputs.jobs }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      client_cpp: ${{ steps.filter.outputs.client_cpp }}
      client_py: ${{ steps.filter.outputs.client_py }}
      client_ts: ${{ steps.filter.outputs.client_ts }}
      console: ${{ steps.filter.outputs.console }}
      console_build: ${{ steps.filter.outputs.console_build }}
      core: ${{ steps.filter.outputs.core }}
      core_build: ${{ steps.filter.outputs.core_build }}
      core_image: ${{ steps.filter.outputs.core_image }}
      docs: ${{ steps.filter.outputs.docs }}
      drift: ${{ steps.filter.outputs.drift }}
      driver: ${{ steps.filter.outputs.driver }}
      driver_build: ${{ steps.filter.outputs.driver_build }}
      eslint_config: ${{ steps.filter.outputs.eslint_config }}
      exports_go: ${{ steps.filter.outputs.exports_go }}
      exports_py: ${{ steps.filter.outputs.exports_py }}
      foundation: ${{ steps.filter.outputs.foundation }}
      freighter_cpp: ${{ steps.filter.outputs.freighter_cpp }}
      freighter_go: ${{ steps.filter.outputs.freighter_go }}
      freighter_image: ${{ steps.filter.outputs.freighter_image }}
      freighter_integration: ${{ steps.filter.outputs.freighter_integration }}
      freighter_py: ${{ steps.filter.outputs.freighter_py }}
      freighter_ts: ${{ steps.filter.outputs.freighter_ts }}
      gorp: ${{ steps.filter.outputs.gorp }}
      integration: ${{ steps.filter.outputs.integration }}
      knip: ${{ steps.filter.outputs.knip }}
      lint_integration: ${{ steps.filter.outputs.lint_integration }}
      lyra: ${{ steps.filter.outputs.lyra }}
      oracle: ${{ steps.filter.outputs.oracle }}
      oracle_check: ${{ steps.filter.outputs.oracle_check }}
      oracle_language: ${{ steps.filter.outputs.oracle_language }}
      pluto: ${{ steps.filter.outputs.pluto }}
      portal: ${{ steps.filter.outputs.portal }}
      protobuf: ${{ steps.filter.outputs.protobuf }}
      py_packages: ${{ steps.filter.outputs.py_packages }}
      scripts: ${{ steps.filter.outputs.scripts }}
      runners: ${{ steps.filter.outputs.runners }}
      site_common: ${{ steps.filter.outputs.site_common }}
      soem: ${{ steps.filter.outputs.soem }}
      stylelint: ${{ steps.filter.outputs.stylelint }}
      stylelint_config: ${{ steps.filter.outputs.stylelint_config }}
      vite_plugin: ${{ steps.filter.outputs.vite_plugin }}
      www: ${{ steps.filter.outputs.www }}
      x_cpp: ${{ steps.filter.outputs.x_cpp }}
      x_go: ${{ steps.filter.outputs.x_go }}
      x_py: ${{ steps.filter.outputs.x_py }}
      x_ts: ${{ steps.filter.outputs.x_ts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest-known

      # Compares against the same base as the filter.
      - name: Find the jobs a CI edit selects
        id: ci
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          jobs=$(uv run --locked --project .github/scripts \
            python .github/scripts/changed_jobs.py "${PR_BASE:-$GROUP_BASE}")
          echo "$jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  actionlint:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.actionlint == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'actionlint')
    uses: ./.github/workflows/lint.actionlint.yaml

  alamos-go:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.alamos_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-go')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: alamos-go
      directory: alamos/go
      macos: &full ${{ inputs.full == true }}
      windows: *full
    secrets: inherit

  alamos-py:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.alamos_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-py')
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: alamos-py
      coverage_module: alamos
      directory: alamos/py
      macos: *full
      windows: *full
    secrets: inherit

  alamos-py-lowest:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.alamos_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-py-lowest')
    uses: ./.github/workflows/test.py.yaml
    with:
      directory: alamos/py
      lowest: true
    secrets: inherit

  alamos-ts:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.alamos_ts == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-ts')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: alamos-ts
      directory: alamos/ts
      macos: *full
      package: alamos
      windows: *full
    secrets: inherit

  arc-cpp:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.arc_cpp == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'arc-cpp')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      clang_tidy: ${{ inputs.full || needs.changes.outputs.arc_cpp == 'true' }}
      core_image: ${{ needs.core-image.outputs.image }}
      directories: arc/cpp
      macos: *full
      rust: true
      targets: //arc/cpp/...
      test_flags: --spawn_strategy=local --jobs=1
      windows: *full
    secrets: inherit

  arc-go:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.arc_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'arc-go')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: arc-go
      directory: arc/go
      install_antlr4: true
      macos: *full
      windows: *full
    secrets: inherit

  aspen:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.aspen == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'aspen')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: aspen
      directory: aspen
      macos: *full
      windows: *full
    secrets: inherit

  buildifier:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.buildifier == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'buildifier')
    uses: ./.github/workflows/lint.buildifier.yaml
    secrets: inherit

  cesium:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.cesium == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'cesium')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: cesium
      directory: cesium
      macos: *full
      windows: *full
    secrets: inherit

  ci-scripts:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.ci_scripts == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'ci-scripts')
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: ci-scripts
      coverage_module: .
      directory: .github/scripts
    secrets: inherit

  client-cpp:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_cpp == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-cpp')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      clang_tidy: ${{ inputs.full || needs.changes.outputs.client_cpp == 'true' }}
      core_image: ${{ needs.core-image.outputs.image }}
      directories: client/cpp client/clib
      macos: *full
      targets: //client/cpp/... //client/clib/...
      test_flags: --nocache_test_results
      windows: *full
    secrets: inherit

  client-py:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_py == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-py')
    uses: ./.github/workflows/test.py.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: client-py
      coverage_module: synnax
      directory: client/py
      type_check_dir: ./synnax ./examples ./tests
    secrets: inherit

  client-py-lowest:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_py == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-py-lowest')
    uses: ./.github/workflows/test.py.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      directory: client/py
      lowest: true
      type_check_dir: ./synnax ./examples ./tests
    secrets: inherit

  client-ts:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_ts == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-ts')
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: client-ts
      directory: client/ts
      package: client
    secrets: inherit

  console:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.console == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'console')
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: console
      directory: console
      package: console
      shards: 3
    secrets: inherit

  copyright:
    uses: ./.github/workflows/test.copyright.yaml

  core:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'core')
    uses: ./.github/workflows/test.go.yaml
    with:
      cached: ${{ github.event_name == 'pull_request' }}
      coverage_flag: core
      directory: core
      macos: *full
      shards: 3
      windows: *full
    secrets: inherit

  core-image:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.core_image == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'core-image')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: core
      repository: ghcr.io/synnaxlabs/synnax
    secrets: inherit

  desktop-shell:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.console == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'desktop-shell')
    # macOS compiles the Tauri shell with no extra system packages.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: console/src-tauri -> target
          cache-shared-key: ${{ runner.os }}-desktop-test
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Create an empty frontend
        # The Tauri context embeds the frontend directory, so it must exist.
        run: mkdir -p console/dist && touch console/dist/index.html

      - name: Test
        working-directory: console/src-tauri
        run: cargo llvm-cov --features desktop --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: console/src-tauri/lcov.info
          flags: desktop-shell
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.docs == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'docs')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: docs
      directory: site/docs
      macos: *full
      package: docs
      windows: *full
    secrets: inherit

  docs-site:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.docs == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'docs-site')
    uses: ./.github/workflows/test.docs.yaml
    secrets: inherit

  drift:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.drift == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'drift')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: drift
      directory: drift
      macos: *full
      package: drift
      windows: *full
    secrets: inherit

  driver:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.driver == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'driver')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      clang_tidy: ${{ inputs.full || needs.changes.outputs.driver == 'true' }}
      core_image: ${{ needs.core-image.outputs.image }}
      directories: driver
      macos: *full
      rust: true
      targets: //driver/...
      test_flags: --spawn_strategy=local --local_test_jobs=1
      test_tags: -hardware
      windows: *full
    secrets: inherit

  # The EtherCAT bus runs on its own thread, and a streamer can set its channels
  # while it reads, so their suites also run under TSan. The GCC TSan runtime on the
  # build bots aborts on the kernel's address randomization, so the tests run with it
  # off.
  driver-tsan:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.driver == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'driver-tsan')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      core_image: ${{ needs.core-image.outputs.image }}
      sanitizers: false
      targets: //client/cpp/framer:framer_test //driver/ethercat/...
      test_flags: --config=tsan --run_under="setarch -R"
      test_tags: -hardware
    secrets: inherit

  eslint-config:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.eslint_config == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'eslint-config')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: eslint-config
      directory: configs/eslint
      package: eslint-config
    secrets: inherit

  exports-go:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.exports_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'exports-go')
    runs-on: ubuntu-latest
    # The proxy drops streams at times, so a failed fetch falls back to the source.
    env:
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Type checking every module for three GOOS values fills the default disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: x/go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Download the Go modules
        run: |
          .github/scripts/go_mod_download.sh alamos/go arc/go aspen cesium core \
            freighter/go freighter/integration gorp oracle x/go

      - name: Build the check
        working-directory: x/go
        run: go build -o "$RUNNER_TEMP/exports" ./cmd/exports

      - name: Check exported identifiers no other package uses
        # Report-only until the current findings are fixed.
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/exports" alamos/go arc/go aspen cesium core freighter/go \
            freighter/integration gorp oracle x/go

  exports-py:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.exports_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'exports-py')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest-known

      - name: Check names that are public without need
        # Report-only until the current findings are fixed.
        continue-on-error: true
        run: uv run --project scripts scripts/check_exports_py.py

  format:
    uses: ./.github/workflows/test.format.yaml

  foundation:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.foundation == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'foundation')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: foundation
      directory: site/foundation
      macos: *full
      package: foundation
      windows: *full
    secrets: inherit

  foundation-site:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.foundation == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'foundation-site')
    permissions:
      contents: read
    uses: ./.github/workflows/build.site.yaml
    with:
      site: foundation
    secrets: inherit

  freighter-cpp:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.freighter_cpp == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-cpp')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      clang_tidy: true
      directories: freighter/cpp
      macos: *full
      targets: //freighter/cpp/...
      windows: *full
    secrets: inherit

  freighter-go:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.freighter_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-go')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: freighter-go
      directory: freighter/go
      macos: *full
      windows: *full
    secrets: inherit

  freighter-image:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.freighter_image == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-image')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: freighter/integration
      repository: ghcr.io/synnaxlabs/freighter-go-integration
    secrets: inherit

  freighter-integration:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.freighter_integration == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-integration')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: freighter-integration
      directory: freighter/integration
      macos: *full
      windows: *full
    secrets: inherit

  freighter-py:
    needs: [changes, freighter-image]
    if:
      inputs.full || needs.changes.outputs.freighter_py == 'true' ||
      needs.changes.outputs.freighter_integration == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-py')
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: freighter-py
      coverage_module: freighter
      directory: freighter/py
      freighter_image: ${{ needs.freighter-image.outputs.image }}
    secrets: inherit

  freighter-py-lowest:
    needs: [changes, freighter-image]
    if:
      inputs.full || needs.changes.outputs.freighter_py == 'true' ||
      needs.changes.outputs.freighter_integration == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-py-lowest')
    uses: ./.github/workflows/test.py.yaml
    with:
      directory: freighter/py
      freighter_image: ${{ needs.freighter-image.outputs.image }}
      lowest: true
    secrets: inherit

  freighter-ts:
    needs: [changes, freighter-image]
    if:
      inputs.full || needs.changes.outputs.freighter_ts == 'true' ||
      needs.changes.outputs.freighter_integration == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'freighter-ts')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: freighter-ts
      directory: freighter/ts
      freighter_image: ${{ needs.freighter-image.outputs.image }}
      package: freighter
    secrets: inherit

  gorp:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.gorp == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'gorp')
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: gorp
      directory: gorp
      macos: *full
      windows: *full
    secrets: inherit

  integration:
    needs: changes
    if:
      inputs.full || (github.event_name == 'merge_group' || inputs.integration) &&
      (needs.changes.outputs.integration == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'integration'))
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/test.integration.yaml
    with:
      ubuntu: *full
    secrets: inherit

  knip:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.knip == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'knip')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Build the Vite plugin
        # Knip loads each Vite configuration, and they import the built plugin.
        run: pnpm turbo build --filter @synnaxlabs/vite-plugin

      - name: Check unused code
        run: pnpm knip

