      contents: read
    uses: ./.github/workflows/build.site.yaml
    with:
      site: www
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  x-cpp:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.x_cpp == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'x-cpp')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'x-cpp')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      clang_tidy: true
      directories: x/cpp
      macos: *full
      targets: //x/cpp/...
      windows: *full
    secrets:
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  x-go:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.x_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'x-go')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'x-go')
    uses: ./.github/workflows/test.go.yaml
    with:
      changed: ${{ fromJSON(needs.changes.outputs.go_changes)['x-go'] }}
      coverage_flag: x-go
      directory: x/go
      macos: *full
      ref: ${{ github.event.pull_request.head.sha }}
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only), 'x-go')
        }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  x-py:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.x_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'x-py')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'x-py')
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: x-py
      coverage_module: x
      directory: x/py
      macos: *full
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only), 'x-py')
        }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  x-py-lowest:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.x_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'x-py-lowest')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'x-py-lowest')
    uses: ./.github/workflows/test.py.yaml
    with:
      directory: x/py
      lowest: true
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'x-py-lowest') }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  x-ts:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.x_ts == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'x-ts')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'x-ts')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: x-ts
      directory: x/ts
      macos: *full
      package: x
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # A merge group cancels its run on the first failed job. The cancel frees the runners
  # that the other jobs hold, and OK then fails at once, so the queue ejects the group.
  fail-fast:
    name: Fail fast
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel the run when a job fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          url="$run/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          while true; do
            # The next poll retries a failed API call.
            if ! jobs=$(gh api --paginate "$url" --jq '.jobs[]' | jq -s .); then
              sleep 30
              continue
            fi
            failed=$(jq -r '.[] | select(.conclusion == "failure"
              or .conclusion == "timed_out") | .name' <<< "$jobs")
            if [ -n "$failed" ]; then
              echo "$failed"
              echo "::error::A job failed, so the run is cancelled."
              gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
              exit 1
            fi
            # OK starts only after every other job finished.
            jq -e '.[] | select(.name == "OK" and (.status == "in_progress"
              or .status == "completed"))' <<< "$jobs" > /dev/null && exit 0
            sleep 30
          done

  # GitHub skips a job whose dependency failed or was skipped, so always() makes this
  # one run and report. A skipped job is left out on purpose or passed before.
  ok:
    name: OK
    if: always()
    needs:
      - actionlint
      - alamos-go
      - alamos-py
      - alamos-py-lowest
      - alamos-ts
      - arc-cpp
      - arc-go
      - buildifier
      - cesium
      - changes
      - ci-scripts
      - client-cpp
      - client-py
      - client-py-lowest
      - client-ts
      - console
      - copyright
      - core
      - core-image
      - desktop-shell
      - docs
      - docs-site
      - drift
      - driver
      - driver-tsan
      - eslint-config
      - exports-go
      - exports-py
      - format
      - foundation
      - foundation-site
      - freighter-cpp
      - freighter-go
      - freighter-image
      - freighter-integration
      - freighter-py
      - freighter-py-lowest
      - freighter-ts
      - gorp
      - integration
      - knip
      - lint-integration
      - lyra
      - oracle
      - oracle-check
      - oracle-language
      - pluto
      - portal
      - portal-site
      - protobuf
      - py-packages
      - scripts
      - runners
      - site-common
      - soem
      - stylelint
      - stylelint-config
      - versions
      - vite-plugin
      - www
      - www-site
      - x-cpp
      - x-go
      - x-py
      - x-py-lowest
      - x-ts
    runs-on: ubuntu-latest
    outputs:
      stamps: ${{ steps.stamps.outputs.stamps }}
    steps:
      # A job that passed is stamped even when another job failed.
      - name: List the keyed jobs that passed
        id: stamps
        if: needs.changes.result == 'success'
        env:
          GO: ${{ needs.changes.outputs.go_changes }}
          KEYS: ${{ needs.changes.outputs.keys }}
          PR: ${{ github.event.pull_request.number || 0 }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          stamps=$(jq -c --argjson keys "$KEYS" --argjson go "$GO" --arg pr "$PR" \
            '[to_entries[] | select(.value.result == "success") | .key as $job
            | ($keys[$job] // {} | .[]), (select($pr != "0" and $go[$job]) | "pr\($pr)")
            | {job: $job, key: .}]' <<< "$RESULTS")
          echo "$stamps"
          echo "stamps=$stamps" >> "$GITHUB_OUTPUT"

      - name: Fail on a failed or cancelled job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e '[.[].result] | all(. == "success" or . == "skipped")' \
            <<< "$RESULTS" > /dev/null

  # Records each passed job by its key. A fork's run is not trusted.
  stamp:
    name: Stamp
    needs: ok
    if:
      always() && needs.ok.outputs.stamps != '' && needs.ok.outputs.stamps != '[]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Install the artifact client
        run: npm install --prefix "$RUNNER_TEMP/stamp" @actions/artifact@6.3.1

      - name: Upload the stamps
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          STAMPS: ${{ needs.ok.outputs.stamps }}
        with:
          script: |
            const lib = "stamp/node_modules/@actions/artifact/lib/artifact.js";
            const { DefaultArtifactClient } = await import(
              `${process.env.RUNNER_TEMP}/${lib}`
            );
            const client = new DefaultArtifactClient();
            require("fs").writeFileSync("pass", process.env.GITHUB_RUN_ID);
            await Promise.all(
              JSON.parse(process.env.STAMPS).map(({ job, key }) =>
                client.uploadArtifact(`pass-${job}-${key}`, ["pass"], ".", {
                  retentionDays: 14,
                }),
              ),
            );

  # GitHub sends no event to the default branch for a failed run of a pull request.
  shepherd:
    name: Wake the shepherd
    needs: ok
    if:
      ${{ failure() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor
      != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Agent - Shepherd
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/agent.shepherd.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"
