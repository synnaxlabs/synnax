              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - aspen/**
              - codecov.yaml
              - freighter/go/**
              - scripts/check_go_generate.sh
              - x/go/**

            cesium:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - cesium/**
              - codecov.yaml
              - scripts/check_go_generate.sh
              - x/go/**

            core:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - arc/go/**
              - aspen/**
              - cesium/**
              - codecov.yaml
              - core/**
              - freighter/go/**
              - scripts/check_go_generate.sh
              - x/go/**

            freighter_go:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - codecov.yaml
              - freighter/go/**
              - scripts/check_go_generate.sh
              - x/go/**

            freighter_integration:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - codecov.yaml
              - freighter/go/**
              - freighter/integration/**
              - scripts/check_go_generate.sh
              - x/go/**

            oracle:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - codecov.yaml
              - oracle/**
              - scripts/check_go_generate.sh
              - scripts/install_antlr4.sh
              - x/go/**

            x_go:
              - .github/workflows/ci.yaml
