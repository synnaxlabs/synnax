# Gates every merge. The ruleset requires only the OK context, so every check a pull
# request or a merge group must pass runs from here.

name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      integration:
        description: Whether to run the merge-queue tier too
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the run it replaces. Merge groups never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One output per filter below, true when the pull request or merge group touched
  # one of its paths. Every filter lists this file, so a change here runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      oracle_check: ${{ steps.filter.outputs.oracle_check }}
      buildifier: ${{ steps.filter.outputs.buildifier }}
      lint_integration: ${{ steps.filter.outputs.lint_integration }}
      docs: ${{ steps.filter.outputs.docs }}
      media: ${{ steps.filter.outputs.media }}
      scripts: ${{ steps.filter.outputs.scripts }}
      protobuf: ${{ steps.filter.outputs.protobuf }}
      alamos_go: ${{ steps.filter.outputs.alamos_go }}
      arc_go: ${{ steps.filter.outputs.arc_go }}
      aspen: ${{ steps.filter.outputs.aspen }}
      cesium: ${{ steps.filter.outputs.cesium }}
      core: ${{ steps.filter.outputs.core }}
      freighter_go: ${{ steps.filter.outputs.freighter_go }}
      freighter_integration: ${{ steps.filter.outputs.freighter_integration }}
      oracle: ${{ steps.filter.outputs.oracle }}
      x_go: ${{ steps.filter.outputs.x_go }}
      alamos_py: ${{ steps.filter.outputs.alamos_py }}
      alamos_ts: ${{ steps.filter.outputs.alamos_ts }}
      x_py: ${{ steps.filter.outputs.x_py }}
      x_ts: ${{ steps.filter.outputs.x_ts }}
      drift: ${{ steps.filter.outputs.drift }}
      console: ${{ steps.filter.outputs.console }}
      pluto: ${{ steps.filter.outputs.pluto }}
      client_cpp: ${{ steps.filter.outputs.client_cpp }}
      client_py: ${{ steps.filter.outputs.client_py }}
      client_ts: ${{ steps.filter.outputs.client_ts }}
      freighter_py: ${{ steps.filter.outputs.freighter_py }}
      freighter_ts: ${{ steps.filter.outputs.freighter_ts }}
      arc: ${{ steps.filter.outputs.arc }}
      driver: ${{ steps.filter.outputs.driver }}
      x_cpp: ${{ steps.filter.outputs.x_cpp }}
      freighter_cpp: ${{ steps.filter.outputs.freighter_cpp }}
      soem: ${{ steps.filter.outputs.soem }}
      integration: ${{ steps.filter.outputs.integration }}
      client: ${{ steps.filter.outputs.client }}
      freighter: ${{ steps.filter.outputs.freighter }}
      core_image: ${{ steps.filter.outputs.core_image }}
      freighter_image: ${{ steps.filter.outputs.freighter_image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            oracle_check:
              - "**/*.gen.*"
              - "**/*.proto"
              - "**/pyproject.toml"
              - .clang-format
              - .clang-format-ignore
              - .github/workflows/check.oracle.yaml
              - .github/workflows/ci.yaml
              - .prettierignore
              - .prettierrc
              - alamos/go/**
              - buf.gen.yaml
              - buf.yaml
              - configs/eslint/**
              - eslint.config.ts
              - licenses/headers/**
              - oracle/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - schemas/**
              - scripts/install_clang_format.sh
              - uv.lock
              - x/go/**

            buildifier:
              - "**/*.bzl"
              - "**/BUILD"
              - "**/BUILD.bazel"
              - .bazeliskrc
              - .bazelrc
              - .github/workflows/ci.yaml
              - .github/workflows/lint.buildifier.yaml
              - MODULE.bazel
              - MODULE.bazel.lock
              - WORKSPACE
              - WORKSPACE.bazel

            lint_integration:
              - .github/actions/test-python/**
              - .github/workflows/ci.yaml
              - .github/workflows/lint.integration.yaml
              - alamos/py/**
              - client/py/**
              - freighter/py/**
              - integration/**
              - pyproject.toml
              - uv.lock

            docs:
              - .github/actions/test-typescript/**
              - .github/workflows/ci.yaml
              - .github/workflows/test.docs.yaml
              - alamos/ts/**
              - arc/ts/**
              - client/ts/**
              - configs/eslint/**
              - configs/ts/**
              - configs/vite/**
              - docs/site/**
              - freighter/ts/**
              - package.json
              - pluto/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/media/**
              - x/ts/**

            media:
              - .github/actions/test-typescript/**
              - .github/workflows/ci.yaml
              - .github/workflows/test.media.yaml
              - codecov.yaml
              - configs/eslint/**
              - configs/ts/**
              - configs/vite/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/media/**

            scripts:
              - .github/scripts/**
              - .github/workflows/ci.yaml
              - .github/workflows/test.scripts.yaml
              - scripts/**

            protobuf:
              - "**/*.proto"
              - .github/workflows/ci.yaml
              - .github/workflows/test.protobuf.yaml
              - buf.gen.yaml
              - buf.yaml

            alamos_go:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - codecov.yaml
              - scripts/check_go_generate.sh
              - x/go/**

            arc_go:
              - .github/workflows/ci.yaml
              - .github/workflows/test.go.yaml
              - .golangci.yaml
              - alamos/go/**
              - arc/go/**
              - codecov.yaml
              - freighter/go/**
              - scripts/check_go_generate.sh
              - scripts/install_antlr4.sh
              - x/go/**

            aspen:
