              - codecov.yaml
              - configs/eslint/**
              - configs/ts/**
              - configs/vite/**
              - knip.json
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/ts/**

            drift:
              - .github/actions/test-typescript/**
              - .github/workflows/ci.yaml
              - .github/workflows/test.drift.yaml
              - alamos/ts/**
              - codecov.yaml
              - configs/eslint/**
              - configs/ts/**
              - configs/vite/**
              - drift/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/ts/**

            console: &console
              - .github/actions/test-typescript/**
              - .github/workflows/ci.yaml
              - .github/workflows/test.console.yaml
              - alamos/go/**
              - alamos/ts/**
              - arc/ts/**
              - aspen/**
              - cesium/**
              - client/ts/**
              - codecov.yaml
              - configs/eslint/**
              - configs/ts/**
              - configs/vite/**
              - console/**
              - core/**
              - drift/**
              - freighter/go/**
              - freighter/ts/**
              - package.json
              - pluto/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - x/go/**
              - x/media/**
              - x/ts/**

            pluto: &pluto
