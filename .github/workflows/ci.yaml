# Gates every merge. The ruleset requires only the OK context, so every check a pull
# request or a merge group must pass runs from here. Nightly and Release call it with
# full, which runs every job whatever changed, on every OS the job supports.

name: CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      full:
        description: Whether to run every job on every OS
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Whether to run every job on every OS
        required: false
        type: boolean
        default: false
      integration:
        description: Whether to run the merge-queue tier too
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the run it replaces. A merge group run is
# cancelled only by cancel.merge-group.yaml, which uses the same key. A called run takes
# the caller's workflow name, so Nightly and Release never share a group.
concurrency:
  group:
    ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref ||
    format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One output per key in .github/filters.yaml, true when the pull request or merge
  # group touched one of its paths.
  changes:
    runs-on: ubuntu-latest
    outputs:
      alamos_go: ${{ steps.filter.outputs.alamos_go }}
      alamos_py: ${{ steps.filter.outputs.alamos_py }}
      alamos_ts: ${{ steps.filter.outputs.alamos_ts }}
      arc_cpp: ${{ steps.filter.outputs.arc_cpp }}
      arc_go: ${{ steps.filter.outputs.arc_go }}
      aspen: ${{ steps.filter.outputs.aspen }}
      buildifier: ${{ steps.filter.outputs.buildifier }}
      cesium: ${{ steps.filter.outputs.cesium }}
      client_cpp: ${{ steps.filter.outputs.client_cpp }}
      client_py: ${{ steps.filter.outputs.client_py }}
      client_ts: ${{ steps.filter.outputs.client_ts }}
      console: ${{ steps.filter.outputs.console }}
      console_build: ${{ steps.filter.outputs.console_build }}
      core: ${{ steps.filter.outputs.core }}
      core_build: ${{ steps.filter.outputs.core_build }}
      core_image: ${{ steps.filter.outputs.core_image }}
      docs: ${{ steps.filter.outputs.docs }}
      drift: ${{ steps.filter.outputs.drift }}
      driver: ${{ steps.filter.outputs.driver }}
      driver_build: ${{ steps.filter.outputs.driver_build }}
      foundation: ${{ steps.filter.outputs.foundation }}
      freighter_cpp: ${{ steps.filter.outputs.freighter_cpp }}
      freighter_go: ${{ steps.filter.outputs.freighter_go }}
      freighter_image: ${{ steps.filter.outputs.freighter_image }}
      freighter_integration: ${{ steps.filter.outputs.freighter_integration }}
      freighter_py: ${{ steps.filter.outputs.freighter_py }}
      freighter_ts: ${{ steps.filter.outputs.freighter_ts }}
      integration: ${{ steps.filter.outputs.integration }}
      knip: ${{ steps.filter.outputs.knip }}
      lint_integration: ${{ steps.filter.outputs.lint_integration }}
      lyra: ${{ steps.filter.outputs.lyra }}
      media: ${{ steps.filter.outputs.media }}
      oracle: ${{ steps.filter.outputs.oracle }}
      oracle_check: ${{ steps.filter.outputs.oracle_check }}
      oracle_language: ${{ steps.filter.outputs.oracle_language }}
      pluto: ${{ steps.filter.outputs.pluto }}
      portal: ${{ steps.filter.outputs.portal }}
      protobuf: ${{ steps.filter.outputs.protobuf }}
      scripts: ${{ steps.filter.outputs.scripts }}
      site_common: ${{ steps.filter.outputs.site_common }}
      soem: ${{ steps.filter.outputs.soem }}
      vite_plugin: ${{ steps.filter.outputs.vite_plugin }}
      www: ${{ steps.filter.outputs.www }}
      x_cpp: ${{ steps.filter.outputs.x_cpp }}
      x_go: ${{ steps.filter.outputs.x_go }}
      x_py: ${{ steps.filter.outputs.x_py }}
      x_ts: ${{ steps.filter.outputs.x_ts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

  alamos-go:
    needs: changes
    if: inputs.full || needs.changes.outputs.alamos_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: alamos-go
      directory: alamos/go
      macos: &full ${{ inputs.full == true }}
      windows: *full
    secrets: inherit

  alamos-py:
    needs: changes
    if: inputs.full || needs.changes.outputs.alamos_py == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: alamos-py
      coverage_module: alamos
      directory: alamos/py
      macos: *full
      windows: *full
    secrets: inherit

  alamos-ts:
    needs: changes
    if: inputs.full || needs.changes.outputs.alamos_ts == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: alamos-ts
      directory: alamos/ts
      macos: *full
      package: alamos
      windows: *full
    secrets: inherit

  arc-cpp:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.arc_cpp == 'true' ||
      needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      directories: arc/cpp
      macos: *full
      rust: true
      targets: //arc/cpp/...
      test_flags: --spawn_strategy=local --jobs=1
      windows: *full
    secrets: inherit

  arc-go:
    needs: changes
    if: inputs.full || needs.changes.outputs.arc_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: arc-go
      directory: arc/go
      install_antlr4: true
      macos: *full
      windows: *full
    secrets: inherit

  aspen:
    needs: changes
    if: inputs.full || needs.changes.outputs.aspen == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: aspen
      directory: aspen
      macos: *full
      windows: *full
    secrets: inherit

  buildifier:
    needs: changes
    if: inputs.full || needs.changes.outputs.buildifier == 'true'
    uses: ./.github/workflows/lint.buildifier.yaml
    secrets: inherit

  cesium:
    needs: changes
    if: inputs.full || needs.changes.outputs.cesium == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: cesium
      directory: cesium
      macos: *full
      windows: *full
    secrets: inherit

  client-cpp:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_cpp == 'true' ||
      needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      directories: client/cpp client/clib
      macos: *full
      targets: //client/cpp/... //client/clib/...
      test_flags: --nocache_test_results
      windows: *full
    secrets: inherit

  client-py:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_py == 'true' ||
      needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: client-py
      coverage_module: synnax
      directory: client/py
      type_check_dir: ./synnax
    secrets: inherit

  client-ts:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.client_ts == 'true' ||
      needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: client-ts
      directory: client/ts
      package: client
    secrets: inherit

  console:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.console == 'true' ||
      needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: console
      directory: console
      package: console
      shards: 3
      test_args: --no-file-parallelism
    secrets: inherit

  copyright:
    uses: ./.github/workflows/test.copyright.yaml

  core:
    needs: changes
    if: inputs.full || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: core
      directory: core
      macos: *full
      windows: *full
    secrets: inherit

  core-image:
    needs: changes
    if: inputs.full || needs.changes.outputs.core_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: core
      repository: ghcr.io/synnaxlabs/synnax
    secrets: inherit

  desktop-shell:
    needs: changes
    if: inputs.full || needs.changes.outputs.console == 'true'
    # macOS compiles the Tauri shell with no extra system packages.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: console/src-tauri -> target
          cache-shared-key: ${{ runner.os }}-desktop-test

      - name: Create an empty frontend
        # The Tauri context embeds the frontend directory, so it must exist.
        run: mkdir -p console/dist && touch console/dist/index.html

      - name: Test
        working-directory: console/src-tauri
        run: cargo test --features desktop

  docs:
    needs: changes
    if: inputs.full || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: docs
      directory: site/docs
      macos: *full
      package: docs
      windows: *full
    secrets: inherit

  docs-site:
    needs: changes
    if: inputs.full || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/test.docs.yaml
    secrets: inherit

  drift:
    needs: changes
    if: inputs.full || needs.changes.outputs.drift == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: drift
      directory: drift
      macos: *full
      package: drift
      windows: *full
    secrets: inherit

  driver:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.driver == 'true' ||
      needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      core_image: ${{ needs.core-image.outputs.image }}
      directories: driver
      macos: *full
      rust: true
      targets: //driver/...
      test_flags: --spawn_strategy=local --local_test_jobs=1
      test_tags: -hardware
      windows: *full
    secrets: inherit

  format:
    uses: ./.github/workflows/test.format.yaml

  foundation:
    needs: changes
    if: inputs.full || needs.changes.outputs.foundation == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      directory: site/foundation
      macos: *full
      package: foundation
      windows: *full
    secrets: inherit

  freighter-cpp:
    needs: changes
    if: inputs.full || needs.changes.outputs.freighter_cpp == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      directories: freighter/cpp
      macos: *full
      targets: //freighter/cpp/...
      windows: *full
    secrets: inherit

  freighter-go:
    needs: changes
    if: inputs.full || needs.changes.outputs.freighter_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: freighter-go
      directory: freighter/go
      macos: *full
      windows: *full
    secrets: inherit

  freighter-image:
    needs: changes
    if: inputs.full || needs.changes.outputs.freighter_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: freighter/integration
      repository: ghcr.io/synnaxlabs/freighter-go-integration
    secrets: inherit

  freighter-integration:
    needs: changes
    if: inputs.full || needs.changes.outputs.freighter_integration == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: freighter-integration
      directory: freighter/integration
      macos: *full
      windows: *full
    secrets: inherit

  freighter-py:
    needs: [changes, freighter-image]
    if:
      inputs.full || needs.changes.outputs.freighter_py == 'true' ||
      needs.changes.outputs.freighter_integration == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: freighter-py
      coverage_module: freighter
      directory: freighter/py
      freighter_image: ${{ needs.freighter-image.outputs.image }}
    secrets: inherit

  freighter-ts:
    needs: [changes, freighter-image]
    if:
      inputs.full || needs.changes.outputs.freighter_ts == 'true' ||
      needs.changes.outputs.freighter_integration == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: freighter-ts
      directory: freighter/ts
      freighter_image: ${{ needs.freighter-image.outputs.image }}
      package: freighter
    secrets: inherit

  integration:
    needs: changes
    if:
      inputs.full || (github.event_name == 'merge_group' || inputs.integration) &&
      needs.changes.outputs.integration == 'true'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/test.integration.yaml
    with:
      ubuntu: *full
    secrets: inherit

  knip:
    needs: changes
    if: inputs.full || needs.changes.outputs.knip == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Build the Vite plugin
        # Knip loads each Vite configuration, and they import the built plugin.
        run: pnpm turbo build --filter @synnaxlabs/vite-plugin

      - name: Check unused code
        run: pnpm knip

  lint-integration:
    needs: changes
    if: inputs.full || needs.changes.outputs.lint_integration == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      directory: integration
      test: false
    secrets: inherit

  lyra:
    needs: changes
    if: inputs.full || needs.changes.outputs.lyra == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: lyra
      directory: lyra
      macos: *full
      package: lyra
      windows: *full
    secrets: inherit

  media:
    needs: changes
    if: inputs.full || needs.changes.outputs.media == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      directory: x/media
      package: media
      test: false
    secrets: inherit

  oracle:
    needs: changes
    if: inputs.full || needs.changes.outputs.oracle == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: oracle
      directory: oracle
      install_antlr4: true
      macos: *full
      windows: *full
    secrets: inherit

  oracle-check:
    needs: changes
    if: inputs.full || needs.changes.outputs.oracle_check == 'true'
    uses: ./.github/workflows/check.oracle.yaml
    secrets: inherit

  oracle-language:
    needs: changes
    if: inputs.full || needs.changes.outputs.oracle_language == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      directory: oracle/lsp/extensions/vscode
      lint: false
      macos: *full
      package: oracle-language
      windows: *full
    secrets: inherit

  pluto:
    needs: [changes, core-image]
    if:
      inputs.full || needs.changes.outputs.pluto == 'true' || needs.changes.outputs.core
      == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: pluto
      directory: pluto
      package: pluto
      test_args: --no-file-parallelism
    secrets: inherit

  portal:
    needs: changes
    if: inputs.full || needs.changes.outputs.portal == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: portal
      directory: site/portal
      macos: *full
      package: portal
      windows: *full
    secrets: inherit

  protobuf:
    needs: changes
    if: inputs.full || needs.changes.outputs.protobuf == 'true'
    uses: ./.github/workflows/test.protobuf.yaml
    secrets: inherit

  scripts:
    needs: changes
    if: inputs.full || needs.changes.outputs.scripts == 'true'
    uses: ./.github/workflows/test.scripts.yaml
    secrets: inherit

  site-common:
    needs: changes
    if: inputs.full || needs.changes.outputs.site_common == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: site-common
      directory: site/common
      macos: *full
      package: site-common
      windows: *full
    secrets: inherit

  soem:
    needs: changes
    if: inputs.full || needs.changes.outputs.soem == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      macos: true
      sanitizers: false
      targets: //vendor/soem:all
      ubuntu: false
    secrets: inherit

  versions:
    uses: ./.github/workflows/test.updates.yaml

  vite-plugin:
    needs: changes
    if: inputs.full || needs.changes.outputs.vite_plugin == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      directory: configs/vite
      macos: *full
      package: vite-plugin
      windows: *full
    secrets: inherit

  www:
    needs: changes
    if: inputs.full || needs.changes.outputs.www == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: www
      directory: site/www
      macos: *full
      package: www
      windows: *full
    secrets: inherit

  x-cpp:
    needs: changes
    if: inputs.full || needs.changes.outputs.x_cpp == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      directories: x/cpp
      macos: *full
      targets: //x/cpp/...
      windows: *full
    secrets: inherit

  x-go:
    needs: changes
    if: inputs.full || needs.changes.outputs.x_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: x-go
      directory: x/go
      macos: *full
      windows: *full
    secrets: inherit

  x-py:
    needs: changes
    if: inputs.full || needs.changes.outputs.x_py == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: x-py
      coverage_module: x
      directory: x/py
      macos: *full
      windows: *full
    secrets: inherit

  x-ts:
    needs: changes
    if: inputs.full || needs.changes.outputs.x_ts == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: x-ts
      directory: x/ts
      macos: *full
      package: x
      windows: *full
    secrets: inherit

  # A merge group cancels its run on the first failed job. The cancel frees the runners
  # that the other jobs hold, and OK then fails at once, so the queue ejects the group.
  fail-fast:
    name: Fail fast
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel the run when a job fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          url="$run/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          while true; do
            # The next poll retries a failed API call.
            if ! jobs=$(gh api --paginate "$url" --jq '.jobs[]' | jq -s .); then
              sleep 30
              continue
            fi
            failed=$(jq -r '.[] | select(.conclusion == "failure"
              or .conclusion == "timed_out") | .name' <<< "$jobs")
            if [ -n "$failed" ]; then
              echo "$failed"
              echo "::error::A job failed, so the run is cancelled."
              gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
              exit 1
            fi
            # OK starts only after every other job finished.
            jq -e '.[] | select(.name == "OK" and (.status == "in_progress"
              or .status == "completed"))' <<< "$jobs" > /dev/null && exit 0
            sleep 30
          done

  # GitHub skips a job whose dependency failed or was skipped, so always() makes this
  # one run and report. A skipped job passed: the change map left it out on purpose.
  ok:
    name: OK
    if: always()
    needs:
      - alamos-go
      - alamos-py
      - alamos-ts
      - arc-cpp
      - arc-go
      - aspen
      - buildifier
      - cesium
      - changes
      - client-cpp
      - client-py
      - client-ts
      - console
      - copyright
      - core
      - core-image
      - desktop-shell
      - docs
      - docs-site
      - drift
      - driver
      - format
      - foundation
      - freighter-cpp
      - freighter-go
      - freighter-image
      - freighter-integration
      - freighter-py
      - freighter-ts
      - integration
      - knip
      - lint-integration
      - lyra
      - media
      - oracle
      - oracle-check
      - oracle-language
      - pluto
      - portal
      - protobuf
      - scripts
      - site-common
      - soem
      - versions
      - vite-plugin
      - www
      - x-cpp
      - x-go
      - x-py
      - x-ts
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a failed or cancelled job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e '[.[].result] | all(. == "success" or . == "skipped")' \
            <<< "$RESULTS" > /dev/null
