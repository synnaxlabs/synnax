  arc:
    needs: [changes, core-image]
    if: needs.changes.outputs.arc == 'true'
    uses: ./.github/workflows/test.arc.yaml
    with:
      image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
    secrets: inherit

  client:
    needs: [changes, core-image]
    if: needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/test.client.yaml
    with:
      image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      cpp: ${{ needs.changes.outputs.client_cpp == 'true' }}
      py: ${{ needs.changes.outputs.client_py == 'true' }}
      ts: ${{ needs.changes.outputs.client_ts == 'true' }}
    secrets: inherit

  freighter:
    needs: [changes, freighter-image]
    if: needs.changes.outputs.freighter == 'true'
    uses: ./.github/workflows/test.freighter.yaml
    with:
      image: ghcr.io/synnaxlabs/freighter-go-integration:${{ github.sha }}
      py: ${{ needs.changes.outputs.freighter_py == 'true' }}
      ts: ${{ needs.changes.outputs.freighter_ts == 'true' }}
    secrets: inherit

  x-cpp:
    needs: changes
    if: needs.changes.outputs.x_cpp == 'true'
    uses: ./.github/workflows/test.x.cpp.yaml
    secrets: inherit

  freighter-cpp:
    needs: changes
    if: needs.changes.outputs.freighter_cpp == 'true'
    uses: ./.github/workflows/test.freighter.cpp.yaml
    secrets: inherit

  soem:
    needs: changes
    if: needs.changes.outputs.soem == 'true'
    uses: ./.github/workflows/test.soem.yaml
    secrets: inherit

  integration:
    needs: changes
    if:
      (github.event_name == 'merge_group' || inputs.integration) &&
      needs.changes.outputs.integration == 'true'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/test.integration.yaml
    with:
      windows: false
    secrets: inherit

  # Runs even when a dependency failed or was skipped: a path-gated job that did not
  # run must still let the merge through.
  ok:
    name: OK
    if: always()
    needs:
      - format
      - copyright
      - versions
      - core-image
      - freighter-image
      - oracle-check
      - buildifier
      - lint-integration
      - docs
      - media
      - scripts
      - protobuf
      - alamos-go
      - arc-go
      - aspen
      - cesium
      - core
      - freighter-go
      - freighter-integration
      - oracle
      - x-go
      - alamos-py
      - alamos-ts
      - x-py
      - x-ts
      - drift
      - console
      - pluto
      - driver
      - arc
      - client
      - freighter
      - x-cpp
      - freighter-cpp
      - soem
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a failed or cancelled job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e '[.[].result] | all(. == "success" or . == "skipped")' \
            <<< "$RESULTS" > /dev/null
