# Gates every merge. The ruleset requires only the OK context, so every check a pull
# request or a merge group must pass runs from here. Nightly and Release call it with
# full, which runs every job whatever changed, on every OS the job supports.

name: CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      full:
        description: Whether to run every job on every OS
        required: false
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      CODECOV_TOKEN:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_USERNAME:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      PAGERDUTY_API_KEY:
        required: false
      PAGERDUTY_ROUTING_KEY:
        required: false
      POSTHOG_CLI_API_KEY:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false
      TAURI_KEY_PASSWORD:
        required: false
      TAURI_PRIVATE_KEY:
        required: false
      TURBO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      full:
        description: Whether to run every job on every OS
        required: false
        type: boolean
        default: false
      integration:
        description: Whether to run the merge-queue tier too
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the run it replaces. A merge group run is
# cancelled only by cancel.merge-group.yaml, which uses the same key. A called run takes
# the caller's workflow name, so Nightly and Release never share a group.
concurrency:
  group:
    ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref ||
    format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test jobs pull the Core and Freighter images from GHCR.
permissions:
  contents: read
  packages: read

jobs:
  # One output per key in .github/filters.yaml, true when the pull request or merge
  # group touched one of its paths. The ci output is a JSON list of the jobs that an
  # edit to this file or the change map selects. reused lists the jobs whose inputs
  # passed before, and lint_only the jobs whose inputs passed except for comments.
  changes:
    # paths-filter reads the changed files and the pass lookup reads the artifacts.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      actionlint: ${{ steps.filter.outputs.actionlint }}
      alamos_go: ${{ steps.filter.outputs.alamos_go }}
      alamos_py: ${{ steps.filter.outputs.alamos_py }}
      alamos_ts: ${{ steps.filter.outputs.alamos_ts }}
      arc_cpp: ${{ steps.filter.outputs.arc_cpp }}
      arc_go: ${{ steps.filter.outputs.arc_go }}
      buildifier: ${{ steps.filter.outputs.buildifier }}
      cesium: ${{ steps.filter.outputs.cesium }}
      ci: ${{ steps.ci.outputs.jobs }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      client_cpp: ${{ steps.filter.outputs.client_cpp }}
      client_py: ${{ steps.filter.outputs.client_py }}
      client_ts: ${{ steps.filter.outputs.client_ts }}
      console: ${{ steps.filter.outputs.console }}
      console_build: ${{ steps.filter.outputs.console_build }}
      core: ${{ steps.filter.outputs.core }}
      core_build: ${{ steps.filter.outputs.core_build }}
      core_image: ${{ steps.filter.outputs.core_image }}
      docs: ${{ steps.filter.outputs.docs }}
      drift: ${{ steps.filter.outputs.drift }}
      driver: ${{ steps.filter.outputs.driver }}
      driver_build: ${{ steps.filter.outputs.driver_build }}
      eslint_config: ${{ steps.filter.outputs.eslint_config }}
      exports_go: ${{ steps.filter.outputs.exports_go }}
      exports_py: ${{ steps.filter.outputs.exports_py }}
      foundation: ${{ steps.filter.outputs.foundation }}
      freighter_cpp: ${{ steps.filter.outputs.freighter_cpp }}
      freighter_go: ${{ steps.filter.outputs.freighter_go }}
      freighter_image: ${{ steps.filter.outputs.freighter_image }}
      freighter_integration: ${{ steps.filter.outputs.freighter_integration }}
      freighter_py: ${{ steps.filter.outputs.freighter_py }}
      freighter_ts: ${{ steps.filter.outputs.freighter_ts }}
      go_changes: ${{ steps.go.outputs.changes }}
      gorp: ${{ steps.filter.outputs.gorp }}
      integration: ${{ steps.filter.outputs.integration }}
      keys: ${{ steps.keys.outputs.keys }}
      knip: ${{ steps.filter.outputs.knip }}
      lint_integration: ${{ steps.filter.outputs.lint_integration }}
      lint_only: ${{ steps.reused.outputs.lint_only }}
      lyra: ${{ steps.filter.outputs.lyra }}
      oracle: ${{ steps.filter.outputs.oracle }}
      oracle_check: ${{ steps.filter.outputs.oracle_check }}
      oracle_language: ${{ steps.filter.outputs.oracle_language }}
      pluto: ${{ steps.filter.outputs.pluto }}
      portal: ${{ steps.filter.outputs.portal }}
      protobuf: ${{ steps.filter.outputs.protobuf }}
      py_packages: ${{ steps.filter.outputs.py_packages }}
      reused: ${{ steps.reused.outputs.jobs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      runners: ${{ steps.filter.outputs.runners }}
      site_common: ${{ steps.filter.outputs.site_common }}
      soem: ${{ steps.filter.outputs.soem }}
      stylelint: ${{ steps.filter.outputs.stylelint }}
      stylelint_config: ${{ steps.filter.outputs.stylelint_config }}
      vite_plugin: ${{ steps.filter.outputs.vite_plugin }}
      www: ${{ steps.filter.outputs.www }}
      x_cpp: ${{ steps.filter.outputs.x_cpp }}
      x_go: ${{ steps.filter.outputs.x_go }}
      x_py: ${{ steps.filter.outputs.x_py }}
      x_ts: ${{ steps.filter.outputs.x_ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/filters.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known

      # Compares against the same base as the filter.
      - name: Find the jobs a CI edit selects
        id: ci
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          jobs=$(uv run --locked --project .github/scripts \
            python .github/scripts/changed_jobs.py "${PR_BASE:-$GROUP_BASE}")
          echo "$jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Key the jobs by their inputs
        id: keys
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          keys=$(uv run --locked --project .github/scripts \
            python .github/scripts/job_key.py keys)
          echo "$keys" | jq .
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

      - name: Find the jobs whose inputs passed before
        id: reused
        env:
          GH_TOKEN: ${{ github.token }}
          KEYS: ${{ steps.keys.outputs.keys }}
        run: |
          found=$(uv run --locked --project .github/scripts \
            python .github/scripts/job_key.py reused "$KEYS")
          echo "$found" | jq .
          echo "jobs=$(jq -c .reused <<< "$found")" >> "$GITHUB_OUTPUT"
          echo "lint_only=$(jq -c .lint_only <<< "$found")" >> "$GITHUB_OUTPUT"

      - name: List the Go files changed since each Go job last passed
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          changes=$(uv run --locked --project .github/scripts \
            python .github/scripts/job_key.py changes "$PR" "$HEAD_SHA")
          echo "$changes" | jq .
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

  actionlint:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.actionlint == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'actionlint')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'actionlint')
    uses: ./.github/workflows/lint.actionlint.yaml

  alamos-go:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.alamos_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-go')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'alamos-go')
    uses: ./.github/workflows/test.go.yaml
    with:
      changed: ${{ fromJSON(needs.changes.outputs.go_changes)['alamos-go'] }}
      coverage_flag: alamos-go
      directory: alamos/go
      macos: &full ${{ inputs.full == true }}
      ref: ${{ github.event.pull_request.head.sha }}
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'alamos-go') }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  alamos-py:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.alamos_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-py')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'alamos-py')
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: alamos-py
      coverage_module: alamos
      directory: alamos/py
      macos: *full
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'alamos-py') }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  alamos-py-lowest:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.alamos_py == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-py-lowest')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'alamos-py-lowest')
    uses: ./.github/workflows/test.py.yaml
    with:
      directory: alamos/py
      lowest: true
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'alamos-py-lowest') }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  alamos-ts:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.alamos_ts == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'alamos-ts')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'alamos-ts')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: alamos-ts
      directory: alamos/ts
      macos: *full
      package: alamos
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  arc-cpp:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.arc_cpp == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'arc-cpp')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'arc-cpp')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      clang_tidy: ${{ inputs.full || needs.changes.outputs.arc_cpp == 'true' }}
      core_image: ${{ needs.core-image.outputs.image }}
      directories: arc/cpp
      macos: *full
      rust: true
      targets: //arc/cpp/...
      test_flags: --spawn_strategy=local --jobs=1
      windows: *full
    secrets:
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  arc-go:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.arc_go == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'arc-go')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'arc-go')
    uses: ./.github/workflows/test.go.yaml
    with:
      changed: ${{ fromJSON(needs.changes.outputs.go_changes)['arc-go'] }}
      coverage_flag: arc-go
      directory: arc/go
      install_antlr4: true
      macos: *full
      ref: ${{ github.event.pull_request.head.sha }}
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'arc-go') }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  buildifier:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.buildifier == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'buildifier')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'buildifier')
    uses: ./.github/workflows/lint.buildifier.yaml

  cesium:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.cesium == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'cesium')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'cesium')
    uses: ./.github/workflows/test.go.yaml
    with:
      changed: ${{ fromJSON(needs.changes.outputs.go_changes)['cesium'] }}
      coverage_flag: cesium
      directory: cesium
      macos: *full
      ref: ${{ github.event.pull_request.head.sha }}
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'cesium') }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ci-scripts:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.ci_scripts == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'ci-scripts')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'ci-scripts')
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: ci-scripts
      coverage_module: .
      directory: .github/scripts
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'ci-scripts') }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  client-cpp:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.client_cpp == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-cpp')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'client-cpp')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      clang_tidy: ${{ inputs.full || needs.changes.outputs.client_cpp == 'true' }}
      core_image: ${{ needs.core-image.outputs.image }}
      directories: client/cpp client/clib
      macos: *full
      targets: //client/cpp/... //client/clib/...
      test_flags: --nocache_test_results
      windows: *full
    secrets:
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  client-py:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.client_py == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-py')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'client-py')
    uses: ./.github/workflows/test.py.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: client-py
      coverage_module: synnax
      directory: client/py
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'client-py') }}
      type_check_dir: ./synnax ./examples ./tests
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  client-py-lowest:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.client_py == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-py-lowest')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'client-py-lowest')
    uses: ./.github/workflows/test.py.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      directory: client/py
      lowest: true
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only),
        'client-py-lowest') }}
      type_check_dir: ./synnax ./examples ./tests
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  client-ts:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.client_ts == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'client-ts')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'client-ts')
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: client-ts
      directory: client/ts
      package: client
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  console:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.console == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'console')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'console')
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: console
      directory: console
      package: console
      shards: 3
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  copyright:
    uses: ./.github/workflows/test.copyright.yaml

  core:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'core')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'core')
    uses: ./.github/workflows/test.go.yaml
    with:
      cached: ${{ github.event_name == 'pull_request' }}
      changed: ${{ fromJSON(needs.changes.outputs.go_changes)['core'] }}
      coverage_flag: core
      directory: core
      macos: *full
      ref: ${{ github.event.pull_request.head.sha }}
      shards: 3
      test:
        ${{ inputs.full || !contains(fromJSON(needs.changes.outputs.lint_only), 'core')
        }}
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  core-image:
    needs: changes
    if:
      inputs.full || needs.changes.outputs.core_image == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'core-image')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: core
      repository: ghcr.io/synnaxlabs/synnax

  desktop-shell:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.console == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'desktop-shell')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'desktop-shell')
    # macOS compiles the Tauri shell with no extra system packages.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache-workspaces: console/src-tauri -> target
          cache-shared-key: ${{ runner.os }}-desktop-test
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-llvm-cov

      - name: Create an empty frontend
        # The Tauri context embeds the frontend directory, so it must exist.
        run: mkdir -p console/dist && touch console/dist/index.html

      - name: Test
        working-directory: console/src-tauri
        run: cargo llvm-cov --features desktop --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CURL_HOME: ${{ github.workspace }}/.github/codecov
        with:
          disable_search: true
          fail_ci_if_error: true
          files: console/src-tauri/lcov.info
          flags: desktop-shell
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.docs == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'docs')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'docs')
    uses: ./.github/workflows/test.ts.yaml
    with:
      browsers: true
      coverage_flag: docs
      directory: site/docs
      macos: *full
      package: docs
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  docs-site:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.docs == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'docs-site')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'docs-site')
    uses: ./.github/workflows/test.docs.yaml
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  drift:
    needs: changes
    if:
      inputs.full || (needs.changes.outputs.drift == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'drift')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'drift')
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: drift
      directory: drift
      macos: *full
      package: drift
      windows: *full
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  driver:
    needs: [changes, core-image]
    if:
      inputs.full || (needs.changes.outputs.driver == 'true' ||
      needs.changes.outputs.core == 'true' ||
      contains(fromJSON(needs.changes.outputs.ci), 'driver')) &&
      !contains(fromJSON(needs.changes.outputs.reused), 'driver')
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      clang_tidy: ${{ inputs.full || needs.changes.outputs.driver == 'true' }}
      core_image: ${{ needs.core-image.outputs.image }}
      directories: driver
      macos: *full
      rust: true
      targets: //driver/... //vendor/open62541:patch_test
      test_flags: --spawn_strategy=local --local_test_jobs=1
      test_tags: -hardware
      windows: *full
    secrets:
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  # The EtherCAT bus runs on its own thread, and a streamer can set its channels
  # while it reads, so their suites also run under TSan. The GCC TSan runtime on the
  # build bots aborts on the kernel's address randomization, so the tests run with it
