              - .github/workflows/ci.yaml
              - .github/workflows/test.client.yaml
              - MODULE.bazel
              - MODULE.bazel.lock
              - alamos/go/**
              - aspen/**
              - cesium/**
              - client/clib/**
              - client/cpp/**
              - core/**
              - freighter/cpp/**
              - freighter/go/**
              - scripts/check_clang_format.sh
              - scripts/sanitizers/**
              - x/cpp/**
              - x/go/**

