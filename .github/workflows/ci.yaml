# Gates every merge. The ruleset requires only the OK context, so every check a pull
# request or a merge group must pass runs from here.

name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      integration:
        description: Whether to run the merge-queue tier too
        required: false
        type: boolean
        default: false

# A new push to a pull request cancels the run it replaces. Merge groups never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One output per key in .github/filters.yaml, true when the pull request or merge
  # group touched one of its paths.
  changes:
    runs-on: ubuntu-latest
    outputs:
      alamos_go: ${{ steps.filter.outputs.alamos_go }}
      alamos_py: ${{ steps.filter.outputs.alamos_py }}
      alamos_ts: ${{ steps.filter.outputs.alamos_ts }}
      arc_cpp: ${{ steps.filter.outputs.arc_cpp }}
      arc_go: ${{ steps.filter.outputs.arc_go }}
      aspen: ${{ steps.filter.outputs.aspen }}
      buildifier: ${{ steps.filter.outputs.buildifier }}
      cesium: ${{ steps.filter.outputs.cesium }}
      client_cpp: ${{ steps.filter.outputs.client_cpp }}
      client_py: ${{ steps.filter.outputs.client_py }}
      client_ts: ${{ steps.filter.outputs.client_ts }}
      console: ${{ steps.filter.outputs.console }}
      console_build: ${{ steps.filter.outputs.console_build }}
      core: ${{ steps.filter.outputs.core }}
      core_build: ${{ steps.filter.outputs.core_build }}
      core_image: ${{ steps.filter.outputs.core_image }}
      docs: ${{ steps.filter.outputs.docs }}
      drift: ${{ steps.filter.outputs.drift }}
      driver: ${{ steps.filter.outputs.driver }}
      driver_build: ${{ steps.filter.outputs.driver_build }}
      freighter_cpp: ${{ steps.filter.outputs.freighter_cpp }}
      freighter_go: ${{ steps.filter.outputs.freighter_go }}
      freighter_image: ${{ steps.filter.outputs.freighter_image }}
      freighter_integration: ${{ steps.filter.outputs.freighter_integration }}
      freighter_py: ${{ steps.filter.outputs.freighter_py }}
      freighter_ts: ${{ steps.filter.outputs.freighter_ts }}
      integration: ${{ steps.filter.outputs.integration }}
      lint_integration: ${{ steps.filter.outputs.lint_integration }}
      media: ${{ steps.filter.outputs.media }}
      oracle: ${{ steps.filter.outputs.oracle }}
      oracle_check: ${{ steps.filter.outputs.oracle_check }}
      pluto: ${{ steps.filter.outputs.pluto }}
      protobuf: ${{ steps.filter.outputs.protobuf }}
      scripts: ${{ steps.filter.outputs.scripts }}
      soem: ${{ steps.filter.outputs.soem }}
      x_cpp: ${{ steps.filter.outputs.x_cpp }}
      x_go: ${{ steps.filter.outputs.x_go }}
      x_py: ${{ steps.filter.outputs.x_py }}
      x_ts: ${{ steps.filter.outputs.x_ts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

  alamos-go:
    needs: changes
    if: needs.changes.outputs.alamos_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: alamos-go
      directory: alamos/go
    secrets: inherit

  alamos-py:
    needs: changes
    if: needs.changes.outputs.alamos_py == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: alamos-py
      coverage_module: alamos
      directory: alamos/py
    secrets: inherit

  alamos-ts:
    needs: changes
    if: needs.changes.outputs.alamos_ts == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: alamos-ts
      directory: alamos/ts
      package: alamos
    secrets: inherit

  arc-cpp:
    needs: [changes, core-image]
    if: needs.changes.outputs.arc_cpp == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      directories: arc/cpp
      rust: true
      targets: //arc/cpp/...
      test_flags: --spawn_strategy=local --jobs=1
    secrets: inherit

  arc-go:
    needs: changes
    if: needs.changes.outputs.arc_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: arc-go
      directory: arc/go
      install_antlr4: true
    secrets: inherit

  aspen:
    needs: changes
    if: needs.changes.outputs.aspen == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: aspen
      directory: aspen
    secrets: inherit

  buildifier:
    needs: changes
    if: needs.changes.outputs.buildifier == 'true'
    uses: ./.github/workflows/lint.buildifier.yaml
    secrets: inherit

  cesium:
    needs: changes
    if: needs.changes.outputs.cesium == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: cesium
      directory: cesium
    secrets: inherit

  client-cpp:
    needs: [changes, core-image]
    if:
      needs.changes.outputs.client_cpp == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      directories: client/cpp client/clib
      targets: //client/cpp/... //client/clib/...
      test_flags: --nocache_test_results
    secrets: inherit

  client-py:
    needs: [changes, core-image]
    if:
      needs.changes.outputs.client_py == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      coverage_flag: client-py
      coverage_module: synnax
      directory: client/py
      type_check_dir: ./synnax
    secrets: inherit

  client-ts:
    needs: [changes, core-image]
    if:
      needs.changes.outputs.client_ts == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      coverage_flag: client-ts
      directory: client/ts
      package: client
    secrets: inherit

  console:
    needs: [changes, core-image]
    if: needs.changes.outputs.console == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      coverage_flag: console
      directory: console
      package: console
      test_args: -- --no-file-parallelism
    secrets: inherit

  copyright:
    uses: ./.github/workflows/test.copyright.yaml

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: core
      directory: core
    secrets: inherit

  core-image:
    needs: changes
    if: needs.changes.outputs.core_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: core
      tag: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
    secrets: inherit

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: docs
      directory: docs/site
      package: docs
    secrets: inherit

  docs-site:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/test.docs.yaml
    secrets: inherit

  drift:
    needs: changes
    if: needs.changes.outputs.drift == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: drift
      directory: drift
      package: drift
    secrets: inherit

  driver:
    needs: [changes, core-image]
    if: needs.changes.outputs.driver == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      directories: driver
      rust: true
      targets: //driver/...
      test_flags: --spawn_strategy=local --local_test_jobs=1
      test_tags: -hardware
    secrets: inherit

  format:
    uses: ./.github/workflows/test.format.yaml

  freighter-cpp:
    needs: changes
    if: needs.changes.outputs.freighter_cpp == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      directories: freighter/cpp
      targets: //freighter/cpp/...
    secrets: inherit

  freighter-go:
    needs: changes
    if: needs.changes.outputs.freighter_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: freighter-go
      directory: freighter/go
    secrets: inherit

  freighter-image:
    needs: changes
    if: needs.changes.outputs.freighter_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: freighter/integration
      tag: ghcr.io/synnaxlabs/freighter-go-integration:${{ github.sha }}
    secrets: inherit

  freighter-integration:
    needs: changes
    if: needs.changes.outputs.freighter_integration == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: freighter-integration
      directory: freighter/integration
    secrets: inherit

  freighter-py:
    needs: [changes, freighter-image]
    if:
      needs.changes.outputs.freighter_py == 'true' ||
      needs.changes.outputs.freighter_integration == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: freighter-py
      coverage_module: freighter
      directory: freighter/py
      freighter_image: ghcr.io/synnaxlabs/freighter-go-integration:${{ github.sha }}
    secrets: inherit

  freighter-ts:
    needs: [changes, freighter-image]
    if:
      needs.changes.outputs.freighter_ts == 'true' ||
      needs.changes.outputs.freighter_integration == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: freighter-ts
      directory: freighter/ts
      freighter_image: ghcr.io/synnaxlabs/freighter-go-integration:${{ github.sha }}
      package: freighter
    secrets: inherit

  integration:
    needs: changes
    if:
      (github.event_name == 'merge_group' || inputs.integration) &&
      needs.changes.outputs.integration == 'true'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/test.integration.yaml
    secrets: inherit

  lint-integration:
    needs: changes
    if: needs.changes.outputs.lint_integration == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      directory: integration
      test: false
    secrets: inherit

  media:
    needs: changes
    if: needs.changes.outputs.media == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      directory: x/media
      package: media
      test: false
    secrets: inherit

  oracle:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: oracle
      directory: oracle
      install_antlr4: true
    secrets: inherit

  oracle-check:
    needs: changes
    if: needs.changes.outputs.oracle_check == 'true'
    uses: ./.github/workflows/check.oracle.yaml
    secrets: inherit

  pluto:
    needs: [changes, core-image]
    if: needs.changes.outputs.pluto == 'true' || needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ghcr.io/synnaxlabs/synnax:${{ github.sha }}
      coverage_flag: pluto
      directory: pluto
      package: pluto
      test_args: -- --no-file-parallelism
    secrets: inherit

  protobuf:
    needs: changes
    if: needs.changes.outputs.protobuf == 'true'
    uses: ./.github/workflows/test.protobuf.yaml
    secrets: inherit

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    uses: ./.github/workflows/test.scripts.yaml
    secrets: inherit

  soem:
    needs: changes
    if: needs.changes.outputs.soem == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      macos: true
      sanitizers: false
      targets: //vendor/soem:all
      ubuntu: false
    secrets: inherit

  versions:
    uses: ./.github/workflows/test.updates.yaml

  x-cpp:
    needs: changes
    if: needs.changes.outputs.x_cpp == 'true'
    uses: ./.github/workflows/test.cpp.yaml
    with:
      directories: x/cpp
      targets: //x/cpp/...
    secrets: inherit

  x-go:
    needs: changes
    if: needs.changes.outputs.x_go == 'true'
    uses: ./.github/workflows/test.go.yaml
    with:
      coverage_flag: x-go
      directory: x/go
    secrets: inherit

  x-py:
    needs: changes
    if: needs.changes.outputs.x_py == 'true'
    uses: ./.github/workflows/test.py.yaml
    with:
      coverage_flag: x-py
      coverage_module: x
      directory: x/py
    secrets: inherit

  x-ts:
    needs: changes
    if: needs.changes.outputs.x_ts == 'true'
    uses: ./.github/workflows/test.ts.yaml
    with:
      coverage_flag: x-ts
      directory: x/ts
      knip: true
      package: x
    secrets: inherit

  # GitHub skips a job whose dependency failed or was skipped, so always() makes this
  # one run and report. A skipped job passed: the change map left it out on purpose.
  ok:
    name: OK
    if: always()
    needs:
      - alamos-go
      - alamos-py
      - alamos-ts
      - arc-cpp
      - arc-go
      - aspen
      - buildifier
      - cesium
      - client-cpp
      - client-py
      - client-ts
      - console
      - copyright
      - core
      - core-image
      - docs
      - docs-site
      - drift
      - driver
      - format
      - freighter-cpp
      - freighter-go
      - freighter-image
      - freighter-integration
      - freighter-py
      - freighter-ts
      - integration
      - lint-integration
      - media
      - oracle
      - oracle-check
      - pluto
      - protobuf
      - scripts
      - soem
      - versions
      - x-cpp
      - x-go
      - x-py
      - x-ts
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a failed or cancelled job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e '[.[].result] | all(. == "success" or . == "skipped")' \
            <<< "$RESULTS" > /dev/null
