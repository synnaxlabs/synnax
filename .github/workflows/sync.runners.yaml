name: Sync - Runner webhook ranges

on:
  schedule:
    - cron: "0 6 * * *" # 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: sync-runners

jobs:
  sync:
    name: Sync webhook ranges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::004704223095:role/github-runners-deploy
          aws-region: us-east-1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest-known

      - name: Sync
        working-directory: scripts/runners
        run: uv run --locked --no-dev hook_ranges.py
