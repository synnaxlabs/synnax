name: Check - Oracle

on:
  pull_request:
    paths:
      - .github/workflows/check.oracle.yaml
      - alamos/go/**
      - oracle/**
      - schemas/**
      - x/go/**
      - "**/*.gen.*"
      - "**/*.proto"
      - "**/pyproject.toml"
      - licenses/headers/**
      - .clang-format
      - .clang-format-ignore
      - .prettierignore
      - .prettierrc
      - scripts/install_clang_format.sh
      - buf.gen.yaml
      - buf.yaml
      - configs/eslint/**
      - eslint.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - uv.lock
  push:
    branches:
      - main
      - release/**
    paths:
      - .github/workflows/check.oracle.yaml
      - alamos/go/**
      - oracle/**
      - schemas/**
      - x/go/**
      - "**/*.gen.*"
      - "**/*.proto"
      - "**/pyproject.toml"
      - licenses/headers/**
      - .clang-format
      - .clang-format-ignore
      - .prettierignore
      - .prettierrc
      - scripts/install_clang_format.sh
      - buf.gen.yaml
      - buf.yaml
      - configs/eslint/**
      - eslint.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: oracle/go.mod
          cache-dependency-path: |
            oracle/go.mod
            oracle/go.sum

      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Install clang-format
        run: scripts/install_clang_format.sh

      - name: Install Python dependencies
        run: uv sync

      - name: Build Oracle
        working-directory: oracle
        run: go build -o ../oracle-bin .

      # The exit code names the gate that failed: 10 format, 11 analyze, 12 generated,
      # 13 orphans, 14 cache.
      - name: Run Oracle Check
        id: check
        run: ./oracle-bin check --diff

      - name: Generate JSON Report
        if: failure() && steps.check.conclusion == 'failure'
        run: ./oracle-bin check --format=json > oracle-check.json || true

      - name: Archive JSON Report
        if: failure() && steps.check.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: oracle-check-report
          path: oracle-check.json
          if-no-files-found: ignore
