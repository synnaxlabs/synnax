name: Check - Oracle

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: oracle/go.mod
          cache-dependency-path: |
            oracle/go.mod
            oracle/go.sum

      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true

      - name: Set up buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Install clang-format
        run: scripts/install_clang_format.sh

      - name: Install Python dependencies
        run: uv sync

      - name: Build Oracle
        working-directory: oracle
        run: go build -o ../oracle-bin .

      # The exit code names the gate that failed: 10 format, 11 analyze, 12 generated,
      # 13 orphans, 14 cache.
      - name: Run Oracle check
        id: check
        run: ./oracle-bin check --diff

      - name: Generate JSON report
        if: failure() && steps.check.conclusion == 'failure'
        run: ./oracle-bin check --format=json > oracle-check.json || true

      - name: Archive JSON report
        if: failure() && steps.check.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          path: oracle-check.json
          archive: false
          if-no-files-found: ignore
