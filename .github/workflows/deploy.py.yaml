name: Deploy - Python

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.py.yaml
      - alamos/py/**
      - x/py/**
      - freighter/py/**
      - client/py/**
      - pyproject.toml
      - uv.lock
      - uv.toml
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: client/py/pyproject.toml

      - name: Pin internal dependency constraints
        run: ./scripts/pin_internal_deps.sh

      - name: Build Alamos
        working-directory: alamos/py
        run: uv build

      - name: Build X
        working-directory: x/py
        run: uv build

      - name: Build Freighter
        working-directory: freighter/py
        run: uv build

      - name: Build Client
        working-directory: client/py
        run: uv build

      - name: Prune already-published distributions
        run: python scripts/prune_published.py

      - name: Publish
        run: |
          if compgen -G "dist/*.whl" > /dev/null || compgen -G "dist/*.tar.gz" > /dev/null; then
            uv publish --check-url https://pypi.org/simple/
          else
            echo "All distributions already published; nothing to upload."
          fi
