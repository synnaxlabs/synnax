name: Nightly

on:
  schedule:
    - cron: "0 4 * * *" # 4am UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    # A called workflow gets no more than its caller grants, and the fail-fast job in CI
    # asks for actions: write.
    permissions:
      actions: write
      contents: write
      packages: write
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
    secrets: inherit

  # The Driver jobs below test against a Core, and CI builds its image in a job they
  # cannot depend on. Both builds tag the image by its sources, so the second finds the
  # image the first pushed, or pushes the same one.
  core-image:
    name: Core image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.docker.yaml
    with:
      module: core
      repository: ghcr.io/synnaxlabs/synnax
    secrets: inherit

  # TSan cannot share the ASan build that CI runs, so it covers the bus code, which
  # moves data between threads, once a night.
  driver-tsan:
    name: Driver - TSan
    needs: core-image
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      capabilities_required: true
      core_image: ${{ needs.core-image.outputs.image }}
      rust: true
      sanitizer: thread
      targets: >-
        //driver/bus/... //driver/can/... //driver/codec/... //driver/serial/...
        //driver/tcp/... //driver/udp/...
      test_flags: --spawn_strategy=local --local_test_jobs=1
      test_tags: -hardware
      vcan: true
    secrets: inherit

  driver-coverage:
    name: Driver - Coverage
    needs: core-image
    uses: ./.github/workflows/test.cpp.yaml
    with:
      apt_packages: libsystemd-dev
      capabilities_required: true
      core_image: ${{ needs.core-image.outputs.image }}
      coverage_flag: driver
      rust: true
      sanitizer: none
      targets: //driver/...
      test_flags: --spawn_strategy=local --local_test_jobs=1
      test_tags: -hardware
      vcan: true
    secrets: inherit

  notify:
    name: Notify Slack
    needs: [ci, core-image, driver-coverage, driver-tsan]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post the failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "{\"text\": \"Nightly CI failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
