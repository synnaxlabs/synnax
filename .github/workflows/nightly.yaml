name: Nightly

on:
  schedule:
    - cron: "0 4 * * *" # 4am UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    # A called workflow gets no more than its caller grants. In CI, the fail-fast job
    # asks for actions: write and the paths filter for pull-requests: read.
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  notify:
    name: Notify Slack
    needs: ci
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post the failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "{\"text\": \"Nightly CI failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"

  triage-prompt:
    name: Write the triage prompt
    needs: ci
    if: failure() && vars.NIGHTLY_TRIAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prompt: ${{ steps.prompt.outputs.prompt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/agents

      - name: Write the prompt
        id: prompt
        env:
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          EOF=$(openssl rand -hex 16)
          {
            echo "prompt<<$EOF"
            cat .github/agents/nightly-triage.md
            printf '\nThe failed nightly run is %s.\n' "$RUN_URL"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

  triage:
    name: Triage
    needs: triage-prompt
    # The plain success() check would see the failed ci job and skip this one.
    if: always() && needs.triage-prompt.result == 'success'
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.yaml
    with:
      prompt: ${{ needs.triage-prompt.outputs.prompt }}
      agent: ${{ vars.AGENT_DEFAULT || 'claude' }}
      output: pr
      title: "[nightly] Fix the failure in run ${{ github.run_id }}"
      labels: review/bot
      timeout-minutes: 90
    secrets:
      CLAUDE_CODE_APP_ID: ${{ secrets.CLAUDE_CODE_APP_ID }}
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
