name: Nightly

on:
  schedule:
    - cron: "0 4 * * *" # 4am UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    # A called workflow gets no more than its caller grants. In CI, the fail-fast job
    # asks for actions: write and the paths filter for pull-requests: read.
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # Not in PR CI, so a date change never fails every open PR.
  typescript-window:
    name: Check the TypeScript support window
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts

      - name: Check the oldest supported TypeScript
        run: scripts/check_declarations_ts.sh --window

  # Outside CI, so a new Deno or Bun release fails neither PRs nor a Release that reuses
  # this run.
  latest-runtimes:
    name: Smoke-test the client on the latest Deno and Bun
    needs: ci
    if: ${{ !cancelled() && needs.ci.outputs.core_image != '' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test.ts.yaml
    with:
      core_image: ${{ needs.ci.outputs.core_image }}
      directory: client/ts
      latest_runtimes: true
      lint: false
      package: client
      runtimes: true
      test: false
    secrets:
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # Only this run saves the Go caches of most modules, and a failed run saves some.
  prune:
    name: Prune older caches
    needs: ci
    if: ${{ !cancelled() }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune.caches.yaml

  triage-prompt:
    name: Write the triage prompt
    needs: ci
    if: failure() && vars.NIGHTLY_TRIAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prompt: ${{ steps.prompt.outputs.prompt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/agents

      - name: Write the prompt
        id: prompt
        env:
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          EOF=$(openssl rand -hex 16)
          {
            echo "prompt<<$EOF"
            cat .github/agents/nightly-triage.md
            printf '\nThe failed nightly run is %s.\n' "$RUN_URL"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

  triage:
    name: Triage
    needs: triage-prompt
    # The plain success() check would see the failed ci job and skip this one.
    if: always() && needs.triage-prompt.result == 'success'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent.yaml
    with:
      prompt: ${{ needs.triage-prompt.outputs.prompt }}
      agent: ${{ vars.AGENT_DEFAULT || 'claude' }}
      output: pr
      title: "[nightly] Fix the failure in run ${{ github.run_id }}"
      labels: review/bot
      timeout-minutes: 90
    secrets:
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  triage-report:
    name: Post the triage
    needs: triage
    if: always() && needs.triage.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post the triage to Slack
        env:
          PR_URL: ${{ needs.triage.outputs.pr-url }}
          RESULT: ${{ needs.triage.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
        run: |
          if [ -n "$PR_URL" ]; then
            REPORT="Opened <$PR_URL|a fix> for the failed run."
          else
            REPORT="Opened no fix ($RESULT)."
          fi
          printf '*Nightly triage*\n%s\n<%s|Run>\n' "$REPORT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" |
            jq --raw-input --slurp '{text: .}' |
            curl --fail --silent --show-error \
              --header "Content-Type: application/json" \
              --data @- "$SLACK_WEBHOOK_URL"

  relay-failure:
    name: Relay the failure
    needs:
      - ci
      - typescript-window
      - latest-runtimes
      - prune
      - triage-prompt
      - triage
      - triage-report
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      actions: write
    uses: ./.github/workflows/relay.failure.yaml
    with:
      requeue: true
      report: true
