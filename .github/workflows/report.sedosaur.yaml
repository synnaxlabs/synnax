# Compares the Sedosaur reviews of the trial with Greptile's reviews of the same commits,
# and writes the report to the run's summary. It covers the whole trial each day, so a
# finding's verdict updates as its thread is fixed, declined, or voted on.

name: Report - Sedosaur

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of reviews to compare"
        type: number
        default: 30

permissions: {}

jobs:
  report:
    name: Compare the reviews
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the reviews
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || 30 }}
        run: python3 -m review compare "$DAYS" >> "$GITHUB_STEP_SUMMARY"
