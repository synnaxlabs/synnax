# Compares the Sedosaur reviews of the trial with Greptile's reviews of the same
# commits, and writes the report to the run's summary. It covers the whole trial each
# day, so a finding's verdict updates as its thread is fixed, declined, or voted on.

name: Report - Sedosaur

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of reviews to compare"
        type: number
        default: 30

permissions: {}

jobs:
  report:
    name: Compare the reviews
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # The verdicts read the commits of each pull request, never their file contents.
      - name: Check out the scripts and the history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # A record never changes, so each run downloads only the records that are new.
      - name: Restore the records
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/records
          key: sedosaur-records-${{ github.run_id }}
          restore-keys: sedosaur-records-

      - name: Compare the reviews
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || 30 }}
          RECORDS: ${{ runner.temp }}/records
        run: |
          mkdir -p "$RECORDS"
          python3 -m review compare "$DAYS" "$RECORDS" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the records
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/records
          key: sedosaur-records-${{ github.run_id }}
