# Deploys a Vercel preview of a site for a pull request with its preview label. Vercel
# builds the source with the project's preview environment, so a preview runs the same
# build command as production.

name: Preview - Site

on:
  workflow_call:
    inputs:
      label:
        description: The label that turns the preview on
        required: true
        type: string
      project:
        description: The ID of the Vercel project
        required: true
        type: string
      title:
        description: The name of the site in the pull request comment
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, inputs.label) &&
      (github.event.action != 'labeled' || github.event.label.name == inputs.label)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # A new push cancels the run it replaces. Any other label gets a group of its own,
    # so it skips without cancelling a deploy.
    concurrency:
      group:
        ${{ inputs.label }}-${{ github.event.pull_request.number }}${{
        github.event.action == 'labeled' && github.event.label.name != inputs.label &&
        format('-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The CLI joins the project's root directory to --cwd, so it uploads the
      # repository root. It runs outside the repository: npm rejects the repository's
      # devEngines.
      - name: Deploy the preview
        id: deploy
        working-directory: ${{ runner.temp }}
        env:
          VERCEL_ORG_ID: team_Ct3QPGNmHHaqBqa5BBIAv2x9
          VERCEL_PROJECT_ID: ${{ inputs.project }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is not set"; exit 1; }
          set -o pipefail
          log=$(mktemp)
          deployment=$(mktemp)
          for attempt in 1 2 3; do
            if npx --yes vercel@63.1.2 deploy --cwd "$GITHUB_WORKSPACE" \
              --archive=tgz --format=json 2>&1 > "$deployment" | tee "$log" >&2; then
              url=$(jq -er '.deployment.url // .url' "$deployment")
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A build failure repeats, so only a dropped connection gets a retry.
            grep -q "fetch failed" "$log" || exit 1
            echo "Deploy attempt $attempt lost its connection"
            sleep 10
          done
          exit 1

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ inputs.label }}
          message: |
            ### ${{ inputs.title }} preview

            ${{ steps.deploy.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}. Each push while
            the `${{ inputs.label }}` label stays deploys a new preview.
