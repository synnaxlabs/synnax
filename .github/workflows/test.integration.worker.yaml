name: Integration test run

on:
  workflow_call:
    inputs:
      test_matrix:
        description: "JSON test matrix (e.g., from validate_test_coverage.sh)"
        type: string
        required: true
      ref_run_id:
        description: "Reference run ID for downloading build artifacts"
        type: string
        required: true
      os:
        description: "Tester runner label ('ubuntu-tester' or 'windows-tester')"
        type: string
        required: true
      flags:
        description: "Additional flags to pass to test-conductor"
        type: string
        required: false
        default: ""

jobs:
  run:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on:
      - self-hosted
      - ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Force quit existing Synnax processes (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: integration/scripts/KillSynnaxProcesses.cmd

      - name: Force quit existing Synnax processes (Ubuntu)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: integration/scripts/kill_synnax_processes.sh

      - name: Download and setup artifacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ inputs.ref_run_id }}
        run: integration/scripts/DownloadArtifacts.cmd

      - name: Download and setup artifacts (Ubuntu)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ inputs.ref_run_id }}
        run: integration/scripts/download_artifacts.sh

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known

      - name: Install Playwright
        working-directory: integration
        run: uv run playwright install --with-deps

      - name: Start Core (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_KEY }}
        run: integration/scripts/StartCore.ps1

      - name: Start Core (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_KEY }}
        run: integration/scripts/start_core.sh

      - name: Test conductor (Windows)
        if: runner.os == 'Windows'
        id: test-conductor-win
        timeout-minutes: 30
        shell: cmd
        working-directory: integration
        env:
          PYTHONIOENCODING: utf-8
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
        run: >-
          uv run test-conductor --name tc_win ${{ matrix.target || inputs.flags }}

      - name: Test conductor (Ubuntu)
        if: runner.os == 'Linux'
        id: test-conductor-unix
        timeout-minutes: 30
        working-directory: integration
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
        run: >-
          uv run test-conductor --name tc_unix ${{ matrix.target || inputs.flags }}

      # The conductor writes a per-run bundle to integration/tests/results/run-*/
      # containing summary.json, server.log, and per-test subdirs (trace.zip,
      # sliced server.log, screenshots, exports). Uploading the bundle is the
      # single artifact CI and local devs share for debugging.
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ inputs.os }}-${{ matrix.name }}
          path: integration/tests/results/*
          retention-days: 7
