name: Integration test run

on:
  workflow_call:
    inputs:
      test_matrix:
        description: "JSON test matrix (e.g., from integration/jobs.py)"
        type: string
        required: true
      ref_run_id:
        description: "Reference run ID for downloading build artifacts"
        type: string
        required: true
      os:
        description: "Runner label ('ubuntu-test-bot' or 'windows-test-bot')"
        type: string
        required: true
      flags:
        description: "Additional flags to pass to test-conductor"
        type: string
        required: false
        default: ""

jobs:
  run:
    name: ${{ matrix.title || matrix.name }}
    timeout-minutes: 30
    runs-on:
      - self-hosted
      - ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Force quit existing Synnax processes (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: integration/scripts/KillSynnaxProcesses.cmd

      - name: Force quit existing Synnax processes (Ubuntu)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: integration/scripts/kill_synnax_processes.sh

      - name: Download and setup artifacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ inputs.ref_run_id }}
        run: integration/scripts/DownloadArtifacts.cmd

      - name: Download and setup artifacts (Ubuntu)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ inputs.ref_run_id }}
        run: integration/scripts/download_artifacts.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known

      - name: Install Playwright
        working-directory: integration
        run: uv run playwright install --with-deps

      - name: Start resource sampler (Windows)
        id: sampler-win
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: integration
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\resources.stop"
          Start-Process -FilePath uv -WindowStyle Hidden -WorkingDirectory . `
            -ArgumentList 'run', 'python', '../.github/scripts/sample_resources.py', `
            'sample', "$env:RUNNER_TEMP\resources.csv"

      - name: Start resource sampler (Ubuntu)
        id: sampler-unix
        if: runner.os == 'Linux'
        working-directory: integration
        run: |
          rm -f "$RUNNER_TEMP/resources.stop"
          nohup uv run python ../.github/scripts/sample_resources.py sample \
            "$RUNNER_TEMP/resources.csv" > /dev/null 2>&1 &

      # Starts the Cores and runs the tests: a job of integration/jobs.py, or the custom
      # target in flags on one Core. The target stays out of the command because the
      # step holds the license key.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: cmd
        working-directory: integration
        env:
          PYTHONIOENCODING: utf-8
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
          TEST_TARGET: ${{ inputs.flags }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
        run: uv run test-split --name tc_win ${{ !inputs.flags && matrix.name || '' }}

      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        working-directory: integration
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
          TEST_TARGET: ${{ inputs.flags }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
        run: uv run test-split --name tc_unix ${{ !inputs.flags && matrix.name || '' }}

      # A failed measurement must not fail the tests it measured.
      - name: Report resource use
        continue-on-error: true
        if:
          always() && (steps.sampler-win.outcome == 'success' ||
          steps.sampler-unix.outcome == 'success')
        working-directory: integration
        run: >-
          uv run python ../.github/scripts/sample_resources.py report ${{ runner.temp
          }}/resources.csv

      # The conductor writes a per-run bundle to integration/tests/results/run-*/
      # containing summary.json, server.log, and per-test subdirs (trace.zip,
      # sliced server.log, screenshots, exports). Uploading the bundle is the
      # single artifact CI and local devs share for debugging.
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ inputs.os }}-${{ matrix.name }}
          path: integration/tests/results/*
          retention-days: 7
