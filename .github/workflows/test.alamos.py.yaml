name: Test - Alamos (Python)

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to test on
        required: false
        type: string
        default: '["ubuntu-latest"]'
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels to test on
        required: false
        type: string
        default: '["ubuntu-latest"]'
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        include:
          - os: ubuntu-latest
            format: true
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Python
        uses: ./.github/actions/test-python
        with:
          directory: alamos/py
          coverage: true
          coverage_module: alamos
          coverage_flag: alamos-py
          format_check: ${{ matrix.format }}
