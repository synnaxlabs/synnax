name: Test - Alamos (Python)

on:
  workflow_call:
    inputs: &inputs
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs: *inputs
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        exclude:
          - os: ${{ !inputs.macos && 'macos-latest' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-latest' }}
          - os: ${{ !inputs.windows && 'windows-latest' }}
        include:
          - os: ubuntu-latest
            format: true
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Python
        uses: ./.github/actions/test-python
        with:
          directory: alamos/py
          coverage: true
          coverage_module: alamos
          coverage_flag: alamos-py
          format_check: ${{ matrix.format }}
