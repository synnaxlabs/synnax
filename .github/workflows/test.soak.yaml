name: Test - Soak

# Runs integration/tests/driver/bus_soak.py for three hours. It runs in its own run after
# the nightly CI, so it reuses the Ubuntu build of that run when it can.
on:
  schedule:
    - cron: "0 7 * * *" # 7am UTC
  workflow_dispatch:

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      SKIP_BUILD: ${{ steps.check-cache.outputs.SKIP_BUILD }}
      REF_RUN_ID: ${{ steps.check-cache.outputs.REF_RUN_ID }}
      DRIVER_REF_RUN_ID: ${{ steps.check-cache.outputs.DRIVER_REF_RUN_ID }}
      CONSOLE_REF_RUN_ID: ${{ steps.check-cache.outputs.CONSOLE_REF_RUN_ID }}
      CORE_REF_RUN_ID: ${{ steps.check-cache.outputs.CORE_REF_RUN_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for cached artifacts
        id: check-cache
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/check_artifact_cache.sh linux

  # The flags match the integration build, so either run can reuse the other's build.
  build:
    needs: setup
    if: needs.setup.outputs.SKIP_BUILD == 'false'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/build.synnax.yaml
    with:
      windows: false
      ubuntu: true
      docker: false
      driver: true
      console: true
      core: true
      use_simple_artifact_names: true
      driver_ref_run_id: ${{ needs.setup.outputs.DRIVER_REF_RUN_ID }}
      console_ref_run_id: ${{ needs.setup.outputs.CONSOLE_REF_RUN_ID }}
      core_ref_run_id: ${{ needs.setup.outputs.CORE_REF_RUN_ID }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  soak:
    name: Soak
    needs: [setup, build]
    if:
      ${{ !cancelled() && needs.setup.result == 'success' && (needs.build.result ==
      'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/test.integration.worker.yaml
    with:
      test_matrix: '{"include":[{"name":"soak","target":"soak"}]}'
      ref_run_id: ${{ needs.setup.outputs.REF_RUN_ID }}
      os: ubuntu-test-bot
      # Three hours of soak, plus setup and the final report.
      timeout_minutes: 210
    secrets:
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  notify:
    name: Notify Slack
    needs: [setup, build, soak]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post the failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "{\"text\": \"Nightly soak failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
