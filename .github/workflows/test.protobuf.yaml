name: Test - Protobuf

on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Buf CI
        uses: bufbuild/buf-action@v1
        with:
          breaking: false
          pr_comment: false
