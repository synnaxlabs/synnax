# Deploys a live Core with the Console embedded for each pull request with the preview
# label, again on each push while the label stays, and removes it when the pull request
# closes. The host is in deploy/preview. Fork pull requests never deploy: their code
# must not reach the AWS role. Nothing runs until the PREVIEW_* variables exist.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

# A new push or the close cancels the run it replaces. A removed label, or an added one
# other than preview, gets a group of its own, so it never cancels a deploy or a
# teardown.
concurrency:
  group:
    preview-${{ github.event.pull_request.number }}${{ (github.event.action ==
    'unlabeled' || (github.event.action == 'labeled' && github.event.label.name !=
    'preview')) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

env:
  PR: ${{ github.event.pull_request.number }}
  URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}

jobs:
  deploy:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_INSTANCE_ID != '' && github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Build the Console
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm build:console-vite
          cp -r console/dist/* core/pkg/console/dist/

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.PREVIEW_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Tag the image
        id: tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "image=$REGISTRY/synnax-preview:pr-$PR-$SHA" >> "$GITHUB_OUTPUT"
          echo "go=$(awk '$1 == "go" { print $2 }' core/go.mod)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=synnax-docker-core
          build-args: |
            GO_VERSION=${{ steps.tag.outputs.go }}
            CONSOLE_ENABLED=true
            GIT_COMMIT=${{ github.event.pull_request.head.sha }}

      - name: Read the review mark
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mark=$(.github/scripts/review_mark.sh)
          echo "mark=$mark" >> "$GITHUB_OUTPUT"

      - name: Deploy the preview
        id: deploy
        shell: bash
        env:
          # A preview waiting on a human review is evicted after the others.
          COMMAND: >-
            /usr/local/bin/preview up ${{ env.PR }} ${{ steps.tag.outputs.image }} ${{
            steps.mark.outputs.mark }}
          INSTANCE: ${{ vars.PREVIEW_INSTANCE_ID }}
        # Records the removed previews even when the deploy fails after removing them.
        run: |
          status=0
          .github/scripts/run_preview_command.sh | tee deploy.log || status=$?
          evicted=$(sed -n 's/^evicted \([0-9]*\) /\1@/p' deploy.log | xargs)
          echo "evicted=$evicted" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The host runs a fixed number of previews, so a deploy can remove the oldest.
      - name: Note the removed previews
        if: ${{ !cancelled() && steps.deploy.outputs.evicted != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVICTED: ${{ steps.deploy.outputs.evicted }}
        # Each entry is <pr>@<eviction time>. A comment updated after the eviction is
        # from a newer deploy of that preview, so the notice leaves it.
        run: |
          marker="<!-- Sticky Pull Request Commentpreview -->"
          issues="repos/$GITHUB_REPOSITORY/issues"
          for entry in $EVICTED; do
            pr=${entry%@*}
            evicted=${entry#*@}
            checks="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr/checks"
            body=$(printf '%s\n\n%s\n%s\n%s\n%s' "### Preview" \
              "Evicted to make room for the preview of #$PR, so the link no longer" \
              "works. To bring it back, re-run the **Preview** workflow from the" \
              "[checks]($checks), or push a commit." "$marker")
            comment=$(gh api --paginate "$issues/$pr/comments" --jq \
              ".[] | select(.body | contains(\"$marker\")) | \"\(.id) \(.updated_at)\"")
            read -r id updated <<< "$comment"
            if [[ -n $id && $updated < $evicted ]]; then
              gh api -X PATCH "$issues/comments/$id" -f body="$body"
            fi
          done

      # Caddy gets the certificate for a new preview name on its first request, so the
      # URL can fail TLS for a short time after the deploy.
      - name: Wait for the preview
        run: |
          deadline=$((SECONDS + 180))
          delay=2
          until curl -fsS -o /dev/null --max-time 10 -X POST \
            -H "Content-Type: application/json" -d '{}' \
            "$URL/api/v1/connectivity/check"; do
            if ((SECONDS + delay > deadline)); then
              echo "::error::$URL did not answer over HTTPS within 3 minutes."
              exit 1
            fi
            sleep "$delay"
            delay=$((delay * 2 > 30 ? 30 : delay * 2))
          done

      - name: Create the sample project
        run: node console/scripts/create_sample.ts "$URL"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### Preview

            Core and Console: ${{ env.URL }}

            Log in with username `synnax` and password `seldon`. The preview is a
            throwaway Core with in-memory storage, and a push rebuilds it from empty.
            It has no Driver, so it has no hardware tasks. Open the sample project
            for a simulated tank pressurization.

            Built from ${{ github.event.pull_request.head.sha }}.

  # Eviction keeps previews waiting on a human review, so the host learns when the
  # review/human label changes without a redeploy.
  mark:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_INSTANCE_ID != '' && github.event.label.name == 'review/human' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.PREVIEW_REGION }}

      - name: Read the review mark
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mark=$(.github/scripts/review_mark.sh)
          echo "mark=$mark" >> "$GITHUB_OUTPUT"

      - name: Mark the preview
        env:
          COMMAND: >-
            /usr/local/bin/preview mark ${{ env.PR }} ${{ steps.mark.outputs.mark }}
          INSTANCE: ${{ vars.PREVIEW_INSTANCE_ID }}
        run: .github/scripts/run_preview_command.sh

  teardown:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_INSTANCE_ID != '' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.PREVIEW_REGION }}

      - name: Remove the preview
        env:
          COMMAND: /usr/local/bin/preview down ${{ env.PR }}
          INSTANCE: ${{ vars.PREVIEW_INSTANCE_ID }}
        run: .github/scripts/run_preview_command.sh

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          only_update: true
          message: |
            ### Preview

            Removed when the pull request closed.
