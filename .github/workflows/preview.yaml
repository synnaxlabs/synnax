# Deploys a live Core with the Console embedded for each pull request that changes the
# Core or the Console, or has the preview label, and removes it when the pull request
# closes. The host is in deploy/preview. Fork pull requests never deploy: their code
# must not reach the AWS role. Nothing runs until the PREVIEW_* variables exist.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]

# A new push or the close cancels the run it replaces. Any other label gets a group of
# its own, so it skips without cancelling a deploy or a teardown.
concurrency:
  group:
    preview-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled'
    && github.event.label.name != 'preview' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

env:
  PR: ${{ github.event.pull_request.number }}
  URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}

jobs:
  changes:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_INSTANCE_ID != '' && github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed:
        ${{ steps.filter.outputs.core_build == 'true' ||
        steps.filter.outputs.console_build == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

  deploy:
    needs: changes
    if:
      needs.changes.outputs.changed == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Build the Console
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm build:console-vite
          cp -r console/dist/* core/pkg/console/dist/

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.PREVIEW_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Tag the image
        id: tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "image=$REGISTRY/synnax-preview:pr-$PR-$SHA" >> "$GITHUB_OUTPUT"
          echo "go=$(awk '$1 == "go" { print $2 }' core/go.mod)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=synnax-docker-core
          build-args: |
            GO_VERSION=${{ steps.tag.outputs.go }}
            CONSOLE_ENABLED=true
            GIT_COMMIT=${{ github.event.pull_request.head.sha }}

      - name: Deploy the preview
        env:
          COMMAND: >-
            /usr/local/bin/preview up ${{ env.PR }} ${{ steps.tag.outputs.image }}
          INSTANCE: ${{ vars.PREVIEW_INSTANCE_ID }}
        run: .github/scripts/run_preview_command.sh

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### Preview

            Core and Console: ${{ env.URL }}

            Log in with username `synnax` and password `seldon`. The preview is a
            throwaway Core with in-memory storage, and a push rebuilds it from empty.
            It has no Driver, so it has no hardware tasks.

            Built from ${{ github.event.pull_request.head.sha }}.

  teardown:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_INSTANCE_ID != '' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.PREVIEW_REGION }}

      - name: Remove the preview
        env:
          COMMAND: /usr/local/bin/preview down ${{ env.PR }}
          INSTANCE: ${{ vars.PREVIEW_INSTANCE_ID }}
        run: .github/scripts/run_preview_command.sh

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          only_update: true
          message: |
            ### Preview

            Removed when the pull request closed.
