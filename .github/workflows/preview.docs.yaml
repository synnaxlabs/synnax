# Deploys a Vercel preview of the docs for each pull request with the preview/docs
# label, and again on each push while the label stays. Fork pull requests never deploy:
# their code must not reach the Vercel token.

name: Preview - Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A new push cancels the run it replaces. Any other label gets a group of its own, so
# it skips without cancelling a deploy.
concurrency:
  group:
    preview-docs-${{ github.event.pull_request.number }}${{ github.event.action ==
    'labeled' && github.event.label.name != 'preview/docs' && format('-{0}',
    github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview/docs') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview/docs')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm build:docs

      - name: Deploy the preview
        id: deploy
        working-directory: site/docs
        env:
          VERCEL_ORG_ID: team_Ct3QPGNmHHaqBqa5BBIAv2x9
          VERCEL_PROJECT_ID: prj_G9x2ZoIrsFQym5DqbqZIM8jUsSer
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is not set"; exit 1; }
          deployment=$(npx --yes vercel@63.1.2 deploy --prebuilt --archive=tgz \
            --format=json)
          url=$(jq -er '.deployment.url // .url' <<< "$deployment")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-docs
          message: |
            ### Docs preview

            ${{ steps.deploy.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}. Each push while
            the `preview/docs` label stays deploys a new preview.
