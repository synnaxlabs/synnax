name: Test - Freighter (Python & TypeScript)

on:
  workflow_call:
    inputs:
      image:
        description: Freighter integration server image tag to test against
        required: true
        type: string
      py:
        description: Whether to run the Python tests
        required: false
        type: boolean
        default: false
      ts:
        description: Whether to run the TypeScript tests
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image:
        description: Freighter integration server image tag to test against
        required: true
        type: string
      py:
        description: Whether to run the Python tests
        required: false
        type: boolean
        default: false
      ts:
        description: Whether to run the TypeScript tests
        required: false
        type: boolean
        default: false
jobs:
  py:
    name: Test - Python
    if: inputs.py
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      integration:
        image: ${{ inputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Python
        uses: ./.github/actions/test-python
        with:
          directory: freighter/py
          coverage: true
          coverage_module: freighter
          coverage_flag: freighter-py

  ts:
    name: Test - TypeScript
    if: inputs.ts
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      integration:
        image: ${{ inputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test TypeScript
        uses: ./.github/actions/test-typescript
        with:
          package: freighter
          coverage_flag: freighter-ts
          directory: freighter/ts
