name: Release

run-name:
  ${{ format('Release{0}{1}{2}{3}{4}{5} from {6}', inputs.console && ' Console' || '',
  inputs.driver && ' Driver' || '', inputs.core && ' Core' || '', inputs.typescript && '
  TypeScript' || '', inputs.python && ' Python' || '', inputs.prerelease && ' candidate'
  || '', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      console:
        description: Release the Console
        type: boolean
        default: true
      driver:
        description: Release the Driver
        type: boolean
        default: true
      core:
        description: Release the Core
        type: boolean
        default: true
      typescript:
        description: Publish the npm packages (from main, only with the Core)
        type: boolean
        default: true
      python:
        description: Publish the PyPI packages (from main, only with the Core)
        type: boolean
        default: true
      prerelease:
        description: Tag release candidates (-rc.N)
        type: boolean
        default: false
      migration_audit:
        description: Run the migration audit before any publish
        type: boolean
        default: true
      console_version:
        description:
          "Console release the Core embeds (default: this run's, else the newest on the
          minor)"
        type: string
        default: ""
      driver_version:
        description:
          "Driver release the Core embeds (default: this run's, else the newest on the
          minor)"
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

# The drafts and the builds start at dispatch. The Core build reads the Console and the
# Driver from the drafts of the run. One publish job follows CI, the migration audit,
# and every build, so a run that fails any of them leaves only drafts, and the next run
# clears them. An `if` with `!cancelled()` drops the implicit success check, so each job
# states the results it needs. The packages, the image, and the docs follow the publish.
jobs:
  ci:
    name: CI
    # A called workflow gets no more than its caller grants. In CI, the fail-fast job
    # asks for actions: write and the paths filter for pull-requests: read.
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # A stored shape that changed without a migration stops every publish of the run.
  migration-audit:
    name: Migration audit
    permissions:
      actions: read
      contents: read
      id-token: write
    if: inputs.migration_audit
    uses: ./.github/workflows/audit.migration.yaml
    secrets:
      CLAUDE_CODE_APP_ID: ${{ secrets.CLAUDE_CODE_APP_ID }}
      CLAUDE_CODE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
      SYNNAX_LICENSE_TOKEN: ${{ secrets.SYNNAX_LICENSE_TOKEN }}

  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      console_version: ${{ steps.console.outputs.version }}
      console_tag: ${{ steps.console.outputs.tag }}
      console_previous_tag: ${{ steps.console.outputs.previous_tag }}
      driver_version: ${{ steps.driver.outputs.version }}
      driver_tag: ${{ steps.driver.outputs.tag }}
      driver_previous_tag: ${{ steps.driver.outputs.previous_tag }}
      core_version: ${{ steps.core.outputs.version }}
      core_tag: ${{ steps.core.outputs.tag }}
      core_previous_tag: ${{ steps.core.outputs.previous_tag }}
      core_latest: ${{ steps.core.outputs.latest }}
      train:
        ${{ steps.core.outputs.minor || steps.console.outputs.minor ||
        steps.driver.outputs.minor }}
      ts_version: ${{ steps.ts.outputs.version }}
      ts_tag: ${{ steps.ts.outputs.tag }}
      ts_minor: ${{ steps.ts.outputs.minor }}
      ts_latest: ${{ steps.ts.outputs.latest }}
      py_version: ${{ steps.py.outputs.version }}
      py_tag: ${{ steps.py.outputs.tag }}
      core_console_version: ${{ steps.embed.outputs.console_version }}
      core_driver_version: ${{ steps.embed.outputs.driver_version }}
    steps:
      - name: Require a product
        if: >-
          !inputs.console && !inputs.driver && !inputs.core && (inputs.prerelease ||
          !inputs.typescript && !inputs.python)
        run: |
          echo "no product selected; a candidate run never publishes packages" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve Console version
        id: console
        if: inputs.console
        uses: ./.github/actions/resolve-version
        with:
          product: console
          prerelease: ${{ inputs.prerelease }}
          ref: ${{ github.ref_name }}

      - name: Resolve Driver version
        id: driver
        if: inputs.driver
        uses: ./.github/actions/resolve-version
        with:
          product: driver
          prerelease: ${{ inputs.prerelease }}
          ref: ${{ github.ref_name }}

      - name: Resolve Core version
        id: core
        if: inputs.core
        uses: ./.github/actions/resolve-version
        with:
          product: core
          prerelease: ${{ inputs.prerelease }}
          ref: ${{ github.ref_name }}

      - name: Resolve TypeScript version
        id: ts
        if: inputs.typescript && !inputs.prerelease
        uses: ./.github/actions/resolve-version
        with:
          product: ts
          ref: ${{ github.ref_name }}
          core: ${{ steps.core.outputs.version }}

      - name: Resolve Python version
        id: py
        if: inputs.python && !inputs.prerelease
        uses: ./.github/actions/resolve-version
        with:
          product: py
          ref: ${{ github.ref_name }}
          core: ${{ steps.core.outputs.version }}

      # The train rule: the Core embeds only releases on its own minor. Default to the
      # product this run releases, else the newest on the minor. A release from another
      # run must have its tag, since a draft that a failed run left has none.
      - name: Resolve embedded versions
        id: embed
        if: inputs.core
        env:
          MINOR: ${{ steps.core.outputs.minor }}
          PRERELEASE: ${{ inputs.prerelease }}
          CONSOLE: ${{ inputs.console_version || steps.console.outputs.version }}
          DRIVER: ${{ inputs.driver_version || steps.driver.outputs.version }}
          RUN_CONSOLE: ${{ steps.console.outputs.version }}
          RUN_DRIVER: ${{ steps.driver.outputs.version }}
        run: |
          latest() { .github/scripts/latest_version.sh "$1" "$MINOR" "$PRERELEASE"; }
          CONSOLE=${CONSOLE:-$(latest console)}
          DRIVER=${DRIVER:-$(latest driver)}
          for row in "console $CONSOLE $RUN_CONSOLE" "driver $DRIVER $RUN_DRIVER"; do
            read -r product version run <<< "$row"
            if [ -z "$version" ]; then
              echo "no $product release exists on train $MINOR" >&2
              exit 1
            fi
            case "$version" in
              "$MINOR".*) ;;
              *)
                echo "train rule: $product $version is not on train $MINOR" >&2
                exit 1
                ;;
            esac
            tag="refs/tags/$product/v$version"
            published() { git rev-parse -q --verify "$tag" > /dev/null; }
            if [ "$version" != "$run" ] && ! published; then
              echo "$product $version is not published" >&2
              exit 1
            fi
            echo "${product}_version=$version" >> "$GITHUB_OUTPUT"
          done

  draft-console:
    name: Draft Console
    needs: resolve
    if: inputs.console
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          tag: ${{ needs.resolve.outputs.console_tag }}
          title: Console v${{ needs.resolve.outputs.console_version }}
          previous_tag: ${{ needs.resolve.outputs.console_previous_tag }}
          config: .github/release/console.yml
          prerelease: ${{ inputs.prerelease }}

  build-console:
    name: Build Console
    needs: [resolve, draft-console]
    if: ${{ !cancelled() && needs.draft-console.result == 'success' }}
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: true
      ubuntu: true
      console: true
      console_tauri: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ needs.resolve.outputs.console_version }}
      release_tag: ${{ needs.resolve.outputs.console_tag }}
      updater_channel: ${{ inputs.prerelease && 'next' || 'stable' }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # The Core embeds the manifest with the other Console update files, so it goes into
  # the draft before the Core builds. Its links work when the release is public.
  manifest-console:
    name: Write Console updater manifest
    needs: [resolve, build-console]
    if: ${{ !cancelled() && needs.build-console.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write updater manifest
        uses: ./.github/actions/publish-updater-manifest
        with:
          tag: ${{ needs.resolve.outputs.console_tag }}
          version: ${{ needs.resolve.outputs.console_version }}
          app: Synnax

  draft-driver:
    name: Draft Driver
    needs: resolve
    if: inputs.driver
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          tag: ${{ needs.resolve.outputs.driver_tag }}
          title: Driver v${{ needs.resolve.outputs.driver_version }}
          previous_tag: ${{ needs.resolve.outputs.driver_previous_tag }}
          config: .github/release/driver.yml
          prerelease: ${{ inputs.prerelease }}

  build-driver:
    name: Build Driver
    needs: [resolve, draft-driver]
    if: ${{ !cancelled() && needs.draft-driver.result == 'success' }}
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: true
      ubuntu: true
      driver: true
      nilinuxrt: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ needs.resolve.outputs.driver_version }}
      release_tag: ${{ needs.resolve.outputs.driver_tag }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  # Packages have no candidate channel, so a candidate run never publishes them. The
  # registries trust this file by name, so the publish jobs live here and not in a called
  # workflow.
  publish-ts:
    name: Publish TypeScript packages
    needs: [resolve, ci, migration-audit, publish]
    # Packages go out after the products of the run, and never after the publish fails.
    # A run with no product has no publish job, so CI and the audit gate it here.
    if: >-
      !cancelled() && inputs.typescript && !inputs.prerelease && needs.resolve.result ==
      'success' && needs.ci.result == 'success' && (!inputs.migration_audit ||
      needs.migration-audit.result == 'success') && (!inputs.console && !inputs.driver
      && !inputs.core || needs.publish.result == 'success')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      SYNNAX_TS_ENV: prod
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      # npm hides a staged version until a maintainer approves it, so the tag goes up
      # only after a stage succeeds, and a run whose tag already names this commit has
      # nothing to stage. While the newest version overall or on this train waits for
      # approval, nothing new stages, so approvals never move a dist-tag back. `client`
      # is approved last.
      - name: Claim the version
        id: claim
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.ts_version }}
          TAG: ${{ needs.resolve.outputs.ts_tag }}
          MINOR: ${{ needs.resolve.outputs.ts_minor }}
        run: |
          status() {
            curl -s -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/@synnaxlabs/$1/$2"
          }
          claimed=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$claimed" = "$GITHUB_SHA" ]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$claimed" ]; then
            echo "$TAG names $claimed, not this commit" >&2
            exit 1
          fi
          for name in x alamos freighter client; do
            code=$(status "$name" "$VERSION")
            if [ "$code" != 404 ]; then
              echo "the registry answered $code for $name $VERSION" >&2
              exit 1
            fi
          done
          newest() {
            git ls-remote --tags --refs origin "refs/tags/ts/v$1*" \
              | sed -nE 's#.*refs/tags/ts/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1
          }
          overall=$(newest "")
          train=$(newest "$MINOR.")
          for pending in "$overall" "$train"; do
            [ -n "$pending" ] || continue
            code=$(status client "$pending")
            case "$code" in
              200) ;;
              404)
                echo "client $pending is not out. Approve it, or reject it" >&2
                echo "and delete the ts/v$pending tag." >&2
                exit 1
                ;;
              *)
                echo "the registry answered $code for client $pending" >&2
                exit 1
                ;;
            esac
          done

      - name: Stamp package versions
        env:
          VERSION: ${{ needs.resolve.outputs.ts_version }}
        run: .github/scripts/stamp_versions.sh ts "$VERSION"

      - name: Build
        run: pnpm build:client

      # A hotfix on an older train must not move `latest` back. The trusted publisher
      # may only stage, so nothing installs until a maintainer approves it with 2FA.
      # pnpm cannot stage a batch, so each package stages on its own.
      - name: Stage
        id: stage
        if: steps.claim.outputs.staged != 'true'
        env:
          TAG:
            ${{ needs.resolve.outputs.ts_latest == 'true' && 'latest' ||
            format('train-{0}', needs.resolve.outputs.ts_minor) }}
        # The stamp dirties the tree, and the resolve job already checked the branch.
        run: pnpm stage publish -r --tag "$TAG" --no-git-checks

      # No tag guards the packages that a failed stage left on the registry.
      - name: Ask for a reject
        if: >-
          always() && (steps.stage.conclusion == 'failure' || steps.stage.conclusion ==
          'cancelled')
        env:
          VERSION: ${{ needs.resolve.outputs.ts_version }}
        run: |
          {
            echo "### Reject the staged npm packages"
            echo "The stage of \`@synnaxlabs\` $VERSION stopped part way. Before the"
            echo "next release, reject every $VERSION version in the Staged Packages"
            echo "tab on npmjs.com or with \`pnpm stage reject\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag
        if: steps.claim.outputs.staged != 'true'
        env:
          TAG: ${{ needs.resolve.outputs.ts_tag }}
        run:
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Ask for approval
        env:
          VERSION: ${{ needs.resolve.outputs.ts_version }}
        run: |
          {
            echo "### Approve the npm packages"
            echo "Approve each \`@synnaxlabs\` $VERSION version in this order, in the"
            echo "Staged Packages tab on npmjs.com or with \`pnpm stage approve\`:"
            echo "\`x\`, \`alamos\`, \`freighter\`, then \`client\`."
            echo "Until \`client\` is approved, no release stages on this train, or on"
            echo "any train while $VERSION is the newest."
            echo "To reject, reject every package and delete the \`ts/v$VERSION\` tag."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-py:
    name: Publish Python packages
    needs: [resolve, ci, migration-audit, publish]
    # Packages go out after the products of the run, and never after the publish fails.
    # A run with no product has no publish job, so CI and the audit gate it here.
    if: >-
      !cancelled() && inputs.python && !inputs.prerelease && needs.resolve.result ==
      'success' && needs.ci.result == 'success' && (!inputs.migration_audit ||
      needs.migration-audit.result == 'success') && (!inputs.console && !inputs.driver
      && !inputs.core || needs.publish.result == 'success')
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known

      # The tag claims the version before anything publishes. A run at the same commit
      # resolves the claimed version again and finishes a partial publish, since the
      # registry skips what already went up. Any other run stops, so one version never
      # holds packages from two commits.
      - name: Claim the version
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.py_version }}
          TAG: ${{ needs.resolve.outputs.py_tag }}
        run: |
          claimed=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$claimed" = "$GITHUB_SHA" ]; then exit 0; fi
          if [ -n "$claimed" ]; then
            echo "$TAG names $claimed, not this commit" >&2
            exit 1
          fi
          for name in alamos synnax synnax-freighter synnax-x; do
            url="https://pypi.org/pypi/$name/$VERSION/json"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            case "$code" in
              404) ;;
              200)
                echo "$name $VERSION is out without $TAG" >&2
                exit 1
                ;;
              *)
                echo "the registry answered $code for $name $VERSION" >&2
                exit 1
                ;;
            esac
          done
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Stamp package versions
        env:
          VERSION: ${{ needs.resolve.outputs.py_version }}
        run: .github/scripts/stamp_versions.sh py "$VERSION"

      - name: Pin internal dependency constraints
        run: .github/scripts/pin_internal_deps.sh

      - name: Build
        run: |
          for package in alamos/py x/py freighter/py client/py; do
            (cd "$package" && uv build)
          done

      - name: Prune already-published distributions
        run: uv run --no-project python .github/scripts/prune_published.py

      - name: Publish
        run: |
          if compgen -G "dist/*.whl" > /dev/null || compgen -G "dist/*.tar.gz" > /dev/null; then
            uv publish --check-url https://pypi.org/simple/
          else
            echo "All distributions already published; nothing to upload."
          fi

  draft-core:
    name: Draft Core
    needs: resolve
    if: inputs.core
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Draft release
        uses: ./.github/actions/draft-release
        with:
          tag: ${{ needs.resolve.outputs.core_tag }}
          title: Core v${{ needs.resolve.outputs.core_version }}
          previous_tag: ${{ needs.resolve.outputs.core_previous_tag }}
          config: .github/release/core.yml
          notes: >-
            Embeds [Console v${{ needs.resolve.outputs.core_console_version }}](${{
            github.server_url }}/${{ github.repository }}/releases/tag/console/v${{
            needs.resolve.outputs.core_console_version }}) and [Driver v${{
            needs.resolve.outputs.core_driver_version }}](${{ github.server_url }}/${{
            github.repository }}/releases/tag/driver/v${{
            needs.resolve.outputs.core_driver_version }}).
          prerelease: ${{ inputs.prerelease }}

  # The Core embeds the Console and the Driver. When the run releases one, the build
  # downloads it from the draft, which holds every file after that build and the
  # manifest job pass. If not, it downloads the newest published release on the train. A
  # job with no status check skips when any ancestor skipped, so each job from here has
  # its own. Without one, a run with no Console or Driver skips the Core.
  build-core:
    name: Build Core
    needs: [resolve, draft-core, manifest-console, build-driver]
    if: >-
      !cancelled() && needs.draft-core.result == 'success' && (!inputs.console ||
      needs.manifest-console.result == 'success') && (!inputs.driver ||
      needs.build-driver.result == 'success')
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      windows: true
      macos: true
      ubuntu: true
      core: true
      sign_binaries: true
      use_simple_artifact_names: true
      version: ${{ needs.resolve.outputs.core_version }}
      release_tag: ${{ needs.resolve.outputs.core_tag }}
      console_release: console/v${{ needs.resolve.outputs.core_console_version }}
      driver_release: driver/v${{ needs.resolve.outputs.core_driver_version }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  windows-installer:
    name: Build Windows installer
    needs: [resolve, build-core]
    if: ${{ !cancelled() && needs.build-core.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: windows-latest
    env:
      TAG: ${{ needs.resolve.outputs.core_tag }}
      VERSION: ${{ needs.resolve.outputs.core_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Core binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: synnax-core-windows
          path: .github/scripts/

      - name: Rename binary for installer
        shell: powershell
        run:
          Move-Item -Force .github/scripts/synnax-v${{ env.VERSION }}.exe
          .github/scripts/synnax-server.exe

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2

      - name: Install trusted-signing-cli
        run: cargo install trusted-signing-cli

      - name: Build Windows installer
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $env:Path = "$nsisDir;$env:Path"
          Copy-Item -Force .\.github\scripts\EnVar.dll "$nsisDir\Plugins\x86-unicode\EnVar.dll"
          makensis /DVERSION=${{ env.VERSION }} .\.github\scripts\windows_installer.nsi

      - name: Sign Windows installer
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run:
          trusted-signing-cli -e https://wcus.codesigning.azure.net -a
          CodeSigningAccountName -c CodeSigningCertificateProfile -d "Synnax Core
          Installer" .\.github\scripts\synnax-setup-v${{ env.VERSION }}.exe

      - name: Upload Windows installer
        run: |
          gh release upload --clobber "${env:TAG}" .\.github\scripts\synnax-setup-v${env:VERSION}.exe

  # The only job that makes a release public. It runs after CI, the migration audit, and
  # every build of the run pass. A publish of a release that is already public changes
  # nothing, so a rerun finishes a publish that stopped part way.
  publish:
    name: Publish
    needs:
      [resolve, ci, migration-audit, manifest-console, build-driver, windows-installer]
    if: >-
      !cancelled() && (inputs.console || inputs.driver || inputs.core) &&
      needs.resolve.result == 'success' && needs.ci.result == 'success' &&
      (!inputs.migration_audit || needs.migration-audit.result == 'success') &&
      (!inputs.console || needs.manifest-console.result == 'success') && (!inputs.driver
      || needs.build-driver.result == 'success') && (!inputs.core ||
      needs.windows-installer.result == 'success')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The repo has one Latest badge, and a publish takes it by default. It belongs to
      # the newest stable Core, so a Console, Driver, or Desktop publish declines it.
      - name: Publish Driver
        if: inputs.driver
        env:
          TAG: ${{ needs.resolve.outputs.driver_tag }}
        run: gh release edit "$TAG" --draft=false --latest=false

      - name: Publish Console
        if: inputs.console
        env:
          TAG: ${{ needs.resolve.outputs.console_tag }}
        run: gh release edit "$TAG" --draft=false --latest=false

      # The Core goes last, so a public Core never embeds a release that is still a
      # draft.
      - name: Publish Core
        if: inputs.core
        env:
          TAG: ${{ needs.resolve.outputs.core_tag }}
          LATEST:
            ${{ inputs.prerelease && 'false' || needs.resolve.outputs.core_latest }}
        run: gh release edit "$TAG" --draft=false --latest="$LATEST"

  # The image builds and pushes in one step, so it follows the publish. No job needs the
  # image, so a failed push blocks only the image. A rerun of this job alone has every
  # input, and it moves latest or next only to the newest Core.
  publish-core-image:
    name: Publish Core image
    needs: [resolve, publish]
    if: ${{ !cancelled() && inputs.core && needs.publish.result == 'success' }}
    uses: ./.github/workflows/build.synnax.yaml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      docker: true
      core: true
      version: ${{ needs.resolve.outputs.core_version }}
      release_tag: ${{ needs.resolve.outputs.core_tag }}
      console_release: console/v${{ needs.resolve.outputs.core_console_version }}
      driver_release: driver/v${{ needs.resolve.outputs.core_driver_version }}
      docker_channel:
        ${{ inputs.prerelease && 'next' || needs.resolve.outputs.core_latest == 'true'
        && 'latest' || '' }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  deploy-docs:
    name: Deploy docs
    needs: [resolve, publish]
    # The docs read stable versions at build time. A release changes the download links
    # of its train, next, and the newest train, and a new train moves the previous one
    # off the root.
    if: ${{ !cancelled() && !inputs.prerelease && needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy.docs.yaml
    with:
      versions: next latest previous
      train: ${{ needs.resolve.outputs.train }}
    secrets:
      DOCS_ALGOLIA_APP_ID: ${{ secrets.DOCS_ALGOLIA_APP_ID }}
      DOCS_ALGOLIA_WRITE_API_KEY: ${{ secrets.DOCS_ALGOLIA_WRITE_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
