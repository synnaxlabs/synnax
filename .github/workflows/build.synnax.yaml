name: Build - Synnax

run-name:
  ${{ github.event.inputs.RUN_NAME || format('Build Synnax - {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "BDEBUG: Build Driver with debug symbols"
        type: boolean
        default: false
      windows:
        description: "Platform: Windows"
        type: boolean
        default: false
      macos:
        description: "Platform: macOS"
        type: boolean
        default: false
      ubuntu:
        description: "Platform: Ubuntu"
        type: boolean
        default: false
      docker:
        description: "Platform: Docker"
        type: boolean
        default: false
      driver:
        description: "Build: Driver"
        type: boolean
        default: false
      console:
        description: "Build: Console web assets"
        type: boolean
        default: false
      console_tauri:
        description: "Build: Console Tauri desktop app"
        type: boolean
        default: false
      desktop:
        description: "Build: Synnax Desktop (needs Core)"
        type: boolean
        default: false
      core:
        description: "Build: Core"
        type: boolean
        default: false
      sign_binaries:
        description: "Sign binaries (macOS + Windows)"
        type: boolean
        default: false
      release_tag:
        description: "Upload assets to this GitHub release tag (empty skips upload)"
        type: string
        default: ""
      nilinuxrt:
        description: "Build: NI Linux Real-Time Driver"
        type: boolean
        default: false
      use_simple_artifact_names:
        description: "Use simple artifact names (e.g., synnax-core-linux)"
        type: boolean
        default: false
      RUN_NAME:
        description: "Custom name for run"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      debug:
        type: boolean
        default: false
      windows:
        type: boolean
        default: false
      macos:
        type: boolean
        default: false
      ubuntu:
        type: boolean
        default: false
      docker:
        type: boolean
        default: false
      driver:
        type: boolean
        default: false
      console:
        type: boolean
        default: false
      console_tauri:
        type: boolean
        default: false
      desktop:
        type: boolean
        default: false
      core:
        type: boolean
        default: false
      sign_binaries:
        type: boolean
        default: false
      release_tag:
        description: Upload assets to this GitHub release tag (empty skips upload)
        type: string
        default: ""
      nilinuxrt:
        type: boolean
        default: false
      use_simple_artifact_names:
        type: boolean
        default: false
      version:
        type: string
        required: false
        default: ""
      desktop_version:
        description: Synnax Desktop app version; the Core and Driver keep version
        type: string
        default: ""
      driver_ref_run_id:
        type: string
        required: false
        default: ""
      console_ref_run_id:
        type: string
        required: false
        default: ""
      core_ref_run_id:
        type: string
        required: false
        default: ""
      console_release:
        description: Console release tag whose web bundle the Core embeds
        type: string
        default: ""
      driver_release:
        description: Driver release tag whose binaries the Core embeds
        type: string
        default: ""
      docker_channel:
        description: Extra Docker tag for a release, latest or next
        type: string
        default: ""
      updater_channel:
        description: Console updater channel the app polls, stable or next
        type: string
        default: stable

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      PURE_VERSION: ${{ steps.version.outputs.PURE_VERSION }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      console_tauri_matrix: ${{ steps.set-console-tauri-matrix.outputs.matrix }}
      GO_BUILD_TAGS: ${{ steps.go-tags.outputs.GO_BUILD_TAGS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dispatch inputs reach shell commands: reject a malformed tag or version before
      # any job interpolates one.
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          CONSOLE_RELEASE: ${{ inputs.console_release }}
          DRIVER_RELEASE: ${{ inputs.driver_release }}
        run: |
          TAG='^((console|core|driver)/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)?$'
          for VALUE in "$RELEASE_TAG" "$CONSOLE_RELEASE" "$DRIVER_RELEASE"; do
            if ! [[ "$VALUE" =~ $TAG ]]; then
              echo "malformed release tag: $VALUE" >&2
              exit 1
            fi
          done
          SEMVER='^([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?)?$'
          for VALUE in "$VERSION" "$DESKTOP_VERSION"; do
            if ! [[ "$VALUE" =~ $SEMVER ]]; then
              echo "malformed version: $VALUE" >&2
              exit 1
            fi
          done

      - name: Get version
        id: version
        working-directory: core
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # Extract pure version by removing any suffix (-rc, -branch, etc.)
            PURE_VERSION=$(echo "${{ inputs.version }}" | sed 's/-.*$//')
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "PURE_VERSION=${PURE_VERSION}" >> $GITHUB_OUTPUT
          else
            # A dev build stays 0.0 so clients pair with it, and names the newest
            # stable Core release behind it.
            BASE=$(git tag --list 'core/v*' --merged HEAD \
              | sed -nE 's#^core/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            echo "PURE_VERSION=0.0.0" >> $GITHUB_OUTPUT
            echo "VERSION=0.0.0-dev${BASE:+.$BASE}.${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Generate OS matrix
        id: set-matrix
        run: |
          MATRIX=$(.github/scripts/generate_os_matrix.sh "${{ inputs.windows }}" "${{ inputs.macos }}" "${{ inputs.ubuntu }}" "${{ inputs.sign_binaries }}")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Generate Console Tauri matrix
        id: set-console-tauri-matrix
        run: |
          OS_LIST=""
          if [ "${{ inputs.macos }}" = "true" ]; then
            if [ "${{ inputs.sign_binaries }}" = "true" ]; then
              OS_LIST="\"macos-latest\""
            else
              OS_LIST="\"macos-build-bot\""
            fi
          fi
          if [ "${{ inputs.windows }}" = "true" ]; then
            [ -n "$OS_LIST" ] && OS_LIST="$OS_LIST,"
            OS_LIST="${OS_LIST}\"windows-latest\""
          fi
          echo "matrix=[${OS_LIST}]" >> $GITHUB_OUTPUT

      - name: Verify build configuration
        run: |
          .github/scripts/verify_build_config.sh \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ inputs.windows }}" \
            "${{ inputs.macos }}" \
            "${{ inputs.ubuntu }}" \
            "${{ inputs.docker }}" \
            "${{ inputs.nilinuxrt }}" \
            "${{ inputs.driver }}" \
            "${{ inputs.console }}" \
            "${{ inputs.console_tauri }}" \
            "${{ inputs.core }}" \
            "${{ inputs.debug }}" \
            "${{ inputs.sign_binaries }}" \
            "${{ inputs.desktop }}"

      - name: Generate Go build tags
        id: go-tags
        run: |
          TAGS=""
          if [ "${{ inputs.console }}" = "true" ] || [ -n "${{ inputs.console_release }}" ]; then
            TAGS="console"
          fi
          if [ "${{ inputs.driver }}" = "true" ] || [ -n "${{ inputs.driver_release }}" ]; then
            TAGS="${TAGS:+$TAGS,}driver"
          fi
          if [ -n "$TAGS" ]; then TAGS="-tags $TAGS"; fi
          echo "GO_BUILD_TAGS=$TAGS" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.os }})
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      GH_TOKEN: ${{ github.token }}
      DRIVER_REF_RUN_ID:
        ${{ fromJSON(inputs.driver_ref_run_id || '{}')[matrix.os-name] }}
      CONSOLE_REF_RUN_ID:
        ${{ fromJSON(inputs.console_ref_run_id || '{}')[matrix.os-name] }}
      CORE_REF_RUN_ID: ${{ fromJSON(inputs.core_ref_run_id || '{}')[matrix.os-name] }}
      BAZEL_BUILD_FLAGS:
        --enable_platform_specific_config ${{ inputs.debug && '-c dbg' || '--config=opt'
        }} --announce_rc --verbose_failures --define=SYNNAX_DRIVER_VERSION=${{
        needs.setup.outputs.VERSION }}
      BAZEL_REMOTE_CACHE_FLAGS:
        --remote_cache=${{ vars.BAZEL_REMOTE_CACHE_GRPC_URL }}
        --remote_cache_compression=true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only the Bazel Driver build reads the vendored submodules.
      - name: Update submodules
        if: inputs.driver && (env.DRIVER_REF_RUN_ID == '' || inputs.nilinuxrt)
        run: git submodule update --init --recursive

      - name: Install deps on Ubuntu
        # Dependencies should already be installed on the machine.
        # This is nominally a no-op, but exists as a fallback and for documentation.
        if: matrix.os == 'ubuntu-build-bot'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev autoconf automake libtool

      - name: Install deps on macOS
        if: startsWith(matrix.os, 'macos')
        run: brew install autoconf automake libtool

      - name: Setup Bazel
        if: inputs.driver && (env.DRIVER_REF_RUN_ID == '' || inputs.nilinuxrt)
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Use S3 cache instead of github cache.
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      - name: Install Rust
        if: inputs.driver && env.DRIVER_REF_RUN_ID == ''
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build Driver (Windows)
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && matrix.os ==
          'windows-build-bot'
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          scripts/run_bazel.sh build $BAZEL_BUILD_FLAGS $BAZEL_REMOTE_CACHE_FLAGS \
            ${{ !inputs.debug && '--config=opt-windows' || '--output_groups=+pdb_file' }} //driver

      - name: Upload Windows debug symbols
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && inputs.debug && matrix.os ==
          'windows-build-bot'
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names &&
            'synnax-driver-debug-symbols-windows' ||
            format('synnax-driver-debug-symbols-v{0}-windows',
            needs.setup.outputs.VERSION) }}
          path: bazel-bin/driver/driver.pdb
          retention-days: 7
          if-no-files-found: error

      - name: Build Driver (macOS)
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && startsWith(matrix.os, 'macos')
        run: |
          bazel build $BAZEL_BUILD_FLAGS \
            --config=opt-unix //driver

      - name: Extract debug symbols (macOS)
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && inputs.debug &&
          startsWith(matrix.os, 'macos')
        run: |
          dsymutil bazel-bin/driver/driver -o bazel-bin/driver/driver.dSYM

      - name: Upload macOS debug symbols
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && inputs.debug &&
          startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && 'synnax-driver-debug-symbols-macos'
            || format('synnax-driver-debug-symbols-v{0}-macos',
            needs.setup.outputs.VERSION) }}
          path: bazel-bin/driver/driver.dSYM
          retention-days: 7
          if-no-files-found: error

      - name: Build Driver (NI Linux Real-Time)
        if: inputs.driver && inputs.nilinuxrt && matrix.os == 'ubuntu-build-bot'
        run: |
          bazel build $BAZEL_BUILD_FLAGS $BAZEL_REMOTE_CACHE_FLAGS \
            --config=opt-unix --define=platform=nilinuxrt //driver
          mv bazel-bin/driver/driver bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-nilinuxrt

      - name: Extract debug symbols (NI Linux Real-Time)
        if:
          inputs.driver && inputs.nilinuxrt && inputs.debug && matrix.os ==
          'ubuntu-build-bot'
        run: |
          objcopy --only-keep-debug bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-nilinuxrt bazel-bin/driver/driver-nilinuxrt.debug

      - name: Upload NI Linux Real-Time debug symbols
        if:
          inputs.driver && inputs.nilinuxrt && inputs.debug && matrix.os ==
          'ubuntu-build-bot'
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names &&
            'synnax-driver-debug-symbols-nilinuxrt' ||
            format('synnax-driver-debug-symbols-v{0}-nilinuxrt',
            needs.setup.outputs.VERSION) }}
          path: bazel-bin/driver/driver-nilinuxrt.debug
          retention-days: 7
          if-no-files-found: error

      - name: Upload NI Linux Real-Time Driver as artifact
        if: inputs.driver && inputs.nilinuxrt && matrix.os == 'ubuntu-build-bot'
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && 'synnax-driver-nilinuxrt' ||
            format('synnax-driver-v{0}-nilinuxrt', needs.setup.outputs.VERSION) }}
          path:
            bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-nilinuxrt
          retention-days: 7
          if-no-files-found: error

      - name: Upload NI Linux Real-Time Driver to release
        if:
          inputs.driver && inputs.nilinuxrt && inputs.release_tag != '' && matrix.os ==
          'ubuntu-build-bot'
        run: |
          gh release upload --clobber "$RELEASE_TAG" bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-nilinuxrt

      # The docs site tells NI Linux Real-Time users to download and run this script.
      - name: Upload NI Linux Real-Time install script to release
        if:
          inputs.driver && inputs.nilinuxrt && inputs.release_tag != '' && matrix.os ==
          'ubuntu-build-bot'
        env:
          BINARY: synnax-driver-v${{ needs.setup.outputs.VERSION }}-nilinuxrt
        run: |
          cat > install-driver-nilinuxrt.sh <<EOF
          #!/bin/bash
          curl -LO "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${BINARY}"
          chmod +x ${BINARY}
          ./${BINARY} stop
          sudo ./${BINARY} install
          ./${BINARY} start
          EOF
          gh release upload --clobber "$RELEASE_TAG" install-driver-nilinuxrt.sh

      - name: Build Driver (Linux)
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && matrix.os ==
          'ubuntu-build-bot'
        run: |
          bazel build $BAZEL_BUILD_FLAGS $BAZEL_REMOTE_CACHE_FLAGS \
            --config=opt-unix //driver

      - name: Extract debug symbols (Linux)
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && inputs.debug && matrix.os ==
          'ubuntu-build-bot'
        run: |
          objcopy --only-keep-debug bazel-bin/driver/driver bazel-bin/driver/driver.debug

      - name: Upload Linux debug symbols
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID == '' && inputs.debug && matrix.os ==
          'ubuntu-build-bot'
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && 'synnax-driver-debug-symbols-linux'
            || format('synnax-driver-debug-symbols-v{0}-linux',
            needs.setup.outputs.VERSION) }}
          path: bazel-bin/driver/driver.debug
          retention-days: 7
          if-no-files-found: error

      - name: Import Apple Developer Certificate
        if: inputs.sign_binaries && startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          KEYCHAIN_NAME: build-${{ runner.name }}.keychain
        run: .github/scripts/import_apple_certificate.sh

      - name: Sign Driver (macOS)
        if: inputs.sign_binaries && inputs.driver && startsWith(matrix.os, 'macos')
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          cat > driver-entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          EOF

          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          codesign --force --options runtime --timestamp --entitlements driver-entitlements.plist --sign "$CERT_ID" bazel-bin/driver/driver

          # Unlock keychain before verification (in case it locked)
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          codesign --verify --verbose bazel-bin/driver/driver

      - name: Notarize macOS Driver binary
        if: inputs.sign_binaries && inputs.driver && startsWith(matrix.os, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a zip for notarization (notarytool requires a container format)
          zip -j driver-notarize.zip bazel-bin/driver/driver

          # Retry logic for notarization (Apple's servers can be flaky)
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt of 3..."
            if xcrun notarytool submit driver-notarize.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "Notarization succeeded on attempt $attempt"
              break
            elif [ $attempt -lt 3 ]; then
              echo "Notarization attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
            else
              echo "Notarization failed after 3 attempts"
              rm driver-notarize.zip
              exit 1
            fi
          done

          rm driver-notarize.zip

      - name: Install trusted-signing-cli
        if: inputs.sign_binaries && matrix.os == 'windows-build-bot'
        run: cargo install trusted-signing-cli

      - name: Remove read-only attribute from Driver for signing
        if: inputs.sign_binaries && inputs.driver && matrix.os == 'windows-build-bot'
        shell: powershell
        run:
          Set-ItemProperty -Path bazel-bin/driver/driver.exe -Name IsReadOnly -Value
          $false

      - name: Sign Driver (Windows)
        if: inputs.sign_binaries && inputs.driver && matrix.os == 'windows-build-bot'
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run:
          trusted-signing-cli -e https://wcus.codesigning.azure.net -a
          CodeSigningAccountName -c CodeSigningCertificateProfile -d "Synnax Driver"
          bazel-bin/driver/driver.exe

      # A scratch dir avoids leftovers in the persistent bazel output base.
      - name: Download cached Driver
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID != '' && inputs.core &&
          env.CORE_REF_RUN_ID == ''
        uses: actions/download-artifact@v8
        with:
          name: synnax-driver-${{ matrix.os-name }}
          path: ${{ runner.temp }}/cached-driver
          run-id: ${{ env.DRIVER_REF_RUN_ID }}
          github-token: ${{ github.token }}

      # The cached binary carries the version stamp of the run that built it.
      - name: Rename cached Driver
        if:
          inputs.driver && env.DRIVER_REF_RUN_ID != '' && inputs.core &&
          env.CORE_REF_RUN_ID == ''
        shell: bash
        run: |
          mkdir -p bazel-bin/driver
          mv "${RUNNER_TEMP}"/cached-driver/synnax-driver-v* \
            bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{ matrix.os-name }}${{ matrix.executable }}

      - name: Rename Driver binary
        if: inputs.driver && env.DRIVER_REF_RUN_ID == ''
        shell: bash
        run: |
          mv bazel-bin/driver/driver${{ matrix.executable }} bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{ matrix.os-name }}${{ matrix.executable }}

      - name: Upload Driver as artifact
        if: inputs.driver && env.DRIVER_REF_RUN_ID == ''
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && format('synnax-driver-{0}',
            matrix.os-name) || format('synnax-driver-v{0}-{1}',
            needs.setup.outputs.VERSION, matrix.os-name) }}
          path:
            bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{
            matrix.os-name }}${{ matrix.executable }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload Driver to release
        if: inputs.driver && inputs.release_tag != ''
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 5
          max_attempts: 3
          command:
            gh release upload --clobber "$RELEASE_TAG"
            bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{
            matrix.os-name }}${{ matrix.executable }}

      - name: Copy Driver to assets
        if:
          inputs.driver && inputs.core && env.CORE_REF_RUN_ID == '' && matrix.os !=
          'windows-build-bot'
        run: |
          cp bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{ matrix.os-name }}${{ matrix.executable }} core/pkg/driver/assets/driver${{ matrix.executable }}

      - name: Copy Driver to assets (Windows)
        if:
          inputs.driver && inputs.core && env.CORE_REF_RUN_ID == '' && matrix.os ==
          'windows-build-bot'
        shell: powershell
        run: |
          Copy-Item -Force bazel-bin/driver/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{ matrix.os-name }}.exe core/pkg/driver/assets/driver.exe

      - name: Download Driver release
        if: inputs.driver_release != '' && inputs.core
        shell: bash
        run: |
          mkdir -p core/pkg/driver/assets
          gh release download "${{ inputs.driver_release }}" \
            --pattern "synnax-driver-v*-${{ matrix.os-name }}${{ matrix.executable }}" \
            --output core/pkg/driver/assets/driver${{ matrix.executable }}
          chmod +x core/pkg/driver/assets/driver${{ matrix.executable }}

      - name: Download Console release
        if: inputs.console_release != '' && inputs.core
        shell: bash
        run: |
          mkdir -p core/pkg/console/dist
          gh release download "${{ inputs.console_release }}" \
            --pattern "console-web-*.tar.gz" --output console-web.tar.gz
          tar -xzf console-web.tar.gz -C core/pkg/console/dist

      - name: Set up pnpm and Node.js
        if: inputs.console && env.CONSOLE_REF_RUN_ID == ''
        uses: ./.github/actions/setup-pnpm
        with:
          # The Linux and macOS build bots keep their pnpm store on a persistent volume.
          # The Windows bots keep it on NVMe next to node_modules, which a stop wipes,
          # so they restore it from the cache that warm.windows.yaml saves.
          cache:
            ${{ matrix.os == 'windows-build-bot' || !endsWith(matrix.os, '-build-bot')
            }}
          # A build bot hosts several runners out of one home directory, so a shared
          # dest lets one job's store cleanup delete files another is installing.
          dest:
            ${{ endsWith(matrix.os, '-build-bot') && format('~/setup-pnpm-{0}',
            runner.name) || '~/setup-pnpm' }}

      - name: Build Console web assets
        if: inputs.console && env.CONSOLE_REF_RUN_ID == ''
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm build:console-vite

      - name: Download cached Console assets
        if:
          inputs.console && env.CONSOLE_REF_RUN_ID != '' && inputs.core &&
          env.CORE_REF_RUN_ID == ''
        uses: actions/download-artifact@v8
        with:
          name: synnax-console-assets-${{ matrix.os-name }}
          path: console/dist
          run-id: ${{ env.CONSOLE_REF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Upload Console assets as artifact
        if: inputs.console && env.CONSOLE_REF_RUN_ID == ''
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && format('synnax-console-assets-{0}',
            matrix.os-name) || format('synnax-console-assets-v{0}-{1}',
            needs.setup.outputs.VERSION, matrix.os-name) }}
          path: console/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Console web bundle to release
        if:
          inputs.console && inputs.release_tag != '' && matrix.os == 'ubuntu-build-bot'
        run: |
          tar -czf console-web-v${{ needs.setup.outputs.VERSION }}.tar.gz -C console/dist .
          gh release upload --clobber "$RELEASE_TAG" console-web-v${{ needs.setup.outputs.VERSION }}.tar.gz

      - name: Copy Console to assets
        if:
          inputs.console && inputs.core && env.CORE_REF_RUN_ID == '' && matrix.os !=
          'windows-build-bot'
        run: cp -r console/dist/* core/pkg/console/dist/

      - name: Copy Console to assets (Windows)
        if:
          inputs.console && inputs.core && env.CORE_REF_RUN_ID == '' && matrix.os ==
          'windows-build-bot'
        shell: powershell
        run: |
          Copy-Item -Recurse -Force console/dist/* core/pkg/console/dist/

      # The Windows bots keep the tool cache on NVMe, which a stop wipes, and
      # extracting the Go archive takes over three minutes there.
      - name: Key the Go toolchain cache
        id: go-toolchain
        if: inputs.core && env.CORE_REF_RUN_ID == '' && matrix.os == 'windows-build-bot'
        shell: bash
        run: .github/scripts/go_toolchain_cache.sh core/go.mod >> "$GITHUB_OUTPUT"

      - name: Restore the Go toolchain
        id: go-restore
        if: inputs.core && env.CORE_REF_RUN_ID == '' && matrix.os == 'windows-build-bot'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-toolchain.outputs.path }}
          key: ${{ steps.go-toolchain.outputs.key }}

      - name: Set up Go
        if: inputs.core && env.CORE_REF_RUN_ID == ''
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          # Don't use github cache. Local cache is faster.
          cache: false

      # Merge queue caches are unreachable from later runs, so the queue never saves.
      - name: Save the Go toolchain
        if:
          steps.go-restore.outcome == 'success' && steps.go-restore.outputs.cache-hit !=
          'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-toolchain.outputs.path }}
          key: ${{ steps.go-toolchain.outputs.key }}

      - name: Build Core
        if: inputs.core && env.CORE_REF_RUN_ID == ''
        working-directory: core
        shell: bash
        run: |
          go build ${{ needs.setup.outputs.GO_BUILD_TAGS }} \
            -ldflags="-w -s \
              -X github.com/synnaxlabs/synnax/pkg/version.version=${{ needs.setup.outputs.VERSION }} \
              -X github.com/synnaxlabs/synnax/pkg/version.gitCommit=${{ github.sha }} \
              -X github.com/synnaxlabs/synnax/pkg/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o synnax-v${{ needs.setup.outputs.VERSION }}${{ matrix.executable }}

      - name: Sign macOS Core binary
        if: inputs.sign_binaries && inputs.core && startsWith(matrix.os, 'macos')
        working-directory: core
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          cat > server-entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          EOF

          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          codesign --force --options runtime --timestamp \
            --entitlements server-entitlements.plist \
            --sign "$CERT_ID" ./synnax-v${{ needs.setup.outputs.VERSION }}

          # Unlock keychain before verification (in case it locked)
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          codesign --verify --verbose ./synnax-v${{ needs.setup.outputs.VERSION }}

      - name: Notarize macOS Core binary
        if: inputs.sign_binaries && inputs.core && startsWith(matrix.os, 'macos')
        working-directory: core
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a zip for notarization (notarytool requires a container format)
          zip -j server-notarize.zip ./synnax-v${{ needs.setup.outputs.VERSION }}

          # Retry logic for notarization (Apple's servers can be flaky)
          for attempt in 1 2 3; do
            echo "Notarization attempt $attempt of 3..."
            if xcrun notarytool submit server-notarize.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "Notarization succeeded on attempt $attempt"
              break
            elif [ $attempt -lt 3 ]; then
              echo "Notarization attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
            else
              echo "Notarization failed after 3 attempts"
              rm server-notarize.zip
              exit 1
            fi
          done

          rm server-notarize.zip

      - name: Sign Windows Core binary
        if: inputs.sign_binaries && inputs.core && matrix.os == 'windows-build-bot'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run:
          trusted-signing-cli -e https://wcus.codesigning.azure.net -a
          CodeSigningAccountName -c CodeSigningCertificateProfile -d "Synnax Core"
          core/synnax-v${{ needs.setup.outputs.VERSION }}.exe

      - name: Upload Core binary as artifact
        if: inputs.core && env.CORE_REF_RUN_ID == ''
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && format('synnax-core-{0}',
            matrix.os-name) || format('synnax-core-v{0}-{1}',
            needs.setup.outputs.VERSION, matrix.os-name) }}
          path: core/synnax-v${{ needs.setup.outputs.VERSION }}${{ matrix.executable }}
          retention-days: 7
          if-no-files-found: error

      - name: Rename Core binary for release
        if: inputs.core && inputs.release_tag != ''
        working-directory: core
        run: |
          cp synnax-v${{ needs.setup.outputs.VERSION }}${{ matrix.executable }} synnax-v${{ needs.setup.outputs.VERSION }}-${{ matrix.os-name }}${{ matrix.executable }}

      - name: Upload Core to release
        if: inputs.core && inputs.release_tag != ''
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 5
          max_attempts: 3
          command:
            gh release upload --clobber "$RELEASE_TAG" core/synnax-v${{
            needs.setup.outputs.VERSION }}-${{ matrix.os-name }}${{ matrix.executable }}

      - name: Clean build caches (Ubuntu)
        if: always() && matrix.os == 'ubuntu-build-bot'
        run: integration/scripts/clean_build_caches.sh 25

      - name: Clean build caches (Windows)
        if: always() && matrix.os == 'windows-build-bot'
        shell: powershell
        run: integration/scripts/CleanBuildCaches.ps1 -MinFreeGB 30

  republish:
    name: Republish cached (${{ matrix.os-name }})
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    timeout-minutes: 20
    permissions:
      actions: read
    env:
      DRIVER_REF_RUN_ID:
        ${{ fromJSON(inputs.driver_ref_run_id || '{}')[matrix.os-name] }}
      CONSOLE_REF_RUN_ID:
        ${{ fromJSON(inputs.console_ref_run_id || '{}')[matrix.os-name] }}
      CORE_REF_RUN_ID: ${{ fromJSON(inputs.core_ref_run_id || '{}')[matrix.os-name] }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download cached Driver
        if: inputs.driver && env.DRIVER_REF_RUN_ID != ''
        uses: actions/download-artifact@v8
        with:
          name: synnax-driver-${{ matrix.os-name }}
          path: driver-in
          run-id: ${{ env.DRIVER_REF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Stamp cached Driver
        if: inputs.driver && env.DRIVER_REF_RUN_ID != ''
        run: |
          mkdir -p driver-out
          mv driver-in/synnax-driver-v* \
            driver-out/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{ matrix.os-name }}${{ matrix.executable }}

      - name: Upload Driver as artifact
        if: inputs.driver && env.DRIVER_REF_RUN_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && format('synnax-driver-{0}',
            matrix.os-name) || format('synnax-driver-v{0}-{1}',
            needs.setup.outputs.VERSION, matrix.os-name) }}
          path:
            driver-out/synnax-driver-v${{ needs.setup.outputs.VERSION }}-${{
            matrix.os-name }}${{ matrix.executable }}
          retention-days: 7
          if-no-files-found: error

      - name: Download cached Console assets
        if: inputs.console && env.CONSOLE_REF_RUN_ID != ''
        uses: actions/download-artifact@v8
        with:
          name: synnax-console-assets-${{ matrix.os-name }}
          path: console-dist
          run-id: ${{ env.CONSOLE_REF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Upload Console assets as artifact
        if: inputs.console && env.CONSOLE_REF_RUN_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && format('synnax-console-assets-{0}',
            matrix.os-name) || format('synnax-console-assets-v{0}-{1}',
            needs.setup.outputs.VERSION, matrix.os-name) }}
          path: console-dist/
          retention-days: 7
          if-no-files-found: error

      - name: Download cached Core
        if: inputs.core && env.CORE_REF_RUN_ID != ''
        uses: actions/download-artifact@v8
        with:
          name: synnax-core-${{ matrix.os-name }}
          path: core-in
          run-id: ${{ env.CORE_REF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Stamp cached Core
        if: inputs.core && env.CORE_REF_RUN_ID != ''
        run: |
          mkdir -p core-out
          mv core-in/synnax-v* \
            core-out/synnax-v${{ needs.setup.outputs.VERSION }}${{ matrix.executable }}

      - name: Upload Core binary as artifact
        if: inputs.core && env.CORE_REF_RUN_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name:
            ${{ inputs.use_simple_artifact_names && format('synnax-core-{0}',
            matrix.os-name) || format('synnax-core-v{0}-{1}',
            needs.setup.outputs.VERSION, matrix.os-name) }}
          path:
            core-out/synnax-v${{ needs.setup.outputs.VERSION }}${{ matrix.executable }}
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Build Docker image
    needs: [setup, build, republish]
    if:
      inputs.docker && (needs.build.result == 'success' || needs.build.result ==
      'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux Driver artifact
        if: inputs.driver
        uses: actions/download-artifact@v8
        with:
          name:
            ${{ inputs.use_simple_artifact_names && 'synnax-driver-linux' ||
            format('synnax-driver-v{0}-linux', needs.setup.outputs.VERSION) }}
          path: ./driver-artifact/

      - name: Prepare Driver binary
        if: inputs.driver
        run: |
          mkdir -p core/pkg/driver/assets
          DRIVER_FILE=$(ls ./driver-artifact/synnax-driver-* 2>/dev/null | head -1)
          if [ -n "$DRIVER_FILE" ]; then
            mv "$DRIVER_FILE" core/pkg/driver/assets/driver
          else
            mv ./driver-artifact/* core/pkg/driver/assets/driver
          fi
          chmod +x core/pkg/driver/assets/driver
          file core/pkg/driver/assets/driver

      - name: Download Console assets
        if: inputs.console
        uses: actions/download-artifact@v8
        with:
          name:
            ${{ inputs.use_simple_artifact_names && 'synnax-console-assets-linux' ||
            format('synnax-console-assets-v{0}-linux', needs.setup.outputs.VERSION) }}
          path: core/pkg/console/dist/

      - name: Download Driver release
        if: inputs.driver_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core/pkg/driver/assets
          gh release download "${{ inputs.driver_release }}" \
            --pattern "synnax-driver-v*-linux" --output core/pkg/driver/assets/driver
          chmod +x core/pkg/driver/assets/driver

      - name: Download Console release
        if: inputs.console_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p core/pkg/console/dist
          gh release download "${{ inputs.console_release }}" \
            --pattern "console-web-*.tar.gz" --output console-web.tar.gz
          tar -xzf console-web.tar.gz -C core/pkg/console/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: inputs.release_tag != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Go version
        id: go-version
        run:
          echo "GO_VERSION=$(grep '^go ' core/go.mod | awk '{print $2}')" >>
          $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.release_tag == '' && format('ghcr.io/synnaxlabs/synnax:{0}', github.sha) || '' }}
            ${{ inputs.release_tag != '' && format('ghcr.io/synnaxlabs/synnax:{0}', needs.setup.outputs.VERSION) || '' }}
            ${{ inputs.release_tag != '' && format('synnaxlabs/synnax:{0}', needs.setup.outputs.VERSION) || '' }}
            ${{ inputs.docker_channel != '' && format('ghcr.io/synnaxlabs/synnax:{0}', inputs.docker_channel) || '' }}
            ${{ inputs.docker_channel != '' && format('synnaxlabs/synnax:{0}', inputs.docker_channel) || '' }}
          cache-from:
            type=gha,scope=synnax-docker-${{ inputs.driver && inputs.console && 'full'
            || inputs.driver && 'driver' || inputs.console && 'console' || 'base' }}
          cache-to:
            type=gha,mode=min,scope=synnax-docker-${{ inputs.driver && inputs.console &&
            'full' || inputs.driver && 'driver' || inputs.console && 'console' || 'base'
            }}
          sbom: ${{ inputs.release_tag != '' }}
          provenance: ${{ inputs.release_tag != '' && 'mode=max' || 'false' }}
          build-args: |
            DRIVER_ENABLED=${{ inputs.driver || inputs.driver_release != '' }}
            CONSOLE_ENABLED=${{ inputs.console || inputs.console_release != '' }}
            VERSION=${{ needs.setup.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GO_VERSION=${{ steps.go-version.outputs.GO_VERSION }}

  build-console-tauri:
    name: Build Console app
    needs: [setup]
    if: inputs.console_tauri && needs.setup.outputs.console_tauri_matrix != '[]'
    uses: ./.github/workflows/build.tauri.yaml
    with:
      os: ${{ needs.setup.outputs.console_tauri_matrix }}
      # A dev build falls back to the Cargo.toml version.
      app_version: ${{ inputs.release_tag != '' && needs.setup.outputs.VERSION || '' }}
      sign_binaries: ${{ inputs.sign_binaries }}
      release_tag: ${{ inputs.release_tag }}
      use_simple_artifact_names: ${{ inputs.use_simple_artifact_names }}
      updater_channel: ${{ inputs.updater_channel }}
    secrets: inherit

  build-desktop-tauri:
    name: Build Synnax Desktop
    needs: [setup, build, republish]
    if: inputs.desktop && needs.setup.outputs.console_tauri_matrix != '[]'
    uses: ./.github/workflows/build.tauri.yaml
    with:
      desktop: true
      os: ${{ needs.setup.outputs.console_tauri_matrix }}
      version: ${{ needs.setup.outputs.VERSION }}
      app_version: ${{ inputs.desktop_version }}
      sign_binaries: ${{ inputs.sign_binaries }}
      use_simple_artifact_names: ${{ inputs.use_simple_artifact_names }}
      updater_channel: ${{ inputs.updater_channel }}
    secrets: inherit
