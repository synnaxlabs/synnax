name: Deploy - Runners

on:
  workflow_dispatch:
    inputs:
      controller:
        description: Deploy the controller
        type: boolean
      core:
        description: Deploy the Core
        type: boolean
      core_source:
        description: >-
          The Core to deploy, as a release version or the URL of a run or job that built
          it. Empty deploys the pinned release.
        type: string
      backup:
        description: Back up the Core
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency: deploy-runners

env:
  INSTANCE: i-0daf42c1631de819a
  COMMENT: Deploy runners at ${{ github.sha }}
  TIMEOUT: 1800
  # The release that a Core deploy with no source installs.
  PINNED_CORE: 0.61.0

jobs:
  deploy:
    name: Deploy to Sandbox-Windows
    runs-on: ubuntu-latest
    environment: runners
    steps:
      - name: Check the selection
        if: ${{ !(inputs.controller || inputs.core || inputs.backup) }}
        run: |
          echo "::error::Select at least one part to deploy."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts
            scripts/runners

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::004704223095:role/github-runners-deploy
          aws-region: us-east-1

      - name: Store secrets
        if: inputs.controller
        env:
          GH_APP_ID_VALUE: ${{ secrets.RUNNERS_GH_APP_ID }}
          GH_APP_KEY_VALUE: ${{ secrets.RUNNERS_GH_APP_KEY }}
          GH_WEBHOOK_SECRET_VALUE: ${{ secrets.RUNNERS_GH_WEBHOOK_SECRET }}
          SYNNAX_PASSWORD_VALUE: ${{ secrets.RUNNERS_SYNNAX_PASSWORD }}
        run: |
          put() {
            aws ssm put-parameter --name "/runners/$1" --type SecureString \
              --overwrite --value="$2" > /dev/null
          }
          put gh-app-id "$GH_APP_ID_VALUE"
          put gh-app-key "$GH_APP_KEY_VALUE"
          put gh-webhook-secret "$GH_WEBHOOK_SECRET_VALUE"
          put synnax-password "$SYNNAX_PASSWORD_VALUE"

      - name: Download the Core
        if: inputs.core
        env:
          CORE: ${{ inputs.core_source || env.PINNED_CORE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          lines=$(.github/scripts/runner_core_source.sh "$CORE")
          mapfile -t source <<< "$lines"
          .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 \
            Step=download "${source[@]}"

      - name: Download the controller
        if: inputs.controller
        run: |
          files=$(cd scripts/runners && printf '%s\n' *.py | paste -sd, -)
          .github/scripts/run_ssm_powershell.sh scripts/runners/deploy.ps1 \
            Step=download "Sha=$GITHUB_SHA" "Files=$files"

      - name: Stop the controller
        id: stop_controller
        if: inputs.controller
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/deploy.ps1 Step=stop

      - name: Shut down the Core
        id: stop_core
        if: inputs.core || inputs.backup
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=stop

      - name: Back up the Core
        if: inputs.backup
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=backup

      - name: Install the Core
        if: inputs.core
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=install

      - name: Restart the Core
        if: always() && steps.stop_core.conclusion != 'skipped'
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/core.ps1 Step=start

      - name: Deploy the controller
        if: always() && steps.stop_controller.conclusion != 'skipped'
        run: .github/scripts/run_ssm_powershell.sh scripts/runners/deploy.ps1 Step=start
