name: Test - Migration

on:
  workflow_call:
    inputs: &inputs
      ref_run_id:
        description: "Reference run ID for downloading build artifacts"
        type: string
        required: true
      base_version:
        description:
          "Base version to migrate from (e.g. '0.54.0'). Defaults to latest release."
        type: string
        required: false
        default: ""
      ubuntu:
        description: Whether to run the migration on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to run the migration on Windows
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs: *inputs

jobs:
  test:
    name: "Migration (${{ matrix.os }})"
    timeout-minutes: 60
    runs-on:
      - self-hosted
      - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-build-bot, windows-build-bot]
        exclude:
          - os: ${{ !inputs.ubuntu && 'ubuntu-build-bot' }}
          - os: ${{ !inputs.windows && 'windows-build-bot' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reference run ID
        run: echo "Reference run ID:${{ inputs.ref_run_id }}"

      - name: Force quit existing Synnax processes (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: integration/scripts/KillSynnaxProcesses.cmd

      - name: Force quit existing Synnax processes (Unix)
        if: runner.os == 'Linux'
        run: integration/scripts/kill_synnax_processes.sh

      - name: Download and setup artifacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ inputs.ref_run_id }}
        run: integration/scripts/DownloadArtifacts.cmd

      - name: Download and setup artifacts (Unix)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ inputs.ref_run_id }}
        run: integration/scripts/download_artifacts.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known

      - name: Install Playwright
        working-directory: integration
        run: uv run playwright install --with-deps

      - name: Run migration tests
        working-directory: integration
        env:
          GH_TOKEN: ${{ github.token }}
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: >-
          uv run mc ${{ inputs.base_version != '' && format('--from {0}',
          inputs.base_version) || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-results-${{ matrix.os }}
          path: integration/tests/results/*
          retention-days: 7

      - name: Upload Core logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: migration-core-logs-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ~/synnax-migration-data/synnax-core.log
          retention-days: 7
