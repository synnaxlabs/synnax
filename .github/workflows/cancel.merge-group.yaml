# GitHub does not cancel the CI run of a merge group it merges past, rebuilds, or
# dequeues. This run cancels the CI runs of the destroyed merge group's commit, which
# frees their runners. A dequeued pull request wakes Agent - Shepherd.

name: Cancel - Merge group

on:
  merge_group:
    types: [destroyed]

permissions: {}

jobs:
  cancel:
    name: Cancel
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Cancel the CI runs of the merge group
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          REASON: ${{ github.event.reason }}
        run: |
          echo "Merge group $HEAD_REF was destroyed ($REASON)."
          runs=$(.github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/ci.yaml/runs?head_sha=$HEAD_SHA" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id')
          for run in $runs; do
            if ! .github/scripts/gh_api.sh -X POST \
              "repos/$GH_REPO/actions/runs/$run/cancel" > /dev/null; then
              # A run that finished after the listing cannot be cancelled.
              status=$(.github/scripts/gh_api.sh "repos/$GH_REPO/actions/runs/$run" \
                --jq .status)
              [ "$status" = completed ] || exit 1
            fi
            echo "Cancelled run $run."
          done

  shepherd:
    name: Wake the shepherd
    if: github.event.reason == 'dequeued'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Agent - Shepherd
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$HEAD_REF" =~ /pr-([0-9]+)- ]]
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/agent.shepherd.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=${BASH_REMATCH[1]}"
