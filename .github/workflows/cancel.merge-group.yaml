# GitHub does not cancel the CI run of a merge group it merges past, rebuilds, or
# dequeues. This run joins the CI concurrency group of the destroyed merge group, which
# cancels that CI run and frees its runners. A dequeued pull request wakes Agent -
# Shepherd.

name: Cancel - Merge group

on:
  merge_group:
    types: [destroyed]

# Must match the merge group key in ci.yaml.
concurrency:
  group: ci-${{ github.event.merge_group.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  cancel:
    name: Cancel
    runs-on: ubuntu-latest
    steps:
      - name: Log the reason
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REASON: ${{ github.event.reason }}
        run: echo "Merge group $HEAD_REF was destroyed ($REASON)."

  shepherd:
    name: Wake the shepherd
    if: github.event.reason == 'dequeued'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Agent - Shepherd
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$HEAD_REF" =~ /pr-([0-9]+)- ]]
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/agent.shepherd.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=${BASH_REMATCH[1]}"
