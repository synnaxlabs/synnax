# Answers a reply on the thread of a Sedosaur finding, or a comment that dismisses a
# finding outside the diff, as the sedosaur GitHub App. An `@sedosaur dismiss` from
# someone with write access to the repository dismisses the finding, and later reviews
# of the pull request do not report it. A rebuttal from such a person or an agent goes
# to Sedosaur on a review runner: Claude Code checks its evidence against the head, then
# Sedosaur withdraws the finding until its file changes, or replies why it holds. Any
# other reply gets the usage. When no finding of the head's review is left, a new check
# run scores the head 5/5. The scripts and the policy come from the default branch,
# never from the pull request.

name: Dismiss - Sedosaur
run-name: ${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request of the finding"
        type: number
        required: true
      comment:
        description: "Reply on the thread of the finding, or comment that dismisses it"
        type: string
        required: true

permissions: {}

# The review module reads the Claude Code stream with the agent wrapper's code.
env:
  PYTHONPATH: ${{ github.workspace }}/scripts

# Each job has its own group, so a dismissal does not wait behind a judgment. A job that
# waits is canceled when another one queues. The next one answers its work.
jobs:
  dismiss:
    name: Answer the reply
    concurrency:
      group: dismiss-sedosaur-${{ inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      key: ${{ steps.pr.outputs.key }}
      bot: ${{ steps.app.outputs.app-slug }}
      judge: ${{ steps.answer.outputs.judge }}
    steps:
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" | jq -r '
            "head=\(.head.sha)", "base=\(.base.sha)", "key=\(.number):\(.base.ref)"
          ' >> "$GITHUB_OUTPUT"

      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            scripts/agent

      - name: Mint the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SEDOSAUR_CLIENT_ID }}
          private-key: ${{ secrets.SEDOSAUR_APP_PRIVATE_KEY }}
          permission-checks: write
          # resolveReviewThread needs contents: write, not only pull-requests: write.
          permission-contents: write
          permission-pull-requests: write

      - name: Answer the reply
        id: answer
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}
          PR: ${{ inputs.pr }}
          COMMENT: ${{ inputs.comment }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          KEY: ${{ steps.pr.outputs.key }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          judge=$(python3 -m review dismiss)
          echo "judge=$judge" >> "$GITHUB_OUTPUT"

  # Claude Code gets only read tools, a checkout of the head, and its OAuth token, as in
  # a review. The App token that posts is minted after it exits.
  judge:
    needs: dismiss
    if: needs.dismiss.outputs.judge == 'true'
    name: Judge the rebuttals
    concurrency:
      group: judge-sedosaur-${{ inputs.pr }}
      cancel-in-progress: false
    runs-on: [self-hosted, review]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ needs.dismiss.outputs.head }}
      BASE_SHA: ${{ needs.dismiss.outputs.base }}
      KEY: ${{ needs.dismiss.outputs.key }}
      RUN_URL:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
        }}
    steps:
      - name: Check out the scripts and the policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner empties its temporary directory after each job, so prune drops the
      # checkout of the last job.
      - name: Check out the head
        run: |
          git worktree prune
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"

      - name: Install Claude Code
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/claude" \
            @anthropic-ai/claude-code@latest
          echo "$RUNNER_TEMP/claude/node_modules/.bin" >> "$GITHUB_PATH"

      # The fleet controller started the runner on a shared Claude login, which only
      # this runner's machine may read.
      - name: Read the Claude login
        run: |
          imds=http://169.254.169.254/latest
          imds_token=$(curl -fsS -X PUT "$imds/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
          login=$(curl -fsS -H "X-aws-ec2-metadata-token: $imds_token" \
            "$imds/meta-data/tags/instance/login")
          token=$(uvx --from awscli==1.46.2 aws secretsmanager get-secret-value \
            --region us-east-1 --secret-id "synnax-agents/logins/$login" \
            --query SecretString --output text)
          echo "::add-mask::$token"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Judge the rebuttals
        id: judge
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }}
          BOT: ${{ needs.dismiss.outputs.bot }}
          POLICY_DIR: ${{ github.workspace }}
          HEAD_DIR: ${{ runner.temp }}/head
        run: python3 -m review judge "$RUNNER_TEMP/judgments.json"

      # A usage limit or a rejected token stops every job of the seat. The seat leaves
      # the pool, and Agent - Requeue runs this job again on a seat with a usable login.
      - name: Leave the pool until the usage limit resets
        if: failure() && steps.judge.outputs.limited-until != ''
        env:
          UNTIL: ${{ steps.judge.outputs.limited-until }}
        run: scripts/agent/leave.sh limited-until "$UNTIL"

      - name: Leave the pool until a person renews the login
        if: failure() && steps.judge.outputs.login-broken != ''
        env:
          AT: ${{ steps.judge.outputs.login-broken }}
        run: |
          scripts/agent/leave.sh login-broken "$AT"
          echo "::error::Claude rejected the token of the seat's login. Store a new" \
            "one with infra/agent-runner/seat.sh token <login>."

      # A rebuttal that could not be judged fails the job, but the judgments of the
      # others still post.
      - name: Mint the GitHub App token
        id: app
        if: ${{ !cancelled() && steps.judge.outcome != 'skipped' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SEDOSAUR_CLIENT_ID }}
          private-key: ${{ secrets.SEDOSAUR_APP_PRIVATE_KEY }}
          permission-checks: write
          # resolveReviewThread needs contents: write, not only pull-requests: write.
          permission-contents: write
          permission-pull-requests: write

      - name: Post the judgments
        if: ${{ !cancelled() && steps.judge.outcome != 'skipped' }}
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -f "$RUNNER_TEMP/judgments.json" ]; then
            python3 -m review rule "$RUNNER_TEMP/judgments.json"
          fi

  relay-failure:
    name: Relay the failure
    needs: [dismiss, judge]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      actions: write
    uses: ./.github/workflows/relay.failure.yaml
    with:
      requeue: true
