# Runs Claude Code or Codex on an agent runner through scripts/agent/run, with the CLI
# login of the runner's seat. Each agent writes to GitHub as its own GitHub App, never
# as a person. The fleet controller starts a stopped runner for the queued job.
name: Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task for the agent, or a skill such as /flake-hunt"
        type: string
        required: true
      agent:
        description: "claude or codex. Empty uses the AGENT_DEFAULT variable."
        type: string
        default: ""
      output:
        description: "pr, comment, or report"
        type: string
        default: pr
      pr:
        description: "PR to check out, push to, and comment on"
        type: number
        required: false
      title:
        description: "PR title. Empty lets the agent pick one."
        type: string
        default: ""
      labels:
        description: "Comma-separated labels for a new PR"
        type: string
        default: ""
      timeout-minutes:
        description: "Job time budget. pr and comment cap the agent at 50 minutes."
        type: number
        default: 60
      setup:
        description: "Repository script to run after checkout, before the agent"
        type: string
        default: ""
      recipient:
        description:
          "GPG public key. With output report, the report output is encrypted to it and
          nothing of the report reaches the log or the step summary."
        type: string
        default: ""
      private:
        description: "Whether the job fails when recipient is empty"
        type: boolean
        default: false
      licensed:
        description: "Whether the agent gets the Core license as SYNNAX_LICENSE_KEY"
        type: boolean
        default: false
    outputs:
      pr-url:
        description: "URL of the PR the agent opened, pushed to, or commented on"
        value: ${{ jobs.run.outputs.pr-url }}
      report:
        description: "The agent's final message, for output report"
        value: ${{ jobs.run.outputs.report }}
    secrets:
      CLAUDE_CODE_APP_ID:
        required: false
      CLAUDE_CODE_APP_PRIVATE_KEY:
        required: false
      CODEX_APP_ID:
        required: false
      CODEX_APP_PRIVATE_KEY:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  run:
    name: Run (${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }})
    # A seat holds the login of one agent CLI, and its runners carry that agent's label.
    runs-on:
      - self-hosted
      - agent-${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      pr-url: ${{ steps.agent.outputs.pr-url }}
      report: ${{ steps.agent.outputs.report }}
    env:
      AGENT: ${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
    steps:
      - name: Mint the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id:
            ${{ env.AGENT == 'codex' && secrets.CODEX_APP_ID ||
            secrets.CLAUDE_CODE_APP_ID }}
          private-key:
            ${{ env.AGENT == 'codex' && secrets.CODEX_APP_PRIVATE_KEY ||
            secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # The wrapper pushes with the App token itself.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A PR branch can predate the wrapper, so the job runs this revision's copy.
      - name: Keep the wrapper
        run: cp -R scripts/agent "$RUNNER_TEMP/agent"

      # The setup script must come from the PR the agent works on.
      - name: Check out the pull request
        if: inputs.pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
        run: gh pr checkout "$PR"

      # Every job installs the latest agent CLIs for itself, so an update never replaces
      # a CLI that another job on the same instance runs.
      - name: Install the agent CLIs
        run: |
          npm install --prefix "$RUNNER_TEMP/cli" \
            @anthropic-ai/claude-code@latest @openai/codex@latest
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Set up the task
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: '"./$SETUP"'

      - name: Run the agent
        id: agent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SYNNAX_LICENSE_KEY:
            ${{ inputs.licensed && secrets.SYNNAX_LICENSE_TOKEN || '' }}
          AGENT_GIT_NAME: ${{ steps.bot.outputs.name }}
          AGENT_GIT_EMAIL: ${{ steps.bot.outputs.email }}
          PROMPT: ${{ inputs.prompt }}
          OUTPUT: ${{ inputs.output }}
          PR: ${{ inputs.pr }}
          TITLE: ${{ inputs.title }}
          LABELS: ${{ inputs.labels }}
          BUDGET: ${{ inputs.timeout-minutes }}
          RECIPIENT: ${{ inputs.recipient }}
          PRIVATE: ${{ inputs.private }}
        run: |
          # With no recipient, the report would reach the public log.
          if [ "$PRIVATE" = true ] && [ -z "$RECIPIENT" ]; then
            echo "::error::The report is private, but the recipient key is empty."
            exit 1
          fi
          args=(--agent "$AGENT" --output "$OUTPUT" --prompt "$PROMPT")
          # Leave ten minutes for setup and delivery. Deliver to GitHub before the App
          # token expires, an hour after it was minted.
          minutes=$((BUDGET > 20 ? BUDGET - 10 : BUDGET / 2))
          if [ "$OUTPUT" != report ] && [ "$minutes" -gt 50 ]; then minutes=50; fi
          args+=(--timeout-minutes "$minutes")
          if [ -n "$PR" ] && [ "$PR" != "0" ]; then args+=(--pr "$PR"); fi
          if [ -n "$TITLE" ]; then args+=(--title "$TITLE"); fi
          if [ -n "$LABELS" ]; then args+=(--labels "$LABELS"); fi
          if [ -n "$RECIPIENT" ]; then
            printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.asc"
            args+=(--recipient "$RUNNER_TEMP/recipient.asc")
          fi
          "$RUNNER_TEMP/agent/run" "${args[@]}"

      # The runners of a seat share its login, so at a usage limit every job on the
      # seat fails. The seat tags the time the limit resets, which keeps the fleet
      # controller from starting it, then stops. The delay lets this job report first.
      - name: Leave the pool until the usage limit resets
        if: failure() && steps.agent.outputs.limited-until != ''
        env:
          UNTIL: ${{ steps.agent.outputs.limited-until }}
        run: |
          imds=http://169.254.169.254/latest
          token=$(curl -fsS -X PUT "$imds/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
          meta() {
            curl -fsS -H "X-aws-ec2-metadata-token: $token" "$imds/meta-data/$1"
          }
          uvx --from awscli==1.46.2 aws ec2 create-tags \
            --region "$(meta placement/region)" --resources "$(meta instance-id)" \
            --tags "Key=limited-until,Value=$UNTIL"
          sudo systemd-run --on-active=30 systemctl poweroff
          echo "::error::The seat is at its usage limit until" \
            "$(date -u -d "@$UNTIL" '+%F %R UTC'), so it stops."
