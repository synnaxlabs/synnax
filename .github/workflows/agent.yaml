# Runs Claude Code or Codex on an agent runner through scripts/agent/run. Each agent
# writes to GitHub as its own GitHub App, never as a person. Callers must grant
# `id-token: write`, which starts a stopped runner through AWS, and `actions: write`,
# which cancels the run when the runners do not take the job.
name: Agent

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task for the agent, or a skill such as /flake-hunt"
        type: string
        required: true
      agent:
        description: "claude or codex. Empty uses the AGENT_DEFAULT variable."
        type: string
        default: ""
      output:
        description: "pr, comment, or report"
        type: string
        default: pr
      pr:
        description: "PR to check out, push to, and comment on"
        type: number
        required: false
      title:
        description: "PR title. Empty lets the agent pick one."
        type: string
        default: ""
      labels:
        description: "Comma-separated labels for a new PR"
        type: string
        default: ""
      timeout-minutes:
        description: "Job time budget. pr and comment cap the agent at 50 minutes."
        type: number
        default: 60
      setup:
        description: "Repository script to run after checkout, before the agent"
        type: string
        default: ""
      recipient:
        description:
          "GPG public key. With output report, the report output is encrypted to it and
          nothing of the report reaches the log or the step summary."
        type: string
        default: ""
    outputs:
      pr-url:
        description: "URL of the PR the agent opened, pushed to, or commented on"
        value: ${{ jobs.run.outputs.pr-url }}
      report:
        description: "The agent's final message, for output report"
        value: ${{ jobs.run.outputs.report }}
    secrets:
      CLAUDE_CODE_APP_ID:
        required: false
      CLAUDE_CODE_APP_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CODEX_APP_ID:
        required: false
      CODEX_APP_PRIVATE_KEY:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  start:
    name: Start a runner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Assume the runner start role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AGENT_RUNNER_ROLE_ARN }}
          aws-region: us-east-1

      # Idle runners stop themselves, so a job starts one stopped runner of its agent.
      # Only one of two concurrent starts sees an instance's previous state as stopped,
      # so the other tries again. The job waits for any runner when none is stopped.
      - name: Start a stopped runner
        env:
          AGENT: ${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
        run: |
          for _ in 1 2 3; do
            seats=$(aws ec2 describe-instances --output text \
              --filters Name=tag:project,Values=synnax-agents \
              Name=tag:pool,Values=agent "Name=tag:agent,Values=$AGENT" \
              Name=instance-state-name,Values=pending,running,stopping,stopped \
              --query 'Reservations[].Instances[].[InstanceId,State.Name]')
            if [ -z "$seats" ]; then
              echo "::error::The agent pool has no seat for $AGENT"
              exit 1
            fi
            mapfile -t stopped < <(awk '$2 == "stopped" { print $1 }' <<< "$seats")
            if [ ${#stopped[@]} -eq 0 ]; then exit 0; fi
            id=$(shuf -n 1 -e "${stopped[@]}")
            previous=$(aws ec2 start-instances --instance-ids "$id" --output text \
              --query 'StartingInstances[0].PreviousState.Name')
            if [ "$previous" = stopped ]; then exit 0; fi
          done

  # A seat can halt from idle before a runner takes the job, and nothing else starts it
  # again. This job starts a seat when none is up, until the job leaves the queue. It
  # cancels the run when the runners of a seat stay idle and do not take the job.
  watch:
    needs: start
    name: Keep a runner up
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      id-token: write
    steps:
      - name: Assume the runner start role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AGENT_RUNNER_ROLE_ARN }}
          aws-region: us-east-1

      - name: Start a seat until the job leaves the queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AGENT: ${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
          JOBS:
            repos/${{ github.repository }}/actions/runs/${{ github.run_id
            }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          JOB: ${{ job.check_run_id }}
        # This shell sets pipefail, so a failed API call fails its pipeline.
        shell: bash
        run: |
          jobs() {
            gh api "$JOBS" --paginate --jq '.jobs[] | [.id, .name, .status] | @tsv'
          }
          # The run job of this call has the same name prefix as this job.
          until name=$(jobs | awk -F '\t' -v id="$JOB" '$1 == id { print $2 }') &&
            [ -n "$name" ]; do
            sleep 20
          done
          run="${name% / *} / Run ($AGENT)"
          up=false
          # A seat that stays idle from its start stops in about 23 minutes. A seat that
          # other jobs keep busy can stop after this watch ends, and then the job stays
          # in the queue. A call that fails is done again on the next pass.
          while [ "$SECONDS" -lt 1800 ]; do
            sleep 60
            status=$(jobs | awk -F '\t' -v name="$run" '$2 == name { print $3 }') ||
              continue
            if [ -z "$status" ]; then continue; fi
            if [ "$status" != queued ]; then exit 0; fi
            seats=$(aws ec2 describe-instances --output text \
              --filters Name=tag:project,Values=synnax-agents \
              Name=tag:pool,Values=agent "Name=tag:agent,Values=$AGENT" \
              Name=instance-state-name,Values=pending,running,stopping,stopped \
              --query 'Reservations[].Instances[].[InstanceId,State.Name]') || continue
            if grep -qE 'pending|running' <<< "$seats"; then
              up=true
              continue
            fi
            # Only a seat with idle runners stops. A stop this long after the job went
            # into the queue shows that the runners were online and did not take it.
            if [ "$up" = true ] && [ "$SECONDS" -gt 180 ]; then
              echo "::error::The agent-$AGENT runners were idle and did not take the" \
                "job. Check their labels and the workflows their runner group accepts."
              gh run cancel "$GITHUB_RUN_ID"
              exit 1
            fi
            mapfile -t ids < <(cut -f 1 <<< "$seats")
            # The waiter fails when another job starts an instance first.
            aws ec2 wait instance-stopped --instance-ids "${ids[@]}" || continue
            up=false
            aws ec2 start-instances --instance-ids "${ids[0]}" > /dev/null || continue
          done

  run:
    needs: start
    name: Run (${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }})
    # A seat holds the login of one agent CLI, and its runners carry that agent's label.
    runs-on:
      - self-hosted
      - agent-${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      pr-url: ${{ steps.agent.outputs.pr-url }}
      report: ${{ steps.agent.outputs.report }}
    env:
      AGENT: ${{ inputs.agent || vars.AGENT_DEFAULT || 'claude' }}
    steps:
      - name: Mint the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id:
            ${{ env.AGENT == 'codex' && secrets.CODEX_APP_ID ||
            secrets.CLAUDE_CODE_APP_ID }}
          private-key:
            ${{ env.AGENT == 'codex' && secrets.CODEX_APP_PRIVATE_KEY ||
            secrets.CLAUDE_CODE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve the bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # The wrapper pushes with the App token itself.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A PR branch can predate the wrapper, so the job runs this revision's copy.
      - name: Keep the wrapper
        run: cp -R scripts/agent "$RUNNER_TEMP/agent"

      # The setup script must come from the PR the agent works on.
      - name: Check out the pull request
        if: inputs.pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
        run: gh pr checkout "$PR"

      # A runner can stay stopped for weeks, so every job takes the latest agent CLIs.
      - name: Update the agent CLIs
        run: sudo npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest

      - name: Set up the task
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: '"./$SETUP"'

      - name: Run the agent
        id: agent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_GIT_NAME: ${{ steps.bot.outputs.name }}
          AGENT_GIT_EMAIL: ${{ steps.bot.outputs.email }}
          CLAUDE_CODE_OAUTH_TOKEN:
            ${{ env.AGENT == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          PROMPT: ${{ inputs.prompt }}
          OUTPUT: ${{ inputs.output }}
          PR: ${{ inputs.pr }}
          TITLE: ${{ inputs.title }}
          LABELS: ${{ inputs.labels }}
          BUDGET: ${{ inputs.timeout-minutes }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          args=(--agent "$AGENT" --output "$OUTPUT" --prompt "$PROMPT")
          # Leave ten minutes for setup and delivery. Deliver to GitHub before the App
          # token expires, an hour after it was minted.
          minutes=$((BUDGET > 20 ? BUDGET - 10 : BUDGET / 2))
          if [ "$OUTPUT" != report ] && [ "$minutes" -gt 50 ]; then minutes=50; fi
          args+=(--timeout-minutes "$minutes")
          if [ -n "$PR" ] && [ "$PR" != "0" ]; then args+=(--pr "$PR"); fi
          if [ -n "$TITLE" ]; then args+=(--title "$TITLE"); fi
          if [ -n "$LABELS" ]; then args+=(--labels "$LABELS"); fi
          if [ -n "$RECIPIENT" ]; then
            printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.asc"
            args+=(--recipient "$RUNNER_TEMP/recipient.asc")
          fi
          "$RUNNER_TEMP/agent/run" "${args[@]}"
