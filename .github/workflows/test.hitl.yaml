# Runs the hitl suite against the real hardware of synnax-server-1. Its runner group
# admits only this workflow from main, so code from a fork or a branch never reaches the
# station. It runs apart from the nightly run, whose build uses the same artifact names.

name: Test - HITL

on:
  # The hardware is free for CI from 06:00 to 14:00 UTC. A run takes about 40 minutes,
  # and the last attempt leaves four hours. An attempt does nothing once a run on main
  # passed its tests that day.
  schedule:
    - cron: "0 6 * * *" # after the nightly build frees the bots
    - cron: "0 8 * * *"
    - cron: "0 10 * * *" # the last attempt; the notify job names it
  workflow_dispatch:

permissions:
  contents: read

# One run at a time holds the hardware. A whole run waits so its gate sees the last run.
concurrency:
  group: hitl
  cancel-in-progress: false

jobs:
  gate:
    name: Check for a passed run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # A skipped attempt also ends in success, so only a passed test job counts.
      - name: Check for a passed run
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false
          ids=$(gh run list --workflow test.hitl.yaml --branch main \
            --status success --created ">=$(date -u +%F)" --json databaseId \
            --jq '.[].databaseId')
          for id in $ids; do
            passed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$id/jobs" \
              --jq '.jobs[] | select(.name == "Test (synnax-server-1)" and
                .conclusion == "success")')
            if [ -n "$passed" ]; then skip=true; fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/build.synnax.yaml
    with:
      windows: true
      # The NI Linux RT Driver builds on the Ubuntu bots.
      ubuntu: true
      driver: true
      nilinuxrt: true
      core: true
      use_simple_artifact_names: true
    secrets:
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  test:
    name: Test (synnax-server-1)
    needs: build
    runs-on: [self-hosted, hitl]
    timeout-minutes: 90
    outputs:
      holders: ${{ steps.hardware.outputs.holders }}
    # gh run download reads the build artifacts.
    permissions:
      actions: read
      contents: read
    env:
      # The station's address on the instrument subnet, where the cRIO reaches the Core.
      CORE_HOST: 192.168.50.10
      CORE_PORT: 9190
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner's user cannot end other users' processes, so this leaves the
      # station's own Core alone.
      - name: Force quit existing Synnax processes
        shell: cmd
        run: integration/scripts/KillSynnaxProcesses.cmd

      # The run needs the hardware to itself. A Core without a Driver holds none.
      - name: Check that the hardware is free
        id: hardware
        shell: powershell
        run: |
          $procs = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -match '^(synnax-driver|driver-[0-9a-f]{16}|DEWEsoft)'
            }
          if ($procs) {
            # GetOwner needs an administrator to read other users' processes. quser
            # does not, so the owner is the user of the process's session.
            $users = @{}
            cmd /c "quser 2>nul" | ForEach-Object {
              if ($_ -match '^\s*>?(\S+)\s+(?:\S+\s+)?(\d+)\s+(Active|Disc)') {
                $users[[int]$Matches[2]] = $Matches[1]
              }
            }
            $list = ($procs | ForEach-Object {
              $user = $users[[int]$_.SessionId]
              if (-not $user) { $user = "session $($_.SessionId)" }
              "$($_.Name) (PID $($_.ProcessId), $user)"
            }) -join ", "
            # Out-File in Windows PowerShell writes a BOM that breaks the output.
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "holders=$list`n")
            Write-Output ("::error title=Hardware in use::These programs use the " +
              "station's hardware: $list. Close them, then run the workflow again.")
            exit 1
          }

      - name: Download Core
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN_ID: ${{ github.run_id }}
        run: integration/scripts/DownloadArtifacts.cmd

      - name: Download NI Linux RT Driver
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" .github/scripts/download_run_artifacts.sh `
            $env:GITHUB_RUN_ID synnax-driver-nilinuxrt nilinuxrt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -Force `
            (Get-Item nilinuxrt\synnax-driver-nilinuxrt\synnax-driver-v*-nilinuxrt) `
            "$env:USERPROFILE\synnax-binaries\synnax-driver-nilinuxrt"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known

      - name: Start Core
        id: core
        timeout-minutes: 1
        shell: powershell
        env:
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run:
          integration/scripts/StartCore.ps1 -Listen "${env:CORE_HOST}:${env:CORE_PORT}"

      - name: Correctness tests
        timeout-minutes: 45
        shell: cmd
        working-directory: integration
        env:
          PYTHONIOENCODING: utf-8
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: >-
          uv run test-conductor --name tc_hitl --server %CORE_HOST% --port %CORE_PORT%
          hitl

      - name: Performance tests
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        timeout-minutes: 15
        shell: cmd
        working-directory: integration
        env:
          PYTHONIOENCODING: utf-8
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        run: >-
          uv run test-conductor --name tc_hitl_perf --server %CORE_HOST% --port
          %CORE_PORT% hitl_perf

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results-hitl
          path: integration/tests/results/*
          retention-days: 7

      # The Core's embedded Driver scans the station's devices until it stops.
      - name: Stop Core
        if: always()
        shell: cmd
        run: integration/scripts/KillSynnaxProcesses.cmd

  # A run that finds the hardware in use posts only on the last attempt of the day.
  notify:
    name: Notify Slack
    needs: [gate, build, test]
    if: >-
      failure() && github.event_name == 'schedule' && (needs.test.outputs.holders == ''
      || github.event.schedule == '0 10 * * *')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post the failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
          HOLDERS: ${{ needs.test.outputs.holders }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          text="HITL tests failed: $RUN_URL"
          if [ -n "$HOLDERS" ]; then
            text="HITL tests did not run. The hardware is in use by: $HOLDERS. $RUN_URL"
          fi
          jq --null-input --arg text "$text" '{text: $text}' |
            curl --fail --silent --show-error \
              --header "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL"
