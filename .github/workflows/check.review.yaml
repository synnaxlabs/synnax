# Reports the Review gate commit status the main ruleset requires. The job itself
# always succeeds: a pull request that still waits on a label or an approval gets a
# pending status, not a failed run and its email.

name: Check - Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Report the Review gate status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          IFS=$'\t' read -r state description < <(.github/scripts/check_review.sh "$PR")
          echo "$state: $description"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="Review gate" \
            -f description="$description" \
            -f target_url="$RUN_URL" > /dev/null
