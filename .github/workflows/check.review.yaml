# Reports the Review gate commit status the main ruleset requires: a tier label, a
# finished Sedosaur review of the head with a 5/5 score, and for review/human an
# approval. The job itself always succeeds: a pull request that still waits gets a
# pending status, not a failed run and its email. Relay - Pull request and Relay -
# Review dispatch this on each change to a pull request, and the check_run trigger
# re-reports the gate when the Sedosaur review lands after the push. The status trigger
# re-reports it when CLA Assistant reports on a fork. Check - Review queue reports the
# gate of a merge group. Runs for one pull request queue behind each
# other instead of cancelling, so a run never posts a verdict older than one already
# posted. Every trigger runs a workflow from a branch of the repository, never from the
# pull request, and the gate script comes from main, so a pull request cannot edit the
# gate it is judged by, and a release branch gets the gate of main; no pull request code
# runs here.

name: Check - Review

on:
  check_run:
    types:
      - completed
  status:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-report
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

# A run that will skip gets its own group, so it never displaces a pending real one.
concurrency:
  group:
    ${{ github.workflow }}-${{ (github.event_name == 'check_run' &&
    github.event.check_run.name != 'Sedosaur Review') && github.run_id ||
    (github.event_name == 'status' && github.event.context != 'license/cla') &&
    github.run_id || github.event.check_run.pull_requests[0].number || inputs.pr ||
    github.event.sha }}
  cancel-in-progress: false

jobs:
  gate:
    # The ruleset matches check runs by name too, so a skipped job named Review gate
    # would block the merge.
    name: Report review gate
    if:
      github.event_name == 'workflow_dispatch' || (github.event_name == 'check_run' &&
      github.event.check_run.name == 'Sedosaur Review' &&
      github.event.check_run.pull_requests[0]) || (github.event_name == 'status' &&
      github.event.context == 'license/cla')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A release branch keeps the scripts it was cut with, so they judge nothing.
      - name: Checkout the main scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Resolve the pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.check_run.pull_requests[0].number || inputs.pr }}
          STATUS_SHA: ${{ github.event.sha }}
        # A status names only a commit, so the step finds the pull request it heads.
        run: |
          if [ -n "$STATUS_SHA" ]; then
            NUMBERS=$(.github/scripts/gh_api.sh \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --paginate \
              --jq '.[] | select(.head.sha == env.STATUS_SHA) | .number')
            NUMBER=${NUMBERS%%$'\n'*}
            if [ -z "$NUMBER" ]; then
              echo "no open pull request has head $STATUS_SHA"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ ! $NUMBER =~ ^[0-9]+$ ]]; then
            echo "not a pull request number: $NUMBER" >&2
            exit 1
          fi
          .github/scripts/gh_api.sh "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" \
            --jq '"number=\(.number)", "sha=\(.head.sha)"' \
            >> "$GITHUB_OUTPUT"

      - name: Report the review gate status
        if: steps.pull.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull.outputs.number }}
          SHA: ${{ steps.pull.outputs.sha }}
        run: |
          IFS=$'\t' read -r state description \
            < <(.github/scripts/check_review.sh "$PR")
          echo "$state: $description"
          # GitHub keeps 1000 statuses per commit and context, and the sweep repeats.
          current=$(.github/scripts/gh_api.sh \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status?per_page=100" \
            --jq '.statuses[] | select(.context == "Review gate")
              | "\(.state)\t\(.description)"')
          if [ "$current" = "$state"$'\t'"$description" ]; then
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          REPO="repos/${GITHUB_REPOSITORY}"
          .github/scripts/gh_api.sh "$REPO/statuses/${SHA}" \
            -f state="$state" \
            -f context="Review gate" \
            -f description="$description" \
            -f target_url="$RUN_URL" > /dev/null && exit 0
          # GitHub can answer an error after the status lands.
          posted=$(.github/scripts/gh_api.sh "$REPO/commits/${SHA}/status" \
            --jq '.statuses[] | select(.context == "Review gate") | .state')
          echo "posted status after the error: ${posted:-none}"
          [ "$posted" = "$state" ]
