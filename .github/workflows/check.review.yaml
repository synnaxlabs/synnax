# Reports the Review gate commit status the main ruleset requires. The job itself
# always succeeds: a pull request that still waits on a label, the Greptile review, or
# an approval gets a pending status, not a failed run and its email. A merge group
# gets success outright: its pull request passed the gate to enqueue, and the queue
# needs the context on the merge commit too. pull_request_target and the base-ref
# checkout run the base branch's workflow and script, so a pull request cannot edit
# the gate it is judged by; no pull request code runs here.

name: Check - Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed
  merge_group:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref:
            ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref
            }}

      - name: Report the review gate status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA:
            ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha
            }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            state=success
            description="merge group: the pull request passed the gate to enqueue"
          else
            IFS=$'\t' read -r state description < <(.github/scripts/check_review.sh "$PR")
          fi
          echo "$state: $description"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" \
            -f context="Review gate" \
            -f description="$description" \
            -f target_url="$RUN_URL" > /dev/null
