# Reports the Review gate commit status the main ruleset requires. The job itself always
# succeeds: a pull request that still waits on a label, the Greptile review, or an
# approval gets a pending status, not a failed run and its email. The check_run trigger
# re-reports the gate when the Greptile review lands after the push, and the edited
# trigger when Greptile writes its score into the description. A merge group gets
# success outright: its pull request passed the gate to enqueue, and the queue needs the
# context on the merge commit too. Every event gets its own run and no run cancels
# another: a run reports twice, so the last run to finish posts a verdict at least as
# fresh as every earlier one. Every trigger runs a workflow from a branch of the
# repository, never from the pull request, and the base-ref checkout takes the script
# from the base branch, so a pull request cannot edit the gate it is judged by; no pull
# request code runs here.

name: Check - Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed
  check_run:
    types:
      - completed
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-report
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    # The ruleset matches check runs by name too, so a skipped job named Review gate
    # would block the merge. Only a tier label can change the verdict.
    name: Report review gate
    if:
      (github.event_name != 'check_run' || (github.event.check_run.name == 'Greptile
      Review' && github.event.check_run.pull_requests[0])) && ((github.event.action !=
      'labeled' && github.event.action != 'unlabeled') ||
      startsWith(github.event.label.name, 'review/'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        if: github.event_name != 'merge_group'
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER:
            ${{ github.event.pull_request.number ||
            github.event.check_run.pull_requests[0].number || inputs.pr }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" \
            --jq '"number=\(.number)", "base=\(.base.ref)", "sha=\(.head.sha)"' \
            >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pull.outputs.base || github.event.merge_group.base_ref }}

      - name: Report the review gate status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pull.outputs.number }}
          SHA: ${{ steps.pull.outputs.sha || github.event.merge_group.head_sha }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          report() {
            echo "$1: $2"
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -f state="$1" \
              -f context="Review gate" \
              -f description="$2" \
              -f target_url="$RUN_URL" > /dev/null
          }
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            report success "merge group: the pull request passed the gate to enqueue"
            exit 0
          fi
          # Concurrent runs post in any order. The second pass reads state that is newer
          # than every post made before this run's first one.
          for _ in 1 2; do
            IFS=$'\t' read -r state description \
              < <(.github/scripts/check_review.sh "$PR")
            report "$state" "$description"
          done
