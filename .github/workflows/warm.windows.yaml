# The Windows build bots lose their pnpm store and Go toolchain on every stop, and merge
# queue runs cannot save caches, so main saves the caches they restore. A full
# repository cache deletes the entries read longest ago, so each hour a check looks for
# them and starts a bot only to save one that is gone. Only a release reads the
# trusted-signing-cli entries, one for the bots and one for the hosted runners, so the
# same check keeps them.
name: Warm - Windows

on:
  push:
    branches: [main]
    paths:
      - core/go.mod
      - pnpm-lock.yaml
      - .github/actions/setup-pnpm/**
      - .github/actions/setup-trusted-signing-cli/**
      - .github/actions/setup-zstd/**
      - .github/scripts/go_toolchain_cache.sh
      - .github/workflows/warm.windows.yaml
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# The check and the bot warm share one concurrency group, and each job checks out the
# head of the branch, not the commit that started the run. A newer pending job replaces
# an older one in the group and does the same work, and a check waits until a running
# bot warm has saved.
jobs:
  check:
    name: Check the cache
    if: github.event_name == 'schedule'
    concurrency:
      group: warm-windows
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      hosted_missing: ${{ steps.check.outputs.hosted_missing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-trusted-signing-cli
            .github/scripts
            core/go.mod
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Look for the entries
        id: check
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # The key that setup-pnpm gives the store on a Windows build bot.
          PNPM_KEY:
            pnpm-store-self-hosted-Windows-X64-${{ hashFiles('pnpm-lock.yaml') }}
        run: |
          go_key=$(RUNNER_OS=Windows RUNNER_ARCH=X64 \
            .github/scripts/go_toolchain_cache.sh core/go.mod | sed -n 's/^key=//p')
          version=$(yq .inputs.version.default \
            .github/actions/setup-trusted-signing-cli/action.yaml)
          count() {
            .github/scripts/gh_api.sh \
              "repos/$GH_REPO/actions/caches?ref=refs/heads/main&key=$1" \
              --jq "[.actions_caches[] | select(.key == \"$1\")] | length"
          }
          missing=false
          for key in "$PNPM_KEY" "$go_key" \
            "trusted-signing-cli-self-hosted-Windows-X64-$version"; do
            found=$(count "$key")
            if [ "$found" = 0 ]; then
              echo "$key is missing"
              missing=true
            fi
          done
          hosted_missing=false
          key=trusted-signing-cli-github-hosted-Windows-X64-$version
          found=$(count "$key")
          if [ "$found" = 0 ]; then
            echo "$key is missing"
            hosted_missing=true
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "hosted_missing=$hosted_missing" >> "$GITHUB_OUTPUT"

  warm:
    name: Warm
    needs: check
    if:
      ${{ !cancelled() && (needs.check.result == 'skipped' ||
      needs.check.outputs.missing == 'true') }}
    concurrency:
      group: warm-windows
      cancel-in-progress: false
    runs-on: windows-build-bot
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: Key the Go toolchain cache
        id: go-toolchain
        shell: bash
        run: .github/scripts/go_toolchain_cache.sh core/go.mod >> "$GITHUB_OUTPUT"

      - name: Restore the Go toolchain
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-toolchain.outputs.path }}
          key: ${{ steps.go-toolchain.outputs.key }}

      - name: Set up Go
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Save the Go toolchain
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.go-toolchain.outputs.path }}
          key: ${{ steps.go-toolchain.outputs.key }}

      - name: Set up trusted-signing-cli
        uses: ./.github/actions/setup-trusted-signing-cli

  warm-hosted:
    name: Warm the hosted runner
    needs: check
    if:
      ${{ !cancelled() && (needs.check.result == 'skipped' ||
      needs.check.outputs.hosted_missing == 'true') }}
    concurrency:
      group: warm-windows-hosted
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Set up trusted-signing-cli
        uses: ./.github/actions/setup-trusted-signing-cli
