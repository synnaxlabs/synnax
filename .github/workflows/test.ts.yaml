name: Test - TypeScript

on:
  workflow_call:
    inputs: &inputs
      core_image:
        description: Core image to test against, or empty for none
        required: false
        type: string
        default: ""
      coverage_flag:
        description: The Codecov flag, or empty to skip the upload
        required: false
        type: string
        default: ""
      directory:
        description: The directory containing the package
        required: true
        type: string
      freighter_image:
        description:
          Freighter integration server image to test against, or empty for none
        required: false
        type: string
        default: ""
      lint:
        description: Whether to check types, circular imports, and lint
        required: false
        type: boolean
        default: true
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      package:
        description: The pnpm package name
        required: true
        type: string
      shards:
        description: How many jobs split the test files on each OS, from 1 to 4
        required: false
        type: number
        default: 1
      test:
        description: Whether to run the tests
        required: false
        type: boolean
        default: true
      test_args:
        description: Extra arguments for the test command
        required: false
        type: string
        default: ""
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs: *inputs

jobs:
  test:
    name:
      Test (${{ matrix.os }}${{ inputs.shards > 1 && format(', {0}/{1}', matrix.shard,
      inputs.shards) || '' }})
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # A service with an empty image does not start, so a package that needs no server
    # leaves both inputs empty.
    services:
      synnax:
        image: ${{ inputs.core_image }}
        env:
          SYNNAX_INSECURE: true
          SYNNAX_MEM: true
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 9090:9090
      freighter:
        image: ${{ inputs.freighter_image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ${{ !inputs.macos && 'macos-latest' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-latest' }}
          - os: ${{ !inputs.windows && 'windows-latest' }}
          - shard: ${{ inputs.shards < 2 && 2 }}
          - shard: ${{ inputs.shards < 3 && 3 }}
          - shard: ${{ inputs.shards < 4 && 4 }}
        include:
          - os: ubuntu-latest
            shard: 1
            lint: true
    runs-on: ${{ matrix.os }}
    steps:
      # The matrix holds four shards, so a larger count would skip test files.
      - name: Check the shard count
        if: inputs.shards < 1 || inputs.shards > 4
        run: |
          echo "::error::shards must be from 1 to 4, not ${{ inputs.shards }}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Check types
        if: matrix.lint && inputs.lint
        run: pnpm check-types:${{ inputs.package }}

      - name: Check circular dependencies
        if: matrix.lint && inputs.lint
        run: pnpm cycles:${{ inputs.package }}

      - name: Lint
        if: matrix.lint && inputs.lint
        run: pnpm lint:${{ inputs.package }}

      - name: Test
        if: inputs.test
        # The reporters feed the coverage upload, which only vitest packages have.
        run: >-
          pnpm cov:${{ inputs.package }} -- ${{ inputs.coverage_flag != '' &&
          '--coverage.reporter=text-summary --coverage.reporter=clover
          --coverage.reporter=json' || '' }} ${{ inputs.shards > 1 &&
          format('--shard={0}/{1}', matrix.shard, inputs.shards) || '' }} ${{
          inputs.test_args }}

      - name: Upload coverage
        if: inputs.test && inputs.coverage_flag != ''
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: ${{ inputs.coverage_flag }}
          directory: ${{ inputs.directory }}
