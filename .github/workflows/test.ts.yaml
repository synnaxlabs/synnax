name: Test - TypeScript

on:
  workflow_call:
    inputs: &inputs
      browsers:
        description: Whether the tests run in Playwright's Chromium and WebKit
        required: false
        type: boolean
        default: false
      core_image:
        description: Core image to test against, or empty for none
        required: false
        type: string
        default: ""
      coverage_flag:
        description: The Codecov flag, or empty to skip the upload
        required: false
        type: string
        default: ""
      directory:
        description: The directory containing the package
        required: true
        type: string
      freighter_image:
        description:
          Freighter integration server image to test against, or empty for none
        required: false
        type: string
        default: ""
      lint:
        description: Whether to check types, circular imports, and lint
        required: false
        type: boolean
        default: true
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      package:
        description: The pnpm package name
        required: true
        type: string
      shards:
        description: How many jobs split the test files on each OS, from 1 to 4
        required: false
        type: number
        default: 1
      test:
        description: Whether to run the tests
        required: false
        type: boolean
        default: true
      test_args:
        description: Extra arguments for the test command
        required: false
        type: string
        default: ""
      test_timeout:
        description: Minutes the Test step can run; an unsharded Console run needs more
        required: false
        type: number
        default: 20
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
      SYNNAX_LICENSE_TOKEN:
        required: false
      TURBO_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *inputs

# The test services pull their images from GHCR.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name:
      Test (${{ matrix.os }}${{ inputs.shards > 1 && format(', {0}/{1}', matrix.shard,
      inputs.shards) || '' }})
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ${{ !inputs.macos && 'macos-latest' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-latest' }}
          - os: ${{ !inputs.windows && 'windows-latest' }}
          - shard: ${{ inputs.shards < 2 && 2 }}
          - shard: ${{ inputs.shards < 3 && 3 }}
          - shard: ${{ inputs.shards < 4 && 4 }}
        include:
          - os: ubuntu-latest
            shard: 1
            lint: true
    runs-on: ${{ matrix.os }}
    steps:
      # The matrix holds four shards, so a larger count would skip test files.
      - name: Check the shard count
        if: inputs.shards < 1 || inputs.shards > 4
        run: |
          echo "::error::shards must be from 1 to 4, not ${{ inputs.shards }}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start Core
        if: runner.os == 'Linux' && inputs.core_image != ''
        uses: ./.github/actions/start-service
        env:
          SYNNAX_INSECURE: true
          SYNNAX_MEM: true
          SYNNAX_LICENSE_KEY: ${{ secrets.SYNNAX_LICENSE_TOKEN }}
        with:
          name: synnax
          image: ${{ inputs.core_image }}
          port: 9090
          token: ${{ github.token }}
          variables: SYNNAX_INSECURE SYNNAX_MEM SYNNAX_LICENSE_KEY

      - name: Start the Freighter server
        if: runner.os == 'Linux' && inputs.freighter_image != ''
        uses: ./.github/actions/start-service
        with:
          name: freighter
          image: ${{ inputs.freighter_image }}
          port: 8080
          token: ${{ github.token }}

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Check types
        if: matrix.lint && inputs.lint
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm check-types:"$PACKAGE"

      - name: Check circular dependencies
        if: matrix.lint && inputs.lint
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm cycles:"$PACKAGE"

      - name: Lint
        if: matrix.lint && inputs.lint
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm lint:"$PACKAGE"

      # Without a limit, a stuck mirror holds the merge queue for up to 6 hours.
      - name: Install browsers
        if: inputs.test && inputs.browsers
        uses: ./.github/actions/setup-browsers
        timeout-minutes: 20
        with:
          package: ${{ inputs.package }}

      # Without a limit, a hung test run holds the job for up to 6 hours.
      - name: Test
        if: inputs.test
        # The reporters feed the coverage upload, which only vitest packages have.
        shell: bash
        timeout-minutes: ${{ inputs.test_timeout }}
        env:
          PACKAGE: ${{ inputs.package }}
          TEST_ARGS: ${{ inputs.test_args }}
          COVERAGE_ARGS:
            ${{ inputs.coverage_flag != '' && '--coverage.reporter=text-summary
            --coverage.reporter=clover --coverage.reporter=json' || '' }}
          SHARD_ARG:
            ${{ inputs.shards > 1 && format('--shard={0}/{1}', matrix.shard,
            inputs.shards) || '' }}
        run: |
          read -ra args <<< "$COVERAGE_ARGS $SHARD_ARG $TEST_ARGS"
          pnpm cov:"$PACKAGE" -- "${args[@]}"

      - name: Test in WebKit
        if: inputs.test && inputs.browsers
        shell: bash
        timeout-minutes: 10
        env:
          PACKAGE: ${{ inputs.package }}
        run: pnpm test:"$PACKAGE" -- --run --project webkit

      - name: Upload coverage
        if: inputs.test && inputs.coverage_flag != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CURL_HOME: ${{ github.workspace }}/.github/codecov
        with:
          fail_ci_if_error: true
          flags: ${{ inputs.coverage_flag }}
          directory: ${{ inputs.directory }}

      - name: Stop the services
        if: always() && runner.os == 'Linux'
        run: docker rm --force synnax freighter 2> /dev/null || true
