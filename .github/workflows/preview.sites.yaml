# Deploys a Vercel preview of a site for each pull request with the site's preview
# label, and again on each push while the label stays. Fork pull requests never deploy:
# their code must not reach the Vercel token.

name: Preview - Sites

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

jobs:
  docs:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.site.yaml
    with:
      label: preview/docs
      project: prj_G9x2ZoIrsFQym5DqbqZIM8jUsSer
      title: Docs
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  foundation:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.site.yaml
    with:
      label: preview/foundation
      project: prj_plE67kbtkjRiCik08iGvDTcValXJ
      title: Foundation
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  landing:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.site.yaml
    with:
      label: preview/landing
      project: prj_WYVMLkCJBhccVrmuYikwgc9QzW46
      title: Landing
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  portal:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.site.yaml
    with:
      label: preview/portal
      project: prj_inpbFHTjJgWYTZrPYJ0p7QgpMMyl
      title: Portal
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
