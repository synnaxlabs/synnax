name: Test - Format

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Check formatting
        run: pnpm check-format
