name: Test - Format

on:
  pull_request:
  push:
    branches:
      - main
      - rc
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          cache: true

      - name: Check Formatting
        run: pnpm check-format
