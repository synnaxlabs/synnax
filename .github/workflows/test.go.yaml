name: Test - Go

on:
  workflow_call:
    inputs: &inputs
      directory:
        description: The directory containing the Go module to test
        required: true
        type: string
      ginkgo_flags:
        description: Additional flags to pass to Ginkgo (e.g., --label-filter)
        required: false
        type: string
        default: ""
      shards:
        description:
          How many jobs split the Ginkgo suites on each OS, from 1 to 4. A cached run is
          one job.
        required: false
        type: number
        default: 1
      coverage_flag:
        description: The codecov flag for this module
        required: true
        type: string
      install_antlr4:
        description:
          Whether to install antlr4 before running `go generate`. Required for modules
          with `//go:generate antlr4 ...` directives (arc, oracle).
        required: false
        type: boolean
        default: false
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
      cached:
        description:
          Whether to run go test, which reuses the results that main saves, instead of
          Ginkgo
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

# The proxy drops streams at times, so a failed fetch falls back to the source.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # Every GOOS lints on Ubuntu, because the Windows runner does not have the disk space
  # for a cold lint. One job per GOOS keeps each runner's cache and compile scratch to
  # one GOOS, which fits the Ubuntu runner's disk. Without a limit, a hung lint holds the
  # runner for up to 6 hours.
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Ubuntu image ships toolchains lint never uses, and the restored cache plus a
      # compile overflows the disk they leave free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache: false

      # This workflow file salts the key, so a cache saved under an older layout of the
      # job never restores into the new one.
      - name: Key the Go caches
        id: key
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          GOOS: ${{ matrix.goos }}
          SUM:
            ${{ hashFiles(format('{0}/go.sum', inputs.directory),
            '.github/workflows/test.go.yaml') }}
        run: |
          echo "module=go-lint-$GOOS-$DIRECTORY-" >> "$GITHUB_OUTPUT"
          echo "sum=go-lint-$GOOS-$DIRECTORY-$SUM-" >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own branch and of main, never those of another
      # pull request, so only main saves them. A changed go.sum falls back to an older
      # cache of the module.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: &lint-cache |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.sum }}
            ${{ steps.key.outputs.module }}

      - name: Download the Go modules
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: .github/scripts/go_mod_download.sh "$DIRECTORY"

      # A download adds missing go.sum entries, so a changed go.mod or go.sum means the
      # committed ones were not tidy. Tidiness does not depend on GOOS.
      - name: Check that go.mod and go.sum are tidy
        if: matrix.goos == 'linux'
        working-directory: ${{ inputs.directory }}
        run: |
          git diff --exit-code -- go.mod go.sum
          go mod tidy -diff

      # Each job and GOOS restores its own module cache from an earlier run, and a
      # download checks go.sum only for modules it fetches.
      - name: Verify the Go module cache
        working-directory: ${{ inputs.directory }}
        run: go mod verify

      - name: Build the custom golangci-lint binary
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: ${{ inputs.directory }}
          install-only: true
          # The matchers register in install(), before install-only returns, so they
          # annotate the custom-gcl run below. That run needs --path-mode=abs to make
          # the paths resolve, which the action adds only to a lint it runs itself.
          problem-matchers: true

      - name: Lint
        working-directory: ${{ inputs.directory }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
        run: |
          ./custom-gcl config verify
          ./custom-gcl run --path-mode=abs

      # Each save holds every entry it restored, so stale builds pile up until their
      # extraction fills the disk. Go and golangci-lint refresh an entry's mtime when
      # they use it, so deleting the oldest files first keeps the ones this lint read.
      # One cold lint fills about 11 GB.
      - name: Trim the Go caches
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          BUDGET: 14000000000
        run: |
          du -sh ~/.cache/go-build ~/.cache/golangci-lint
          find ~/.cache/go-build ~/.cache/golangci-lint -type f -printf '%T@ %s %p\n' |
            sort -rn | awk -v budget="$BUDGET" '(total += $2) > budget { print $3 }' |
            xargs -r rm -f
          du -sh ~/.cache/go-build ~/.cache/golangci-lint

      # A failed lint leaves a cache that pull requests would restore, so only a
      # passing lint on main saves.
      - name: Save the Go caches
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: *lint-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name:
      Test (${{ matrix.os }}${{ !inputs.cached && inputs.shards > 1 && format(',
      {0}/{1}', matrix.shard, inputs.shards) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ${{ !inputs.macos && 'macos-latest' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-latest' }}
          - os: ${{ !inputs.windows && 'windows-latest' }}
          - shard: ${{ (inputs.cached || inputs.shards < 2) && 2 }}
          - shard: ${{ (inputs.cached || inputs.shards < 3) && 3 }}
          - shard: ${{ (inputs.cached || inputs.shards < 4) && 4 }}
        include:
          - os: ubuntu-latest
            shard: 1
            codegen: true
    runs-on: ${{ matrix.os }}
    # Tests read no DWARF, and race reports get function names and lines without it.
    # Dropping it cuts compile time and halves link time.
    env:
      GOFLAGS: -gcflags=all=-dwarf=false -ldflags=-w
      # The relative path of each package that has tests.
      SUITE:
        "{{if or .TestGoFiles .XTestGoFiles}}.{{slice .ImportPath (len
        .Module.Path)}}{{end}}"
    steps:
      # The matrix holds four shards, so a larger count would skip suites.
      - name: Check the shard count
        if: inputs.shards < 1 || inputs.shards > 4
        run: |
          echo "::error::shards must be from 1 to 4, not ${{ inputs.shards }}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Go keeps its caches and build scratch on the OS disk (C:), whose ~14GB of
      # free space a --race --cover build of a large module overflows. RUNNER_TEMP
      # sits on the far larger workspace drive. Runs before setup-go so its cache
      # restores into the moved paths.
      - name: Move the Go caches off the OS disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\gotmp" | Out-Null
          Add-Content $env:GITHUB_ENV "GOCACHE=$env:RUNNER_TEMP\gocache"
          Add-Content $env:GITHUB_ENV "GOMODCACHE=$env:RUNNER_TEMP\gomod"
          Add-Content $env:GITHUB_ENV "GOTMPDIR=$env:RUNNER_TEMP\gotmp"

      # The Ubuntu image ships toolchains these tests never use, and Ginkgo keeps every
      # --race --cover test binary of the Core until its last suite ends, which
      # overflows the disk they leave free. go test deletes each binary after its run.
      - name: Free disk space
        if: runner.os == 'Linux' && !inputs.cached
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache: false

      # This workflow file salts the key: cache archives store absolute paths, so one
      # saved before a cache-path move would restore to the old spot. The trim keeps
      # only what a run used, and a Ginkgo run uses no test results, so a Ginkgo run
      # never saves under the go test key. It restores a go test key before the Ginkgo
      # key of the same kind: go test compiles the same packages, and only a module that
      # main warms has such a cache.
      - name: Key the Go caches
        id: key
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          KIND: ${{ inputs.cached && 'test' || 'ginkgo' }}
          SUM:
            ${{ hashFiles(format('{0}/go.sum', inputs.directory),
            '.github/workflows/test.go.yaml') }}
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "module=go-$KIND-$RUNNER_OS-$DIRECTORY-"
            echo "sum=go-$KIND-$RUNNER_OS-$DIRECTORY-$SUM-"
            echo "test_module=go-test-$RUNNER_OS-$DIRECTORY-"
            echo "test_sum=go-test-$RUNNER_OS-$DIRECTORY-$SUM-"
          } >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own branch and of main, never those of another
      # pull request, so only main saves them. A changed go.sum falls back to an older
      # cache of the module.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.key.outputs.build }}
            ${{ steps.key.outputs.modules }}
          key: ${{ steps.key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.test_sum }}
            ${{ steps.key.outputs.sum }}
            ${{ steps.key.outputs.test_module }}
            ${{ steps.key.outputs.module }}

      - name: Mark the start of the build
        id: start
        shell: bash
        run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Download the Go modules
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: .github/scripts/go_mod_download.sh "$DIRECTORY"

      - name: Verify the Go module cache
        shell: bash
        working-directory: ${{ inputs.directory }}
        run: go mod verify

      - name: Install stringer
        if: matrix.codegen
        run: go install golang.org/x/tools/cmd/stringer@v0.52.0

      - name: Install antlr4
        if: matrix.codegen && inputs.install_antlr4
        run: |
          scripts/install_antlr4.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify `go generate` is up to date
        if: matrix.codegen
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: scripts/check_go_generate.sh "$DIRECTORY"

      # go test reuses a result only while each file the test read keeps its
      # modification time, which a checkout resets. Runs after go generate, which
      # rewrites files.
      - name: Pin the modification times
        if: inputs.cached
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: python3 -I .github/scripts/pin_mtimes.py "$DIRECTORY"

      # macOS skips race and cover until it runs on stronger machines. With -cover, go
      # test adds counters to each named package that has no tests, which changes the
      # build of each package that imports it. Ginkgo compiles one suite at a time and
      # adds none, so naming only the suites keeps the builds the same as Ginkgo's.
      - name: Test
        if: inputs.cached
        timeout-minutes: 150
        shell: bash
        env:
          FLAGS:
            ${{ runner.os != 'macOS' && '-race -cover -coverprofile=cover.out' || '' }}
        run: |
          suites=$(go list -f "$SUITE" ./...)
          read -ra flags <<< "$FLAGS"
          read -ra suites <<< "${suites//$'\n'/ }"
          go test "${flags[@]}" -timeout=30m "${suites[@]}"
        working-directory: ${{ inputs.directory }}

      # go test -cover adds a sync/atomic import to each package it names, so its build
      # of a package differs from the one Ginkgo makes when a suite imports that
      # package. A plain build makes the Ginkgo one, so a Ginkgo run that restores this
      # cache compiles only the test mains.
      - name: Build the packages that the Ginkgo suites import
        if: inputs.cached && github.ref == 'refs/heads/main'
        run: go build ${{ runner.os != 'macOS' && '-race' || '' }} ./...
        working-directory: ${{ inputs.directory }}

      # Each shard takes every nth suite in path order, which spreads the versions of
      # one service across the shards.
      - name: Test
        if: ${{ !inputs.cached }}
        timeout-minutes: 150
        shell: bash
        env:
          FLAGS:
            ${{ runner.os == 'macOS' && '--procs=2 --compilers=1' || '-p --cover
            --coverprofile=cover.out --race' }} ${{ inputs.ginkgo_flags }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: |
          suites=$(go list -f "$SUITE" ./... |
            awk -v n="$SHARDS" -v s="$SHARD" 'NF && ++i % n == s % n')
          read -ra flags <<< "$FLAGS"
          read -ra suites <<< "${suites//$'\n'/ }"
          go run github.com/onsi/ginkgo/v2/ginkgo "${flags[@]}" --randomize-suites \
            --fail-on-empty --keep-going --trace --timeout=2h --github-output \
            "${suites[@]}"
        working-directory: ${{ inputs.directory }}

      # Each save holds every entry it restored, so stale builds pile up until their
      # extraction fills the disk. Go refreshes the mtime of an entry it uses, unless
      # that mtime is less than an hour old, so an entry older than an hour before the
      # build did not serve this run. A size budget below the size of one build deletes
      # entries that the run used. A failed run used only a part of the cache, so only
      # a run that passes trims and saves. A Ginkgo run that restored the go test cache
      # of its go.sum saves nothing, because the warm run keeps that cache at the head
      # of main.
      - name: Trim the Go build cache
        if: >-
          ${{ success() && github.ref == 'refs/heads/main' && matrix.shard == 1 &&
          (inputs.cached || !startsWith(steps.cache.outputs.cache-matched-key,
          steps.key.outputs.test_sum)) }}
        shell: bash
        env:
          BUILD: ${{ steps.key.outputs.build }}
          START: ${{ steps.start.outputs.seconds }}
        run: |
          cd "$BUILD"
          du -sh .
          find . -type f -mmin "+$(( ($(date +%s) - START) / 60 + 61 ))" -delete
          du -sh .

      # The shards restore the same cache and save under one key, so only the first
      # saves. Its cache holds no test build of the other shards, by design: it holds
      # most of the packages they import, and a cache for each shard is about 1.8 GB.
      - name: Save the Go caches
        if: >-
          ${{ success() && github.ref == 'refs/heads/main' && matrix.shard == 1 &&
          (inputs.cached || !startsWith(steps.cache.outputs.cache-matched-key,
          steps.key.outputs.test_sum)) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.key.outputs.build }}
            ${{ steps.key.outputs.modules }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload coverage
        if: runner.os != 'macOS'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CURL_HOME: ${{ github.workspace }}/.github/codecov
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.coverage_flag }}
          directory: ${{ inputs.directory }}
