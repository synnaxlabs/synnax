name: Test - Go

on:
  workflow_call:
    inputs: &inputs
      directory:
        description: The directory containing the Go module to test
        required: true
        type: string
      ginkgo_flags:
        description: Additional flags to pass to Ginkgo (e.g., --label-filter)
        required: false
        type: string
        default: ""
      shards:
        description:
          How many jobs split the Ginkgo suites on each OS, from 1 to 4. A cached run is
          one job.
        required: false
        type: number
        default: 1
      coverage_flag:
        description: The codecov flag for this module
        required: true
        type: string
      install_antlr4:
        description:
          Whether to install antlr4 before running `go generate`. Required for modules
          with `//go:generate antlr4 ...` directives (arc, oracle).
        required: false
        type: boolean
        default: false
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
      cached:
        description:
          Whether to run go test, which reuses the results that main saves, instead of
          Ginkgo
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read

# The proxy drops streams at times, so a failed fetch falls back to the source.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # Every GOOS lints on Ubuntu, because the Windows runner does not have the disk space
  # for a cold lint. One job per GOOS keeps each runner's cache and compile scratch to
  # one GOOS, which fits the Ubuntu runner's disk.
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Ubuntu image ships toolchains lint never uses, and the restored cache plus a
      # compile overflows the disk they leave free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache: false

      # This workflow file salts the key, so a cache saved under an older layout of the
      # job never restores into the new one.
      - name: Key the Go caches
        id: key
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          GOOS: ${{ matrix.goos }}
          SUM:
            ${{ hashFiles(format('{0}/go.sum', inputs.directory),
            '.github/workflows/test.go.yaml') }}
        run: |
          echo "module=go-lint-$GOOS-$DIRECTORY-" >> "$GITHUB_OUTPUT"
          echo "sum=go-lint-$GOOS-$DIRECTORY-$SUM-" >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own branch and of main, never those of another
      # pull request, so only main saves them. A changed go.sum falls back to an older
      # cache of the module.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: &lint-cache |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.sum }}
            ${{ steps.key.outputs.module }}

      - name: Download the Go modules
        run: .github/scripts/go_mod_download.sh ${{ inputs.directory }}

      - name: Build the custom golangci-lint binary
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ inputs.directory }}
          install-only: true
          # The matchers register in install(), before install-only returns, so they
          # annotate the custom-gcl run below. That run needs --path-mode=abs to make
          # the paths resolve, which the action adds only to a lint it runs itself.
          problem-matchers: true

      - name: Lint
        working-directory: ${{ inputs.directory }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
        run: |
          ./custom-gcl config verify
          ./custom-gcl run --path-mode=abs

      # Each save holds every entry it restored, so stale builds pile up until their
      # extraction fills the disk. Go and golangci-lint refresh an entry's mtime when
      # they use it, so deleting the oldest files first keeps the ones this lint read.
      # One cold lint fills about 11 GB.
      - name: Trim the Go caches
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          BUDGET: 14000000000
        run: |
          du -sh ~/.cache/go-build ~/.cache/golangci-lint
          find ~/.cache/go-build ~/.cache/golangci-lint -type f -printf '%T@ %s %p\n' |
            sort -rn | awk -v budget="$BUDGET" '(total += $2) > budget { print $3 }' |
            xargs -r rm -f
          du -sh ~/.cache/go-build ~/.cache/golangci-lint

      # A failed lint leaves a cache that pull requests would restore, so only a
      # passing lint on main saves.
      - name: Save the Go caches
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: *lint-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name:
      Test (${{ matrix.os }}${{ !inputs.cached && inputs.shards > 1 && format(',
      {0}/{1}', matrix.shard, inputs.shards) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        exclude:
          - os: ${{ !inputs.macos && 'macos-latest' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-latest' }}
          - os: ${{ !inputs.windows && 'windows-latest' }}
          - shard: ${{ (inputs.cached || inputs.shards < 2) && 2 }}
          - shard: ${{ (inputs.cached || inputs.shards < 3) && 3 }}
          - shard: ${{ (inputs.cached || inputs.shards < 4) && 4 }}
        include:
          - os: ubuntu-latest
            shard: 1
            codegen: true
    runs-on: ${{ matrix.os }}
    steps:
      # The matrix holds four shards, so a larger count would skip suites.
      - name: Check the shard count
        if: inputs.shards < 1 || inputs.shards > 4
        run: |
          echo "::error::shards must be from 1 to 4, not ${{ inputs.shards }}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      # Go keeps its caches and build scratch on the OS disk (C:), whose ~14GB of
      # free space a --race --cover build of a large module overflows. RUNNER_TEMP
      # sits on the far larger workspace drive. Runs before setup-go so its cache
      # restores into the moved paths.
      - name: Move the Go caches off the OS disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\gotmp" | Out-Null
          Add-Content $env:GITHUB_ENV "GOCACHE=$env:RUNNER_TEMP\gocache"
          Add-Content $env:GITHUB_ENV "GOMODCACHE=$env:RUNNER_TEMP\gomod"
          Add-Content $env:GITHUB_ENV "GOTMPDIR=$env:RUNNER_TEMP\gotmp"

      # The Ubuntu image ships toolchains these tests never use, and Ginkgo keeps every
      # --race --cover test binary of the Core until its last suite ends, which
      # overflows the disk they leave free. go test deletes each binary after its run.
      - name: Free disk space
        if: runner.os == 'Linux' && !inputs.cached
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache: false

      # This workflow file salts the key: cache archives store absolute paths, so one
      # saved before a cache-path move would restore to the old spot.
      - name: Key the Go caches
        id: key
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          SUM:
            ${{ hashFiles(format('{0}/go.sum', inputs.directory),
            '.github/workflows/test.go.yaml') }}
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "module=go-test-${{ runner.os }}-$DIRECTORY-"
            echo "sum=go-test-${{ runner.os }}-$DIRECTORY-$SUM-"
          } >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own branch and of main, never those of another
      # pull request, so only main saves them. A changed go.sum falls back to an older
      # cache of the module.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.key.outputs.build }}
            ${{ steps.key.outputs.modules }}
          key: ${{ steps.key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.sum }}
            ${{ steps.key.outputs.module }}

      - name: Download the Go modules
        shell: bash
        run: .github/scripts/go_mod_download.sh ${{ inputs.directory }}

      - name: Install stringer
        if: matrix.codegen
        run: go install golang.org/x/tools/cmd/stringer@v0.52.0

      - name: Install antlr4
        if: matrix.codegen && inputs.install_antlr4
        run: |
          scripts/install_antlr4.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify `go generate` is up to date
        if: matrix.codegen
        run: scripts/check_go_generate.sh ${{ inputs.directory }}

      # go test reuses a result only while each file the test read keeps its
      # modification time, which a checkout resets. Runs after go generate, which
      # rewrites files.
      - name: Pin the modification times
        if: inputs.cached
        run: python3 -I .github/scripts/pin_mtimes.py ${{ inputs.directory }}

      # macOS skips race and cover until it runs on stronger machines.
      - name: Test
        if: inputs.cached
        timeout-minutes: 150
        run: >-
          go test ${{ runner.os != 'macOS' && '-race -cover -coverprofile=cover.out' ||
          '' }} -timeout=30m ./...
        working-directory: ${{ inputs.directory }}

      # Each shard takes every nth suite in path order, which spreads the versions of
      # one service across the shards.
      - name: Test
        if: ${{ !inputs.cached }}
        timeout-minutes: 150
        shell: bash
        env:
          FLAGS:
            ${{ runner.os == 'macOS' && '--procs=2 --compilers=1' || '-p --cover
            --coverprofile=cover.out --race' }} ${{ inputs.ginkgo_flags }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          SUITE:
            "{{if or .TestGoFiles .XTestGoFiles}}.{{slice .ImportPath (len
            .Module.Path)}}{{end}}"
        run: |
          suites=$(go list -f "$SUITE" ./... |
            awk -v n="$SHARDS" -v s="$SHARD" 'NF && ++i % n == s % n')
          # shellcheck disable=SC2086 # Splits the flags and suites into arguments.
          go run github.com/onsi/ginkgo/v2/ginkgo $FLAGS --randomize-suites \
            --fail-on-empty --keep-going --trace --timeout=2h --github-output $suites
        working-directory: ${{ inputs.directory }}

      # Each save holds every entry it restored, so stale builds pile up until their
      # extraction fills the disk. Go refreshes an entry's mtime when it uses it, so
      # deleting the oldest files first keeps the ones this run read. One compile of
      # the Core tests reads or writes about 16 GB.
      - name: Trim the Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 }}
        shell: bash
        env:
          BUDGET: 20000000000
          BUILD: ${{ steps.key.outputs.build }}
        run: |
          cd "$BUILD"
          du -sh .
          if [ "$RUNNER_OS" = macOS ]; then
            find . -type f -exec stat -f '%m %z %N' {} +
          else
            find . -type f -printf '%T@ %s %p\n'
          fi |
            sort -rn | awk -v budget="$BUDGET" '(total += $2) > budget { print $3 }' |
            xargs -r rm -f
          du -sh .

      # The shards restore the same cache and save under one key, so only the first
      # saves.
      - name: Save the Go caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.key.outputs.build }}
            ${{ steps.key.outputs.modules }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload coverage
        if: runner.os != 'macOS'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.coverage_flag }}
          directory: ${{ inputs.directory }}
