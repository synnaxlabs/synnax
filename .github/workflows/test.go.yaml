name: Test - Go

on:
  workflow_call:
    inputs: &inputs
      directory:
        description: The directory containing the Go module to test
        required: true
        type: string
      ginkgo_flags:
        description:
          Additional flags to pass to Ginkgo (e.g., -p, --randomize-all,
          --fail-on-empty)
        required: false
        type: string
        default: ""
      coverage_flag:
        description: The codecov flag for this module
        required: true
        type: string
      install_antlr4:
        description:
          Whether to install antlr4 before running `go generate`. Required for modules
          with `//go:generate antlr4 ...` directives (arc, oracle).
        required: false
        type: boolean
        default: false
      macos:
        description: Whether to test on macOS
        required: false
        type: boolean
        default: false
      ubuntu:
        description: Whether to test on Ubuntu
        required: false
        type: boolean
        default: true
      windows:
        description: Whether to test on Windows
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs: *inputs

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache: false

      - name: Key the Go caches
        id: key
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          SUM: ${{ hashFiles(format('{0}/go.sum', inputs.directory)) }}
        run: |
          echo "module=go-lint-$DIRECTORY-" >> "$GITHUB_OUTPUT"
          echo "sum=go-lint-$DIRECTORY-$SUM-" >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own branch and of main, never those of another
      # pull request, so only main saves them. A changed go.sum falls back to an older
      # cache of the module.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: &lint-cache |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.sum }}
            ${{ steps.key.outputs.module }}

      - name: Build the custom golangci-lint binary
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ inputs.directory }}
          install-only: true
          # The matchers register in install(), before install-only returns, so they
          # annotate the custom-gcl run below. That run needs --path-mode=abs to make
          # the paths resolve, which the action adds only to a lint it runs itself.
          problem-matchers: true

      # The Windows runner does not have the disk space for a cold lint, so lint both
      # GOOS values here. No package has a darwin-only file, so linux covers macOS.
      - name: Lint
        working-directory: ${{ inputs.directory }}
        env:
          CGO_ENABLED: "0"
        run: |
          ./custom-gcl config verify
          echo "::group::GOOS=linux"
          GOOS=linux ./custom-gcl run --path-mode=abs
          echo "::endgroup::"
          echo "::group::GOOS=windows"
          GOOS=windows ./custom-gcl run --path-mode=abs
          echo "::endgroup::"

      - name: Save the Go caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: *lint-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        exclude:
          - os: ${{ !inputs.macos && 'macos-latest' }}
          - os: ${{ !inputs.ubuntu && 'ubuntu-latest' }}
          - os: ${{ !inputs.windows && 'windows-latest' }}
        include:
          - os: ubuntu-latest
            codegen: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Go keeps its caches and build scratch on the OS disk (C:), whose ~14GB of
      # free space a --race --cover build of a large module overflows. RUNNER_TEMP
      # sits on the far larger workspace drive. Runs before setup-go so its cache
      # restores into the moved paths.
      - name: Move the Go caches off the OS disk
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\gotmp" | Out-Null
          Add-Content $env:GITHUB_ENV "GOCACHE=$env:RUNNER_TEMP\gocache"
          Add-Content $env:GITHUB_ENV "GOMODCACHE=$env:RUNNER_TEMP\gomod"
          Add-Content $env:GITHUB_ENV "GOTMPDIR=$env:RUNNER_TEMP\gotmp"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache: false

      # This workflow file salts the key: cache archives store absolute paths, so one
      # saved before a cache-path move would restore to the old spot.
      - name: Key the Go caches
        id: key
        shell: bash
        env:
          DIRECTORY: ${{ inputs.directory }}
          SUM:
            ${{ hashFiles(format('{0}/go.sum', inputs.directory),
            '.github/workflows/test.go.yaml') }}
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "module=go-test-${{ runner.os }}-$DIRECTORY-" >> "$GITHUB_OUTPUT"
          echo "sum=go-test-${{ runner.os }}-$DIRECTORY-$SUM-" >> "$GITHUB_OUTPUT"

      # A run reads the caches of its own branch and of main, never those of another
      # pull request, so only main saves them. A changed go.sum falls back to an older
      # cache of the module.
      - name: Restore the Go caches
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.key.outputs.build }}
            ${{ steps.key.outputs.modules }}
          key: ${{ steps.key.outputs.sum }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.key.outputs.sum }}
            ${{ steps.key.outputs.module }}

      - name: Install stringer
        if: matrix.codegen
        run: go install golang.org/x/tools/cmd/stringer@v0.50.0

      - name: Install antlr4
        if: matrix.codegen && inputs.install_antlr4
        run: |
          scripts/install_antlr4.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify `go generate` is up to date
        if: matrix.codegen
        run: scripts/check_go_generate.sh ${{ inputs.directory }}

      # macOS skips race and cover until it runs on stronger machines.
      - name: Test
        timeout-minutes: 150
        run: >-
          go run github.com/onsi/ginkgo/v2/ginkgo -r ${{ runner.os == 'macOS' &&
          '--procs=2 --compilers=1' || '-p --cover --coverprofile=cover.out --race' }}
          --randomize-all --randomize-suites --fail-on-pending --fail-on-empty
          --keep-going --trace --timeout=2h --github-output ${{ inputs.ginkgo_flags }}
        working-directory: ${{ inputs.directory }}

      # Pull requests test only on Linux, so other caches would only evict theirs.
      - name: Save the Go caches
        if:
          ${{ !cancelled() && github.ref == 'refs/heads/main' && runner.os == 'Linux' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.key.outputs.build }}
            ${{ steps.key.outputs.modules }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload coverage
        if: runner.os != 'macOS'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.coverage_flag }}
          directory: ${{ inputs.directory }}
