name: Test - Go

on:
  workflow_call:
    inputs:
      directory:
        description: The directory containing the Go module to test
        required: true
        type: string
      ginkgo_flags:
        description:
          Additional flags to pass to Ginkgo (e.g., -p, --randomize-all,
          --fail-on-empty)
        required: false
        type: string
        default: ""
      coverage_flag:
        description: The codecov flag for this module
        required: true
        type: string
      install_antlr4:
        description:
          Whether to install antlr4 before running `go generate`. Required for modules
          with `//go:generate antlr4 ...` directives (arc, oracle).
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            codegen: true
        exclude:
          - os:
              ${{ (github.ref != 'refs/heads/main' && github.base_ref != 'main') &&
              'macos-latest' }}
          - os:
              ${{ (github.ref != 'refs/heads/main' && github.base_ref != 'main') &&
              'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.directory }}/go.mod
          cache-dependency-path: |
            ${{ inputs.directory }}/go.mod
            ${{ inputs.directory }}/go.sum

      - name: Install stringer
        if: matrix.codegen
        run: go install golang.org/x/tools/cmd/stringer@v0.48.0

      - name: Install antlr4
        if: matrix.codegen && inputs.install_antlr4
        run: |
          scripts/install_antlr4.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify `go generate` is up to date
        if: matrix.codegen
        run: scripts/check_go_generate.sh ${{ inputs.directory }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ inputs.directory }}

      - name: Test
        run: >-
          go run github.com/onsi/ginkgo/v2/ginkgo -r -p --randomize-all
          --randomize-suites --fail-on-pending --fail-on-empty --keep-going --cover
          --coverprofile=cover.out --race --trace --github-output ${{
          inputs.ginkgo_flags }}
        working-directory: ${{ inputs.directory }}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.coverage_flag }}
          directory: ${{ inputs.directory }}
