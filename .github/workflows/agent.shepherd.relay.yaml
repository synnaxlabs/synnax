# Wakes Agent - Shepherd. A review event runs this file from the pull request branch, so
# it can only dispatch, and only for a branch of this repository. It skips reviews from
# bots other than Greptile, so an agent's own replies never wake it.

name: Agent - Review submitted
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types:
      - submitted

permissions: {}

jobs:
  submitted:
    name: Submitted
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.state != 'approved' && (github.event.review.user.type != 'Bot'
      || github.event.review.user.login == 'greptile-apps[bot]')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # A pull request cannot edit the script that runs with this token.
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Agent - Shepherd
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.repository.default_branch }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          echo "Review from $REVIEWER"
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/agent.shepherd.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"
