# Wakes Agent - Shepherd through workflow_run. A review event runs this file from the
# pull request branch, so it holds no permissions and does nothing but succeed. It skips
# reviews from bots other than Greptile, so an agent's own replies never wake it. The
# run name carries the pull request number.

name: Agent - Review submitted
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types:
      - submitted

permissions: {}

jobs:
  submitted:
    name: Submitted
    if:
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.state != 'approved' && (github.event.review.user.type != 'Bot'
      || github.event.review.user.login == 'greptile-apps[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Report the review
        env:
          REVIEWER: ${{ github.event.review.user.login }}
        run: echo "Review from $REVIEWER"
