# Core pull requests reuse the go test results and builds that main saves. Only this
# workflow runs go test on main, so each merge refreshes them.
name: Warm - Go

on:
  push:
    branches: [main]
    # The Core and the local modules its go.mod replaces.
    paths:
      - alamos/go/**
      - arc/go/**
      - aspen/**
      - cesium/**
      - core/**
      - freighter/go/**
      - gorp/**
      - x/go/**
      - .github/scripts/pin_mtimes.py
      - .github/workflows/test.go.yaml
      - .github/workflows/warm.go.yaml
  workflow_dispatch:

# A burst of merges warms only the newest one.
concurrency:
  group: warm-go
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core:
    name: Core
    uses: ./.github/workflows/test.go.yaml
    with:
      cached: true
      coverage_flag: core
      directory: core
    secrets: inherit

  # Pull requests restore only the newest cache, so the older ones only evict others.
  prune:
    name: Prune older caches
    needs: core
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete older Core caches
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in go-test-Linux-core- go-lint-linux-core- \
            go-lint-windows-core- go-lint-darwin-core-; do
            gh cache list --ref refs/heads/main --key "$prefix" --sort created_at \
              --order desc --limit 100 --json id --jq '.[1:][].id' |
              xargs -r -n1 gh cache delete
          done
