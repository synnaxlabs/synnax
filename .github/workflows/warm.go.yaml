# Core pull requests reuse the go test results and builds that main saves, and the
# Ginkgo runs of the Core on Ubuntu reuse the builds. Only this workflow runs go test on
# main, so each merge refreshes them.
name: Warm - Go

on:
  push:
    branches: [main]
    # The Core and the local modules its go.mod replaces.
    paths:
      - alamos/go/**
      - arc/go/**
      - cesium/**
      - core/**
      - freighter/go/**
      - gorp/**
      - x/go/**
      - .github/scripts/pin_mtimes.py
      - .github/workflows/test.go.yaml
      - .github/workflows/warm.go.yaml
  workflow_dispatch:

# A burst of merges warms only the newest one.
concurrency:
  group: warm-go
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core:
    name: Core
    uses: ./.github/workflows/test.go.yaml
    with:
      cached: true
      coverage_flag: core
      directory: core
      os_specific: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # A failed test job does not stop the lint jobs, which save caches too.
  prune:
    name: Prune older caches
    needs: core
    if: ${{ !cancelled() }}
    permissions:
      actions: write
    uses: ./.github/workflows/prune.caches.yaml
