# Starts the workflows that act on a pull request. Those hold write access or secrets,
# so they run from the default branch through a dispatch, never from a pull request
# event. This file runs from the pull request, and a token can dispatch only for a
# branch of this repository, so a fork reaches none of them. CONTRIBUTING.md says what a
# maintainer does for a fork.

name: Relay - Pull request
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions: {}

jobs:
  relay:
    name: Relay pull request
    if:
      github.event.pull_request.head.repo.full_name == github.repository && github.actor
      != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REF: ${{ github.event.repository.default_branch }}
    steps:
      - name: Start Check - Review
        run: gh workflow run check.review.yaml --ref "$REF" -f pr="$PR"

      - name: Start Merge - Auto
        # Main has no dispatch trigger for this until #4466 merges.
        if: github.event.pull_request.number != 4466
        run: gh workflow run merge.auto.yaml --ref "$REF" -f pr="$PR"
