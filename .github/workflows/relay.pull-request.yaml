# Starts the workflows that act on a pull request. Those hold write access or secrets,
# so they run from the default branch through a dispatch, never from a pull request
# event. This file runs from the pull request, and a token can dispatch only for a
# branch of this repository, so a fork reaches none of them. CONTRIBUTING.md says what a
# maintainer does for a fork.

name: Relay - Pull request
run-name: ${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions: {}

jobs:
  relay:
    name: Relay pull request
    if:
      github.event.pull_request.head.repo.full_name == github.repository && github.actor
      != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REF: ${{ github.event.repository.default_branch }}
    steps:
      # A pull request cannot edit the script that runs with this token.
      - name: Checkout the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start Check - Review
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/check.review.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"

      - name: Start Merge - Auto
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/merge.auto.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"

      - name: Start Agent - Shepherd
        if:
          github.event.action == 'unlabeled' && github.event.label.name ==
          'agent/needs-human'
        run: |
          .github/scripts/gh_api.sh \
            "repos/$GH_REPO/actions/workflows/agent.shepherd.yaml/dispatches" \
            -X POST -f ref="$REF" -f "inputs[pr]=$PR"
