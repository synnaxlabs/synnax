# Categories for generated release notes, keyed on pull request labels.
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: Console
      labels:
        - console
    - title: Driver
      labels:
        - driver
    - title: Core
      labels:
        - server
        - go
    - title: Clients
      labels:
        - py-client
        - ts-client
        - cpp-client
    - title: Arc
      labels:
        - arc
    - title: Pluto and Drift
      labels:
        - pluto
        - drift
    - title: Documentation
      labels:
        - user docs
        - tech docs
    - title: Other changes
      labels:
        - "*"
