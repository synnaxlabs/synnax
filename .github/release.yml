# Categories for generated release notes, one per product a user knows, keyed on the
# labels labeler.yml applies. A pull request lands in the first category that matches.
changelog:
  categories:
    - title: Console
      labels:
        - console
    - title: Driver
      labels:
        - driver
    - title: Core
      labels:
        - core
    - title: Arc
      labels:
        - arc
    - title: Python client
      labels:
        - py-client
    - title: TypeScript client
      labels:
        - ts-client
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
